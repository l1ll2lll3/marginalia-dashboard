const CHAR_BASES = {"유비": "成都", "제갈량": "成都", "관우": "荆州", "장비": "成都", "조자룡": "成都", "위연": "汉中", "강유": "成都", "마초": "汉中", "황충": "成都", "방통": "成都", "관흥": "成都", "관평": "荆州", "왕평": "成都", "장포": "成都", "유선": "成都", "조조": "许昌", "사마의": "洛阳", "장료": "合肥", "장합": "洛阳", "서황": "洛阳", "하후돈": "许昌", "하후연": "汉中", "허저": "许昌", "등애": "洛阳", "조인": "许昌", "조홍": "许昌", "우금": "许昌", "사마소": "洛阳", "조비": "洛阳", "손권": "建业", "주유": "柴桑", "노숙": "建业", "여몽": "建业", "감녕": "建业", "손책": "建业", "육손": "建业", "여포": "下邳", "동탁": "长安", "원소": "邺城", "원술": "建业", "유표": "襄阳", "맹획": "成都", "유장": "成都", "장로": "汉中"};
const CHAR_JOURNEYS = {"유비": ["洛阳", "下邳", "许昌", "新野", "长坂坡", "赤壁", "荆州", "成都", "汉中", "夷陵", "白帝城"], "제갈량": ["新野", "赤壁", "荆州", "成都", "汉中", "祁山", "街亭", "祁山", "五丈原"], "관우": ["虎牢关", "下邳", "许昌", "荆州"], "조조": ["洛阳", "许昌", "濮阳", "官渡", "邺城", "赤壁", "许昌", "汉中", "洛阳"], "장비": ["虎牢关", "下邳", "新野", "长坂坡", "荆州", "成都"], "조자룡": ["长坂坡", "荆州", "成都", "汉中"], "여포": ["洛阳", "长安", "濮阳", "下邳"], "주유": ["柴桑", "赤壁"], "손권": ["建业", "合肥", "建业"], "강유": ["成都", "汉中", "祁山", "成都"], "사마의": ["洛阳", "五丈原", "洛阳"]};

const tooltip = d3.select('#tooltip');
const container = d3.select('#map-container');
const rect = container.node().getBoundingClientRect();
const W = rect.width || 1000;
const H = rect.height || 520;
const svg = container.append('svg').attr('width', W).attr('height', H);

// Auto-fit to all locations
const allCoords = Object.values(LOCATIONS).map(l => l.coords);
const lngs = allCoords.map(c => c[0]);
const lats = allCoords.map(c => c[1]);
const centerLng = (d3.min(lngs) + d3.max(lngs)) / 2;
const centerLat = (d3.min(lats) + d3.max(lats)) / 2;
const tempProj = d3.geoMercator().center([centerLng, centerLat]).translate([W/2, H/2]).scale(1);
const points = allCoords.map(c => tempProj(c));
const fitScale = Math.min(W * 0.85 / (d3.max(points, p=>p[0]) - d3.min(points, p=>p[0])),
                          H * 0.85 / (d3.max(points, p=>p[1]) - d3.min(points, p=>p[1])));

const projection = d3.geoMercator().center([centerLng, centerLat]).scale(fitScale).translate([W/2, H/2]);

const tileGroup = svg.append('g').attr('class', 'tiles');
const g = svg.append('g').attr('class', 'overlay');

function renderTiles(transform) {
  const tiles = d3.tile()
    .size([W, H])
    .scale(transform.k * projection.scale() * 2 * Math.PI)
    .translate(transform.apply(projection([0, 0])))();
  tileGroup.selectAll('image').remove();
  tileGroup.selectAll('image').data(tiles).join('image')
    .attr('xlink:href', d => `https://tiles.stadiamaps.com/tiles/stamen_watercolor/${d[2]}/${d[0]}/${d[1]}.jpg?api_key=${STADIA_KEY}`)
    .attr('x', d => Math.round((d[0] + tiles.translate[0]) * tiles.scale))
    .attr('y', d => Math.round((d[1] + tiles.translate[1]) * tiles.scale))
    .attr('width', Math.round(tiles.scale) + 1)
    .attr('height', Math.round(tiles.scale) + 1);
}

const zoom = d3.zoom().scaleExtent([0.5, 30])
  .on('zoom', event => { g.attr('transform', event.transform); renderTiles(event.transform); });
svg.call(zoom);
renderTiles(d3.zoomIdentity);

// Plot locations
Object.entries(LOCATIONS).forEach(([name, loc]) => {
  const [x, y] = projection(loc.coords);
  const color = LOC_TYPE_COLORS[loc.type] || '#888';
  const r = loc.type === 'capital' ? 7 : loc.type === 'battle' ? 5 : 4;
  const isCapital = loc.type === 'capital';
  g.append('circle').attr('cx', x).attr('cy', y).attr('r', r)
    .attr('fill', color).attr('stroke', '#fff').attr('stroke-width', 1.5).attr('opacity', 0.85)
    .style('cursor', 'pointer')
    .on('mouseover', function(event) {
      tooltip.html(`<b>${loc.ko || name}</b> ${name}<br>${loc.en}<br>${loc.note}`)
        .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
      // 호버 시 라벨 표시
      d3.select(this.parentNode).select(`.label-${name.replace(/[^a-zA-Z]/g,'')}`)
        .attr('opacity', 1);
    }).on('mouseout', function() {
      tooltip.style('display','none');
      // 수도가 아니면 라벨 숨기기
      if (!isCapital) {
        d3.select(this.parentNode).select(`.label-${name.replace(/[^a-zA-Z]/g,'')}`)
          .attr('opacity', 0);
      }
    });
  const koName = loc.ko || name;
  g.append('text').attr('class', `city-label label-${name.replace(/[^a-zA-Z]/g,'')}`)
    .attr('x', x+r+3).attr('y', y+3)
    .attr('opacity', isCapital ? 1 : 0)
    .text(`${koName} ${name}`);
});

// Character list by faction
const factionOrder = ['蜀', '魏', '吳', '群', '기타'];
const charList = d3.select('#char-list');

factionOrder.forEach(faction => {
  const fChars = CHARACTERS.filter(c => c.faction === faction);
  if (fChars.length === 0) return;
  const fNames = { '蜀':'촉한 蜀漢', '魏':'조위 曹魏', '吳':'동오 東吳', '群':'군웅 群雄', '기타':'기타' };
  const section = charList.append('div').attr('class', 'faction-section');
  section.append('div').attr('class', 'faction-title')
    .style('color', FACTION_COLORS[faction]).text(fNames[faction] || faction);
  const grid = section.append('div').attr('class', 'char-grid');

  fChars.forEach(c => {
    const chip = grid.append('div').attr('class', 'char-chip')
      .style('border-color', FACTION_COLORS[faction]);
    chip.html(`${c.name_ko} <span style="color:#888">${c.name_zh}</span><span class="count">${c.mention_count}</span>`);
    chip.on('mouseover', event => {
      const aliases = c.aliases && c.aliases.length > 0 ? '<br>별명: ' + c.aliases.join(', ') : '';
      const base = CHAR_BASES[c.name_ko] || '?';
      tooltip.html(`<b>${c.name_ko}</b> ${c.name_zh}${aliases}<br>등장: ${c.mention_count}회<br>거점: ${base}`)
        .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
    }).on('mouseout', () => tooltip.style('display','none'));
    chip.on('click', () => {
      // 기존 경로 제거
      g.selectAll('.journey-path, .journey-dot, .journey-order').remove();

      const journey = CHAR_JOURNEYS[c.name_ko];
      if (!journey || journey.length === 0) {
        // 경로 없으면 거점으로 줌
        const base = CHAR_BASES[c.name_ko];
        if (base && LOCATIONS[base]) {
          const [tx, ty] = projection(LOCATIONS[base].coords);
          svg.transition().duration(750).call(
            zoom.transform, d3.zoomIdentity.translate(W/2 - tx*3, H/2 - ty*3).scale(3)
          );
        }
        return;
      }

      const color = FACTION_COLORS[c.faction] || '#888';

      // 경로선 그리기
      for (let i = 0; i < journey.length - 1; i++) {
        const fromLoc = LOCATIONS[journey[i]];
        const toLoc = LOCATIONS[journey[i+1]];
        if (!fromLoc || !toLoc) continue;
        const interp = d3.geoInterpolate(fromLoc.coords, toLoc.coords);
        const arcPoints = d3.range(0, 1.01, 0.03).map(t => interp(t));
        g.append('path').attr('class', 'journey-path')
          .datum({type: 'LineString', coordinates: arcPoints})
          .attr('d', d3.geoPath().projection(projection))
          .attr('fill', 'none').attr('stroke', color)
          .attr('stroke-width', 3).attr('stroke-dasharray', '8 4').attr('opacity', 0.8);
      }

      // 경로 위 순서 점 + 호버 툴팁
      journey.forEach((locName, idx) => {
        const loc = LOCATIONS[locName];
        if (!loc) return;
        const [x, y] = projection(loc.coords);
        const koName = loc.ko || locName;

        // 투명한 큰 히트 영역 (마우스 잡기 쉽게)
        g.append('circle').attr('class', 'journey-dot')
          .attr('cx', x).attr('cy', y).attr('r', 16)
          .attr('fill', 'transparent').style('cursor', 'pointer')
          .on('mouseover', event => {
            tooltip.html(`<b>${idx+1}. ${koName}</b> ${locName}<br>${loc.note || ''}`)
              .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
          }).on('mouseout', () => tooltip.style('display','none'));

        // 보이는 점
        g.append('circle').attr('class', 'journey-dot')
          .attr('cx', x).attr('cy', y).attr('r', 10)
          .attr('fill', color).attr('stroke', '#fff').attr('stroke-width', 2)
          .style('pointer-events', 'none');
        g.append('text').attr('class', 'journey-order')
          .attr('x', x).attr('y', y + 4).attr('text-anchor', 'middle')
          .attr('fill', '#fff').attr('font-size', '11px').attr('font-weight', 'bold')
          .style('pointer-events', 'none')
          .text(idx + 1);
      });

      // 줌 리셋
      svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
    });
  });
});
</script>
