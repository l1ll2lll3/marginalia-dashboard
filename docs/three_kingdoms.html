const tooltip = d3.select('#tooltip');
const container = d3.select('#map-container');
const rect = container.node().getBoundingClientRect();
const W = rect.width || 1000;
const H = rect.height || 520;
const svg = container.append('svg').attr('width', W).attr('height', H);

// Auto-fit to all locations
const allCoords = Object.values(LOCATIONS).map(l => l.coords);
const lngs = allCoords.map(c => c[0]);
const lats = allCoords.map(c => c[1]);
const centerLng = (d3.min(lngs) + d3.max(lngs)) / 2;
const centerLat = (d3.min(lats) + d3.max(lats)) / 2;
const tempProj = d3.geoMercator().center([centerLng, centerLat]).translate([W/2, H/2]).scale(1);
const points = allCoords.map(c => tempProj(c));
const fitScale = Math.min(W * 0.85 / (d3.max(points, p=>p[0]) - d3.min(points, p=>p[0])),
                          H * 0.85 / (d3.max(points, p=>p[1]) - d3.min(points, p=>p[1])));

const projection = d3.geoMercator().center([centerLng, centerLat]).scale(fitScale).translate([W/2, H/2]);

svg.append('defs');
const tileGroup = svg.append('g').attr('class', 'tiles');
const g = svg.append('g').attr('class', 'overlay');

function renderTiles(transform) {
  const tiles = d3.tile()
    .size([W, H])
    .scale(transform.k * projection.scale() * 2 * Math.PI)
    .translate(transform.apply(projection([0, 0])))();
  tileGroup.selectAll('image').remove();
  tileGroup.selectAll('image').data(tiles).join('image')
    .attr('xlink:href', d => `https://tiles.stadiamaps.com/tiles/stamen_watercolor/${d[2]}/${d[0]}/${d[1]}.jpg?api_key=${STADIA_KEY}`)
    .attr('x', d => Math.round((d[0] + tiles.translate[0]) * tiles.scale))
    .attr('y', d => Math.round((d[1] + tiles.translate[1]) * tiles.scale))
    .attr('width', Math.round(tiles.scale) + 1)
    .attr('height', Math.round(tiles.scale) + 1);
}

const zoom = d3.zoom().scaleExtent([0.5, 30])
  .on('zoom', event => {
    g.attr('transform', event.transform);
    renderTiles(event.transform);
    // 줌 레벨에 반비례하여 마커 크기 유지
    const k = event.transform.k;
    g.selectAll('circle').attr('r', function() {
      const base = +d3.select(this).attr('data-base-r') || 7;
      return base / k;
    }).attr('stroke-width', function() { return 1.5 / k; });
    g.selectAll('.city-label').attr('font-size', (11 / k) + 'px');
    g.selectAll('.journey-path').attr('stroke-width', 1.2 / k);
    g.selectAll('.journey-dot').attr('r', function() {
      const base = +d3.select(this).attr('data-base-r') || 7;
      return base / k;
    });
  });
svg.call(zoom);
renderTiles(d3.zoomIdentity);

// Plot locations
Object.entries(LOCATIONS).forEach(([name, loc]) => {
  const [x, y] = projection(loc.coords);
  const color = LOC_TYPE_COLORS[loc.type] || '#888';
  const r = loc.type === 'capital' ? 7 : loc.type === 'battle' ? 5 : 4;
  const isCapital = loc.type === 'capital';
  g.append('circle').attr('cx', x).attr('cy', y).attr('r', r).attr('data-base-r', r)
    .attr('fill', color).attr('stroke', '#fff').attr('stroke-width', 1.5).attr('opacity', 0.85)
    .style('cursor', 'pointer')
    .on('mouseover', function(event) {
      tooltip.html(`<b>${loc.ko || name}</b> ${name}<br>${loc.en}<br>${loc.note}`)
        .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
      // 호버 시 라벨 표시
      d3.select(this.parentNode).select(`.label-${name.replace(/[^a-zA-Z]/g,'')}`)
        .attr('opacity', 1);
    }).on('mouseout', function() {
      tooltip.style('display','none');
      // 수도가 아니면 라벨 숨기기
      if (!isCapital) {
        d3.select(this.parentNode).select(`.label-${name.replace(/[^a-zA-Z]/g,'')}`)
          .attr('opacity', 0);
      }
    });
  const koName = loc.ko || name;
  g.append('text').attr('class', `city-label label-${name.replace(/[^a-zA-Z]/g,'')}`)
    .attr('x', x+r+3).attr('y', y+3)
    .attr('opacity', isCapital ? 1 : 0)
    .text(`${koName} ${name}`);
});

// ── 지도 하이라이트 (state diagram 연동) ──
function highlightOnMap(fromId, toId, color, charName, order) {
  // 기존 하이라이트 제거
  g.selectAll('.map-highlight').remove();

  const fromLoc = LOCATIONS[fromId];
  const toLoc = LOCATIONS[toId];
  if (!fromLoc || !toLoc) return;

  const [x1, y1] = projection(fromLoc.coords);
  const [x2, y2] = projection(toLoc.coords);

  // 굵은 하이라이트 선
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1;
  const cx = mx + (-dy)*0.15, cy = my + dx*0.15;

  g.append('path').attr('class', 'map-highlight')
    .attr('d', `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`)
    .attr('fill', 'none').attr('stroke', color)
    .attr('stroke-width', 4).attr('opacity', 0.9)
    .attr('marker-end', `url(#arr-0)`);

  // 출발/도착 하이라이트 원
  [{x: x1, y: y1, loc: fromLoc}, {x: x2, y: y2, loc: toLoc}].forEach(p => {
    g.append('circle').attr('class', 'map-highlight')
      .attr('cx', p.x).attr('cy', p.y).attr('r', 12)
      .attr('fill', 'none').attr('stroke', color).attr('stroke-width', 3).attr('opacity', 0.8);
  });

  // 해당 구간으로 줌
  const padX = Math.abs(x2-x1) * 0.5 + 100;
  const padY = Math.abs(y2-y1) * 0.5 + 100;
  const midX = (x1+x2)/2, midY = (y1+y2)/2;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const scale = Math.min(3, Math.max(1.5, 300 / (dist || 1)));
  svg.transition().duration(750).call(
    zoom.transform,
    d3.zoomIdentity.translate(W/2 - midX*scale, H/2 - midY*scale).scale(scale)
  );
}

function highlightNodeOnMap(locId) {
  g.selectAll('.map-highlight').remove();
  const loc = LOCATIONS[locId];
  if (!loc) return;
  const [x, y] = projection(loc.coords);

  g.append('circle').attr('class', 'map-highlight')
    .attr('cx', x).attr('cy', y).attr('r', 15)
    .attr('fill', 'none').attr('stroke', '#c0392b').attr('stroke-width', 3)
    .attr('stroke-dasharray', '4 2');

  svg.transition().duration(750).call(
    zoom.transform,
    d3.zoomIdentity.translate(W/2 - x*2.5, H/2 - y*2.5).scale(2.5)
  );
}

      .attr('orient', 'auto')
      .append('path').attr('d', 'M 0 1 L 8 5 L 0 9 z').attr('fill', color).attr('opacity', 0.7);

    // 구간별 곡률 (같은 구간 왕복 구분)
    const edgeDrawn = {};
    for (let i = 0; i < journey.length - 1; i++) {
      const fromLoc = LOCATIONS[journey[i]];
      const toLoc = LOCATIONS[journey[i+1]];
      if (!fromLoc || !toLoc) continue;
      const [x1, y1] = projection(fromLoc.coords);
      const [x2, y2] = projection(toLoc.coords);

      const sortedKey = [journey[i], journey[i+1]].sort().join('|');
      if (!edgeDrawn[sortedKey]) edgeDrawn[sortedKey] = 0;
      const nth = edgeDrawn[sortedKey]++;
      const curvatures = [0.12, -0.2, 0.28, -0.36, 0.44];
      const curv = curvatures[nth % curvatures.length];

      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const dx = x2-x1, dy = y2-y1;
      const cx = mx + (-dy)*curv, cy = my + dx*curv;

      g.append('path').attr('class', 'journey-path')
        .attr('d', `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`)
        .attr('fill', 'none').attr('stroke', color)
        .attr('stroke-width', 1.2).attr('opacity', 0.6)
        .attr('marker-end', `url(#${arrowId})`)
        .style('cursor', 'pointer')
        .on('mouseover', event => {
          const fko = fromLoc.ko || journey[i];
          const tko = toLoc.ko || journey[i+1];
          tooltip.html(`<b>${name_ko}</b> ${i+1}번째<br>${fko} → ${tko}`)
            .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
        }).on('mouseout', () => tooltip.style('display','none'));
    }

    // 장소 노드
    const visitedLocs = [...new Set(journey)];
    visitedLocs.forEach(locName => {
      const loc = LOCATIONS[locName];
      if (!loc) return;
      const [x, y] = projection(loc.coords);
      const koName = loc.ko || locName;
      const angle = selIdx * (2 * Math.PI / Math.max(selArray.length, 1));
      const oR = selArray.length > 1 ? 10 : 0;
      const ox = x + Math.cos(angle) * oR;
      const oy = y + Math.sin(angle) * oR;
      const visits = journey.filter(l => l === locName).length;

      g.append('circle').attr('class', 'journey-dot')
        .attr('cx', ox).attr('cy', oy).attr('r', 7).attr('data-base-r', 7)
        .attr('fill', color).attr('stroke', '#fff').attr('stroke-width', 1.5)
        .style('cursor', 'pointer')
        .on('mouseover', event => {
          const indices = journey.map((l, idx) => l === locName ? idx+1 : null).filter(v => v);
          tooltip.html(`<b>${name_ko}</b>: ${koName} ${locName}<br>방문: ${indices.join(', ')}번째 (${visits}회)`)
            .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
        }).on('mouseout', () => tooltip.style('display','none'));
    });
  });
}

// Character list
const factionOrder = ['蜀', '魏', '吳', '群', '기타'];
const charList = d3.select('#char-list');

charList.append('div').style('margin-bottom', '8px')
  .append('button').attr('class', 'clear-btn').text('전체 해제')
  .on('click', () => {
    selectedChars.clear();
    d3.selectAll('.char-chip').classed('selected', false)
      .style('background', '#fff').style('color', '#2c2c2c');
    redrawJourneys();
  });

factionOrder.forEach(faction => {
  const fChars = CHARACTERS.filter(c => c.faction === faction);
  if (fChars.length === 0) return;
  const fNames = { '蜀':'촉한 蜀漢', '魏':'조위 曹魏', '吳':'동오 東吳', '群':'군웅 群雄', '기타':'기타' };
  const section = charList.append('div').attr('class', 'faction-section');
  section.append('div').attr('class', 'faction-title')
    .style('color', FACTION_COLORS[faction]).text(fNames[faction] || faction);
  const grid = section.append('div').attr('class', 'char-grid');

  fChars.forEach(c => {
    const chip = grid.append('div').attr('class', 'char-chip')
      .style('border-color', FACTION_COLORS[faction]);
    const hasJourney = CHAR_JOURNEYS[c.name_ko] && CHAR_JOURNEYS[c.name_ko].length > 0;
    chip.html(`${c.name_ko} <span style="color:#888">${c.name_zh}</span><span class="count">${c.mention_count}${hasJourney ? ' ✓' : ''}</span>`);
    chip.on('mouseover', event => {
      const aliases = c.aliases && c.aliases.length > 0 ? '<br>별명: ' + c.aliases.join(', ') : '';
      const base = CHAR_BASES[c.name_ko] || '?';
      const jLen = CHAR_JOURNEYS[c.name_ko] ? CHAR_JOURNEYS[c.name_ko].length + '개 장소' : '경로 없음';
      tooltip.html(`<b>${c.name_ko}</b> ${c.name_zh}${aliases}<br>등장: ${c.mention_count}회<br>거점: ${base}<br>경로: ${jLen}`)
        .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
    }).on('mouseout', () => tooltip.style('display','none'));

    chip.on('click', function() {
      const el = d3.select(this);
      if (el.classed('selected')) {
        el.classed('selected', false).style('background', '#fff').style('color', '#2c2c2c');
        selectedChars.delete(c.name_ko);
      } else {
        el.classed('selected', true)
          .style('background', FACTION_COLORS[c.faction] || '#888').style('color', '#fff');
        selectedChars.add(c.name_ko);
      }
      redrawJourneys();
    });
  });
});

// ── State Diagram (Force Layout) ──
function drawStateDiagram() {
  const container = d3.select('#state-diagram');
  if (selectedChars.size === 0) {
    container.style('display', 'none');
    return;
  }
  container.style('display', 'block').html('');

  const SW = container.node().getBoundingClientRect().width || 900;
  const SH = 450;
  const ssvg = container.append('svg').attr('width', SW).attr('height', SH);
  const sdefs = ssvg.append('defs');
  const sg = ssvg.append('g');

  // 줌/팬
  ssvg.call(d3.zoom().scaleExtent([0.3, 5]).on('zoom', event => sg.attr('transform', event.transform)));

  const typeColors = { capital: '#e67e22', battle: '#c0392b', city: '#8e7cc3' };

  // 모든 선택 인물의 장소+엣지 합치기
  const nodeSet = new Set();
  const edgeList = [];  // {from, to, char, color, order, edgeKey}
  const selArray = [...selectedChars];

  selArray.forEach((name_ko, selIdx) => {
    const c = CHARACTERS.find(ch => ch.name_ko === name_ko);
    if (!c) return;
    const journey = CHAR_JOURNEYS[name_ko];
    if (!journey || journey.length === 0) return;
    const color = FACTION_COLORS[c.faction] || '#888';

    journey.forEach(loc => nodeSet.add(loc));
    for (let i = 0; i < journey.length - 1; i++) {
      edgeList.push({
        source: journey[i], target: journey[i+1],
        char: name_ko, color: color, order: i+1,
        isFirst: i === 0,
        isLast: i === journey.length - 2,
      });
    }
  });

  // 시작/끝 장소 판별
  const startLocs = new Set();
  const endLocs = new Set();
  selArray.forEach(name_ko => {
    const j = CHAR_JOURNEYS[name_ko];
    if (j && j.length > 0) {
      startLocs.add(j[0]);
      endLocs.add(j[j.length - 1]);
    }
  });

  // 노드 데이터
  const nodes = [...nodeSet].map(loc => ({
    id: loc,
    ko: LOCATIONS[loc] ? LOCATIONS[loc].ko : loc,
    type: LOCATIONS[loc] ? LOCATIONS[loc].type : 'city',
    isStart: startLocs.has(loc),
    isEnd: endLocs.has(loc),
  }));

  // 엣지 그룹핑 (같은 구간 → 곡률 다르게)
  const edgeGroups = {};
  edgeList.forEach((e, i) => {
    const key = [e.source, e.target].sort().join('|');
    if (!edgeGroups[key]) edgeGroups[key] = [];
    edgeGroups[key].push(i);
  });

  // 화살표 마커 (색상별)
  const colors = [...new Set(edgeList.map(e => e.color))];
  colors.forEach(c => {
    sdefs.append('marker')
      .attr('id', 'sd-arr-' + c.replace('#',''))
      .attr('viewBox', '0 0 10 10').attr('refX', 24).attr('refY', 5)
      .attr('markerWidth', 4).attr('markerHeight', 4).attr('orient', 'auto')
      .append('path').attr('d', 'M 1 2 L 7 5 L 1 8 z').attr('fill', c);
  });

  // Force simulation
  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edgeList).id(d => d.id).distance(120).strength(0.3))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(SW / 2, SH / 2))
    .force('collision', d3.forceCollide(50))
    .force('x', d3.forceX(SW / 2).strength(0.05))
    .force('y', d3.forceY(SH / 2).strength(0.05));

  // 엣지 그리기
  const linkElements = sg.append('g').selectAll('path')
    .data(edgeList).join('path')
    .attr('fill', 'none').attr('stroke', d => d.color)
    .attr('stroke-width', 1.2).attr('stroke-opacity', 0.45)
    .attr('marker-end', d => `url(#sd-arr-${d.color.replace('#','')})`)
    .style('cursor', 'pointer')
    .on('mouseover', (event, d) => {
      const fko = LOCATIONS[d.source.id||d.source] ? LOCATIONS[d.source.id||d.source].ko : d.source;
      const tko = LOCATIONS[d.target.id||d.target] ? LOCATIONS[d.target.id||d.target].ko : d.target;
      tooltip.html(`<b>${d.char}</b> ${d.order}번째<br>${fko} → ${tko}<br><i>클릭 → 지도 표시</i>`)
        .style('display','block').style('left',(event.clientX+12)+'px').style('top',(event.clientY-10)+'px');
      d3.select(event.target).attr('stroke-width', 3).attr('stroke-opacity', 1);
      // 해당 번호도 강조
      edgeLabelGroups.filter(e => e === d)
        .select('circle').attr('r', 9).attr('opacity', 1).attr('stroke-width', 1.5);
      edgeLabelGroups.filter(e => e === d)
        .select('text').attr('font-size', '9px');
    }).on('mouseout', (event, d) => {
      tooltip.style('display','none');
      d3.select(event.target).attr('stroke-width', 1.2).attr('stroke-opacity', 0.45);
      edgeLabelGroups.filter(e => e === d)
        .select('circle').attr('r', 7).attr('opacity', 0.85).attr('stroke-width', 0.8);
      edgeLabelGroups.filter(e => e === d)
        .select('text').attr('font-size', '7px');
    })
    .on('click', (event, d) => {
      highlightOnMap(d.source.id, d.target.id, d.color, d.char, d.order);
    });

  // 엣지 위 순서 번호 (배경 원 + 숫자)
  const edgeLabelG = sg.append('g');
  const edgeLabelGroups = edgeLabelG.selectAll('g')
    .data(edgeList).join('g').style('pointer-events', 'none');
  edgeLabelGroups.append('circle')
    .attr('r', 7).attr('fill', '#fff').attr('stroke', d => d.color)
    .attr('stroke-width', 0.8).attr('opacity', 0.85);
  const edgeLabels = edgeLabelGroups.append('text')
    .attr('font-size', '7px').attr('fill', d => d.color).attr('text-anchor', 'middle')
    .attr('dy', 2.5).attr('font-weight', 'bold')
    .text(d => d.order);

  // 노드 그리기
  const nodeElements = sg.append('g').selectAll('g')
    .data(nodes).join('g').style('cursor', 'grab')
    .on('click', (event, d) => {
      highlightNodeOnMap(d.id);
    })
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  // init state: 검은 점 + 화살표가 첫 장소로
  selArray.forEach((name_ko, selIdx) => {
    const j = CHAR_JOURNEYS[name_ko];
    if (!j || j.length === 0) return;
    const c = CHARACTERS.find(ch => ch.name_ko === name_ko);
    const color = FACTION_COLORS[c ? c.faction : '기타'] || '#888';
    const startNode = nodes.find(n => n.id === j[0]);
    if (!startNode) return;

    // 검은 점 (init)
    const initDot = sg.append('circle')
      .attr('r', 6).attr('fill', '#2c2c2c')
      .attr('data-start-for', name_ko);
    const initArrow = sg.append('line')
      .attr('stroke', color).attr('stroke-width', 2)
      .attr('marker-end', `url(#sd-arr-${color.replace('#','')})`)
      .attr('data-start-for', name_ko);

    // tick에서 위치 업데이트
    simulation.on('tick.init' + selIdx, () => {
      const sx = startNode.x - 50 - selIdx * 15;
      const sy = startNode.y - 30 - selIdx * 10;
      initDot.attr('cx', sx).attr('cy', sy);
      initArrow.attr('x1', sx).attr('y1', sy).attr('x2', startNode.x - 22).attr('y2', startNode.y - 5);
    });
  });

  // final state: 이중 원 (◎)
  nodeElements.filter(d => d.isEnd && !d.isStart).append('circle')
    .attr('r', 24).attr('fill', 'none').attr('stroke', '#2c2c2c').attr('stroke-width', 2);

  // 일반 노드
  nodeElements.append('circle')
    .attr('r', 20)
    .attr('fill', '#fff')
    .attr('stroke', d => typeColors[d.type] || '#888')
    .attr('stroke-width', 2);

  // final inner dot
  nodeElements.filter(d => d.isEnd && !d.isStart).append('circle')
    .attr('r', 3).attr('fill', '#2c2c2c');

  // 라벨
  nodeElements.append('text')
    .attr('text-anchor', 'middle').attr('y', -26)
    .attr('font-size', '11px').attr('font-family', 'Georgia, serif').attr('fill', '#2c2c2c')
    .text(d => d.ko);

  // 한자 (작게)
  nodeElements.append('text')
    .attr('text-anchor', 'middle').attr('y', 5)
    .attr('font-size', '9px').attr('font-family', 'Georgia, serif').attr('fill', '#999')
    .text(d => d.id);

  // Tick
  simulation.on('tick', () => {
    linkElements.attr('d', (d, i) => {
      const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      const key = [d.source.id, d.target.id].sort().join('|');
      const group = edgeGroups[key] || [i];
      const idx = group.indexOf(i);
      const curves = [0.05, -0.15, 0.25, -0.35, 0.45, -0.55];
      const curv = curves[idx % curves.length] * (group.length > 1 ? 2.0 : 1);
      const mx = (sx+tx)/2, my = (sy+ty)/2;
      const dx = tx-sx, dy = ty-sy;
      return `M${sx},${sy} Q${mx+(-dy)*curv},${my+dx*curv} ${tx},${ty}`;
    });

    edgeLabelGroups
      .attr('transform', (d, i) => {
        const sx=d.source.x, sy=d.source.y, tx=d.target.x, ty=d.target.y;
        const key=[d.source.id,d.target.id].sort().join('|');
        const group=edgeGroups[key]||[i]; const idx=group.indexOf(i);
        const curves=[0.05,-0.15,0.25,-0.35,0.45,-0.55];
        const curv=curves[idx%curves.length]*(group.length>1?2.0:1);
        // t=0.45: 곡선의 중간보다 약간 출발 쪽 (선에 더 가깝게)
        const t = 0.45;
        const mx = (sx+tx)/2, my = (sy+ty)/2;
        const cpx = mx + (-(ty-sy))*curv, cpy = my + (tx-sx)*curv;
        const lx = (1-t)*(1-t)*sx + 2*(1-t)*t*cpx + t*t*tx;
        const ly = (1-t)*(1-t)*sy + 2*(1-t)*t*cpy + t*t*ty;
        return `translate(${lx},${ly})`;
      });

    nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// redrawJourneys 후 state diagram도 갱신
const origRedraw = redrawJourneys;
redrawJourneys = function() {
  origRedraw();
  drawStateDiagram();
};

</script>
