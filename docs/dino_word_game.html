const CHAPTER = 1;
const BOOK_TITLE = "The Moon and Sixpence";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wordListEl = document.getElementById('word-list');
const W = canvas.width, H = canvas.height;

const GROUND_Y = H - 40;
const GRAVITY = 0.6;
const JUMP_FORCE = -11;
const BASE_SPEED = 3.2;
const COIN_HEIGHTS = { 'B2': 45, 'C1': 68, 'C2': 95 };
const IDIOM_HEIGHT = 78;
const DIFF_ORDER = ['B2', 'C1', 'C2'];

let gameState = 'start';
let coinQueue = [], activeCoins = [], cacti = [];
let queueIdx = 0, score = 0, collected = 0, missed = 0, idiomsCaught = 0, totalIdioms = 0;
let speed = BASE_SPEED, frameCount = 0, cactusTimer = 0;
let sparkles = [], missedWords = [];
let selectedDiffIdx = 1;
let clouds = [];
let collectedFlash = null; // { text, timer }
let missedFlash = null;

const dino = { x: 80, y: GROUND_Y, w: 40, h: 44, vy: 0, grounded: true, legFrame: 0, stunTimer: 0 };

for (let i = 0; i < 5; i++) clouds.push({ x: Math.random()*W, y: 20+Math.random()*60, w: 40+Math.random()*50, speed: 0.15+Math.random()*0.25 });

function filterObstacles(minDiff) {
  const minIdx = DIFF_ORDER.indexOf(minDiff);
  return ALL_OBSTACLES.filter(o => o.type === 'idiom' || DIFF_ORDER.indexOf(o.difficulty) >= minIdx);
}

// ── Input ──
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); handleAction(); }
  else if (gameState === 'start') {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') selectedDiffIdx = Math.max(0, selectedDiffIdx - 1);
    else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') selectedDiffIdx = Math.min(2, selectedDiffIdx + 1);
  }
});
canvas.addEventListener('click', e => {
  if (gameState === 'start') {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    const btnY = H/2 + 10, btnW = 80, btnH = 28, gap = 16;
    const startX = (W - 3*btnW - 2*gap) / 2;
    if (my >= btnY - btnH/2 && my <= btnY + btnH/2) {
      for (let i = 0; i < 3; i++) {
        const bx = startX + i*(btnW+gap);
        if (mx >= bx && mx <= bx+btnW) { selectedDiffIdx = i; return; }
      }
    }
    if (my >= btnY + 30) handleAction();
  } else handleAction();
});
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleAction(); }, { passive: false });

function handleAction() {
  if (gameState === 'start') startGame();
  else if (gameState === 'playing' && dino.grounded && dino.stunTimer <= 0) {
    dino.vy = JUMP_FORCE; dino.grounded = false;
  }
  else if (gameState === 'complete') gameState = 'start';
}

function startGame() {
  const minDiff = DIFF_ORDER[selectedDiffIdx];
  coinQueue = filterObstacles(minDiff);
  totalIdioms = coinQueue.filter(o => o.type === 'idiom').length;
  activeCoins = []; cacti = []; sparkles = []; missedWords = [];
  queueIdx = 0; score = 0; collected = 0; missed = 0; idiomsCaught = 0;
  speed = BASE_SPEED; frameCount = 0; cactusTimer = 0;
  collectedFlash = null; missedFlash = null;
  dino.y = GROUND_Y; dino.vy = 0; dino.grounded = true; dino.stunTimer = 0;
  wordListEl.innerHTML = '';
  gameState = 'playing';
  for (let i = 0; i < 3 && queueIdx < coinQueue.length; i++) spawnCoin();
}

function spawnCoin() {
  if (queueIdx >= coinQueue.length) return;
  const data = coinQueue[queueIdx];
  const isIdiom = data.type === 'idiom';
  const floatH = isIdiom ? IDIOM_HEIGHT : (COIN_HEIGHTS[data.difficulty] || 45);
  const lastCoin = activeCoins.filter(c => !c.collected && !c.passed).pop();
  const minX = lastCoin ? lastCoin.x + 200 : W + 60;
  activeCoins.push({
    x: Math.max(W + 60, minX),
    y: GROUND_Y - floatH,
    data, isIdiom,
    collected: false, passed: false,
    bobPhase: Math.random() * Math.PI * 2,
  });
  queueIdx++;
}

function spawnCactus() {
  const variants = [{ w: 14, h: 26 }, { w: 18, h: 34 }, { w: 24, h: 30 }];
  const v = variants[Math.floor(Math.random() * variants.length)];
  if (activeCoins.some(c => !c.collected && !c.passed && Math.abs(c.x - (W+20)) < 120)) return;
  cacti.push({ x: W + 20, y: GROUND_Y, w: v.w, h: v.h });
}

function addToWordList(data) {
  const isIdiom = data.type === 'idiom';
  const lemma = isIdiom ? data.phrase : data.lemma;
  const badge = isIdiom ? 'IDIOM' : data.difficulty;
  const gloss = isIdiom ? data.meaning : data.gloss;
  const sentence = data.sentence || '';
  const ko = data.ko || '';
  const ipa = data.ipa || '';

  // Highlight the word in the sentence
  let highlightedSentence = sentence;
  if (!isIdiom && data.word) {
    const re = new RegExp('(' + data.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    highlightedSentence = sentence.replace(re, '<mark>$1</mark>');
  } else if (isIdiom && data.phrase) {
    const re = new RegExp('(' + data.phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    highlightedSentence = sentence.replace(re, '<mark>$1</mark>');
  }

  const el = document.createElement('div');
  el.className = 'word-entry';
  el.innerHTML = `
    <div class="word-head">
      <span class="lemma">${lemma}</span>
      <span class="badge ${badge}">${badge}</span>
      ${ipa ? '<span class="ipa">' + ipa + '</span>' : ''}
    </div>
    <div class="gloss">${gloss || ''}</div>
    <div class="sentence">${highlightedSentence}</div>
    ${ko ? '<div class="ko">' + ko + '</div>' : ''}
  `;
  wordListEl.prepend(el);
  document.getElementById('btn-print').disabled = false;
}

function printWords() {
  const hdr = document.getElementById('print-header');
  const total = wordListEl.children.length;
  hdr.querySelector('h1').textContent = BOOK_TITLE + ' — Chapter ' + CHAPTER + ' Vocabulary';
  hdr.querySelector('p').textContent = total + ' words collected';
  window.print();
}

// ── Update ──
function update() {
  if (gameState !== 'playing') return;
  frameCount++;

  if (dino.stunTimer > 0) dino.stunTimer--;
  if (!dino.grounded) {
    dino.vy += GRAVITY; dino.y += dino.vy;
    if (dino.y >= GROUND_Y) { dino.y = GROUND_Y; dino.vy = 0; dino.grounded = true; }
  }
  dino.legFrame = Math.floor(frameCount / 6) % 2;

  for (const c of activeCoins) c.x -= speed;
  for (const c of cacti) c.x -= speed;

  const dinoR = dino.x + dino.w, dinoT = dino.y - dino.h;
  for (const c of activeCoins) {
    if (c.collected || c.passed) continue;
    const bobY = c.y + Math.sin(c.bobPhase + frameCount * 0.05) * 4;
    const coinR = 14;
    const cx = c.x, cy = bobY;
    if (dinoR > cx - coinR && dino.x < cx + coinR && dino.y > cy - coinR && dinoT < cy + coinR) {
      c.collected = true; collected++;
      if (c.isIdiom) idiomsCaught++;
      const pts = c.isIdiom ? 25 : c.data.difficulty === 'C2' ? 30 : c.data.difficulty === 'C1' ? 20 : 10;
      score += pts;
      for (let i = 0; i < 8; i++) {
        sparkles.push({
          x: cx, y: cy,
          vx: (Math.random()-0.5)*5, vy: (Math.random()-1)*4,
          life: 20+Math.random()*12,
          color: c.isIdiom ? '#c4b5fd' : '#fbbf24',
        });
      }
      const label = c.isIdiom ? c.data.phrase : c.data.lemma;
      collectedFlash = { text: label, timer: 50, color: c.isIdiom ? '#c4b5fd' : '#fbbf24' };
      addToWordList(c.data);
      continue;
    }
    if (c.x + 14 < dino.x - 30) {
      c.passed = true; missed++;
      missedWords.push(c.isIdiom ? c.data.phrase : c.data.lemma);
      missedFlash = { text: c.isIdiom ? c.data.phrase : c.data.lemma, timer: 45 };
    }
  }

  for (const c of cacti) {
    if (c.hit || c.x > W || c.x + c.w < 0) continue;
    if (dinoR > c.x && dino.x < c.x + c.w && dino.y > c.y - c.h && dinoT < c.y) {
      speed = Math.max(BASE_SPEED * 0.6, speed - 0.8);
      dino.stunTimer = 20; c.hit = true;
      for (let i = 0; i < 4; i++) sparkles.push({
        x: c.x+c.w/2, y: c.y-c.h/2, vx:(Math.random()-0.5)*3, vy:(Math.random()-1)*2, life:15, color:'#ef4444'
      });
    }
  }

  activeCoins = activeCoins.filter(c => c.x > -100);
  cacti = cacti.filter(c => c.x + c.w > -50);

  const pending = activeCoins.filter(c => !c.collected && !c.passed);
  if (pending.length < 4 && queueIdx < coinQueue.length) spawnCoin();
  if (queueIdx >= coinQueue.length && pending.length === 0) { gameState = 'complete'; return; }

  cactusTimer++;
  if (cactusTimer > Math.max(80, 150 - speed*6)) { spawnCactus(); cactusTimer = 0; }

  sparkles = sparkles.filter(s => { s.x += s.vx; s.y += s.vy; s.vy += 0.1; s.life--; return s.life > 0; });
  if (collectedFlash) { collectedFlash.timer--; if (collectedFlash.timer <= 0) collectedFlash = null; }
  if (missedFlash) { missedFlash.timer--; if (missedFlash.timer <= 0) missedFlash = null; }
  if (frameCount % 500 === 0) speed = Math.min(7, speed + 0.15);
  for (const c of clouds) { c.x -= c.speed; if (c.x + c.w < 0) { c.x = W + 20; c.y = 20 + Math.random() * 60; } }
}

// ── Draw ──
function drawCloud(x, y, w) {
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.beginPath(); ctx.ellipse(x, y, w*0.5, 8, 0, 0, Math.PI*2); ctx.fill();
}

function drawGround() {
  const goff = (frameCount * speed) % 20;
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
  for (let x = -goff; x < W; x += 20) { ctx.fillStyle = '#333'; ctx.fillRect(x, GROUND_Y+3, 8, 2); }
}

function drawDino() {
  const x = dino.x, y = dino.y;
  const flash = dino.stunTimer > 0 && Math.floor(frameCount/3)%2===0;
  const col = flash ? '#ff6b6b' : '#7cb342';
  ctx.fillStyle = col;
  ctx.fillRect(x+8, y-40, 24, 28);
  ctx.fillRect(x+20, y-44, 20, 16);
  ctx.fillStyle = '#fff'; ctx.fillRect(x+32, y-42, 5, 5);
  ctx.fillStyle = '#0f0f1a'; ctx.fillRect(x+34, y-41, 2, 2);
  ctx.fillStyle = col;
  ctx.fillRect(x+30, y-32, 12, 2);
  ctx.fillRect(x+4, y-34, 10, 5); ctx.fillRect(x, y-30, 6, 4);
  if (dino.grounded) {
    if (dino.legFrame===0) { ctx.fillRect(x+12,y-12,6,12); ctx.fillRect(x+24,y-8,6,8); }
    else { ctx.fillRect(x+12,y-8,6,8); ctx.fillRect(x+24,y-12,6,12); }
  } else { ctx.fillRect(x+14,y-10,6,10); ctx.fillRect(x+24,y-10,6,10); }
  ctx.fillRect(x, y-38, 10, 4); ctx.fillRect(x-6, y-36, 8, 3);
}

function drawStar(cx, cy, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (i * Math.PI / 5) - Math.PI / 2;
    const radius = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function drawCoin(c) {
  if (c.collected) return;
  const bobY = c.y + Math.sin(c.bobPhase + frameCount * 0.05) * 4;
  const cx = c.x;
  if (c.isIdiom) {
    const grad = ctx.createRadialGradient(cx, bobY, 2, cx, bobY, 14);
    grad.addColorStop(0, '#c4b5fd'); grad.addColorStop(1, '#8b5cf6');
    ctx.beginPath(); ctx.arc(cx, bobY, 13, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); ctx.arc(cx-4, bobY-4, 3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  } else {
    const size = c.data.difficulty === 'C2' ? 14 : c.data.difficulty === 'C1' ? 12 : 10;
    const color = c.data.difficulty === 'C2' ? '#ef4444' : c.data.difficulty === 'C1' ? '#f59e0b' : '#22c55e';
    drawStar(cx, bobY, size, color);
    if (frameCount % 24 < 12) {
      ctx.beginPath(); ctx.arc(cx, bobY, size+5, 0, Math.PI*2);
      ctx.strokeStyle = color; ctx.globalAlpha = 0.2; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
  // Small label
  const label = c.isIdiom ? c.data.phrase : c.data.lemma;
  ctx.font = '9px Courier New';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'center';
  ctx.fillText(label, cx, bobY - 18);
  ctx.textAlign = 'left';
}

function drawCactus(c) {
  ctx.fillStyle = '#4a5568';
  const cx = c.x + c.w/2;
  ctx.fillRect(cx-5, c.y-c.h, 10, c.h);
  if (c.h > 28) {
    ctx.fillRect(cx-14, c.y-c.h+8, 8, 5); ctx.fillRect(cx-14, c.y-c.h+8, 5, 14);
    ctx.fillRect(cx+6, c.y-c.h+16, 8, 5); ctx.fillRect(cx+9, c.y-c.h+16, 5, 10);
  }
}

function drawSparkles() {
  for (const s of sparkles) {
    ctx.globalAlpha = Math.min(1, s.life/20);
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x-2, s.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.font = '12px Courier New'; ctx.fillStyle = '#555';
  ctx.fillText('Ch.' + CHAPTER + '  ' + BOOK_TITLE, 12, 16);

  ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'right'; ctx.fillText('Score: ' + score, W-12, 16); ctx.textAlign = 'left';

  // Progress
  const total = coinQueue.length;
  const barW = 160, barH = 3, barX = W/2-barW/2, barY = 10;
  ctx.fillStyle = '#222'; ctx.fillRect(barX, barY, barW, barH);
  if (total > 0) {
    ctx.fillStyle = '#22c55e'; ctx.fillRect(barX, barY, barW*(collected/total), barH);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(barX+barW*(collected/total), barY, barW*(missed/total), barH);
  }
  ctx.font = '9px Courier New'; ctx.fillStyle = '#555'; ctx.textAlign = 'center';
  ctx.fillText((collected+missed)+'/'+total, W/2, barY+14); ctx.textAlign = 'left';

  // Collected flash (center of game area, brief)
  if (collectedFlash) {
    const alpha = Math.min(1, collectedFlash.timer / 20);
    const yOff = (50 - collectedFlash.timer) * 0.5;
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 20px Georgia'; ctx.fillStyle = collectedFlash.color;
    ctx.textAlign = 'center';
    ctx.fillText(collectedFlash.text, W/2, GROUND_Y - 120 - yOff);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Missed flash
  if (missedFlash) {
    ctx.globalAlpha = missedFlash.timer / 45;
    ctx.font = '11px Courier New'; ctx.fillStyle = '#ef4444';
    ctx.textAlign = 'center';
    ctx.fillText('Missed: ' + missedFlash.text, W/2, GROUND_Y + 20);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

function drawStartScreen() {
  ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, W, H);
  for (const c of clouds) drawCloud(c.x, c.y, c.w);
  drawGround();
  dino.y = GROUND_Y; dino.legFrame = Math.floor(frameCount/10)%2; drawDino();

  const t = frameCount * 0.03;
  drawStar(300, GROUND_Y-45+Math.sin(t)*3, 10, '#22c55e');
  drawStar(440, GROUND_Y-68+Math.sin(t+1)*3, 12, '#f59e0b');
  drawStar(580, GROUND_Y-95+Math.sin(t+2)*3, 14, '#ef4444');
  ctx.beginPath(); ctx.arc(700, GROUND_Y-78+Math.sin(t+3)*3, 12, 0, Math.PI*2);
  ctx.fillStyle = '#8b5cf6'; ctx.fill();

  ctx.textAlign = 'center';
  ctx.font = 'bold 26px Georgia'; ctx.fillStyle = '#fbbf24';
  ctx.fillText('DINO WORD JUMP', W/2, H/2-60);
  ctx.font = '13px Georgia'; ctx.fillStyle = '#94a3b8';
  ctx.fillText(BOOK_TITLE + ' — Chapter ' + CHAPTER, W/2, H/2-36);

  const labels = ['B2+','C1+','C2'];
  const counts = labels.map((_,i) => filterObstacles(DIFF_ORDER[i]).length);
  const colors = ['#22c55e','#f59e0b','#ef4444'];
  const btnW = 80, btnH = 28, gap = 16;
  const startX = (W - 3*btnW - 2*gap)/2;
  const btnY = H/2 + 10;
  ctx.font = '10px Courier New'; ctx.fillStyle = '#555';
  ctx.fillText('Difficulty', W/2, btnY-16);

  for (let i = 0; i < 3; i++) {
    const bx = startX + i*(btnW+gap), sel = i === selectedDiffIdx;
    ctx.fillStyle = sel ? colors[i]+'33' : '#1a1a2e';
    ctx.strokeStyle = sel ? colors[i] : '#444'; ctx.lineWidth = sel ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(bx, btnY-btnH/2, btnW, btnH, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = sel ? colors[i] : '#888';
    ctx.font = sel ? 'bold 12px Courier New' : '12px Courier New';
    ctx.fillText(labels[i]+' ('+counts[i]+')', bx+btnW/2, btnY+4);
  }

  ctx.font = '12px Courier New'; ctx.fillStyle = '#fbbf24';
  if (Math.floor(frameCount/30)%2===0) ctx.fillText('[ SPACE or TAP to start ]', W/2, H/2+48);
  ctx.font = '10px Georgia'; ctx.fillStyle = '#475569';
  ctx.fillText('Jump to collect coins. Collected words appear below.', W/2, H/2+70);
  ctx.textAlign = 'left';
}

function drawCompleteScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px Georgia'; ctx.fillStyle = '#fbbf24';
  ctx.fillText('Chapter ' + CHAPTER + ' Complete!', W/2, 40);

  const total = coinQueue.length;
  const pct = total > 0 ? Math.round(collected / total * 100) : 0;

  ctx.font = '14px Georgia'; ctx.fillStyle = '#e2e8f0';
  ctx.fillText('Collected: ' + collected + ' / ' + total, W/2, 80);
  ctx.fillText('Missed: ' + missed, W/2, 102);
  if (totalIdioms > 0) ctx.fillText('Idioms: ' + idiomsCaught + ' / ' + totalIdioms, W/2, 124);

  ctx.font = 'bold 18px Georgia'; ctx.fillStyle = '#fbbf24';
  ctx.fillText('Score: ' + score, W/2, 154);

  const barW = 180, barH = 10, barX = W/2-barW/2, barY = 170;
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 4); ctx.fill();
  ctx.fillStyle = pct >= 80 ? '#22c55e' : pct >= 50 ? '#f59e0b' : '#ef4444';
  ctx.beginPath(); ctx.roundRect(barX, barY, barW*pct/100, barH, 4); ctx.fill();

  ctx.font = '12px Courier New'; ctx.fillStyle = '#e2e8f0'; ctx.fillText(pct + '%', W/2, barY+barH+16);
  const rating = pct >= 90 ? 'Perfect!' : pct >= 70 ? 'Great!' : pct >= 50 ? 'Good job!' : 'Keep trying!';
  ctx.font = '16px Georgia'; ctx.fillStyle = pct >= 70 ? '#22c55e' : '#f59e0b';
  ctx.fillText(rating, W/2, barY+barH+38);

  if (missedWords.length > 0) {
    ctx.font = '10px Courier New'; ctx.fillStyle = '#ef4444'; ctx.fillText('Missed:', W/2, 230);
    ctx.font = '10px Courier New'; ctx.fillStyle = '#888';
    const shown = missedWords.slice(0, 15).join(', ') + (missedWords.length > 15 ? ' ...' : '');
    ctx.fillText(shown, W/2, 246);
  }

  ctx.font = '12px Courier New'; ctx.fillStyle = '#fbbf24';
  if (Math.floor(frameCount/30)%2===0) ctx.fillText('[ SPACE to play again ]', W/2, H-16);
  ctx.textAlign = 'left';
}

function gameLoop() {
  ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, 0, W, H);
  if (gameState === 'start') {
    frameCount++;
    for (const c of clouds) { c.x -= c.speed; if (c.x+c.w<0) c.x = W+20; }
    drawStartScreen();
  } else if (gameState === 'playing') {
    update();
    for (const c of clouds) drawCloud(c.x, c.y, c.w);
    drawGround();
    for (const c of cacti) drawCactus(c);
    for (const c of activeCoins) drawCoin(c);
    drawSparkles();
    drawDino();
    drawHUD();
  } else if (gameState === 'complete') {
    frameCount++;
    drawCompleteScreen();
  }
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
