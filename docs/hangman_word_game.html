e of an ox-waggon.","word_in_sentence":"dallied","ko":"때로는 그들이 교회 계단에 기대어 있었고, 때로는 구름 한 점 없는 하늘을 배경으로 사이프러스 나무들 사이에서 한가로이 시간을 보냈다. 때로는 르네상스 시대 우물가에서 사랑을 나누었고, 때로는 소가 끄는 마차 옆에서 캄파냐 평원을 거닐었다.","chapter":18},{"lemma":"cypress","difficulty":"C1","gloss":"An evergreen coniferous tree with flattened shoots bearing small scale-like leaves, whose dark foliage is sometimes associated with mourning, in family Cupressaceae, especially the genera Cupressus and Chamaecyparis.","ipa":"/ˈsaɪ.pɹəs/","sentence":"I thought of those cold scenes of his, with their picturesque peasants and cypresses and olive-trees.","word_in_sentence":"cypresses","ko":"나는 그림 같은 농부들과 사이프러스 나무, 올리브 나무가 있는 그의 차가운 풍경화들을 떠올렸다.","chapter":38},{"lemma":"cloudless","difficulty":"C2","gloss":"Without any clouds.","ipa":null,"sentence":"On the verandah the air was scented with the heavy perfume of the tiare, and overhead the Southern Cross shone in a cloudless sky.","word_in_sentence":"cloudless","ko":"베란다에는 티아레 꽃의 진한 향기가 공기를 감쌌고, 머리 위로는 구름 한 점 없는 하늘에 남십자성이 빛나고 있었다.","chapter":51},{"lemma":"waggon","difficulty":"C2","gloss":"Dated spelling of wagon.","ipa":null,"sentence":"Sometimes they lounged at the steps of a church, and sometimes dallied among cypresses against a cloudless sky; sometimes they made love by a Renaissance well-head, and sometimes they wandered through the Campagna by the side of an ox-waggon.","word_in_sentence":"waggon","ko":"때로는 그들이 교회 계단에 기대어 있었고, 때로는 구름 한 점 없는 하늘을 배경으로 사이프러스 나무들 사이에서 한가로이 시간을 보냈다. 때로는 르네상스 시대 우물가에서 사랑을 나누었고, 때로는 소가 끄는 마차 옆에서 캄파냐 평원을 거닐었다.","chapter":18},{"lemma":"chocolat","difficulty":"C1","gloss":{"en":"A sweet food made from cacao beans.","ko":"초콜릿","zh":"巧克力"},"ipa":"","sentence":"One of the painters at the Villa Medici had called him Le Maître de la Boîte à Chocolats.","word_in_sentence":"Chocolats","ko":"빌라 메디치의 화가 중 한 명이 그를 '초콜릿 상자의 대가'라고 불렀다.","chapter":18},{"lemma":"tradesman","difficulty":"C1","gloss":"A skilled manual worker (implied male).","ipa":null,"sentence":"It’s mostly merchants who buy them, and rich tradesmen.","word_in_sentence":"tradesmen","ko":"주로 상인들과 부유한 장사꾼들이 사죠.","chapter":18},{"lemma":"dazzle","difficulty":"C1","gloss":"To confuse or overpower the sight of (someone or something, such as a sensor) by means of excessive brightness.","ipa":"/ˈdæzəl/","sentence":"The colour dazzles you.","word_in_sentence":"dazzles","ko":"그 색채가 눈을 부시게 한다.","chapter":45},{"lemma":"brigand","difficulty":"C2","gloss":"An outlaw or bandit.","ipa":"/ˈbɹɪɡ.ənd/","sentence":"And I think that was the vision that had remained with him always, dazzling his eyes so that he could not see the truth; and notwithstanding the brutality of fact, he continued to see with the eyes of the spirit an Italy of romantic brigands and picturesque ruins.","word_in_sentence":"brigands","ko":"그리고 내 생각에 그 환상이 언제나 그와 함께 남아 있어서 그의 눈을 현혹시켜 진실을 보지 못하게 했던 것 같다. 현실의 잔혹함에도 불구하고 그는 계속해서 영혼의 눈으로 낭만적인 도적들과 그림 같은 폐허가 있는 이탈리아를 보고 있었다.","chapter":18},{"lemma":"naively","difficulty":"C1","gloss":"In a naive manner.","ipa":"/naɪˈivli/","sentence":"He was generous, and the needy, laughing at him because he believed so naively their stories of distress, borrowed from him with effrontery.","word_in_sentence":"naively","ko":"그는 관대했고, 궁핍한 사람들은 그가 자신들의 곤경담을 순진하게 믿는다고 비웃으면서도 뻔뻔스럽게 그에게서 돈을 빌렸다.","chapter":18},{"lemma":"arouse","difficulty":"C1","gloss":"To stimulate or induce (feelings); pique.","ipa":"/əˈɹaʊz/","sentence":"It’s generally a gesture to arouse pity or terror in their lover.”","word_in_sentence":"arouse","ko":"보통은 연인의 동정이나 공포심을 불러일으키려는 몸짓일 뿐이죠.\"","chapter":34},{"lemma":"pickpocket","difficulty":"C1","gloss":"One who steals from the pocket of a passerby, usually by sleight of hand.","ipa":"/ˈpɪkpɒkɪt/","sentence":"I imagine that a pickpocket, proud of his light fingers, must feel a sort of indignation with the careless woman who leaves in a cab a vanity-bag with all her jewels in it.","word_in_sentence":"pickpocket","ko":"손재주가 뛰어난 소매치기라면, 보석을 모두 넣어둔 화장품 가방을 택시에 부주의하게 두고 내리는 여자에게 일종의 분노를 느낄 것이라고 나는 생각한다.","chapter":18},{"lemma":"insensibility","difficulty":"C2","gloss":"The property of being insensible.","ipa":null,"sentence":"Nature had made him a butt, but had denied him insensibility.","word_in_sentence":"insensibility","ko":"자연은 그를 조롱거리로 만들어놓고는 무감각함은 주지 않았다.","chapter":18},{"lemma":"writhe","difficulty":"C2","gloss":"To twist, wring (something).","ipa":"/ɹaɪð/","sentence":"He writhed under the jokes, practical and otherwise, which were perpetually made at his expense, and yet never ceased, it seemed wilfully, to expose himself to them.","word_in_sentence":"writhed","ko":"그는 끊임없이 자신을 희생양으로 삼아 벌어지는 실제적이든 그렇지 않든 온갖 농담들 때문에 괴로워했지만, 마치 일부러 그러는 것처럼 보일 정도로 자신을 그런 상황에 계속 노출시키는 일을 멈추지 않았다.","chapter":18},{"lemma":"perpetually","difficulty":"C1","gloss":"Seeming to never end; endlessly; constantly.","ipa":"/pəˈpɛtʃʊəli/","sentence":"He writhed under the jokes, practical and otherwise, which were perpetually made at his expense, and yet never ceased, it seemed wilfully, to expose himself to them.","word_in_sentence":"perpetually","ko":"그는 끊임없이 자신을 희생양으로 삼아 벌어지는 실제적이든 그렇지 않든 온갖 농담들 때문에 괴로워했지만, 마치 일부러 그러는 것처럼 보일 정도로 자신을 그런 상황에 계속 노출시키는 일을 멈추지 않았다.","chapter":18},{"lemma":"wilfully","difficulty":"C1","gloss":"Willingly, of one's own free will.","ipa":"/ˈwɪlfəli/","sentence":"He writhed under the jokes, practical and otherwise, which were perpetually made at his expense, and yet never ceased, it seemed wilfully, to expose himself to them.","word_in_sentence":"wilfully","ko":"그는 끊임없이 자신을 희생양으로 삼아 벌어지는 실제적이든 그렇지 않든 온갖 농담들 때문에 괴로워했지만, 마치 일부러 그러는 것처럼 보일 정도로 자신을 그런 상황에 계속 노출시키는 일을 멈추지 않았다.","chapter":18},{"lemma":"viper","difficulty":"C1","gloss":"A venomous snake in the family Viperidae.","ipa":"/ˈvaɪpɚ/","sentence":"He was constantly wounded, and yet his good-nature was such that he could not bear malice: the viper might sting him, but he never learned by experience, and had no sooner recovered from his pain than he tenderly placed it once more in his bosom.","word_in_sentence":"viper","ko":"그는 끊임없이 상처를 받았지만, 그의 선량한 성품 때문에 원한을 품을 수가 없었다. 독사가 그를 물어도 그는 경험으로부터 배우지 못했고, 아픔에서 회복되자마자 다시 그 독사를 품에 다정히 안았다.","chapter":18},{"lemma":"tenderly","difficulty":"C1","gloss":"In a tender manner; gently; sweetly.","ipa":"/ˈtɛn.dɚ.li/","sentence":"He was constantly wounded, and yet his good-nature was such that he could not bear malice: the viper might sting him, but he never learned by experience, and had no sooner recovered from his pain than he tenderly placed it once more in his bosom.","word_in_sentence":"tenderly","ko":"그는 끊임없이 상처를 받았지만, 그의 선량한 성품 때문에 원한을 품을 수가 없었다. 독사가 그를 물어도 그는 경험으로부터 배우지 못했고, 아픔에서 회복되자마자 다시 그 독사를 품에 다정히 안았다.","chapter":18},{"lemma":"knockabout","difficulty":"C2","gloss":"Boisterous","ipa":"/ˈnɒk.əˌbaʊt/","sentence":"His life was a tragedy written in the terms of knockabout farce.","word_in_sentence":"knockabout","ko":"그의 인생은 막장 희극의 형식으로 쓰인 비극이었다.","chapter":18},{"lemma":"farce","difficulty":"C1","gloss":"A style of humor marked by broad improbabilities with little regard to regularity or method.","ipa":"/fɑːs/","sentence":"His life was a tragedy written in the terms of knockabout farce.","word_in_sentence":"farce","ko":"그의 인생은 막장 희극의 형식으로 쓰인 비극이었다.","chapter":18},{"lemma":"surer","difficulty":"C2","gloss":"comparative form of sure: more sure","ipa":null,"sentence":"I think I have never known a man whose judgment was surer.","word_in_sentence":"surer","ko":"그만큼 확실한 판단력을 가진 사람을 나는 본 적이 없다고 생각한다.","chapter":18},{"lemma":"kindre","difficulty":"C2","gloss":{"en":"To be of the same kind or nature as.","ko":"같은 종류","zh":"同类"},"ipa":"","sentence":"They may spend their whole lives aliens among their kindred and remain aloof among the only scenes they have ever known.","word_in_sentence":"kindred","ko":"평생을 친족들 사이에서 이방인으로 보내고, 지금껏 알아온 유일한 풍경들 속에서도 동떨어져 지낼지도 모른다.","chapter":50},{"lemma":"incomparable","difficulty":"C1","gloss":"Not comparable.","ipa":"/ɪŋˈkɒmp(ə)rəbəl/","sentence":"To a young man like myself his advice and guidance were of incomparable value.","word_in_sentence":"incomparable","ko":"나 같은 젊은이에게 그의 조언과 지도는 비할 데 없이 소중했다.","chapter":18},{"lemma":"vividly","difficulty":"C1","gloss":"In a vivid manner.","ipa":"/ˈvɪvɪdli/","sentence":"When I left Rome I corresponded with him, and about once in two months received from him long letters in queer English, which brought before me vividly his spluttering, enthusiastic, gesticulating conversation.","word_in_sentence":"vividly","ko":"로마를 떠난 후 나는 그와 편지를 주고받았는데, 두 달에 한 번 정도 그로부터 이상한 영어로 쓰인 긴 편지를 받았고, 그 편지는 더듬거리며 열정적으로 몸짓을 섞어가며 나누던 그의 대화를 생생하게 떠올리게 해주었다.","chapter":18},{"lemma":"spluttering","difficulty":"C2","gloss":"gerund of splutter: the act of one who splutters.","ipa":"/ˈsplʌtəɹɪŋ/","sentence":"When I left Rome I corresponded with him, and about once in two months received from him long letters in queer English, which brought before me vividly his spluttering, enthusiastic, gesticulating conversation.","word_in_sentence":"spluttering","ko":"로마를 떠난 후 나는 그와 편지를 주고받았는데, 두 달에 한 번 정도 그로부터 이상한 영어로 쓰인 긴 편지를 받았고, 그 편지는 더듬거리며 열정적으로 몸짓을 섞어가며 나누던 그의 대화를 생생하게 떠올리게 해주었다.","chapter":18},{"lemma":"gesticulate","difficulty":"C2","gloss":"To make gestures or motions, as in speaking.","ipa":"/d͡ʒɛsˈtɪkjəleɪt/","sentence":"And the crowd that throngs the wharf as the steamer draws alongside is gay and debonair; it is a noisy, cheerful, gesticulating crowd.","word_in_sentence":"gesticulating","ko":"그리고 기선이 접안할 때 부두에 몰려든 군중은 명랑하고 쾌활하다. 시끄럽고 유쾌하며 몸짓을 크게 하는 군중이다.","chapter":45},{"lemma":"bombard","difficulty":"C1","gloss":"A medieval primitive cannon, used chiefly in sieges for throwing heavy stone balls.","ipa":"/ˈbɑmˌbɑɹd/","sentence":"He bombarded me with questions.","word_in_sentence":"bombarded","ko":"그는 질문 공세를 퍼부었다.","chapter":19},{"lemma":"exuberance","difficulty":"C1","gloss":"The quality of being exuberant; cheerful or vigorous enthusiasm; liveliness.","ipa":"/ɛksˈjuː.bɜːɹ.əns/","sentence":"He was heart-broken because he had no whisky, wanted to make coffee for me, racked his brain for something he could possibly do for me, and beamed and laughed, and in the exuberance of his delight sweated at every pore.","word_in_sentence":"exuberance","ko":"위스키가 없다며 가슴 아파하고, 나를 위해 커피를 끓이려 하고, 내게 뭔가 해줄 일이 없나 머리를 쥐어짜며, 환하게 웃고 기뻐하다가 흥분한 나머지 온몸에서 땀을 뻘뻘 흘렸다.","chapter":19},{"lemma":"pore","difficulty":"C1","gloss":"A tiny opening in the skin.","ipa":"/pɔː(ɹ)/","sentence":"He was heart-broken because he had no whisky, wanted to make coffee for me, racked his brain for something he could possibly do for me, and beamed and laughed, and in the exuberance of his delight sweated at every pore.","word_in_sentence":"pore","ko":"위스키가 없다며 가슴 아파하고, 나를 위해 커피를 끓이려 하고, 내게 뭔가 해줄 일이 없나 머리를 쥐어짜며, 환하게 웃고 기뻐하다가 흥분한 나머지 온몸에서 땀을 뻘뻘 흘렸다.","chapter":19},{"lemma":"prematurely","difficulty":"C1","gloss":"In a premature manner; too soon or too early.","ipa":"/ˌpɹiːməˈtjʊə(ɹ)li/","sentence":"He was a fat little man, with short legs, young still—he could not have been more than thirty—but prematurely bald.","word_in_sentence":"prematurely","ko":"그는 다리가 짧은 뚱뚱한 소남자였는데, 아직 젊었지만—서른을 넘지 않았을 것이다—일찍 대머리가 되었다.","chapter":19},{"lemma":"unfriendly","difficulty":"C1","gloss":"Not friendly; hostile; mean.","ipa":"/ʌnˈfɹɛn(d)li/","sentence":"He really looked upon it as unfriendly that I had not given him the opportunity of making himself useful to me.","word_in_sentence":"unfriendly","ko":"그는 자신이 나에게 도움이 될 기회를 주지 않은 것을 정말로 불친절한 일이라고 여겼다.","chapter":19},{"lemma":"mend","difficulty":"C1","gloss":"To physically repair (something that is broken, defaced, decayed, torn, or otherwise damaged).","ipa":"/mɛnd/","sentence":"Mrs. Stroeve sewed, and I thought I recognised the shirt she was mending as Strickland’s.","word_in_sentence":"mending","ko":"스트루브 부인은 바느질을 하고 있었는데, 그녀가 꿰매고 있는 셔츠가 스트릭랜드의 것인 듯했다.","chapter":26},{"lemma":"stocking","difficulty":"C1","gloss":"A soft garment, usually knit or woven, worn on the foot and lower leg under shoes or other footwear.","ipa":"/ˈstɑkɪŋ/","sentence":"Meanwhile, Mrs. Stroeve sat quietly mending her stockings, without talking, and she listened to all he said with a quiet smile on her lips.","word_in_sentence":"stockings","ko":"한편 스트루브 부인은 조용히 앉아서 말없이 스타킹을 꿰매고 있었는데, 그가 하는 말을 모두 입가에 잔잔한 미소를 띠며 듣고 있었다.","chapter":19},{"lemma":"petit","difficulty":"C1","gloss":"Petite: small, little.","ipa":"/ˈpɛtət/","sentence":"“Mon petit chou”, he said.","word_in_sentence":"petit","ko":"\"몽 프티 슈\", 그가 말했다.","chapter":19},{"lemma":"pantaloon","difficulty":"C2","gloss":"An aging buffoon.","ipa":"/pæntəˈluːn/","sentence":"Poor pantaloon, he was not an object to excite love, but the smile in her eyes was affectionate, and it was possible that her reserve concealed a very deep feeling.","word_in_sentence":"pantaloon","ko":"불쌍한 어릿광대, 그는 사랑을 불러일으킬 만한 대상은 아니었지만, 그녀의 눈에 담긴 미소는 다정했고, 그녀의 차분함이 아주 깊은 감정을 숨기고 있을 가능성도 있었다.","chapter":19},{"lemma":"affectionate","difficulty":"C1","gloss":"Having affection or warm regard; loving; fond.","ipa":"/əˈfɛkʃənət/","sentence":"“Don’t be affectionate before strangers, Dirk,” she said.","word_in_sentence":"affectionate","ko":"\"낯선 사람들 앞에서 애정 표현은 하지 마세요, 더크.\" 그녀가 말했다.","chapter":25},{"lemma":"ravish","difficulty":"C2","gloss":"To seize and carry away by violence; to snatch by force.","ipa":"/ˈɹæ.vɪʃ/","sentence":"She was not the ravishing creature that his love-sick fancy saw, but she had a grave comeliness.","word_in_sentence":"ravishing","ko":"그녀는 그의 사랑에 병든 상상이 그려낸 황홀한 피조물은 아니었지만, 엄숙한 아름다움을 지니고 있었다.","chapter":19},{"lemma":"comeliness","difficulty":"C2","gloss":"Quality of being comely; beauty, attractiveness.","ipa":null,"sentence":"She was not the ravishing creature that his love-sick fancy saw, but she had a grave comeliness.","word_in_sentence":"comeliness","ko":"그녀는 그의 사랑에 병든 상상이 그려낸 황홀한 피조물은 아니었지만, 엄숙한 아름다움을 지니고 있었다.","chapter":19},{"lemma":"sculptor","difficulty":"C1","gloss":"A person who sculpts; an artist who produces sculpture.","ipa":"/ˈskʌlptɚ/","sentence":"It was a figure that might have appealed more to the sculptor than to the costumier.","word_in_sentence":"sculptor","ko":"그것은 의상 디자이너보다는 조각가에게 더 어필할 만한 몸매였다.","chapter":19},{"lemma":"costumier","difficulty":"C2","gloss":"A person who supplies or designs costumes.","ipa":null,"sentence":"It was a figure that might have appealed more to the sculptor than to the costumier.","word_in_sentence":"costumier","ko":"그것은 의상 디자이너보다는 조각가에게 더 어필할 만한 몸매였다.","chapter":19},{"lemma":"housewife","difficulty":"C1","gloss":"A woman whose main employment is homemaking, maintaining the upkeep of her home and tending to household affairs; often, such a woman whose sole [unpaid] employment is homemaking.","ipa":"/ˈhaʊs.waɪf/","sentence":"But when Stroeve spoke of Chardin it was not without reason, and she reminded me curiously of that pleasant housewife in her mob-cap and apron whom the great painter has immortalised.","word_in_sentence":"housewife","ko":"하지만 스트루브가 샤르댕을 언급한 것은 이유가 없지 않았고, 그녀는 그 위대한 화가가 불멸의 작품으로 남긴 모자를 쓰고 앞치마를 두른 그 다정한 주부를 기묘하게 연상시켰다.","chapter":19},{"lemma":"apron","difficulty":"C1","gloss":"An article of clothing worn over the front of the torso and/or legs for protection from spills; also historically worn by Freemasons and as part of women's fashion.","ipa":"/ˈeɪ.pɹən/","sentence":"He saw her roll down her sleeves and remove her apron—the apron hung on a peg behind the door—and take the bottle of oxalic acid and go with it into the bedroom.","word_in_sentence":"apron","ko":"그는 그녀가 소매를 내리고 앞치마를 벗는 모습을 보았다—그 앞치마는 문 뒤 못에 걸려 있었다—그리고 옥살산 병을 들고 침실로 들어가는 모습을.","chapter":39},{"lemma":"immortalise","difficulty":"C2","gloss":"To give unending life to, to make immortal.","ipa":"/ɪˈmɔː(ɹ).təˌlaɪz/","sentence":"But when Stroeve spoke of Chardin it was not without reason, and she reminded me curiously of that pleasant housewife in her mob-cap and apron whom the great painter has immortalised.","word_in_sentence":"immortalised","ko":"하지만 스트루브가 샤르댕을 언급한 것은 이유가 없지 않았고, 그녀는 그 위대한 화가가 불멸의 작품으로 남긴 모자를 쓰고 앞치마를 두른 그 다정한 주부를 기묘하게 연상시켰다.","chapter":19},{"lemma":"sedately","difficulty":"C2","gloss":"Calmly, without excessive emotion or force; in a composed manner.","ipa":null,"sentence":"I could imagine her sedately busy among her pots and pans, making a ritual of her household duties, so that they acquired a moral significance; I did not suppose that she was clever or could ever be amusing, but there was something in her grave intentness which excited my interest.","word_in_sentence":"sedately","ko":"나는 그녀가 냄비와 프라이팬 사이에서 차분히 바쁘게 움직이며, 가사일을 하나의 의식으로 만들어 도덕적 의미를 부여하는 모습을 상상할 수 있었다. 그녀가 영리하거나 재미있을 수 있으리라고는 생각하지 않았지만, 그녀의 진지한 집중력에는 내 관심을 끄는 무언가가 있었다.","chapter":19},{"lemma":"intentness","difficulty":"C2","gloss":"The condition of being intent.","ipa":null,"sentence":"I could imagine her sedately busy among her pots and pans, making a ritual of her household duties, so that they acquired a moral significance; I did not suppose that she was clever or could ever be amusing, but there was something in her grave intentness which excited my interest.","word_in_sentence":"intentness","ko":"나는 그녀가 냄비와 프라이팬 사이에서 차분히 바쁘게 움직이며, 가사일을 하나의 의식으로 만들어 도덕적 의미를 부여하는 모습을 상상할 수 있었다. 그녀가 영리하거나 재미있을 수 있으리라고는 생각하지 않았지만, 그녀의 진지한 집중력에는 내 관심을 끄는 무언가가 있었다.","chapter":19},{"lemma":"upbringing","difficulty":"C1","gloss":"The traits acquired during one's childhood training","ipa":"/ˈʌpˌbrɪŋɪŋ/","sentence":"Though she was English, I could not exactly place her, and it was not obvious from what rank in society she sprang, what had been her upbringing, or how she had lived before her marriage.","word_in_sentence":"upbringing","ko":"그녀는 영국인이었지만, 나는 그녀의 정확한 출신을 알 수 없었고, 그녀가 어떤 사회 계층 출신인지, 어떤 교육을 받았는지, 결혼 전에 어떻게 살았는지도 분명하지 않았다.","chapter":19},{"lemma":"easel","difficulty":"C1","gloss":"An upright frame, typically on three legs, for displaying or supporting something, such as an artist's canvas.","ipa":"/ˈiː.z(ə)l/","sentence":"There was a picture on the easel.","word_in_sentence":"easel","ko":"이젤 위에 그림이 한 점 있었다.","chapter":55},{"lemma":"apologetic","difficulty":"C1","gloss":"Having the character of apology; regretfully excusing.","ipa":"/əˌpɑləˈd͡ʒɛtɪk/","sentence":"His apologetic laugh did not disguise the pleasure that he felt.","word_in_sentence":"apologetic","ko":"그의 미안해하는 듯한 웃음으로도 자신이 느끼는 기쁨을 감출 수는 없었다.","chapter":19},{"lemma":"linger","difficulty":"C1","gloss":"To stay or remain in a place or situation, especially as if unwilling to depart or not easily able to do so.","ipa":"/ˈlɪŋɡɚ/","sentence":"His eyes lingered on his picture.","word_in_sentence":"lingered","ko":"그의 시선이 자신의 그림에 머물렀다.","chapter":19},{"lemma":"hackneye","difficulty":"C2","gloss":{"en":"to travel or move by using public transportation","ko":"공중 교통으로 이동하다","zh":"乘车"},"ipa":"","sentence":"It was strange that his critical sense, so accurate and unconventional when he dealt with the work of others, should be satisfied in himself with what was hackneyed and vulgar beyond belief.","word_in_sentence":"hackneyed","ko":"다른 사람의 작품을 다룰 때는 그토록 정확하고 독창적이던 그의 비판적 안목이, 자신의 경우에는 믿을 수 없을 만큼 진부하고 저속한 것에 만족한다는 사실이 이상했다.","chapter":19},{"lemma":"insincere","difficulty":"C1","gloss":"Not genuinely meaning what has been expressed; not sincere; artificial; factitious.","ipa":null,"sentence":"It was all false, insincere, shoddy; and yet no one was more honest, sincere, and frank than Dirk Stroeve.","word_in_sentence":"insincere","ko":"모든 것이 거짓되고 부성실하고 조잡했다. 그런데도 더크 스트루브보다 더 정직하고 성실하고 솔직한 사람은 없었다.","chapter":19},{"lemma":"shoddy","difficulty":"C1","gloss":"Of poor quality or construction.","ipa":"/ˈʃɑ.di/","sentence":"It was all false, insincere, shoddy; and yet no one was more honest, sincere, and frank than Dirk Stroeve.","word_in_sentence":"shoddy","ko":"모든 것이 거짓되고 부성실하고 조잡했다. 그런데도 더크 스트루브보다 더 정직하고 성실하고 솔직한 사람은 없었다.","chapter":19},{"lemma":"awkwardness","difficulty":"C1","gloss":"The state or quality of being awkward; clumsiness; unskillfulness.","ipa":null,"sentence":"I do not know why he had begun the story against himself; he felt an awkwardness at finishing it.","word_in_sentence":"awkwardness","ko":"왜 자신에게 불리한 이야기를 시작했는지 모르겠지만, 그는 끝맺기가 어색했다.","chapter":19},{"lemma":"indignantly","difficulty":"C2","gloss":"In an indignant manner.","ipa":null,"sentence":"“And Dirk actually gave it him,” said his wife indignantly.","word_in_sentence":"indignantly","ko":"\"그런데 더크가 정말로 돈을 줬다니까요.\" 그의 아내가 분개하며 말했다.","chapter":19},{"lemma":"lamentable","difficulty":"C2","gloss":"Causing sorrow, distress or regret; deplorable, pitiful or distressing.","ipa":"/ləˈmɛn.tə.bəl/","sentence":"When I had narrated his lamentable death I ceased.","word_in_sentence":"lamentable","ko":"그의 비참한 죽음을 이야기하고 나서 나는 말을 멈췄다.","chapter":58},{"lemma":"flushed","difficulty":"C1","gloss":"Red in the face because of embarrassment, exertion, etc.","ipa":"/flʌʃt/","sentence":"His flushed face was shining with excitement.","word_in_sentence":"flushed","ko":"흥분으로 달아오른 그의 얼굴이 번들거렸다.","chapter":19},{"lemma":"sluggishness","difficulty":"C2","gloss":"The property of being sluggish, unable or unwilling to act quickly.","ipa":null,"sentence":"The fact that he had never changed suggested a sluggishness of habit which seemed to me characteristic.","word_in_sentence":"sluggishness","ko":"그가 한 번도 장소를 바꾸지 않았다는 사실은 그의 특징으로 보이는 습관의 게으름을 시사했다.","chapter":20},{"lemma":"straightway","difficulty":"C2","gloss":"A straight section of a racetrack.","ipa":null,"sentence":"He moved a piece and straightway became absorbed in the game.","word_in_sentence":"straightway","ko":"그는 말을 움직이고는 곧바로 게임에 몰두했다.","chapter":20},{"lemma":"ragged","difficulty":"C1","gloss":"In tatters, having the texture broken.","ipa":"/ˈɹæɡɪd/","sentence":"Bananas with their great ragged leaves, like the tattered habiliments of an empress in adversity, grew close up to the house.","word_in_sentence":"ragged","ko":"역경에 처한 여제의 너덜너덜한 의복 같은 크고 너덜거리는 잎사귀를 가진 바나나 나무들이 집 바로 옆까지 자라고 있었다.","chapter":52},{"lemma":"untrimmed","difficulty":"C2","gloss":"Not trimmed; not made tidy by cutting.","ipa":null,"sentence":"In the first place his red beard, ragged and untrimmed, hid much of his face, and his hair was long; but the most surprising change in him was his extreme thinness.","word_in_sentence":"untrimmed","ko":"우선 그의 붉은 수염이 거칠고 다듬어지지 않아 얼굴의 상당 부분을 가리고 있었고, 머리카락도 길었다. 하지만 그에게서 가장 놀라운 변화는 극도로 말라빠진 모습이었다.","chapter":20},{"lemma":"thinness","difficulty":"C2","gloss":"The state or quality of being thin.","ipa":null,"sentence":"In the first place his red beard, ragged and untrimmed, hid much of his face, and his hair was long; but the most surprising change in him was his extreme thinness.","word_in_sentence":"thinness","ko":"우선 그의 붉은 수염이 거칠고 다듬어지지 않아 얼굴의 상당 부분을 가리고 있었고, 머리카락도 길었다. 하지만 그에게서 가장 놀라운 변화는 극도로 말라빠진 모습이었다.","chapter":20},{"lemma":"protrude","difficulty":"C2","gloss":"To extend from, above or beyond a surface or boundary; to bulge outward; to stick out.","ipa":"/pɹəˈtɹuːd/","sentence":"It made his great nose protrude more arrogantly; it emphasized his cheekbones; it made his eyes seem larger.","word_in_sentence":"protrude","ko":"그것은 그의 큰 코를 더욱 거만하게 튀어나오게 했고, 광대뼈를 강조했으며, 눈을 더 크게 보이게 했다.","chapter":20},{"lemma":"arrogantly","difficulty":"C2","gloss":"In an arrogant manner; with undue pride or self-importance.","ipa":null,"sentence":"It made his great nose protrude more arrogantly; it emphasized his cheekbones; it made his eyes seem larger.","word_in_sentence":"arrogantly","ko":"그것은 그의 큰 코를 더욱 거만하게 튀어나오게 했고, 광대뼈를 강조했으며, 눈을 더 크게 보이게 했다.","chapter":20},{"lemma":"cheekbone","difficulty":"C2","gloss":"The small prominent bone of the cheek.","ipa":"/ˈt͡ʃikˌboʊn/","sentence":"It made his great nose protrude more arrogantly; it emphasized his cheekbones; it made his eyes seem larger.","word_in_sentence":"cheekbones","ko":"그것은 그의 큰 코를 더욱 거만하게 튀어나오게 했고, 광대뼈를 강조했으며, 눈을 더 크게 보이게 했다.","chapter":20},{"lemma":"cadaverous","difficulty":"C2","gloss":"Corpselike; hinting of death; imitating a cadaver.","ipa":null,"sentence":"His body was cadaverous.","word_in_sentence":"cadaverous","ko":"그의 몸은 해골 같았다.","chapter":20},{"lemma":"threadbare","difficulty":"C2","gloss":"Of cloth, clothing, furnishings, etc.: frayed and worn to an extent that the nap is damaged and the warp and weft threads show; shabby, worn-out.","ipa":"/ˈθɹɛdbɛə/","sentence":"He wore the same suit that I had seen him in five years before; it was torn and stained, threadbare, and it hung upon him loosely, as though it had been made for someone else.","word_in_sentence":"threadbare","ko":"그는 5년 전에 내가 보았던 것과 같은 정장을 입고 있었는데, 찢어지고 얼룩져 있었으며 실이 다 빠져 있었고, 마치 다른 사람을 위해 만들어진 것처럼 헐렁하게 걸쳐져 있었다.","chapter":20},{"lemma":"sinew","difficulty":"C2","gloss":"A cord or tendon of the body.","ipa":"/ˈsɪny/","sentence":"I noticed his hands, dirty, with long nails; they were merely bone and sinew, large and strong; but I had forgotten that they were so shapely.","word_in_sentence":"sinew","ko":"나는 그의 손을 주목했는데, 더럽고 손톱이 길었으며, 뼈와 힘줄뿐이었지만 크고 강했다. 하지만 그토록 아름다운 모양이었다는 것을 나는 잊고 있었다.","chapter":20},{"lemma":"shapely","difficulty":"C1","gloss":"Having a pleasing shape, pleasant to look at.","ipa":"/ˈʃeɪpli/","sentence":"I noticed his hands, dirty, with long nails; they were merely bone and sinew, large and strong; but I had forgotten that they were so shapely.","word_in_sentence":"shapely","ko":"나는 그의 손을 주목했는데, 더럽고 손톱이 길었으며, 뼈와 힘줄뿐이었지만 크고 강했다. 하지만 그토록 아름다운 모양이었다는 것을 나는 잊고 있었다.","chapter":20},{"lemma":"rivet","difficulty":"C1","gloss":"A cylindrical mechanical fastener that attaches multiple parts together by fitting through a hole and deforming the head(s) at either end.","ipa":"/ˈɹɪvət/","sentence":"He gave me an extraordinary impression as he sat there, his attention riveted on his game—an impression of great strength; and I could not understand why it was that his emaciation somehow made it more striking.","word_in_sentence":"riveted","ko":"그가 거기 앉아 게임에 시선을 고정한 채 있는 모습은 나에게 기이한 인상을 주었다—엄청난 힘의 인상을. 그런데 그의 야윔이 어째서 그것을 더욱 인상적으로 만드는지 나는 이해할 수 없었다.","chapter":20},{"lemma":"emaciation","difficulty":"C2","gloss":"The act of making very lean.","ipa":null,"sentence":"He gave me an extraordinary impression as he sat there, his attention riveted on his game—an impression of great strength; and I could not understand why it was that his emaciation somehow made it more striking.","word_in_sentence":"emaciation","ko":"그가 거기 앉아 게임에 시선을 고정한 채 있는 모습은 나에게 기이한 인상을 주었다—엄청난 힘의 인상을. 그런데 그의 야윔이 어째서 그것을 더욱 인상적으로 만드는지 나는 이해할 수 없었다.","chapter":20},{"lemma":"abstraction","difficulty":"C1","gloss":"The taking surreptitiously for one's own use part of the property of another; purloining.","ipa":"/æbˈstɹæk.ʃn̩/","sentence":"Presently, after moving, he leaned back and gazed with a curious abstraction at his antagonist.","word_in_sentence":"abstraction","ko":"곧 한 수를 둔 후, 그는 몸을 뒤로 기대며 기묘한 몰입으로 상대방을 응시했다.","chapter":20},{"lemma":"antagonist","difficulty":"C1","gloss":"An opponent or enemy.","ipa":"/ænˈtæɡənɪst/","sentence":"Presently, after moving, he leaned back and gazed with a curious abstraction at his antagonist.","word_in_sentence":"antagonist","ko":"곧 한 수를 둔 후, 그는 몸을 뒤로 기대며 기묘한 몰입으로 상대방을 응시했다.","chapter":20},{"lemma":"bearded","difficulty":"C1","gloss":"simple past and past participle of beard","ipa":"/ˈbɪɹdəd/","sentence":"This was a fat, bearded Frenchman.","word_in_sentence":"bearded","ko":"상대는 뚱뚱하고 수염 난 프랑스인이었다.","chapter":20},{"lemma":"jovial","difficulty":"C1","gloss":"Cheerful and good-humoured; jolly, merry.","ipa":"/ˈd͡ʒəʊ.vɪ.əl/","sentence":"The Frenchman considered the position, then broke suddenly into jovial expletives, and with an impatient gesture, gathering up the pieces, flung them into their box.","word_in_sentence":"jovial","ko":"프랑스인은 판세를 살펴보더니 갑자기 유쾌한 욕설을 터뜨리며, 성급한 몸짓으로 말들을 모아 상자 안에 던져 넣었다.","chapter":20},{"lemma":"strickland","difficulty":"C1","gloss":"A surname from Old English.","ipa":null,"sentence":"“Strickland’s painting in my studio.”","word_in_sentence":"Strickland","ko":"\"스트릭랜드가 내 작업실에서 그림을 그리고 있어.\"","chapter":27},{"lemma":"cheerfully","difficulty":"C1","gloss":"In a cheerful manner.","ipa":"/ˈt͡ʃɪɹfəli/","sentence":"“I’ve brought an old friend to see you,” repeated Stroeve, beaming cheerfully.","word_in_sentence":"cheerfully","ko":"\"오랜 친구를 데려와서 당신을 만나게 해드렸어요.\" 스트루브가 밝게 웃으며 다시 말했다.","chapter":20},{"lemma":"thoughtfully","difficulty":"C1","gloss":"In a thoughtful or pensive manner.","ipa":"/ˈθɔːtfʊli/","sentence":"Strickland looked at me thoughtfully for nearly a minute.","word_in_sentence":"thoughtfully","ko":"스트릭랜드는 거의 1분 동안 나를 곰곰히 바라보았다.","chapter":20},{"lemma":"gleam","difficulty":"C1","gloss":"An appearance of light, especially one which is indistinct or small, or short-lived.","ipa":"/ɡliːm/","sentence":"he said, with a gleam of anger in his eyes.","word_in_sentence":"gleam","ko":"그가 눈에 분노의 빛을 띠며 말했다.","chapter":23},{"lemma":"abash","difficulty":"C2","gloss":"To make ashamed; to embarrass; to destroy the self-possession of, as by exciting suddenly a consciousness of guilt, mistake, or inferiority; to disconcert; to discomfit.","ipa":"/əˈbæʃ/","sentence":"I was not so easily abashed as I had been some years earlier.","word_in_sentence":"abashed","ko":"나는 몇 년 전처럼 그렇게 쉽게 당황하지 않았다.","chapter":20},{"lemma":"stroeve","difficulty":"C2","gloss":{"en":"Used to express a strong feeling or emphasis","ko":"강하게","zh":"强烈地"},"ipa":"","sentence":"“Stroeve,” I said.","word_in_sentence":"Stroeve","ko":"\"스트루브.\" 내가 말했다.","chapter":27},{"lemma":"voluble","difficulty":"C2","gloss":"Fluent or having a ready flow of speech.","ipa":"/ˈvɒl.jʊ.bəl/","sentence":"Stroeve, with voluble tongue, explained how he and I had met, and by what an accident we discovered that we both knew Strickland.","word_in_sentence":"voluble","ko":"스트루브는 유창한 말솜씨로 그와 내가 어떻게 만났는지, 그리고 어떤 우연으로 우리 둘 다 스트릭랜드를 안다는 사실을 알게 되었는지 설명했다.","chapter":20},{"lemma":"reflectively","difficulty":"C2","gloss":"In a reflective manner; meditatively.","ipa":null,"sentence":"I looked at him reflectively.","word_in_sentence":"reflectively","ko":"나는 그를 곰곰히 바라보았다.","chapter":21},{"lemma":"babble","difficulty":"C1","gloss":"To utter words indistinctly or unintelligibly; to utter inarticulate sounds","ipa":"/ˈbæb.(ə)l/","sentence":"He glanced at me once or twice reflectively, but for the most part seemed occupied with his own thoughts; and certainly without Stroeve’s babble the conversation would have been difficult.","word_in_sentence":"babble","ko":"그는 한두 번 생각에 잠긴 듯 나를 흘끗 보았지만, 대부분은 자신의 생각에 잠겨 있는 것 같았다. 스트루브의 수다가 없었다면 대화는 분명 어려웠을 것이다.","chapter":20},{"lemma":"exasperation","difficulty":"C1","gloss":"The act of exasperating or the state of being exasperated; irritation; keen or bitter anger.","ipa":null,"sentence":"I fancied there was in his tone a slight note of exasperation.","word_in_sentence":"exasperation","ko":"그의 어조에 약간의 짜증이 섞여 있는 것 같았다.","chapter":21},{"lemma":"patiently","difficulty":"C1","gloss":"In a patient manner.","ipa":"/ˈpeɪʃəntli/","sentence":"I waited patiently.","word_in_sentence":"patiently","ko":"나는 참을성 있게 기다렸다.","chapter":21},{"lemma":"tantalise","difficulty":"C2","gloss":"Non-Oxford British English standard spelling of tantalize.","ipa":null,"sentence":"They were strangely tantalising.","word_in_sentence":"tantalising","ko":"그것들은 이상하게도 감질나게 했다.","chapter":42},{"lemma":"mutilate","difficulty":"C2","gloss":"To physically harm as to impair use, notably by cutting off or otherwise disabling a vital part, such as a limb.","ipa":"/ˈmjuː.tɪˌleɪt/","sentence":"It was like making one’s way through a mutilated manuscript.","word_in_sentence":"mutilated","ko":"그것은 훼손된 원고를 해독해 나가는 것과 같았다.","chapter":21},{"lemma":"englishman","difficulty":"C1","gloss":"A native or inhabitant of England; a man who is English by ancestry, birth, descent, or naturalisation.","ipa":"/ˈɪŋ.lɪʃ.mən/","sentence":"Strickland was distinguished from most Englishmen by his perfect indifference to comfort; it did not irk him to live always in one shabby room; he had no need to be surrounded by beautiful things.","word_in_sentence":"Englishmen","ko":"스트릭랜드는 안락함에 대한 완전한 무관심으로 대부분의 영국인들과 구별되었다. 항상 초라한 방 하나에서 사는 것이 그를 괴롭히지 않았고, 아름다운 것들에 둘러싸여 있을 필요도 느끼지 않았다.","chapter":21},{"lemma":"dingy","difficulty":"C1","gloss":"dark, dull","ipa":"/ˈdɪn.d͡ʒi/","sentence":"I do not suppose he had ever noticed how dingy was the paper on the wall of the room in which on my first visit I found him.","word_in_sentence":"dingy","ko":"내가 처음 그를 찾아갔을 때 그가 머물던 방의 벽지가 얼마나 더러웠는지 그는 아마 한 번도 눈여겨보지 않았을 것이다.","chapter":21},{"lemma":"devour","difficulty":"C1","gloss":"To eat quickly, greedily, hungrily, or ravenously.","ipa":"/dɪˈvaʊɚ/","sentence":"He ate with appetite, but was indifferent to what he ate; to him it was only food that he devoured to still the pangs of hunger; and when no food was to be had he seemed capable of doing without.","word_in_sentence":"devoured","ko":"그는 식욕을 가지고 먹었지만, 무엇을 먹는지에는 무관심했다. 그에게 음식은 단지 배고픔의 고통을 달래기 위해 게걸스럽게 먹어치우는 것일 뿐이었다. 그리고 먹을 것이 없을 때는 없이도 지낼 수 있는 것처럼 보였다.","chapter":21},{"lemma":"loaf","difficulty":"C1","gloss":"A block of bread after baking.","ipa":"/ləʊf/","sentence":"I learned that for six months he had lived on a loaf of bread and a bottle of milk a day.","word_in_sentence":"loaf","ko":"그가 6개월 동안 하루에 빵 한 덩어리와 우유 한 병으로 살았다는 것을 나는 알게 되었다.","chapter":21},{"lemma":"privation","difficulty":"C2","gloss":"The state of being deprived of or lacking an attribute formerly or properly possessed; the loss or absence of such an attribute.","ipa":"/pɹɪˈveɪʃən/","sentence":"He looked upon privation as no hardship.","word_in_sentence":"privation","ko":"그는 궁핍을 고난으로 여기지 않았다.","chapter":21},{"lemma":"sardonic","difficulty":"C1","gloss":"Scornfully mocking or cynical.","ipa":"/sɑːˈdɒnɪk/","sentence":"I could see his sardonic smile.","word_in_sentence":"sardonic","ko":"나는 그의 냉소적인 미소를 볼 수 있었다.","chapter":47},{"lemma":"disreputable","difficulty":"C2","gloss":"Not respectable, lacking repute; discreditable.","ipa":"/dɪsˈɹɛpjʊtəbəl/","sentence":"He told me with grim humour of the time he had spent acting as guide to Cockneys who wanted to see the night side of life in Paris; it was an occupation that appealed to his sardonic temper and somehow or other he had acquired a wide acquaintance with the more disreputable quarters of the city.","word_in_sentence":"disreputable","ko":"그는 파리의 밤의 세계를 구경하고 싶어 하는 런던 서민들의 안내자 노릇을 했던 시절을 냉혹한 유머로 내게 들려주었다. 그것은 그의 냉소적인 성격에 어울리는 직업이었고, 어떻게 해서인지 그는 도시의 더 불명예스러운 지역들과 폭넓은 친분을 쌓고 있었다.","chapter":21},{"lemma":"shabbiness","difficulty":"C2","gloss":"The property of being shabby.","ipa":null,"sentence":"When in luck he was able to make a tidy sum; but the shabbiness of his clothes at last frightened the sight-seers, and he could not find people adventurous enough to trust themselves to him.","word_in_sentence":"shabbiness","ko":"운이 좋을 때는 제법 괜찮은 돈을 벌 수 있었지만, 마침내 그의 남루한 옷차림이 관광객들을 겁주게 되어 그를 믿고 따라갈 만큼 모험심 있는 사람들을 찾을 수 없게 되었다.","chapter":21},{"lemma":"frighten","difficulty":"C1","gloss":"To cause to feel fear; to scare; to cause to feel alarm or fright.","ipa":"/ˈfɹaɪ.tən/","sentence":"It must have frightened her.","word_in_sentence":"frightened","ko":"그것이 그녀를 두렵게 했을 것이다.","chapter":43},{"lemma":"seer","difficulty":"C1","gloss":"One who foretells the future; a clairvoyant, prophet, soothsayer or diviner.","ipa":"/sɪə(ɹ)/","sentence":"When in luck he was able to make a tidy sum; but the shabbiness of his clothes at last frightened the sight-seers, and he could not find people adventurous enough to trust themselves to him.","word_in_sentence":"seers","ko":"운이 좋을 때는 제법 괜찮은 돈을 벌 수 있었지만, 마침내 그의 남루한 옷차림이 관광객들을 겁주게 되어 그를 믿고 따라갈 만큼 모험심 있는 사람들을 찾을 수 없게 되었다.","chapter":21},{"lemma":"adventurous","difficulty":"C1","gloss":"Inclined to adventure; willing to take risks; prone to embark on hazardous enterprises; daring.","ipa":"/ædˈvɛn.t͡ʃɚ.əs/","sentence":"When in luck he was able to make a tidy sum; but the shabbiness of his clothes at last frightened the sight-seers, and he could not find people adventurous enough to trust themselves to him.","word_in_sentence":"adventurous","ko":"운이 좋을 때는 제법 괜찮은 돈을 벌 수 있었지만, 마침내 그의 남루한 옷차림이 관광객들을 겁주게 되어 그를 믿고 따라갈 만큼 모험심 있는 사람들을 찾을 수 없게 되었다.","chapter":21},{"lemma":"tiring","difficulty":"C1","gloss":"present participle and gerund of tire","ipa":"/ˈtaɪəɹɪŋ/","sentence":"Meanwhile he had never ceased to work at his art; but, soon tiring of the studios, entirely by himself.","word_in_sentence":"tiring","ko":"그 동안에도 그는 결코 자신의 예술 작업을 멈추지 않았지만, 화실에 곧 싫증을 내고는 완전히 혼자서 작업했다.","chapter":21},{"lemma":"unwillingness","difficulty":"C1","gloss":"The property of being unwilling.","ipa":null,"sentence":"So far as I could make out, he painted with great difficulty, and in his unwillingness to accept help from anyone lost much time in finding out for himself the solution of technical problems which preceding generations had already worked out one by one.","word_in_sentence":"unwillingness","ko":"내가 알아본 바로는, 그는 매우 어렵게 그림을 그렸고, 누구의 도움도 받으려 하지 않는 고집 때문에 이전 세대들이 이미 하나씩 해결해놓은 기술적 문제들의 해답을 스스로 찾아내느라 많은 시간을 허비했다.","chapter":21},{"lemma":"oblivious","difficulty":"C1","gloss":"Lacking awareness; unmindful; unaware, unconscious of.","ipa":"/əˈblɪviːəs/","sentence":"I had the feeling that he worked on a canvas with all the force of his violent personality, oblivious of everything in his effort to get what he saw with the mind’s eye; and then, having finished, not the picture perhaps, for I had an idea that he seldom brought anything to completion, but the passion that fired him, he lost all care for it.","word_in_sentence":"oblivious","ko":"그가 캔버스 앞에서 작업할 때는 마음의 눈으로 본 것을 얻어내려는 노력에 모든 것을 잊은 채, 격렬한 성격의 온 힘을 다해 그림을 그린다는 느낌이 들었다. 그리고 나서 그림을 완성하고 나면—아마 그림 자체가 아니라, 그는 어떤 것도 완성까지 가져가는 일이 드물다는 생각이 들었기 때문이다—그를 불타오르게 했던 열정이 끝나고 나면, 그는 그 작품에 대한 모든 관심을 잃어버렸다.","chapter":21},{"lemma":"unmeasurable","difficulty":"C2","gloss":"Not able to be measured; immeasurable.","ipa":"/ʌnˈmɛʒəɹəbəl/","sentence":"I cannot describe the unmeasurable contempt he put into the two words.","word_in_sentence":"unmeasurable","ko":"그가 그 두 마디에 담아낸 헤아릴 수 없는 경멸을 나는 표현할 수가 없다.","chapter":21},{"lemma":"twopence","difficulty":"C2","gloss":"A British or Irish coin worth two (old or new) pence.","ipa":"/ˈtʌ.pəns/","sentence":"How can you care for the opinion of the crowd, when you don’t care twopence for the opinion of the individual?”","word_in_sentence":"twopence","ko":"\"개인의 의견은 한 푼어치도 신경 쓰지 않으면서, 어떻게 군중의 의견을 신경 쓸 수 있단 말인가?\"","chapter":21},{"lemma":"ecstasy","difficulty":"C1","gloss":"Intense pleasure.","ipa":"/ˈɛk.stə.si/","sentence":"Chardin delighted him, and Rembrandt moved him to ecstasy.","word_in_sentence":"ecstasy","ko":"샤르댕은 그를 기쁘게 했고, 렘브란트는 그를 황홀경에 빠뜨렸다.","chapter":44},{"lemma":"boundless","difficulty":"C1","gloss":"Without bounds, unbounded.","ipa":null,"sentence":"“Sometimes I’ve thought of an island lost in a boundless sea, where I could live in some hidden valley, among strange trees, in silence.","word_in_sentence":"boundless","ko":"\"때로는 끝없는 바다에 잃어버린 섬을 생각해봤다. 그곳 어딘가 숨겨진 계곡에서, 기이한 나무들 사이에서, 고요 속에 살 수 있는 곳을.\"","chapter":21},{"lemma":"adjective","difficulty":"C1","gloss":"A word that modifies a noun or noun phrase or describes a noun’s referent.","ipa":"/ˈæd͡ʒ.ɪk.tɪv/","sentence":"He used gestures instead of adjectives, and he halted.","word_in_sentence":"adjectives","ko":"그는 형용사 대신 몸짓을 사용했고, 말을 더듬었다.","chapter":21},{"lemma":"monosyllabic","difficulty":"C2","gloss":"Consisting of one syllable.","ipa":"/ˌmɒnə(ʊ)sɪˈlabɪk/","sentence":"“I wish you weren’t so damned monosyllabic.","word_in_sentence":"monosyllabic","ko":"\"당신이 그렇게 빌어먹을 정도로 말이 없지 않았으면 좋겠소.","chapter":21},{"lemma":"everlaste","difficulty":"C2","gloss":{"en":"Last or continue indefinitely.","ko":"영원히 지속","zh":"永久持续"},"ipa":"","sentence":"The only thing that matters is the everlasting present.”","word_in_sentence":"everlasting","ko":"중요한 것은 오직 영원한 현재뿐이다.\"","chapter":21},{"lemma":"dimly","difficulty":"C1","gloss":"In a dim manner; not clearly.","ipa":"/ˈdɪmli/","sentence":"It was obscure, perhaps, but I thought that I saw dimly his meaning.","word_in_sentence":"dimly","ko":"모호한 말이었지만, 그의 뜻을 어렴풋이 알 것 같았다.","chapter":21},{"lemma":"disapprove","difficulty":"C1","gloss":"To condemn; to consider wrong or inappropriate; used with of.","ipa":"/dɪsəˈpɹuːv/","sentence":"“I’m afraid you disapprove of me?”","word_in_sentence":"disapprove","ko":"\"당신이 나를 못마땅하게 여기는 것 같은데요?\"","chapter":21},{"lemma":"constrictor","difficulty":"C2","gloss":"A muscle whose contraction narrows a vessel or passage or compresses an organ.","ipa":"/kənˈstɹɪk.tə/","sentence":"“Nonsense,” I answered promptly; “I don’t disapprove of the boa-constrictor; on the contrary, I’m interested in his mental processes.”","word_in_sentence":"constrictor","ko":"\"말도 안 되는 소리군요.\" 나는 즉시 대답했다. \"나는 보아뱀을 못마땅하게 여기지 않습니다. 오히려 그놈의 정신적 과정에 흥미를 느끼죠.\"","chapter":21},{"lemma":"dryly","difficulty":"C2","gloss":"In a dry manner.","ipa":"/ˈdɹaɪ.li/","sentence":"He smiled dryly, but said nothing.","word_in_sentence":"dryly","ko":"그는 씁쓸하게 미소를 지었지만 아무 말도 하지 않았다.","chapter":21},{"lemma":"sombre","difficulty":"C1","gloss":"Dark; gloomy; shadowy, dimly lit.","ipa":"/ˈsɒmbə/","sentence":"They seemed to possess a sombre passion of their own.","word_in_sentence":"sombre","ko":"그것들만의 음울한 열정을 품고 있는 듯했다.","chapter":57},{"lemma":"natured","difficulty":"C1","gloss":"Having or possessing the specified disposition or temperament.","ipa":null,"sentence":"His body was shaped like a huge duck’s egg; and his eyes, sharp, blue, and good-natured, rested now and then with self-satisfaction on his enormous paunch.","word_in_sentence":"natured","ko":"그의 몸은 거대한 오리알 모양이었고, 날카롭고 푸른 선량한 눈은 때때로 자신의 엄청난 배를 자족스럽게 내려다보았다.","chapter":55},{"lemma":"glee","difficulty":"C1","gloss":"Joy; happiness; great delight, especially from one's own good fortune or from another's misfortune.","ipa":"/ɡliː/","sentence":"It was a slow smile, starting and sometimes ending in the eyes; it was very sensual, neither cruel nor kindly, but suggested rather the inhuman glee of the satyr.","word_in_sentence":"glee","ko":"그것은 느린 미소였는데, 눈에서 시작되어 때로는 눈에서 끝나기도 했다. 매우 관능적이면서도 잔혹하지도 친절하지도 않았으며, 오히려 사티로스의 비인간적인 환희를 연상시켰다.","chapter":21},{"lemma":"satyr","difficulty":"C2","gloss":"A sylvan deity or demigod, male companion of Pan or Dionysus, represented as part man and part goat, and characterized by riotous merriment and lasciviousness, sometimes pictured with a perpetual erection.","ipa":"/ˈsætə/","sentence":"Did he dream of the nymph flying through the woods of Greece with the satyr in hot pursuit?","word_in_sentence":"satyr","ko":"그는 사티로스의 뜨거운 추격을 받으며 그리스 숲속을 달아나는 님프를 꿈꾸고 있는 것일까?","chapter":30},{"lemma":"anchorite","difficulty":"C2","gloss":"One who lives in isolation or seclusion, especially for religious reasons; hermit.","ipa":"/ˈæŋ.kə(ˌ)ɹaɪt/","sentence":"“Your appearance doesn’t suggest the anchorite.”","word_in_sentence":"anchorite","ko":"\"당신 외모는 은둔자 같지 않은데요.\"","chapter":21},{"lemma":"snigger","difficulty":"C2","gloss":"A partly suppressed or broken laugh.","ipa":"/ˈsnɪɡɚ/","sentence":"“Why are you sniggering at me?”","word_in_sentence":"sniggering","ko":"\"왜 나를 비웃는 거야?\"","chapter":21},{"lemma":"searchingly","difficulty":"C2","gloss":"In a searching manner.","ipa":null,"sentence":"I paused, and I looked at him searchingly.","word_in_sentence":"searchingly","ko":"나는 말을 멈추고 그를 예리하게 바라보았다.","chapter":21},{"lemma":"rejoice","difficulty":"C1","gloss":"To be very happy, be delighted, exult; to feel joy.","ipa":"/ɹɪˈd͡ʒɔɪs/","sentence":"You rejoice in your freedom, and you feel that at last you can call your soul your own.","word_in_sentence":"rejoice","ko":"자유를 만끽하며, 마침내 네 영혼을 온전히 네 것이라고 부를 수 있다고 느끼겠지.","chapter":21},{"lemma":"blatant","difficulty":"C1","gloss":"Obvious, on show; unashamed; loudly obtrusive or offensive.","ipa":"/ˈbleɪtənt/","sentence":"And you find some woman, coarse and low and vulgar, some beastly creature in whom all the horror of sex is blatant, and you fall upon her like a wild animal.","word_in_sentence":"blatant","ko":"그러면 어떤 여자를 찾게 되지. 거칠고 천하고 저속한, 성의 모든 추악함이 노골적으로 드러나는 짐승 같은 여자를 말이야. 그리고 야생동물처럼 그녀에게 달려들어.\"","chapter":21},{"lemma":"disembody","difficulty":"C2","gloss":"To cause someone's soul, spirit, consciousness, voice, etc, to become separated from the physical body.","ipa":null,"sentence":"I would have given much to be a disembodied spirit so that I could see them in the privacy of the studio and hear what they talked about.","word_in_sentence":"disembodied","ko":"나는 육체에서 벗어난 영혼이 되어 화실의 은밀한 공간에서 그들을 지켜보고 무슨 이야기를 나누는지 들을 수 있다면 무엇이든 주고 싶었다.","chapter":32},{"lemma":"immaterial","difficulty":"C1","gloss":"Having no matter or substance; incorporeal.","ipa":"/ˌɪ.məˈtɪə.ɹɪ.əl/","sentence":"You felt that it was ready to be wafted away on the immaterial air, and death bore all the aspect of a beloved friend.”","word_in_sentence":"immaterial","ko":"그 영혼은 무형의 대기 속으로 언제든 떠날 준비가 되어 있는 것 같았고, 죽음은 사랑하는 친구의 모든 면모를 지니고 있었다.\"","chapter":53},{"lemma":"palpable","difficulty":"C1","gloss":"Capable of being touched, felt or handled; touchable, tangible.","ipa":"/ˈpælpəbəl/","sentence":"The silence of the studio seemed to gather body, so that it became an almost palpable presence.","word_in_sentence":"palpable","ko":"작업실의 정적이 실체를 갖춘 듯 응축되어 거의 만질 수 있을 정도의 존재감이 되었다.","chapter":25},{"lemma":"iridescence","difficulty":"C2","gloss":"The condition or state of being iridescent; exhibition of colors like those of the rainbow; a prismatic play of color.","ipa":"/ˌɪɹ.ɪˈdɛs.əns/","sentence":"You feel like a disembodied spirit, immaterial; and you seem to be able to touch beauty as though it were a palpable thing; and you feel an intimate communion with the breeze, and with the trees breaking into leaf, and with the iridescence of the river.","word_in_sentence":"iridescence","ko":"마치 육체를 벗어난 영혼처럼, 비물질적인 존재가 된 기분이야. 그리고 아름다움을 마치 만질 수 있는 실체인 것처럼 손에 닿을 수 있을 것 같고, 산들바람과, 잎을 틔우는 나무들과, 강물의 무지갯빛과 친밀한 교감을 나누는 것 같아.","chapter":21},{"lemma":"quay","difficulty":"C1","gloss":"A stone or concrete structure on navigable water used for loading and unloading vessels; a wharf.","ipa":"/kiː/","sentence":"Once they each of them earned a franc by loading trucks with innumerable boxes of oranges that had been dumped down on the quay.","word_in_sentence":"quay","ko":"한번은 부두에 쌓아놓은 수많은 오렌지 상자를 트럭에 싣는 일로 각자 1프랑씩 벌었다.","chapter":47},{"lemma":"succulent","difficulty":"C1","gloss":"Juicy or lush.","ipa":"/ˈsʌkjələnt/","sentence":"It was a dinner for a King when he brought in a huge dish of it, succulent with tomatoes, and we ate it together with the good household bread and a bottle of red wine.","word_in_sentence":"succulent","ko":"토마토로 맛을 낸 커다란 접시의 스파게티를 가져올 때면 그야말로 왕의 만찬이었고, 우리는 그것을 집에서 만든 좋은 빵과 적포도주 한 병과 함께 먹었다.","chapter":22},{"lemma":"accentuate","difficulty":"C1","gloss":"To pronounce with an accent or vocal stress.","ipa":"/əkˈsɛn.t͡ʃu.eɪt/","sentence":"But I thought that was perhaps no more than a natural reserve accentuated by the verbose frankness of her husband.","word_in_sentence":"accentuated","ko":"하지만 그것은 아마도 남편의 수다스러운 솔직함 때문에 더욱 두드러져 보이는 천성적인 내성적 성격에 불과할 것이라고 생각했다.","chapter":22},{"lemma":"verbose","difficulty":"C2","gloss":"Containing or using more words than necessary; long-winded, wordy.","ipa":"/vəˈbəʊs/","sentence":"But I thought that was perhaps no more than a natural reserve accentuated by the verbose frankness of her husband.","word_in_sentence":"verbose","ko":"하지만 그것은 아마도 남편의 수다스러운 솔직함 때문에 더욱 두드러져 보이는 천성적인 내성적 성격에 불과할 것이라고 생각했다.","chapter":22},{"lemma":"frankness","difficulty":"C1","gloss":"The state of being frank; candour; honesty.","ipa":"/ˈfɹæŋknɛs/","sentence":"But I thought that was perhaps no more than a natural reserve accentuated by the verbose frankness of her husband.","word_in_sentence":"frankness","ko":"하지만 그것은 아마도 남편의 수다스러운 솔직함 때문에 더욱 두드러져 보이는 천성적인 내성적 성격에 불과할 것이라고 생각했다.","chapter":22},{"lemma":"countenance","difficulty":"C1","gloss":"Appearance, especially the features and expression of the face.","ipa":"/ˈkaʊn.tə.nəns/","sentence":"He is not embarrassed by the sans gene of the hobo, nor put out of countenance by the etiquette of the prince.","word_in_sentence":"countenance","ko":"그는 부랑자의 뻔뻔함에 당황하지도 않고, 왕자의 예법에 기죽지도 않는다.","chapter":46},{"lemma":"narrate","difficulty":"C1","gloss":"To relate (a story or series of events) in speech or writing.","ipa":"/nəˈɹeɪt/","sentence":"When I had narrated his lamentable death I ceased.","word_in_sentence":"narrated","ko":"그의 비참한 죽음을 이야기하고 나서 나는 말을 멈췄다.","chapter":58},{"lemma":"convulse","difficulty":"C2","gloss":"To suffer violent involuntary contractions of the muscles, causing one's body to contort.","ipa":"/kənˈvʌls/","sentence":"The perfect seriousness with which he narrated his misfortunes convulsed me with laughter, and this added to Mrs. Stroeve’s irritation.","word_in_sentence":"convulsed","ko":"그가 자신의 불행을 이야기하는 완전히 진지한 태도가 나를 웃음으로 경련시켰고, 이것이 스트루브 부인의 짜증을 더했다.","chapter":22},{"lemma":"irritation","difficulty":"C1","gloss":"The act of irritating or annoying.","ipa":"/ˌɪɹɪˈteɪʃən/","sentence":"I clenched my hands, seeking to control my irritation.","word_in_sentence":"irritation","ko":"나는 주먹을 꽉 쥐고 짜증을 억누르려 애썼다.","chapter":34},{"lemma":"rounder","difficulty":"C1","gloss":"comparative form of round: more round","ipa":"/ˈɹaʊndə(ɹ)/","sentence":"His round eyes grew rounder still, and his brow puckered in dismay as he saw that she was angry.","word_in_sentence":"rounder","ko":"그의 동그란 눈이 더욱 동그래졌고, 그녀가 화났다는 것을 보자 그의 이마가 당황해서 주름졌다.","chapter":22},{"lemma":"pucker","difficulty":"C1","gloss":"To pinch or wrinkle (especially a body part); to squeeze inwardly, to dimple or fold.","ipa":"/ˈpʌkə(ɹ)/","sentence":"His forehead was all puckered, and his red mouth set in a pout.","word_in_sentence":"puckered","ko":"이마에는 주름이 잔뜩 잡혔고, 붉은 입술은 삐죽하게 내밀어져 있었다.","chapter":25},{"lemma":"bilious","difficulty":"C2","gloss":"Of or pertaining to something containing or consisting of bile.","ipa":"/ˈbɪl.i.əs/","sentence":"It was only because I was bilious.","word_in_sentence":"bilious","ko":"단지 속이 쓰려서 그랬을 뿐이에요.","chapter":22},{"lemma":"sedentary","difficulty":"C1","gloss":"Not moving; relatively still; staying in the vicinity.","ipa":"/ˈsɛd.ən.tɛɹ.i/","sentence":"I lead a sedentary life.","word_in_sentence":"sedentary","ko":"나는 앉아서 지내는 생활을 하거든요.","chapter":22},{"lemma":"annoyance","difficulty":"C1","gloss":"That which annoys.","ipa":"/əˈnɔɪ.əns/","sentence":"“For goodness sake, hold your tongue,” she interrupted, tears of annoyance in her eyes.","word_in_sentence":"annoyance","ko":"\"제발 입 좀 다물어요.\" 그녀가 짜증스러운 눈물을 글썽이며 말을 끊었다.","chapter":22},{"lemma":"pout","difficulty":"C1","gloss":"To push out one's lips.","ipa":"/paʊt/","sentence":"His face fell, and he pouted his lips like a scolded child.","word_in_sentence":"pouted","ko":"그의 얼굴이 침울해졌고, 꾸중 들은 아이처럼 입술을 삐죽 내밀었다.","chapter":22},{"lemma":"scold","difficulty":"C1","gloss":"A person who habitually scolds, in particular a troublesome and angry woman.","ipa":"/skoʊld/","sentence":"His face fell, and he pouted his lips like a scolded child.","word_in_sentence":"scolded","ko":"그의 얼굴이 침울해졌고, 꾸중 들은 아이처럼 입술을 삐죽 내밀었다.","chapter":22},{"lemma":"voyon","difficulty":"C2","gloss":{"en":"A foolish or annoying person.","ko":"바보","zh":"笨蛋"},"ipa":"","sentence":"“I’m interested in the young men, but voyons, you yourself, Monsieur Stroeve, you don’t think there’s any talent there.”","word_in_sentence":"voyons","ko":"\"젊은 화가들에게는 관심이 있지만, 보세요, 스트루브 씨, 당신 자신도 거기에 재능이 있다고 생각하지 않잖아요.\"","chapter":22},{"lemma":"reste","difficulty":"C2","gloss":{"en":"A short period of rest or sleep.","ko":"휴식","zh":"休息"},"ipa":"","sentence":"Du reste, it has still to be proved that this friend of yours has merit.","word_in_sentence":"reste","ko":"게다가 당신 친구에게 재능이 있다는 것도 아직 증명되지 않았다.","chapter":22},{"lemma":"halting","difficulty":"C1","gloss":"Prone to pauses or breaks; hesitant; broken.","ipa":null,"sentence":"I fancy that Strickland saw vaguely some spiritual meaning in material things that was so strange that he could only suggest it with halting symbols.","word_in_sentence":"halting","ko":"스트릭랜드는 물질적인 것들 속에서 너무나 기이한 어떤 정신적 의미를 막연히 보았기에, 더듬거리는 상징으로만 그것을 암시할 수 있었던 것 같다.","chapter":42},{"lemma":"susceptibility","difficulty":"C1","gloss":"The condition of being susceptible; vulnerability.","ipa":"/səˌsɛptəˈbɪlɪti/","sentence":"He was indifferent to the susceptibilities of others, and when he wounded them was amused.","word_in_sentence":"susceptibilities","ko":"그는 다른 사람들의 감정에 무관심했고, 상처를 주면 오히려 재미있어 했다.","chapter":23},{"lemma":"clumsy","difficulty":"C1","gloss":"Awkward, lacking coordination, not graceful, not dextrous.","ipa":"/ˈklʌmzi/","sentence":"He was constantly offending Dirk Stroeve so bitterly that he flung away, vowing he would never speak to him again; but there was a solid force in Strickland that attracted the fat Dutchman against his will, so that he came back, fawning like a clumsy dog, though he knew that his only greeting would be the blow he dreaded.","word_in_sentence":"clumsy","ko":"그는 끊임없이 더크 스트루브를 몹시 화나게 해서 스트루브가 다시는 그와 말하지 않겠다고 맹세하며 뛰쳐나가게 만들었지만, 스트릭랜드에게는 뚱뚱한 네덜란드인의 의지와는 반대로 그를 끌어당기는 확고한 힘이 있어서, 스트루브는 자신을 맞이할 것이 두려워하는 매질뿐이라는 것을 알면서도 서툰 개처럼 아첨하며 다시 돌아오곤 했다.","chapter":23},{"lemma":"brag","difficulty":"C1","gloss":"A boast or boasting; bragging; ostentatious pretence or self-glorification.","ipa":"/bɹæɡ/","sentence":"“You’re bragging.","word_in_sentence":"bragging","ko":"\"허풍을 떨고 있군요.","chapter":23},{"lemma":"flicker","difficulty":"C1","gloss":"An unsteady flash of light.","ipa":"/ˈflɪkə/","sentence":"A smile flickered in his eyes, and he stirred his absinthe in silence.","word_in_sentence":"flickered","ko":"그의 눈에 미소가 스쳤고, 그는 조용히 압생트를 저었다.","chapter":23},{"lemma":"fray","difficulty":"C1","gloss":"To rub or wear away (something); to cause (something made of strands twisted or woven together, such as cloth or rope) to unravel through friction; also, to irritate (something) through chafing or rubbing; to chafe.","ipa":"/fɹeɪ/","sentence":"There is a sense of satisfaction in looking at your men all ready for the fray.","word_in_sentence":"fray","ko":"전투를 위해 준비된 자신의 말들을 바라보는 데는 어떤 만족감이 있다.","chapter":23},{"lemma":"plumber","difficulty":"C1","gloss":"One who works in or with lead.","ipa":"/ˈplʌm.əʴ/","sentence":"I’m painting the portrait of a retired plumber for two hundred francs.”","word_in_sentence":"plumber","ko":"은퇴한 배관공의 초상화를 그리는데 이백 프랑을 받기로 했거든요.\"","chapter":23},{"lemma":"adept","difficulty":"C1","gloss":"Well skilled; completely versed; thoroughly proficient","ipa":"/əˈdɛpt/","sentence":"The Swede is adept at the gentle pastime of fishing in troubled waters.","word_in_sentence":"adept","ko":"스웨덴인은 혼란한 상황에서 이득을 취하는 온화한 오락에 능숙하다.","chapter":23},{"lemma":"pastime","difficulty":"C1","gloss":"Something which amuses, and serves to make time pass agreeably.","ipa":"/ˈpæs.taɪm/","sentence":"The Swede is adept at the gentle pastime of fishing in troubled waters.","word_in_sentence":"pastime","ko":"스웨덴인은 혼란한 상황에서 이득을 취하는 온화한 오락에 능숙하다.","chapter":23},{"lemma":"ferocious","difficulty":"C1","gloss":"Marked by extreme and violent energy.","ipa":"/fəˈɹəʊʃəs/","sentence":"Strickland was in a good humour, and when Dirk Stroeve came up and sat down with us he attacked him with ferocious banter.","word_in_sentence":"ferocious","ko":"스트릭랜드는 기분이 좋았고, 더크 스트루브가 다가와 우리와 함께 앉자 맹렬한 농담으로 그를 공격하기 시작했다.","chapter":23},{"lemma":"banter","difficulty":"C1","gloss":"Sharp, good-humoured, playful, typically spontaneous conversation.","ipa":"/ˈbæntɚ/","sentence":"Strickland was in a good humour, and when Dirk Stroeve came up and sat down with us he attacked him with ferocious banter.","word_in_sentence":"banter","ko":"스트릭랜드는 기분이 좋았고, 더크 스트루브가 다가와 우리와 함께 앉자 맹렬한 농담으로 그를 공격하기 시작했다.","chapter":23},{"lemma":"rapi","difficulty":"C2","gloss":{"en":"Racy or risqué","ko":"성스러운","zh":"淫秽"},"ipa":"","sentence":"Strickland employed not the rapier of sarcasm but the bludgeon of invective.","word_in_sentence":"rapier","ko":"스트릭랜드는 풍자라는 가는 검이 아니라 욕설이라는 몽둥이를 사용했다.","chapter":23},{"lemma":"bludgeon","difficulty":"C2","gloss":"A short, heavy club, often of wood, which is thicker or loaded at one end.","ipa":"/ˈblʌd͡ʒ.ən/","sentence":"Strickland employed not the rapier of sarcasm but the bludgeon of invective.","word_in_sentence":"bludgeon","ko":"스트릭랜드는 풍자라는 가는 검이 아니라 욕설이라는 몽둥이를 사용했다.","chapter":23},{"lemma":"unprovoked","difficulty":"C1","gloss":"Happening without provocation.","ipa":"/ˌʌnpɹəˈvoʊkt/","sentence":"The attack was so unprovoked that Stroeve, taken unawares, was defenceless.","word_in_sentence":"unprovoked","ko":"공격이 너무나 뜻밖이어서 방심하고 있던 스트루브는 속수무책이었다.","chapter":23},{"lemma":"unawares","difficulty":"C2","gloss":"Unexpectedly or by surprise.","ipa":"/ˌʌnəˈwɛə(ɹ)z/","sentence":"The attack was so unprovoked that Stroeve, taken unawares, was defenceless.","word_in_sentence":"unawares","ko":"공격이 너무나 뜻밖이어서 방심하고 있던 스트루브는 속수무책이었다.","chapter":23},{"lemma":"defenceless","difficulty":"C1","gloss":"Without defence; undefended.","ipa":"/dɪˈfɛnsləs/","sentence":"It is an emotion which is defenceless against passion.","word_in_sentence":"defenceless","ko":"그것은 열정 앞에서는 무력한 감정이다.","chapter":30},{"lemma":"aimlessly","difficulty":"C1","gloss":"Without an aim, purpose or direction; in an aimless manner.","ipa":"/ˈeɪmləsli/","sentence":"He reminded you of a frightened sheep running aimlessly hither and thither.","word_in_sentence":"aimlessly","ko":"그는 겁에 질린 양이 이리저리 목적 없이 뛰어다니는 모습을 연상시켰다.","chapter":23},{"lemma":"hither","difficulty":"C1","gloss":"To this place, to here.","ipa":"/ˈhɪðə/","sentence":"It urged him hither and thither.","word_in_sentence":"hither","ko":"그것은 그를 이리저리 몰아댔다.","chapter":54},{"lemma":"thither","difficulty":"C1","gloss":"To that place.","ipa":"/ˈðɪðə/","sentence":"It urged him hither and thither.","word_in_sentence":"thither","ko":"그것은 그를 이리저리 몰아댔다.","chapter":54},{"lemma":"startled","difficulty":"C1","gloss":"Surprised and slightly frightened.","ipa":"/ˈstɑɹt.l̩d/","sentence":"He was startled and amazed.","word_in_sentence":"startled","ko":"그는 깜짝 놀라며 어리둥절해했다.","chapter":23},{"lemma":"pleasantest","difficulty":"C2","gloss":"superlative form of pleasant: most pleasant","ipa":null,"sentence":"But after all when I look back upon that winter in Paris, my pleasantest recollection is of Dirk Stroeve.","word_in_sentence":"pleasantest","ko":"하지만 결국 파리에서 보낸 그 겨울을 되돌아보면, 가장 즐거운 기억은 더크 스트루브에 관한 것이다.","chapter":23},{"lemma":"gratefully","difficulty":"C1","gloss":"In a grateful manner.","ipa":"/ˈɡɹeɪtfəli/","sentence":"He and his wife made a picture which the imagination gratefully dwelt upon, and the simplicity of his love for her had a deliberate grace.","word_in_sentence":"gratefully","ko":"그와 그의 아내는 상상력이 기꺼이 머물고 싶어 하는 그림을 만들어냈고, 그녀에 대한 그의 사랑의 순수함에는 의도적인 우아함이 있었다.","chapter":23},{"lemma":"pedestal","difficulty":"C1","gloss":"The base or foot of a column, statue, vase, lamp.","ipa":"/ˈpɛdɪstəl/","sentence":"Dozing against the pedestal of a statue, he saw Strickland again.","word_in_sentence":"pedestal","ko":"동상 받침대에 기대어 졸고 있는 스트릭랜드를 다시 발견했다.","chapter":47},{"lemma":"idolatry","difficulty":"C1","gloss":"The worship of idols.","ipa":"/aɪˈdɑ.lə.tɹi/","sentence":"If she had any sense of humour, it must amuse her that he should place her on a pedestal and worship her with such an honest idolatry, but even while she laughed she must have been pleased and touched.","word_in_sentence":"idolatry","ko":"그녀에게 유머 감각이 조금이라도 있었다면, 그가 자신을 받들어 모시며 그토록 순진한 우상숭배로 숭배하는 모습이 우스웠을 것이다. 하지만 웃으면서도 기뻐하고 감동했을 것이다.","chapter":23},{"lemma":"orderliness","difficulty":"C2","gloss":"The fact of having a regular, proper and systematic arrangement.","ipa":"/ˈɔːdəlɪnəs/","sentence":"There was a pleasing grace in the orderliness of their lives.","word_in_sentence":"orderliness","ko":"그들의 질서정연한 생활에는 유쾌한 우아함이 있었다.","chapter":23},{"lemma":"housework","difficulty":"C1","gloss":"domestic household chores such as cleaning and cooking","ipa":"/ˈhaʊsˌwɝk/","sentence":"Ata continued to do the housework, and I gave him his meals as I said I would.","word_in_sentence":"housework","ko":"아타는 계속 집안일을 했고, 나는 약속한 대로 그에게 식사를 제공했다.","chapter":51},{"lemma":"exuberant","difficulty":"C1","gloss":"Very cheery and peppy; extremely cheerful, energetic and enthusiastic.","ipa":"/ɪɡˈzuːbəɹənt/","sentence":"He played with taste, but with more feeling than was always justified, and into his music poured all his honest, sentimental, exuberant soul.","word_in_sentence":"exuberant","ko":"그는 품위 있게 연주했지만, 때로는 정당화되기 어려울 만큼 감정을 담아 연주했고, 그의 음악에는 그의 순수하고 감상적이며 열정적인 영혼이 모두 쏟아져 나왔다.","chapter":23},{"lemma":"idyl","difficulty":"C2","gloss":"Alternative spelling of idyll.","ipa":null,"sentence":"Their life in its own way was an idyl, and it managed to achieve a singular beauty.","word_in_sentence":"idyl","ko":"그들의 생활은 나름대로 목가적이었고, 독특한 아름다움을 이루어냈다.","chapter":23},{"lemma":"unresolved","difficulty":"C1","gloss":"For which no solution has been found.","ipa":null,"sentence":"The absurdity that clung to everything connected with Dirk Stroeve gave it a curious note, like an unresolved discord, but made it somehow more modern, more human; like a rough joke thrown into a serious scene, it heightened the poignancy which all beauty has.","word_in_sentence":"unresolved","ko":"더크 스트루브와 관련된 모든 것에 달라붙은 우스꽝스러움이 해결되지 않은 불협화음처럼 기묘한 색채를 더했지만, 그것이 오히려 더 현대적이고 더 인간적으로 만들었다. 진지한 장면에 던져진 거친 농담처럼, 그것은 모든 아름다움이 지닌 애절함을 더욱 고조시켰다.","chapter":23},{"lemma":"discord","difficulty":"C1","gloss":"Lack of concord, agreement, harmony; disaccord.","ipa":"/ˈdɪskɔɹd/","sentence":"The absurdity that clung to everything connected with Dirk Stroeve gave it a curious note, like an unresolved discord, but made it somehow more modern, more human; like a rough joke thrown into a serious scene, it heightened the poignancy which all beauty has.","word_in_sentence":"discord","ko":"더크 스트루브와 관련된 모든 것에 달라붙은 우스꽝스러움이 해결되지 않은 불협화음처럼 기묘한 색채를 더했지만, 그것이 오히려 더 현대적이고 더 인간적으로 만들었다. 진지한 장면에 던져진 거친 농담처럼, 그것은 모든 아름다움이 지닌 애절함을 더욱 고조시켰다.","chapter":23},{"lemma":"heighten","difficulty":"C1","gloss":"To make high; to raise higher; to elevate.","ipa":"/ˈhaɪ̯.tən/","sentence":"The absurdity that clung to everything connected with Dirk Stroeve gave it a curious note, like an unresolved discord, but made it somehow more modern, more human; like a rough joke thrown into a serious scene, it heightened the poignancy which all beauty has.","word_in_sentence":"heightened","ko":"더크 스트루브와 관련된 모든 것에 달라붙은 우스꽝스러움이 해결되지 않은 불협화음처럼 기묘한 색채를 더했지만, 그것이 오히려 더 현대적이고 더 인간적으로 만들었다. 진지한 장면에 던져진 거친 농담처럼, 그것은 모든 아름다움이 지닌 애절함을 더욱 고조시켰다.","chapter":23},{"lemma":"poignancy","difficulty":"C2","gloss":"The quality of being poignant","ipa":null,"sentence":"The absurdity that clung to everything connected with Dirk Stroeve gave it a curious note, like an unresolved discord, but made it somehow more modern, more human; like a rough joke thrown into a serious scene, it heightened the poignancy which all beauty has.","word_in_sentence":"poignancy","ko":"더크 스트루브와 관련된 모든 것에 달라붙은 우스꽝스러움이 해결되지 않은 불협화음처럼 기묘한 색채를 더했지만, 그것이 오히려 더 현대적이고 더 인간적으로 만들었다. 진지한 장면에 던져진 거친 농담처럼, 그것은 모든 아름다움이 지닌 애절함을 더욱 고조시켰다.","chapter":23},{"lemma":"sentimentality","difficulty":"C1","gloss":"An act or state of being sentimental.","ipa":null,"sentence":"He had a characteristic sentimentality about the day and wanted to pass it among his friends with suitable ceremonies.","word_in_sentence":"sentimentality","ko":"그는 그날에 대해 특유의 감상적인 마음을 품고 있었고, 적절한 의식과 함께 친구들 사이에서 그날을 보내고 싶어 했다.","chapter":24},{"lemma":"humiliating","difficulty":"C1","gloss":"Liable to humiliate, degrade, shame or embarrass someone.","ipa":"/hjuːˈmɪliˌeɪtɪŋ/","sentence":"That answer of his seemed to me strangely humiliating.","word_in_sentence":"humiliating","ko":"그의 그런 대답이 나에게는 이상하리만큼 굴욕적으로 느껴졌다.","chapter":33},{"lemma":"stuffy","difficulty":"C1","gloss":"Poorly ventilated; partially plugged.","ipa":"/ˈstʌfi/","sentence":"It was hot and stuffy, and the air was gray with smoke.","word_in_sentence":"stuffy","ko":"안은 덥고 답답했으며, 공기는 담배 연기로 회색빛이었다.","chapter":24},{"lemma":"unwillingly","difficulty":"C1","gloss":"In an unwilling or uncooperative manner.","ipa":null,"sentence":"Stroeve accompanied me unwillingly.","word_in_sentence":"unwillingly","ko":"스트루브는 마지못해 나를 따라왔다.","chapter":24},{"lemma":"indifferently","difficulty":"C2","gloss":"Tolerably; passably.","ipa":null,"sentence":"“It may be,” answered the concierge indifferently.","word_in_sentence":"indifferently","ko":"\"그럴지도 모르죠.\" 관리인이 무관심하게 대답했다.","chapter":24},{"lemma":"effet","difficulty":"C2","gloss":"Alternative form of eft (“a newt”).","ipa":null,"sentence":"“En effet, I have not seen him for several days.”","word_in_sentence":"effet","ko":"\"사실 며칠째 보지 못했거든요.\"","chapter":24},{"lemma":"workman","difficulty":"C1","gloss":"A man who labours for wages.","ipa":"/ˈwɝkmən/","sentence":"Stroeve ran up the stairs ahead of me, and when I reached the top floor I found him talking to a workman in his shirt-sleeves who had opened a door at which Stroeve had knocked.","word_in_sentence":"workman","ko":"스트루브가 나보다 앞서 계단을 뛰어올라갔고, 내가 맨 위층에 도착했을 때 그가 셔츠 차림의 일꾼과 이야기하고 있는 것을 보았다. 스트루브가 노크한 문을 그 일꾼이 열어준 것이었다.","chapter":24},{"lemma":"helplessness","difficulty":"C1","gloss":"The state of being helpless.","ipa":"/ˈhɛlplɪsnɪs/","sentence":"Stroeve made as though he were about to knock, and then turned to me with a gesture of helplessness.","word_in_sentence":"helplessness","ko":"스트루브는 문을 두드리려는 듯하더니 무력한 몸짓으로 나를 돌아보았다.","chapter":24},{"lemma":"sloping","difficulty":"C1","gloss":"Having a slope.","ipa":"/ˈsləʊpɪŋ/","sentence":"I could only see that it was an attic, with a sloping roof; and a faint glimmer, no more than a less profound obscurity, came from a skylight.","word_in_sentence":"sloping","ko":"경사진 지붕을 가진 다락방이라는 것만 알 수 있었고, 천창에서 희미한 빛이 새어 들어왔는데 그것도 그저 덜 짙은 어둠에 불과했다.","chapter":24},{"lemma":"glimmer","difficulty":"C1","gloss":"A faint light; a dim glow.","ipa":"/ˈɡlɪmɚ/","sentence":"I could only see that it was an attic, with a sloping roof; and a faint glimmer, no more than a less profound obscurity, came from a skylight.","word_in_sentence":"glimmer","ko":"경사진 지붕을 가진 다락방이라
