<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #faf8f5; font-family: 'Georgia', serif; color: #2c2c2c; min-height: 100vh; }
.mnav { display:flex; gap:5px; justify-content:center; flex-wrap:wrap; padding:8px 16px; background:#faf8f5; border-bottom:1px solid #e0dcd4; font-family:'Georgia',serif; font-size:12px; line-height:1; }
.mnav a { padding:5px 11px; border-radius:14px; font-size:12px; line-height:1; text-decoration:none; color:#78716c; border:1px solid transparent; transition:all 0.15s; white-space:nowrap; }
.mnav a:hover { border-color:#d6d3d1; color:#1c1917; }
.mnav a.active { background:#1c1917; color:white; border-color:#1c1917; }

.game-container { max-width: 700px; margin: 0 auto; padding: 24px 20px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 22px; color: #1c1917; margin-bottom: 4px; }
.header .sub { font-size: 12px; color: #78716c; font-family: 'Courier New'; }

.stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; font-family: 'Courier New'; font-size: 12px; color: #78716c; }
.stats .val { color: #1c1917; font-weight: bold; }

.gallows { display: flex; justify-content: center; margin-bottom: 20px; }
.gallows canvas { }

.word-display { text-align: center; margin-bottom: 20px; }
.word-display .letters { font-size: 28px; letter-spacing: 8px; font-family: 'Courier New'; color: #1c1917; }
.word-display .letters .blank { color: #ccc; }
.word-display .letters .revealed { color: #22c55e; }
.word-display .letters .wrong-reveal { color: #ef4444; }
.word-display .diff-badge {
  display: inline-block; font-size: 10px; font-family: 'Courier New';
  border: 1px solid; padding: 1px 6px; border-radius: 3px; margin-left: 8px; vertical-align: middle;
}
.word-display .diff-badge.C1 { color: #d97706; border-color: #d97706; }
.word-display .diff-badge.C2 { color: #dc2626; border-color: #dc2626; }

.hint-box { background: #fff; border: 1px solid #e0dcd4; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
.hint-box .label { font-size: 10px; color: #999; font-family: 'Courier New'; text-transform: uppercase; margin-bottom: 4px; }
.hint-box .gloss { font-size: 15px; color: #333; margin-bottom: 10px; line-height: 1.5; }
.hint-box .sentence { font-size: 13px; color: #666; font-style: italic; line-height: 1.5; margin-bottom: 4px; }
.hint-box .sentence .blank-word { background: #e0dcd4; color: #e0dcd4; border-radius: 3px; padding: 0 4px; }
.hint-box .ko { font-size: 12px; color: #888; line-height: 1.5; }

.keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 20px; max-width: 520px; margin-left: auto; margin-right: auto; }
.keyboard .key {
  width: 36px; height: 36px; border: 1px solid #ccc; border-radius: 6px;
  background: #fff; color: #333; font-size: 14px; font-family: 'Courier New';
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.keyboard .key:hover { border-color: #1c1917; color: #1c1917; background: #f0ece7; }
.keyboard .key.correct { background: #dcfce7; border-color: #22c55e; color: #16a34a; cursor: default; }
.keyboard .key.wrong { background: #fef2f2; border-color: #ef4444; color: #ef4444; cursor: default; opacity: 0.5; }
.keyboard .key.used { pointer-events: none; }

.result { text-align: center; margin-bottom: 16px; }
.result .msg { font-size: 18px; margin-bottom: 8px; }
.result .answer { font-size: 14px; color: #333; }
.result .ipa { font-size: 12px; color: #888; font-family: 'Courier New'; }

.btn-next {
  display: block; margin: 0 auto; padding: 8px 24px;
  background: none; border: 1px solid #1c1917; color: #1c1917;
  font: 14px 'Courier New'; border-radius: 6px; cursor: pointer;
}
.btn-next:hover { background: #f0ece7; }

.filter { text-align: center; margin-bottom: 16px; }
.filter button {
  background: none; border: 1px solid #ccc; color: #78716c; font: 11px 'Courier New';
  padding: 3px 10px; border-radius: 4px; cursor: pointer; margin: 0 3px;
}
.filter button:hover { border-color: #999; color: #333; }
.filter button.active { border-color: #1c1917; color: #1c1917; background: #f0ece7; }

#missed-controls { max-width: 700px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
#missed-controls h3 { font-size: 14px; color: #78716c; font-weight: normal; }
#btn-print-missed {
  background: none; border: 1px solid #bbb; color: #666; font: 12px 'Courier New';
  padding: 4px 14px; border-radius: 4px; cursor: pointer;
}
#btn-print-missed:hover { border-color: #1c1917; color: #1c1917; }
#btn-print-missed:disabled { opacity: 0.3; cursor: default; }
#missed-list { max-width: 700px; margin: 0 auto; padding: 0 20px 40px; }
.missed-entry {
  border-left: 3px solid #e0dcd4; margin: 0; padding: 10px 16px;
  background: #fff; animation: fadeIn 0.3s ease;
}
.missed-entry .word-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.missed-entry .lemma { font-size: 17px; font-weight: bold; color: #1c1917; }
.missed-entry .badge { font-size: 10px; font-family: 'Courier New'; border: 1px solid; padding: 1px 6px; border-radius: 3px; }
.missed-entry .badge.C1 { color: #d97706; border-color: #d97706; }
.missed-entry .badge.C2 { color: #dc2626; border-color: #dc2626; }
.missed-entry .ipa { font-size: 12px; color: #888; font-family: 'Courier New'; }
.missed-entry .gloss { font-size: 14px; color: #333; margin: 4px 0; }
.missed-entry .sentence { font-size: 12px; color: #666; font-style: italic; margin: 3px 0; }
.missed-entry .sentence mark { background: #fef3c7; color: #92400e; padding: 0 2px; border-radius: 2px; }
.missed-entry .ko { font-size: 12px; color: #888; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

@media print {
  body { background: #fff !important; }
  .game-container, .mnav, #missed-controls { display: none !important; }
  #missed-list { max-width: 100%; padding: 0; }
  .missed-entry { background: #fff !important; border-left: 2px solid #ccc !important; break-inside: avoid; animation: none !important; }
  .missed-entry .lemma { color: #000 !important; font-size: 15px; }
  .missed-entry .gloss { color: #222 !important; font-size: 13px; }
  .missed-entry .sentence { color: #444 !important; font-size: 11px; }
  .missed-entry .sentence mark { color: #000 !important; font-weight: bold; background: none !important; }
  .missed-entry .ko { color: #555 !important; font-size: 11px; }
  @page { margin: 25mm 14mm 22mm 14mm; }
  @page :first { margin-top: 30mm; }
  #print-header { display: block !important; text-align: center; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #ccc; font-family: Georgia; }
  #print-header h1 { font-size: 18px; color: #000; margin-bottom: 6px; }
  #print-header p { font-size: 11px; color: #666; }
}
#print-header { display: none; }
</style>

pɹɪʃəs/","sentence":"It is still possible to discuss his place in art, and the adulation of his admirers is perhaps no less capricious than the disparagement of his detractors; but one thing can never be doubtful, and that is that he had genius.","word_in_sentence":"capricious","ko":"예술에서 그의 위치를 논하는 것은 여전히 가능하고, 그를 숭배하는 이들의 찬사가 그를 폄하하는 이들의 비난만큼이나 변덕스러울지도 모르지만, 한 가지만은 결코 의심할 수 없으니, 그것은 그에게 천재성이 있었다는 것이다.","chapter":1},{"lemma":"disparagement","difficulty":"C2","gloss":"The act of disparaging, of belittling.","ipa":null,"sentence":"It is still possible to discuss his place in art, and the adulation of his admirers is perhaps no less capricious than the disparagement of his detractors; but one thing can never be doubtful, and that is that he had genius.","word_in_sentence":"disparagement","ko":"예술에서 그의 위치를 논하는 것은 여전히 가능하고, 그를 숭배하는 이들의 찬사가 그를 폄하하는 이들의 비난만큼이나 변덕스러울지도 모르지만, 한 가지만은 결코 의심할 수 없으니, 그것은 그에게 천재성이 있었다는 것이다.","chapter":1},{"lemma":"detractor","difficulty":"C2","gloss":"A person who belittles the worth of another person or cause.","ipa":null,"sentence":"It is still possible to discuss his place in art, and the adulation of his admirers is perhaps no less capricious than the disparagement of his detractors; but one thing can never be doubtful, and that is that he had genius.","word_in_sentence":"detractors","ko":"예술에서 그의 위치를 논하는 것은 여전히 가능하고, 그를 숭배하는 이들의 찬사가 그를 폄하하는 이들의 비난만큼이나 변덕스러울지도 모르지만, 한 가지만은 결코 의심할 수 없으니, 그것은 그에게 천재성이 있었다는 것이다.","chapter":1},{"lemma":"stale","difficulty":"C1","gloss":"Clear, free of dregs and lees; old and strong.","ipa":"/steɪl/","sentence":"I dare say he’d got stale.","word_in_sentence":"stale","ko":"아마 그 사람도 권태기가 왔을 거예요.","chapter":15},{"lemma":"sensual","difficulty":"C1","gloss":"Inducing pleasurable or erotic sensations.","ipa":"/ˈsɛn.ʃu.əl/","sentence":"His mouth was large, his lips were heavy and sensual.","word_in_sentence":"sensual","ko":"입은 크고, 입술은 두툼하고 관능적이었다.","chapter":12},{"lemma":"proffer","difficulty":"C2","gloss":"An offer made; something proposed for acceptance by another; a tender.","ipa":"/ˈpɹɒfə(ɹ)/","sentence":"I suppose Velasquez was a better painter than El Greco, but custom stales one’s admiration for him: the Cretan, sensual and tragic, proffers the mystery of his soul like a standing sacrifice.","word_in_sentence":"proffers","ko":"벨라스케스가 엘 그레코보다 더 뛰어난 화가였을 것이라고 생각하지만, 관습이 그에 대한 감탄을 진부하게 만든다. 반면 관능적이고 비극적인 크레타 출신 화가는 제단 위의 제물처럼 자신의 영혼의 신비를 내보인다.","chapter":1},{"lemma":"sublime","difficulty":"C1","gloss":"To heat (a substance) in a container so as to convert it into a gas which then condenses in solid form on cooler parts of the container; (generally) to change (a solid substance) into a gas without breaking down or passing through the liquid state by heating it gently.","ipa":"/səˈblaɪm/","sentence":"Stroeve was sublime.","word_in_sentence":"sublime","ko":"스트루브는 숭고했다.","chapter":26},{"lemma":"barbarity","difficulty":"C2","gloss":"The state of being barbarous; brutality","ipa":"/bɑː(ɹ)ˈbæɹɪti/","sentence":"The artist, painter, poet, or musician, by his decoration, sublime or beautiful, satisfies the aesthetic sense; but that is akin to the sexual instinct, and shares its barbarity: he lays before you also the greater gift of himself.","word_in_sentence":"barbarity","ko":"예술가, 화가, 시인, 음악가는 숭고하거나 아름다운 장식을 통해 미적 감각을 만족시킨다. 하지만 그것은 성적 본능과 유사하며 그 야만성을 공유한다. 그는 또한 자신이라는 더 큰 선물을 당신 앞에 내놓는다.","chapter":1},{"lemma":"fascination","difficulty":"C1","gloss":"The act of bewitching, or enchanting","ipa":"/fæsɪˈneɪʃən/","sentence":"To pursue his secret has something of the fascination of a detective story.","word_in_sentence":"fascination","ko":"그의 비밀을 추적하는 일에는 추리소설 같은 매혹이 있다.","chapter":1},{"lemma":"riddle","difficulty":"C1","gloss":"A verbal puzzle, mystery, or other problem of an intellectual nature.","ipa":"/ˈɹɪdəl/","sentence":"It is a riddle which shares with the universe the merit of having no answer.","word_in_sentence":"riddle","ko":"그것은 우주와 마찬가지로 답이 없다는 장점을 지닌 수수께끼다.","chapter":1},{"lemma":"tormented","difficulty":"C1","gloss":"simple past and past participle of torment","ipa":null,"sentence":"The most insignificant of Strickland’s works suggests a personality which is strange, tormented, and complex; and it is this surely which prevents even those who do not like his pictures from being indifferent to them; it is this which has excited so curious an interest in his life and character.","word_in_sentence":"tormented","ko":"스트릭랜드의 가장 하찮은 작품조차 기이하고 고뇌에 찬 복잡한 개성을 암시한다. 그의 그림을 좋아하지 않는 사람들조차 무관심할 수 없게 만드는 것이 바로 이것이며, 그의 삶과 성격에 그토록 기묘한 관심을 불러일으킨 것도 바로 이것이다.","chapter":1},{"lemma":"indifferent","difficulty":"C1","gloss":"Ambivalent; unconcerned; uninterested, apathetic.","ipa":"/ɪnˈdɪf.ɹənt/","sentence":"He was indifferent to money.","word_in_sentence":"indifferent","ko":"그는 돈에 무관심했다.","chapter":43},{"lemma":"excite","difficulty":"C1","gloss":"To stir the emotions of.","ipa":"/ɪkˈsaɪt/","sentence":"He might have excited sympathy if he had grown worn and thin.","word_in_sentence":"excited","ko":"그가 초췌해지고 말라갔다면 동정을 받았을지도 모른다.","chapter":31},{"lemma":"oblivion","difficulty":"C1","gloss":"The state of forgetting completely, of being oblivious, unconscious, unaware, as when sleeping, drunk, or dead.","ipa":"/əˈblɪviːən/","sentence":"It was not till four years after Strickland’s death that Maurice Huret wrote that article in the Mercure de France which rescued the unknown painter from oblivion and blazed the trail which succeeding writers, with more or less docility, have followed.","word_in_sentence":"oblivion","ko":"스트릭랜드가 죽은 지 4년이 지나서야 모리스 위레가 메르퀴르 드 프랑스지에 그 기사를 써서 무명의 화가를 망각에서 구해내고, 후속 작가들이 다소간의 순종으로 따라간 길을 개척했다.","chapter":1},{"lemma":"docility","difficulty":"C2","gloss":"The quality of being docile.","ipa":null,"sentence":"It was not till four years after Strickland’s death that Maurice Huret wrote that article in the Mercure de France which rescued the unknown painter from oblivion and blazed the trail which succeeding writers, with more or less docility, have followed.","word_in_sentence":"docility","ko":"스트릭랜드가 죽은 지 4년이 지나서야 모리스 위레가 메르퀴르 드 프랑스지에 그 기사를 써서 무명의 화가를 망각에서 구해내고, 후속 작가들이 다소간의 순종으로 따라간 길을 개척했다.","chapter":1},{"lemma":"incontestable","difficulty":"C2","gloss":"Not contestable; indisputable; certain","ipa":null,"sentence":"For a long time no critic has enjoyed in France a more incontestable authority, and it was impossible not to be impressed by the claims he made; they seemed extravagant; but later judgments have confirmed his estimate, and the reputation of Charles Strickland is now firmly established on the lines which he laid down.","word_in_sentence":"incontestable","ko":"오랫동안 프랑스에서 그보다 더 확실한 권위를 누린 비평가는 없었고, 그가 제기한 주장에 감명받지 않을 수 없었다. 그 주장들은 과장된 것처럼 보였지만, 후의 판단들이 그의 평가를 확증했고, 찰스 스트릭랜드의 명성은 이제 그가 제시한 노선 위에 확고히 자리 잡았다.","chapter":1},{"lemma":"extravagant","difficulty":"C1","gloss":"Exceeding the bounds of something; roving; hence, foreign.","ipa":"/ɪkˈstɹævəɡənt/","sentence":"Tough Bill’s fare was seldom extravagant, and you rose from his table almost as hungry as you sat down, but for some days they had good reason to regret it.","word_in_sentence":"extravagant","ko":"터프 빌의 식사는 좀처럼 풍성하지 않아서 그의 식탁에서 일어날 때는 앉았을 때와 거의 마찬가지로 배가 고팠지만, 며칠 동안 그들은 그것을 그리워할 충분한 이유가 있었다.","chapter":47},{"lemma":"superciliously","difficulty":"C2","gloss":"In a supercilious manner.","ipa":null,"sentence":"I cannot agree with the painters who claim superciliously that the layman can understand nothing of painting, and that he can best show his appreciation of their works by silence and a cheque-book.","word_in_sentence":"superciliously","ko":"일반인은 회화에 대해 아무것도 이해할 수 없으며, 작품에 대한 감상을 보여주는 최선의 방법은 침묵과 수표책이라고 거만하게 주장하는 화가들의 의견에 나는 동의할 수 없다.","chapter":1},{"lemma":"layman","difficulty":"C1","gloss":"Layperson, someone who is not an ordained cleric or member of the clergy.","ipa":"/ˈleɪmən/","sentence":"I cannot agree with the painters who claim superciliously that the layman can understand nothing of painting, and that he can best show his appreciation of their works by silence and a cheque-book.","word_in_sentence":"layman","ko":"일반인은 회화에 대해 아무것도 이해할 수 없으며, 작품에 대한 감상을 보여주는 최선의 방법은 침묵과 수표책이라고 거만하게 주장하는 화가들의 의견에 나는 동의할 수 없다.","chapter":1},{"lemma":"cheque","difficulty":"C1","gloss":"A written order directing a bank to pay money to a person or entity.","ipa":"/t͡ʃɛk/","sentence":"I cannot agree with the painters who claim superciliously that the layman can understand nothing of painting, and that he can best show his appreciation of their works by silence and a cheque-book.","word_in_sentence":"cheque","ko":"일반인은 회화에 대해 아무것도 이해할 수 없으며, 작품에 대한 감상을 보여주는 최선의 방법은 침묵과 수표책이라고 거만하게 주장하는 화가들의 의견에 나는 동의할 수 없다.","chapter":1},{"lemma":"grotesque","difficulty":"C1","gloss":"Distorted and unnatural in shape or size; abnormal, especially in a hideous way.","ipa":"/ɡɹoʊˈtɛsk/","sentence":"The saddest thing about them was that they were grotesque, and the more pathetic they were, the more you wanted to laugh.","word_in_sentence":"grotesque","ko":"그 고민들에서 가장 슬픈 점은 그것들이 우스꽝스럽다는 것이었고, 더 애처로울수록 더욱 웃음이 나오고 싶어졌다.","chapter":18},{"lemma":"misapprehension","difficulty":"C2","gloss":"A failure to understand something; an illusion, misconception or misunderstanding.","ipa":null,"sentence":"It is a grotesque misapprehension which sees in art no more than a craft comprehensible perfectly only to the craftsman: art is a manifestation of emotion, and emotion speaks a language that all may understand.","word_in_sentence":"misapprehension","ko":"예술을 장인만이 완전히 이해할 수 있는 기예 이상으로 보지 않는 것은 기괴한 오해이다. 예술은 감정의 발현이며, 감정은 모든 사람이 이해할 수 있는 언어로 말하기 때문이다.","chapter":1},{"lemma":"comprehensible","difficulty":"C1","gloss":"Able to be comprehended.","ipa":"/kɒmpɹəˈhɛnsɪbəl/","sentence":"She tried to talk to him, partly by signs, partly in pidgin French, which, for some reason, she thought would be more comprehensible to him, and she had half a dozen phrases of English.","word_in_sentence":"comprehensible","ko":"그녀는 그와 이야기를 나누려 했는데, 부분적으로는 손짓으로, 부분적으로는 어떤 이유에서인지 그가 더 잘 알아들을 거라고 생각한 어설픈 프랑스어로, 그리고 영어 구문 서너 개를 써가며 말했다.","chapter":13},{"lemma":"craftsman","difficulty":"C1","gloss":"One who is highly skilled at one's trade; an artisan or artificer.","ipa":"/ˈkɹɑːftsmən/","sentence":"It is a grotesque misapprehension which sees in art no more than a craft comprehensible perfectly only to the craftsman: art is a manifestation of emotion, and emotion speaks a language that all may understand.","word_in_sentence":"craftsman","ko":"예술을 장인만이 완전히 이해할 수 있는 기예 이상으로 보지 않는 것은 기괴한 오해이다. 예술은 감정의 발현이며, 감정은 모든 사람이 이해할 수 있는 언어로 말하기 때문이다.","chapter":1},{"lemma":"manifestation","difficulty":"C1","gloss":"The act or process of becoming manifest.","ipa":"/ˌmænɪfɛˈsteɪʃən/","sentence":"I suppose that art is a manifestation of the sexual instinct.","word_in_sentence":"manifestation","ko":"예술이란 성적 본능의 발현이라고 생각한다.","chapter":43},{"lemma":"admirable","difficulty":"C1","gloss":"Deserving of the highest esteem or admiration; estimable.","ipa":"/ˈæd.məɹ.ə.bəl/","sentence":"“Admirable advice,” I answered.","word_in_sentence":"Admirable","ko":"\"훌륭한 조언이군요.\" 내가 대답했다.","chapter":4},{"lemma":"exhaustively","difficulty":"C2","gloss":"In an exhaustive manner.","ipa":"/ɛɡˈzɑ.stɪv.li/","sentence":"Fortunately, there is no need for me to risk the adventure, since my friend, Mr. Edward Leggatt, an able writer as well as an admirable painter, has exhaustively discussed Charles Strickland’s work in a little book[1] which is a charming example of a style, for the most part, less happily cultivated in England than in France.","word_in_sentence":"exhaustively","ko":"다행히 나는 그런 모험을 감행할 필요가 없다. 유능한 작가이자 훌륭한 화가인 내 친구 에드워드 레가트 씨가 찰스 스트릭랜드의 작품을 한 권의 소책자에서 철저히 논의했기 때문이다. 이 책은 대체로 영국보다는 프랑스에서 더 성공적으로 발달한 문체의 매력적인 본보기이다.","chapter":1},{"lemma":"cultivate","difficulty":"C1","gloss":"To grow plants, notably crops.","ipa":"/ˈkʌltɪveɪt/","sentence":"I imagine that she had never looked with approval on her sister’s leaning towards persons who cultivated the arts.","word_in_sentence":"cultivated","ko":"그녀는 언니가 예술을 추구하는 사람들에게 기울이는 관심을 결코 좋게 보지 않았던 것 같다.","chapter":15},{"lemma":"whet","difficulty":"C1","gloss":"To hone or rub on with some substance, as a piece of stone, for the purpose of sharpening – see whetstone.","ipa":"/ˈwɛt/","sentence":"Maurice Huret in his famous article gave an outline of Charles Strickland’s life which was well calculated to whet the appetites of the inquiring.","word_in_sentence":"whet","ko":"모리스 위레는 그의 유명한 기사에서 찰스 스트릭랜드의 생애 개요를 제시했는데, 이는 탐구하는 이들의 호기심을 자극하기에 충분히 계산된 것이었다.","chapter":1},{"lemma":"inquiring","difficulty":"C1","gloss":"present participle and gerund of inquire","ipa":"/ɪnˈkwaɪɹɪŋ/","sentence":"Maurice Huret in his famous article gave an outline of Charles Strickland’s life which was well calculated to whet the appetites of the inquiring.","word_in_sentence":"inquiring","ko":"모리스 위레는 그의 유명한 기사에서 찰스 스트릭랜드의 생애 개요를 제시했는데, 이는 탐구하는 이들의 호기심을 자극하기에 충분히 계산된 것이었다.","chapter":1},{"lemma":"disinterested","difficulty":"C1","gloss":"Having no stake or interest in the outcome, and no conflicts of interest; free of bias, impartial.","ipa":"/dɪˈsɪnt(ə)ɹɛstɪd/","sentence":"With his disinterested passion for art, he had a real desire to call the attention of the wise to a talent which was in the highest degree original; but he was too good a journalist to be unaware that the “human interest” would enable him more easily to effect his purpose.","word_in_sentence":"disinterested","ko":"예술에 대한 사심 없는 열정으로, 그는 최고도로 독창적인 재능에 현명한 이들의 관심을 끌고자 하는 진정한 욕망을 가지고 있었다. 하지만 그는 너무나 훌륭한 저널리스트여서 '인간적 흥미'가 자신의 목적을 더 쉽게 달성하게 해줄 것임을 모르지 않았다.","chapter":1},{"lemma":"cafés","difficulty":"C1","gloss":"plural of café","ipa":null,"sentence":"“There are more cafés in Paris than one, at which to trifle away an idle hour.”","word_in_sentence":"cafés","ko":"\"파리에는 한가한 시간을 보낼 수 있는 카페가 한 곳만 있는 것은 아니니까요.\"","chapter":32},{"lemma":"amazement","difficulty":"C1","gloss":"The condition of being amazed; a state of overwhelming wonder, as from surprise or sudden fear, horror, or admiration; astonishment.","ipa":"/əˈmeɪz.mənt/","sentence":"I forgot everything but my own amazement.","word_in_sentence":"amazement","ko":"나는 내 자신의 놀라움 외에는 모든 것을 잊었다.","chapter":12},{"lemma":"reminiscence","difficulty":"C1","gloss":"An act of remembering long-past experiences, especially positive or pleasant ones, often fondly.","ipa":"/ˌɹɛm.əˈnɪs.əns/","sentence":"What would we not give for the reminiscences of someone who had been as intimately acquainted with El Greco as I was with Strickland?","word_in_sentence":"reminiscences","ko":"내가 스트릭랜드를 알았던 것만큼 엘 그레코를 친밀하게 알았던 누군가의 회상록이 있다면 우리가 그것을 얻기 위해 무엇을 아끼겠는가?","chapter":2},{"lemma":"notoriety","difficulty":"C1","gloss":"An infamous or notorious condition or reputation.","ipa":"/noʊ.tɚ.aɪ.ə.ti/","sentence":"And when such as had come in contact with Strickland in the past, writers who had known him in London, painters who had met him in the cafés of Montmartre, discovered to their amazement that where they had seen but an unsuccessful artist, like another, authentic genius had rubbed shoulders with them there began to appear in the magazines of France and America a succession of articles, the reminiscences of one, the appreciation of another, which added to Strickland’s notoriety, and fed without satisfying the curiosity of the public.","word_in_sentence":"notoriety","ko":"과거에 스트릭랜드와 접촉했던 사람들, 런던에서 그를 알았던 작가들, 몽마르트르의 카페에서 그를 만났던 화가들이 자신들이 그저 또 다른 실패한 예술가로만 보았던 곳에서 진정한 천재가 어깨를 스쳤다는 사실을 놀랍게 발견하자, 프랑스와 미국의 잡지들에 연이어 기사들이 나타나기 시작했다. 한 사람의 회상, 다른 사람의 평가가 스트릭랜드의 명성을 더했고, 대중의 호기심을 만족시키지는 못한 채 부채질했다.","chapter":1},{"lemma":"industrious","difficulty":"C1","gloss":"Hard-working and persistent.","ipa":"/ɪnˈdʌstɹi.əs/","sentence":"Mr. Strickland has drawn the portrait of an excellent husband and father, a man of kindly temper, industrious habits, and moral disposition.","word_in_sentence":"industrious","ko":"스트릭랜드 씨는 훌륭한 남편이자 아버지, 온화한 성품과 근면한 습관, 그리고 도덕적 품성을 지닌 인물의 초상을 그려냈다.","chapter":1},{"lemma":"seine","difficulty":"C1","gloss":"A long net having floats attached at the top and sinkers (weights) at the bottom, used in shallow water for catching fish.","ipa":"/seɪn/","sentence":"sein Leben und seine Kunst,” by Hugo Weitbrecht-Rotholz, Ph.D. Schwingel und Hanisch.","word_in_sentence":"seine","ko":"『찰스 스트릭랜드: 그의 생애와 예술』, 후고 바이트브레히트-로톨츠 박사. 슈빙겔 운트 하니쉬.","chapter":1},{"lemma":"innate","difficulty":"C1","gloss":"Inborn; existing or having existed since birth.","ipa":"/ɪˈneɪt/","sentence":"The faculty for myth is innate in the human race.","word_in_sentence":"innate","ko":"신화를 만들어내는 능력은 인간에게 타고난 것이다.","chapter":1},{"lemma":"avidity","difficulty":"C2","gloss":"Greediness; strong appetite.","ipa":"/əˈvɪdɪti/","sentence":"It seizes with avidity upon any incidents, surprising or mysterious, in the career of those who have at all distinguished themselves from their fellows, and invents a legend to which it then attaches a fanatical belief.","word_in_sentence":"avidity","ko":"인간은 동료들과 조금이라도 구별되는 사람들의 생애에서 놀랍거나 신비로운 사건들을 탐욕스럽게 붙잡고는, 그것에 광신적인 믿음을 부여하는 전설을 만들어낸다.","chapter":1},{"lemma":"fanatical","difficulty":"C1","gloss":"Having an extreme, irrational zeal or enthusiasm for a specific cause.","ipa":"/fəˈnætɪkəl/","sentence":"It seizes with avidity upon any incidents, surprising or mysterious, in the career of those who have at all distinguished themselves from their fellows, and invents a legend to which it then attaches a fanatical belief.","word_in_sentence":"fanatical","ko":"인간은 동료들과 조금이라도 구별되는 사람들의 생애에서 놀랍거나 신비로운 사건들을 탐욕스럽게 붙잡고는, 그것에 광신적인 믿음을 부여하는 전설을 만들어낸다.","chapter":1},{"lemma":"commonplace","difficulty":"C1","gloss":"Ordinary; not having any remarkable characteristics.","ipa":"/ˈkɑmənˌpleɪs/","sentence":"He looked commonplace.","word_in_sentence":"commonplace","ko":"그는 평범해 보였다.","chapter":6},{"lemma":"immortality","difficulty":"C1","gloss":"Never dying","ipa":"/ˌɪmɔːɹˈtæləti/","sentence":"The incidents of the legend become the hero’s surest passport to immortality.","word_in_sentence":"immortality","ko":"전설 속 사건들은 영웅이 불멸에 이르는 가장 확실한 여권이 된다.","chapter":1},{"lemma":"inshrine","difficulty":"C2","gloss":"Archaic form of enshrine.","ipa":null,"sentence":"The ironic philosopher reflects with a smile that Sir Walter Raleigh is more safely inshrined in the memory of mankind because he set his cloak for the Virgin Queen to walk on than because he carried the English name to undiscovered countries.","word_in_sentence":"inshrined","ko":"아이러니한 철학자는 미소를 지으며 생각한다. 월터 롤리 경이 인류의 기억 속에 더욱 안전하게 자리 잡은 것은 미지의 땅에 영국의 이름을 전파했기 때문이 아니라, 처녀 여왕이 걸을 수 있도록 자신의 망토를 깔아드렸기 때문이라고.","chapter":1},{"lemma":"undiscovered","difficulty":"C1","gloss":"That has not been discovered; unknown, unexplored.","ipa":null,"sentence":"The ironic philosopher reflects with a smile that Sir Walter Raleigh is more safely inshrined in the memory of mankind because he set his cloak for the Virgin Queen to walk on than because he carried the English name to undiscovered countries.","word_in_sentence":"undiscovered","ko":"아이러니한 철학자는 미소를 지으며 생각한다. 월터 롤리 경이 인류의 기억 속에 더욱 안전하게 자리 잡은 것은 미지의 땅에 영국의 이름을 전파했기 때문이 아니라, 처녀 여왕이 걸을 수 있도록 자신의 망토를 깔아드렸기 때문이라고.","chapter":1},{"lemma":"obscurely","difficulty":"C2","gloss":"In an obscure manner.","ipa":null,"sentence":"Charles Strickland lived obscurely.","word_in_sentence":"obscurely","ko":"찰스 스트릭랜드는 무명으로 살았다.","chapter":1},{"lemma":"scanty","difficulty":"C2","gloss":"Somewhat less than is needed in amplitude or extent.","ipa":"/ˈskænti/","sentence":"It is not strange, then, that those who wrote of him should have eked out their scanty recollections with a lively fancy, and it is evident that there was enough in the little that was known of him to give opportunity to the romantic scribe; there was much in his life which was strange and terrible, in his character something outrageous, and in his fate not a little that was pathetic.","word_in_sentence":"scanty","ko":"따라서 그에 대해 쓴 사람들이 빈약한 기억을 생생한 상상력으로 보완했다는 것은 이상한 일이 아니며, 그에 대해 알려진 적은 것들 속에도 낭만적인 필사자에게 기회를 줄 만한 충분한 소재가 있었음이 분명하다. 그의 삶에는 기이하고 끔찍한 것들이 많았고, 그의 성격에는 터무니없는 면이 있었으며, 그의 운명에는 적지 않은 비극적 요소가 있었다.","chapter":1},{"lemma":"recollection","difficulty":"C1","gloss":"The act of recollecting, or recalling to the memory; the act of recalling to memory.","ipa":"/ɹɛkəˈlɛkʃən/","sentence":"She was searching among her recollections.","word_in_sentence":"recollections","ko":"그녀는 기억을 더듬고 있었다.","chapter":15},{"lemma":"scribe","difficulty":"C1","gloss":"Someone who writes; a draughtsperson; a writer for another; especially, an official or public writer; an amanuensis, secretary, notary, or copyist.","ipa":"[skɹaɪ̯b]","sentence":"It is not strange, then, that those who wrote of him should have eked out their scanty recollections with a lively fancy, and it is evident that there was enough in the little that was known of him to give opportunity to the romantic scribe; there was much in his life which was strange and terrible, in his character something outrageous, and in his fate not a little that was pathetic.","word_in_sentence":"scribe","ko":"따라서 그에 대해 쓴 사람들이 빈약한 기억을 생생한 상상력으로 보완했다는 것은 이상한 일이 아니며, 그에 대해 알려진 적은 것들 속에도 낭만적인 필사자에게 기회를 줄 만한 충분한 소재가 있었음이 분명하다. 그의 삶에는 기이하고 끔찍한 것들이 많았고, 그의 성격에는 터무니없는 면이 있었으며, 그의 운명에는 적지 않은 비극적 요소가 있었다.","chapter":1},{"lemma":"circumstantiality","difficulty":"C2","gloss":"Extreme attention to minute or irrelevant detail.","ipa":null,"sentence":"In due course a legend arose of such circumstantiality that the wise historian would hesitate to attack it.","word_in_sentence":"circumstantiality","ko":"마침내 너무나 구체적인 전설이 생겨나서, 현명한 역사가라면 그것을 공격하기를 주저할 정도가 되었다.","chapter":1},{"lemma":"avowedly","difficulty":"C2","gloss":"With open acknowledgment, declaration or verification.","ipa":null,"sentence":"He wrote his biography[3] avowedly to “remove certain misconceptions which had gained currency” in regard to the later part of his father’s life, and which had “caused considerable pain to persons still living.”","word_in_sentence":"avowedly","ko":"그는 아버지 생 one of his relatives for a subscription to the Additional Curates Society.","word_in_sentence":"clergyman","ko":"나는 성직자인 헨리 삼촌이 친척들에게 보조 목사회 기부금을 요청할 때 쓰던 어조를 취했다.","chapter":12},{"lemma":"exegesis","difficulty":"C1","gloss":"A critical explanation or interpretation of a text, especially a religious text.","ipa":"/ɛksɪˈd͡ʒisɪs/","sentence":"The modern clergyman has acquired in his study of the science which I believe is called exegesis an astonishing facility for explaining things away, but the subtlety with which the Rev. Robert Strickland has “interpreted” all the facts in his father’s life which a dutiful son might find it inconvenient to remember must surely lead him in the fullness of time to the highest dignities of the Church.","word_in_sentence":"exegesis","ko":"현대의 성직자들은 주석학이라고 불리는 학문 연구를 통해 사물을 해명해버리는 놀라운 능력을 습득했지만, 로버트 스트릭랜드 목사가 효성스러운 아들로서 기억하기 불편할 수 있는 아버지 생애의 모든 사실들을 \"해석\"해낸 그 교묘함은 분명 때가 되면 그를 교회의 최고 지위에 올려놓을 것이다.","chapter":1},{"lemma":"subtlety","difficulty":"C1","gloss":"The quality of being scarcely noticeable or difficult to discern. (of things)","ipa":"/ˈsʌt(ə)lti/","sentence":"But who can fathom the subtleties of the human heart?","word_in_sentence":"subtleties","ko":"하지만 누가 인간 마음의 미묘함을 헤아릴 수 있겠는가?","chapter":43},{"lemma":"dutiful","difficulty":"C1","gloss":"Accepting of one's legal or moral obligations and willing to do them well, and without complaint.","ipa":null,"sentence":"The modern clergyman has acquired in his study of the science which I believe is called exegesis an astonishing facility for explaining things away, but the subtlety with which the Rev. Robert Strickland has “interpreted” all the facts in his father’s life which a dutiful son might find it inconvenient to remember must surely lead him in the fullness of time to the highest dignities of the Church.","word_in_sentence":"dutiful","ko":"현대의 성직자들은 주석학이라고 불리는 학문 연구를 통해 사물을 해명해버리는 놀라운 능력을 습득했지만, 로버트 스트릭랜드 목사가 효성스러운 아들로서 기억하기 불편할 수 있는 아버지 생애의 모든 사실들을 \"해석\"해낸 그 교묘함은 분명 때가 되면 그를 교 nt, courteous, especially with regard to male attitudes towards women.","ipa":"/ˈɡælənt/","sentence":"These gallant words which seem so novel to those that speak them were said in accents scarcely changed a hundred times before.","word_in_sentence":"gallant","ko":"말하는 이들에게는 참신해 보이는 이런 용감한 말들이 이미 백 번도 더 거의 똑같은 억양으로 되풀이되었던 것이다.","chapter":2},{"lemma":"detestation","difficulty":"C2","gloss":"Hate coupled with disgust; abhorrence.","ipa":null,"sentence":"Here, on this remote island, he seemed to have aroused none of the detestation with which he was regarded at home, but compassion rather; and his vagaries were accepted with tolerance.","word_in_sentence":"detestation","ko":"여기, 이 외딴 섬에서 그는 고국에서 받았던 그런 혐오감을 불러일으키지 않는 것 같았고, 오히려 동정을 받았다. 그리고 그의 기행들도 관용으로 받아들여졌다.","chapter":54},{"lemma":"originality","difficulty":"C1","gloss":"The quality of being original or novel.","ipa":"/əˌɹɪd͡ʒɪˈnælɪti/","sentence":"I think that my taste is good, but I am conscious that it has no originality.","word_in_sentence":"originality","ko":"내 취향이 좋다고 생각하지만, 독창성이 없다는 것을 의식하고 있다.","chapter":42},{"lemma":"scarcely","difficulty":"C1","gloss":"Probably not.","ipa":"/ˈskɛəsli/","sentence":"“I scarcely know.","word_in_sentence":"scarcely","ko":"\"잘 모르겠어요.","chapter":57},{"lemma":"suffice","difficulty":"C1","gloss":"To be enough or sufficient; to meet the need (of anything); to be adequate; to be good enough.","ipa":"/səˈfaɪs/","sentence":"Perhaps Charles Strickland’s power and originality would scarcely have sufficed to turn the scale if the remarkable mythopoeic faculty of mankind had not brushed aside with impatience a story which disappointed all its craving for the extraordinary.","word_in_sentence":"sufficed","ko":"아마도 찰스 스트릭랜드의 힘과 독창성만으로는 균형을 뒤바꾸기에 충분하지 않았을 것이다. 만약 인류의 놀라운 신화 창조 능력이 비범한 것에 대한 모든 갈망을 실망시키는 이야기를 성급하게 밀어내지 않았다면 말이다.","chapter":1},{"lemma":"mythopoeic","difficulty":"C2","gloss":"Giving rise to myths; pertaining to the creation of myth.","ipa":"/mɪθə(ʊ)ˈpiːɪk/","sentence":"Perhaps lify","difficulty":"C2","gloss":"To say defamatory things about someone or something; to speak ill of.","ipa":"/ˈvɪl.ɪ.faɪ/","sentence":"His decent reticence is branded as hypocrisy, his circumlocutions are roundly called lies, and his silence is vilified as treachery.","word_in_sentence":"vilified","ko":"그의 품위 있는 침묵은 위선으로 낙인찍히고, 그의 완곡한 표현은 거짓말이라고 단정되며, 그의 침묵은 배신으로 비난받는다.","chapter":1},{"lemma":"treachery","difficulty":"C1","gloss":"Deliberate, often calculated, disregard for trust or faith.","ipa":"/ˈtɹɛt͡ʃəɹi/","sentence":"His decent reticence is branded as hypocrisy, his circumlocutions are roundly called lies, and his silence is vilified as treachery.","word_in_sentence":"treachery","ko":"그의 품위 있는 침묵은 위선으로 낙인찍히고, 그의 완곡한 표현은 거짓말이라고 단정되며, 그의 침묵은 배신으로 비난받는다.","chapter":1},{"lemma":"reprehensible","difficulty":"C1","gloss":"Blameworthy, censurable, guilty.","ipa":"/ˌɹɛpɹɪˈhɛnsɪb(ə)l/","sentence":"And on the strength of peccadillos, reprehensible in an author, but excusable in a son, the Anglo-Saxon race is accused of prudishness, humbug, pretentiousness, deceit, cunning, and bad cooking.","word_in_sentence":"reprehensible","ko":"그리고 작가로서는 비난받을 만하지만 아들로서는 용서할 만한 사소한 잘못들을 근거로, 앵글로색슨 민족은 경직성, 허위, 허세, 기만, 교활함, 그리고 형편없는 요리 실력으로 고발당한다.","chapter":1},{"lemma":"excusable","difficulty":"C2","gloss":"Possible to excuse; worthy of being excused.","ipa":null,"sentence":"And on the strength of peccadillos, reprehensible in an author, but excusable in a son, the Anglo-Saxon race is accused of prudishness, humbug, pretentiousness, deceit, cunning, and bad cooking.","word_in_sentence":"excusable","ko":"그리고 작가로서는 비난받을 만하지만 아들로서는 용서할 만한 사소한 잘못들을 근거로, 앵글로색슨 민족은 경직성, 허위, 허세, 기만, 교활함, 그리고 형편없는 요리 실력으로 고발당한다.","chapter":1},{"lemma":"prudishness","difficulty":"C2","gloss":"The condition of being prudish; prudery","ipa":null,"sentence":"And on the strength of peccadillos, reprehensible in an author, but excusable in a son, the Anglo-Saxon race is accused of prudishness, humbug, pretentiousness, deceit, cunning, and bad cooking.","word_in_sentence":"prudishness","ko":"그리고 작가로서는 비난받을 만하지만 아들로서는 용서할 만한 사소한 잘못들을 근거로, 앵글로색슨 민족은 경직성, 허위, 허세, 기만, 교활함, 그리고 형편없는 요리 실력으로 고발당한다.","chapter":1},{"lemma":"humbug","difficulty":"C1","gloss":"A hoax, jest, or prank.","ipa":"/ˈhʌmbʌɡ/","sentence":"“What’s the good of trying to humbug me?”","word_in_sentence":"humbug","ko":"\"나를 속이려 해봤자 무슨 소용이 있겠어?\"","chapter":21},{"lemma":"pretentiousness","difficulty":"C2","gloss":"The quality of being pretentious.","ipa":null,"sentence":"His pretentiousness will only expose his vacuity.","word_in_sentence":"pretentiousness","ko":"그의 허세는 오직 그의 공허함만을 드러낼 뿐이다.","chapter":42},{"lemma":"deceit","difficulty":"C1","gloss":"An act or practice intended to deceive; a trick.","ipa":"/dɪˈsiːt/","sentence":"And on the strength of peccadillos, reprehensible in an author, but excusable in a son, the Anglo-Saxon race is accused of prudishness, humbug, pretentiousness, deceit, cunning, and bad cooking.","word_in_sentence":"deceit","ko":"그리고 작가로서는 비난받을 만하지만 아들로서는 용서할 만한 사소한 잘못들을 근거로, 앵글로색슨 민족은 경직성, 허위, 허세, 기만, 교활함, 그리고 형편없는 요리 실력으로 고발당한다.","chapter":1},{"lemma":"cunning","difficulty":"C1","gloss":"Sly; crafty; clever in surreptitious behaviour.","ipa":"/ˈkʌnɪŋ/","sentence":"He was very cunning, but it was evidently this that he was aiming at.","word_in_sentence":"cunning","ko":"그는 매우 교활했지만, 분명히 이것이 그가 노리는 바였다.","chapter":12},{"lemma":"refute","difficulty":"C1","gloss":"To prove (something) to be false or incorrect.","ipa":"/ɹɪˈfjuːt/","sentence":"Personally I think it was rash of Mr. Strickland, in refuting the account which had gained belief of a certain “unpleasantness” between his father and mother, to state that Charles Strickland in a letter written from Paris had described her as “an excellent woman,” since Dr. Weitbrecht-Rotholz was able to print the letter in facsimile, and it appears that the passage referred to ran in fact as follows: God damn my wife.","word_in_sentence":"refuting","ko":"개인적으로 나는 스트릭랜드 씨가 아버지와 어머니 사이의 어떤 \"불쾌한 일\"에 대해 널리 믿어진 설명을 반박하면서, 찰스 스트릭랜드가 파리에서 보낸 편지에서 어머니를 \"훌륭한 여성\"이라고 묘사했다고 진술한 것은 경솔했다고 생각한다. 왜냐하면 바이트브레히트-로톨츠 박사가 그 편지를 복사본으로 인쇄할 수 있었고, 언급된 구절이 실제로는 다음과 같이 되어 있었음이 밝혀졌기 때문이다: 젠장할 내 아내.","chapter":1},{"lemma":"unpleasantness","difficulty":"C1","gloss":"The property of being unpleasant or disagreeable.","ipa":"/ʌnˈplɛz.ənt.nəs/","sentence":"But it was nice to see that any unpleasantness he had endured in his native land had not impaired his ardent patriotism.","word_in_sentence":"unpleasantness","ko":"하지만 고국에서 겪었던 어떤 불쾌한 일도 그의 열렬한 애국심을 손상시키지 못했다는 것은 보기 좋은 일이었다.","chapter":46},{"lemma":"facsimile","difficulty":"C1","gloss":"A copy or reproduction.","ipa":"/fækˈsɪm.ə.li/","sentence":"Personally I think it was rash of Mr. Strickland, in refuting the account which had gained belief of a certain “unpleasantness” between his father and mother, to state that Charles Strickland in a letter written from Paris had described her as “an excellent woman,” since Dr. Weitbrecht-Rotholz was able to print the letter in facsimile, and it appears that the passage referred to ran in fact as follows: God damn my wife.","word_in_sentence":"facsimile","ko":"개인적으로 나는 스트릭랜드 씨가 아버지와 어머니 사이의 어떤 \"불쾌한 일\"에 대해 널리 믿어진 설명을 반박하면서, 찰스 스트릭랜드가 파리에서 보낸 편지에서 어머니를 \"훌륭한 여성\"이라고 묘사했다고 진술한 것은 경솔했다고 생각한다. 왜냐하면 바이트브레히트-로톨츠 박사가 그 편지를 복사본으로 인쇄할 수 있었고, 언급된 구절이 실제로는 다음과 같이 되어 있었음이 밝혀졌기 때문이다: 젠장할 내 아내.","chapter":1},{"lemma":"unwelcome","difficulty":"C1","gloss":"Not welcome.","ipa":null,"sentence":"It is not thus that the Church in its great days dealt with evidence that was unwelcome.","word_in_sentence":"unwelcome","ko":"전성기의 교회가 달갑지 않은 증거를 이런 식으로 다루지는 않았다.","chapter":1},{"lemma":"whitewash","difficulty":"C1","gloss":"A lime and water mixture for painting walls and fences bright white.","ipa":"/ˈwaɪt.wɒʃ/","sentence":"Dr. Weitbrecht-Rotholz was an enthusiastic admirer of Charles Strickland, and there was no danger that he would whitewash him.","word_in_sentence":"whitewash","ko":"바이트브레히트-로톨츠 박사는 찰스 스트릭랜드의 열렬한 찬미자였으므로, 그가 스트릭랜드를 미화할 위험은 전혀 없었다.","chapter":1},{"lemma":"unerring","difficulty":"C2","gloss":"consistently accurate; not missing a target.","ipa":"/ʌnˈɜːɹ.ɪŋ/","sentence":"He had an unerring eye for the despicable motive in actions that had all the appearance of innocence.","word_in_sentence":"unerring","ko":"그는 순진해 보이는 행동들 속에서 비열한 동기를 찾아내는 데 있어 절대 틀리지 않는 안목을 가지고 있었다.","chapter":1},{"lemma":"despicable","difficulty":"C1","gloss":"Fit or deserving to be despised; contemptible; mean.","ipa":"/dɪˈspɪkəbəl/","sentence":"You have a despicable character.”","word_in_sentence":"despicable","ko":"당신은 비열한 성격의 소유자니까요.\"","chapter":21},{"lemma":"pathologist","difficulty":"C1","gloss":"An expert in pathology; a specialist who examines samples of body tissues for diagnostic or forensic purpose.","ipa":null,"sentence":"The mystic sees the ineffable, and the psycho-pathologist the unspeakable.","word_in_sentence":"pathologist","ko":"신비주의자는 형언할 수 없는 것을 보고, 정신병리학자는 말할 수 없는 것을 본다.","chapter":1},{"lemma":"subconscious","difficulty":"C1","gloss":"Occuring in the part of our mind that we are not normally aware of.","ipa":"/sʌbˈkɒn.ʃəs/","sentence":"He was a psycho-pathologist, as well as a student of art, and the subconscious had few secrets from him.","word_in_sentence":"subconscious","ko":"그는 예술 연구자인 동시에 정신병리학자였으며, 무의식이 그에게 숨기는 비밀은 거의 없었다.","chapter":1},{"lemma":"ineffable","difficulty":"C2","gloss":"Beyond expression in words; unspeakable.","ipa":"/ˌɪnˈɛf.ə.bəl/","sentence":"I had a fleeting glimpse of a pursuit of the ineffable.","word_in_sentence":"ineffable","ko":"나는 형언할 수 없는 것을 추구하는 모습을 잠깐 엿보았다.","chapter":41},{"lemma":"unspeakable","difficulty":"C1","gloss":"Incapable of being spoken or uttered","ipa":null,"sentence":"The mystic sees the ineffable, and the psycho-pathologist the unspeakable.","word_in_sentence":"unspeakable","ko":"신비주의자는 형언할 수 없는 것을 보고, 정신병리학자는 말할 수 없는 것을 본다.","chapter":1},{"lemma":"eagerness","difficulty":"C1","gloss":"The state or quality of being eager; ardent desire.","ipa":"/ˈiɡɚnəs/","sentence":"It was charming to be welcomed with so much eagerness.","word_in_sentence":"eagerness","ko":"그토록 열렬하게 환영받는다는 것은 정말 기분 좋은 일이었다.","chapter":19},{"lemma":"ferret","difficulty":"C1","gloss":"An often domesticated mammal (Mustela putorius furo) rather like a weasel, descended from the polecat and often trained to hunt burrowing animals.","ipa":"/ˈfɛɹɪt/","sentence":"There is a singular fascination in watching the eagerness with which the learned author ferrets out every circumstance which may throw discredit on his hero.","word_in_sentence":"ferrets","ko":"박식한 저자가 자신의 주인공에게 불명예를 안겨줄 수 있는 모든 정황을 열심히 파헤치는 모습을 지켜보는 것에는 묘한 매력이 있다.","chapter":1},{"lemma":"discredit","difficulty":"C1","gloss":"To harm the good reputation of (a person).","ipa":"/dɪsˈkɹɛd.ɪt/","sentence":"There is a singular fascination in watching the eagerness with which the learned author ferrets out every circumstance which may throw discredit on his hero.","word_in_sentence":"discredit","ko":"박식한 저자가 자신의 주인공에게 불명예를 안겨줄 수 있는 모든 정황을 열심히 파헤치는 모습을 지켜보는 것에는 묘한 매력이 있다.","chapter":1},{"lemma":"meanness","difficulty":"C2","gloss":"The condition, or quality, of being mean (any of its definitions)","ipa":null,"sentence":"His heart warms to him when he can bring forward some example of cruelty or meanness, and he exults like an inquisitor at the auto da fé of an heretic when with some forgotten story he can confound the filial piety of the Rev. Robert Strickland.","word_in_sentence":"meanness","ko":"잔혹함이나 비열함의 사례를 제시할 수 있을 때면 그의 마음이 따뜻해지고, 잊혀진 이야기로 로버트 스트릭랜드 목사의 효성을 당황시킬 수 있을 때면 마치 종교재판관이 이단자의 화형식에서 환호하듯 의기양양해한다.","chapter":1},{"lemma":"exult","difficulty":"C2","gloss":"To rejoice; to be very happy, especially in triumph; to triumph (over).","ipa":"/ɪɡˈzʌlt/","sentence":"His heart warms to him when he can bring forward some example of cruelty or meanness, and he exults like an inquisitor at the auto da fé of an heretic when with some for etic when with some forgotten story he can confound the filial piety of the Rev. Robert Strickland.","word_in_sentence":"filial","ko":"잔혹함이나 비열함의 사례를 제시할 수 있을 때면 그의 마음이 따뜻해지고, 잊혀진 이야기로 로버트 스트릭랜드 목사의 효성을 당황시킬 수 있을 때면 마치 종교재판관이 이단자의 화형식에서 환호하듯 의기양양해한다.","chapter":1},{"lemma":"piety","difficulty":"C1","gloss":"Reverence and devotion to God.","ipa":"/ˈpaɪ.ɪ.ti/","sentence":"His heart warms to him when he can bring forward some example of cruelty or meanness, and he exults like an inquisitor at the auto da fé of an heretic when with some forgotten story he can confound the filial piety of the Rev. Robert Strickland.","word_in_sentence":"piety","ko":"잔혹함이나 비열함의 사례를 제시할 수 있을 때면 그의 마음이 따뜻해지고, 잊혀진 이야기로 로버트 스트릭랜드 목사의 효성을 당황시킬 수 있을 때면 마치 종교재판관이 이단자의 화형식에서 환호하듯 의기양양해한다.","chapter":1},{"lemma":"extenso","difficulty":"C2","gloss":{"en":"A long or extended period of time.","ko":"장기간","zh":"长期"},"ipa":"","sentence":"Nothing has been too small to escape him, and you may be sure that if Charles Strickland left a laundry bill unpaid it will be given you in extenso, and if he forebore to return a borrowed half-crown no detail of the transaction will be omitted.","word_in_sentence":"extenso","ko":"아무리 사소한 것도 그의 눈을 피해가지 못했으며, 찰스 스트릭랜드가 세탁비를 미납했다면 그것도 빠짐없이 상세히 기록될 것이고, 빌린 반크라운을 돌려주지 않았다면 그 거래의 어떤 세부사항도 빠뜨리지 않을 것이라고 확신해도 좋다.","chapter":1},{"lemma":"forebore","difficulty":"C2","gloss":"simple past and past participle of forebear","ipa":null,"sentence":"Nothing has been too small to escape him, and you may be sure that if Charles Strickland left a laundry bill unpaid it will be given you in extenso, and if he forebore to return a borrowed half-crown no detail of the transaction will be omitted.","word_in_sentence":"forebore","ko":"아무리 사소한 것도 그의 눈을 피해가지 못했으며, 찰스 스트릭랜드가 세탁비를 미납했다면 그것도 빠짐없이 상세히 기록될 것이고, 빌린 반크라운을 돌려주지 않았다면 그 거래의 어떤 세부사항도 빠뜨리지 않을 것이라고 확신해도 좋다.","chapter":1},{"lemma":"omit","difficulty":"C1","gloss":"To leave out or exclude.","ipa":"/oʊˈmɪt/","sentence":"He had omitted nothing that could make his wife despise him.","word_in_sentence":"omitted","ko":"그는 아내로 하여금 자신을 경멸하게 만들 수 있는 것이라면 하나도 빠뜨리지 않았다.","chapter":31},{"lemma":"intimately","difficulty":"C1","gloss":"In an intimate manner.","ipa":"/ˈɪntɪmətli/","sentence":"What would we not give for the reminiscences of someone who had been as intimately acquainted with El Greco as I was with Strickland?","word_in_sentence":"intimately","ko":"내가 스트릭랜드를 알았던 것만큼 엘 그레코를 친밀하게 알았던 누군가의 회상록이 있다면 우리가 그것을 얻기 위해 무엇을 아끼겠는가?","chapter":2},{"lemma":"infrequently","difficulty":"C1","gloss":"Not frequently.","ipa":"/ɪnˈfɹiːkwənt.li/","sentence":"During the summer I met Mrs. Strickland not infrequently.","word_in_sentence":"infrequently","ko":"여름 동안 나는 스트릭랜드 부인을 자주 만났다.","chapter":5},{"lemma":"superfluous","difficulty":"C1","gloss":"In excess of what is required or sufficient.","ipa":"/suˈpɝflu.əs/","sentence":"If they who believe in Strickland’s greatness are right, the personal narratives of such as knew him in the flesh can hardly be superfluous.","word_in_sentence":"superfluous","ko":"스트릭랜드의 위대함을 믿는 사람들이 옳다면, 그를 직접 알았던 사람들의 개인적인 증언이 불필요할 리는 없다.","chapter":2},{"lemma":"acquaint","difficulty":"C1","gloss":"To furnish or give experimental knowledge of; to make (one) know; to make familiar.","ipa":"/əˈkweɪnt/","sentence":"What would we not give for the reminiscences of someone who had been as intimately acquainted with El Greco as I was with Strickland?","word_in_sentence":"acquainted","ko":"내가 스트릭랜드를 알았던 것만큼 엘 그레코를 친밀하게 알았던 누군가의 회상록이 있다면 우리가 그것을 얻기 위해 무엇을 아끼겠는가?","chapter":2},{"lemma":"precept","difficulty":"C1","gloss":"A rule or principle, especially one governing personal conduct.","ipa":"/ˈpɹiːsɛpt/","sentence":"She looked upon venery as the natural occupation for men and women, and was ever ready with precept and example from her own wide experience.","word_in_sentence":"precept","ko":"그녀는 연애를 남녀의 자연스러운 일로 여겼고, 자신의 풍부한 경험에서 나온 교훈과 실례를 들려주기를 언제나 마다하지 않았다.","chapter":49},{"lemma":"scrupulously","difficulty":"C2","gloss":"In a careful manner, with scruple; done with careful attention to detail.","ipa":"/ˈskɹuːpjʊləsli/","sentence":"I forget who it was that recommended men for their soul’s good to do each day two things they disliked: it was a wise man, and it is a precept that I have followed scrupulously; for every day I have got up and I have gone to bed.","word_in_sentence":"scrupulously","ko":"영혼의 건강을 위해 매일 싫어하는 일 두 가지를 하라고 권한 사람이 누구였는지 기억나지 않지만, 그는 현명한 사람이었고 나는 그 교훈을 철저히 따라왔다. 매일 잠자리에서 일어나고 잠자리에 들었으니까.","chapter":2},{"lemma":"asceticism","difficulty":"C2","gloss":"The principles and practices of an ascetic; extreme self-denial and austerity.","ipa":"/əˈsɛt.əˌsɪz.əm/","sentence":"But there is in my nature a strain of asceticism, and I have subjected my flesh each week to a more severe mortification.","word_in_sentence":"asceticism","ko":"하지만 내 성격에는 금욕적인 면이 있어서, 매주 내 육신을 더욱 혹독한 고행에 내맡겨왔다.","chapter":2},{"lemma":"mortification","difficulty":"C2","gloss":"The act of mortifying.","ipa":"/ˌmoɹtɪfɪˈkeɪʃən/","sentence":"But there is in my nature a strain of asceticism, and I have subjected my flesh each week to a more severe mortification.","word_in_sentence":"mortification","ko":"하지만 내 성격에는 금욕적인 면이 있어서, 매주 내 육신을 더욱 혹독한 고행에 내맡겨왔다.","chapter":2},{"lemma":"salutary","difficulty":"C2","gloss":"Effecting or designed to effect an improvement; remedial.","ipa":"/ˈsaljʊtəɹi/","sentence":"It is a salutary discipline to consider the vast number of books that are written, the fair hopes with which their authors see them published, and the fate which awaits them.","word_in_sentence":"salutary","ko":"얼마나 많은 책들이 쓰이는지, 저자들이 얼마나 희망에 부풀어 출간을 바라보는지, 그리고 그 책들을 기다리는 운명이 무엇인지 생각해보는 것은 유익한 수행이다.","chapter":2},{"lemma":"heartache","difficulty":"C1","gloss":"Emotional distress or pain, often caused by a loved one or their absence.","ipa":"/ˈhɑːteɪk/","sentence":"Heaven knows what pains the author has been at, what bitter experiences he has endured and what heartache suffered, to give some chance reader a few hours’ relaxation or to while away the tedium of a journey.","word_in_sentence":"heartache","ko":"하늘만이 아시겠지만, 저자가 얼마나 고생했을지, 얼마나 쓰라린 경험을 견뎠을지, 얼마나 가슴 아파했을지를, 그저 우연한 독자 한 명에게 몇 시간의 휴식을 주거나 여행의 지루함을 달래주기 위해서 말이다.","chapter":2},{"lemma":"tedium","difficulty":"C1","gloss":"Boredom or tediousness; ennui.","ipa":"/ˈtiː.di.əm/","sentence":"To avoid the tedium of dining tête-à-tête, to give their servants a rest, because there was no reason to refuse, because they were “owed” a dinner.","word_in_sentence":"tedium","ko":"둘만의 지루한 식사를 피하기 위해, 하인들에게 휴식을 주기 위해, 거절할 이유가 없어서, 저녁 식사를 \"빚졌기\" 때문에.","chapter":6},{"lemma":"aught","difficulty":"C2","gloss":"Anything whatsoever, any part.","ipa":"/ɔt/","sentence":"But I should be thrice a fool if I did it for aught but my own entertainment.","word_in_sentence":"aught","ko":"하지만 내 자신의 즐거움이 아닌 다른 목적으로 그런다면 나는 세 번이나 바보가 될 것이다.","chapter":2},{"lemma":"censure","difficulty":"C1","gloss":"The act of blaming, criticizing, or condemning as wrong; reprehension.","ipa":"/ˈsɛn.ʃɚ/","sentence":"The moral I draw is that the writer should seek his reward in the pleasure of his work and in release from the burden of his thought; and, indifferent to aught else, care nothing for praise or censure, failure or success.","word_in_sentence":"censure","ko":"내가 얻는 교훈은 작가란 자신의 작업에서 오는 기쁨과 사상의 짐에서 벗어나는 해방감에서 보상을 찾아야 한다는 것이다. 그 밖의 모든 것에는 무관심하게, 칭찬이나 비난, 실패나 성공 따위는 아랑곳하지 말고.","chapter":2},{"lemma":"tumultuous","difficulty":"C1","gloss":"Characterized by loud, confused noise.","ipa":"/tjʊˈmʌl.tjʊ.əs/","sentence":"The younger generation, conscious of strength and tumultuous, have done with knocking at the door; they have burst in and seated themselves in our seats.","word_in_sentence":"tumultuous","ko":"자신들의 힘을 자각하고 격정적인 젊은 세대는 문을 두드리는 일 따위는 그만두었다. 그들은 문을 부수고 들어와 우리 자리에 앉아 버렸다.","chapter":2},{"lemma":"imitate","difficulty":"C1","gloss":"To follow as a model or a pattern; to make a copy, counterpart or semblance of.","ipa":"/ˈɪmɪteɪt/","sentence":"Of their elders some, by imitating the antics of youth, strive to persuade themselves that their day is not yet over; they shout with the lustiest, but the war cry sounds hollow in their mouth; they are like poor wantons attempting with pencil, paint and powder, with shrill gaiety, to recover the illusion of their spring.","word_in_sentence":"imitating","ko":"기성세대 중 일부는 젊은이들의 우스꽝스러운 행동을 흉내 내며 자신들의 시대가 아직 끝나지 않았다고 스스로를 설득하려 애쓴다. 그들은 가장 힘차게 외치지만, 그 전투 함성은 그들의 입에서 공허하게 울릴 뿐이다. 마치 불쌍한 창녀들이 연필과 물감과 분칠로, 날카로운 쾌활함으로 자신들의 봄날이라는 환상을 되찾으려 애쓰는 것과 같다.","chapter":2},{"lemma":"antic","difficulty":"C2","gloss":"Playful, funny, absurd.","ipa":"/ˈæn.tɪk/","sentence":"Of their elders some, by imitating the antics of youth, strive to persuade themselves that their day is not yet over; they shout with the lustiest, but the war cry sounds hollow in their mouth; they are like poor wantons attempting with pencil, paint and powder, with shrill gaiety, to recover the illusion of their spring.","word_in_sentence":"antics","ko":"기성세대 중 일부는 젊은이들의 우스꽝스러운 행동을 흉내 내며 자신들의 시대가 아직 끝나지 않았다고 스스로를 설득하려 애쓴다. 그들은 가장 힘차게 외치지만, 그 전투 함성은 그들의 입에서 공허하게 울릴 뿐이다. 마치 불쌍한 창녀들이 연필과 물감과 분칠로, 날카로운 쾌활함으로 자신들의 봄날이라는 환상을 되찾으려 애쓰는 것과 같다.","chapter":2},{"lemma":"lusty","difficulty":"C1","gloss":"Exhibiting lust (in the obsolete sense meaning \"vigor\"); strong, healthy, robust; vigorous; full of sap or vitality.","ipa":"/ˈlʌsti/","sentence":"Of their elders some, by imitating the antics of youth, strive to persuade themselves that their day is not yet over; they shout with the lustiest, but the war cry sounds hollow in their mouth; they are like poor wantons attempting with pencil, paint and powder, with shrill gaiety, to recover the illusion of their spring.","word_in_sentence":"lustiest","ko":"기성세대 중 일부는 젊은이들의 우스꽝스러운 행동을 흉내 내며 자신들의 시대가 아직 끝나지 않았다고 스스로를 설득하려 애쓴다. 그들은 가장 힘차게 외치지만, 그 전투 함성은 그들의 입에서 공허하게 울릴 뿐이다. 마치 불쌍한 창녀들이 연필과 물감과 분칠로, 날카로운 쾌활함으로 자신들의 봄날이라는 환상을 되찾으려 애쓰는 것과 같다.","chapter":2},{"lemma":"wanton","difficulty":"C1","gl _in_sentence":"indulgent","ko":"그들의 차분한 미소에는 관대한 조롱이 담겨 있다.","chapter":2},{"lemma":"mockery","difficulty":"C1","gloss":"The action of mocking; ridicule, derision.","ipa":"/ˈmɑkəɹi/","sentence":"In their chastened smile is an indulgent mockery.","word_in_sentence":"mockery","ko":"그들의 차분한 미소에는 관대한 조롱이 담겨 있다.","chapter":2},{"lemma":"sated","difficulty":"C2","gloss":"In a state of complete and thorough satisfaction; having one’s appetite fully satisfied, by having enough of something.","ipa":"/ˈseɪtɪd/","sentence":"They remember that they too trod down a sated generation, with just such clamor and with just such scorn, and they foresee that these brave torch-bearers will presently yield their place also.","word_in_sentence":"sated","ko":"그들도 한때 바로 그런 소란과 바로 그런 경멸로 물린 세대를 짓밟았음을 기억하고, 이 용감한 횃불 든 자들도 머지않아 자신들의 자리를 내주게 되리라는 것을 내다본다.","chapter":2},{"lemma":"clamor","difficulty":"C1","gloss":"A great outcry or vociferation; loud and continued shouting or exclamation.","ipa":"/ˈklæm.ɚ/","sentence":"They remember that they too trod down a sated generation, with just such clamor and with just such scorn, and they foresee that these brave torch-bearers will presently yield their place also.","word_in_sentence":"clamor","ko":"그들도 한때 바로 그런 소란과 바로 그런 경멸로 물린 세대를 짓밟았음을 기억하고, 이 용감한 횃불 든 자들도 머지않아 자신들의 자리를 내주게 되리라는 것을 내다본다.","chapter":2},{"lemma":"scorn","difficulty":"C1","gloss":"To feel or display contempt or disdain for something or somebody; to despise.","ipa":"/skɔːn/","sentence":"They remember that they too trod down a sated generation, with just such clamor and with just such scorn, and they foresee that these brave torch-bearers will presently yield their place also.","word_in_sentence":"scorn","ko":"그들도 한때 바로 그런 소란과 바로 그런 경멸로 물린 세대를 짓밟았음을 기억하고, 이 용감한 횃불 든 자들도 머지않아 자신들의 자리를 내주게 되리라는 것을 내다본다.","chapter":2},{"lemma":"foresee","difficulty":"C1","gloss":"To perceive (a situation or event) in advance.","ipa":"/fɔɹˈsi/","sentence":"“I foresee some terrible catastrophe.”","word_in_sente ggests that they fingered Roget’s Thesaurus in their cradles)","word_in_sentence":"felicity","ko":"나는 그들의 세련됨을 감탄한다—그들의 젊음은 이미 너무나 완성되어 있어서 장래성을 운운하는 것조차 우스꽝스러워 보인다—나는 그들 문체의 적절함에 경탄한다. 하지만 그 모든 풍부함에도 불구하고 (그들의 어휘력을 보면 요람에서부터 로제의 유의어 사전을 만지작거렸던 것 같다)","chapter":2},{"lemma":"copiousness","difficulty":"C2","gloss":"The state of being copious.","ipa":null,"sentence":"I admire their polish—their youth is already so accomplished that it seems absurd to speak of promise—I marvel at the felicity of their style; but with all their copiousness (their vocabulary suggests that they fingered Roget’s Thesaurus in their cradles)","word_in_sentence":"copiousness","ko":"나는 그들의 세련됨을 감탄한다—그들의 젊음은 이미 너무나 완성되어 있어서 장래성을 운운하는 것조차 우스꽝스러워 보인다—나는 그들 문체의 적절함에 경탄한다. 하지만 그 모든 풍부함에도 불구하고 (그들의 어휘력을 보면 요람에서부터 로제의 유의어 사전을 만지작거렸던 것 같다)","chapter":2},{"lemma":"thesaurus","difficulty":"C1","gloss":"A publication that provides synonyms (and sometimes antonyms and other semantic relations) for the words of a given language.","ipa":"/θɪˈsɔːɹəs/","sentence":"I admire their polish—their youth is already so accomplished that it seems absurd to speak of promise—I marvel at the felicity of their style; but with all their copiousness (their vocabulary suggests that they fingered Roget’s Thesaurus in their cradles)","word_in_sentence":"Thesaurus","ko":"나는 그들의 세련됨을 감탄한다—그들의 젊음은 이미 너무나 완성되어 있어서 장래성을 운운하는 것조차 우스꽝스러워 보인다—나는 그들 문체의 적절함에 경탄한다. 하지만 그 모든 풍부함에도 불구하고 (그들의 어휘력을 보면 요람에서부터 로제의 유의어 사전을 만지작거렸던 것 같다)","chapter":2},{"lemma":"heartiness","difficulty":"C2","gloss":"The quality of being hearty.","ipa":null,"sentence":"But at the moment he was all heartiness and good-fellowship.","word_in_sentence":"heartiness","ko":"하지만 그 순간 그는 온통 다정함과 친근함 그 자체였다.","chapter":46},{"lemma":"hurl","difficulty":"C1","gloss":"To throw (something) with force.","ipa":"/hɝl/","sentence":"they say nothing to me: to my mind they know too much and feel too obviously; I cannot stomach the heartiness with which they slap me on the back or the emotion with which they hurl themselves on my bosom; their passion seems to me a little anaemic and their dreams a trifle dull.","word_in_sentence":"hurl","ko":"그들은 내게 아무것도 말해주지 않는다. 내가 보기에 그들은 너무 많이 알고 너무 뻔하게 느낀다. 나는 그들이 내 등을 두드리는 그 호탕함이나 내 품에 몸을 던지는 그 감정을 견딜 수 없다. 그들의 열정은 내게 다소 빈혈기가 있어 보이고 그들의 꿈은 조금 따분해 보인다.","chapter":2},{"lemma":"bosom","difficulty":"C1","gloss":"The breast or chest of a human (or sometimes of another animal).","ipa":"/ˈbʊz(ə)m/","sentence":"They fell away voluminously into the capaciousness of her bosom.","word_in_sentence":"bosom","ko":"턱들은 풍성하게 늘어져 그녀의 넓은 가슴팍 속으로 사라져갔다.","chapter":49},{"lemma":"anaemic","difficulty":"C2","gloss":"Alternative spelling of anemic.","ipa":null,"sentence":"they say nothing to me: to my mind they know too much and feel too obviously; I cannot stomach the heartiness with which they slap me on the back or the emotion with which they hurl themselves on my bosom; their passion seems to me a little anaemic and their dreams a trifle dull.","word_in_sentence":"anaemic","ko":"그들은 내게 아무것도 말해주지 않는다. 내가 보기에 그들은 너무 많이 알고 너무 뻔하게 느낀다. 나는 그들이 내 등을 두드리는 그 호탕함이나 내 품에 몸을 던지는 그 감정을 견딜 수 없다. 그들의 열정은 내게 다소 빈혈기가 있어 보이고 그들의 꿈은 조금 따분해 보인다.","chapter":2},{"lemma":"trifle","difficulty":"C1","gloss":"An English dessert made from a mixture of thick custard, fruit, sponge cake, jelly and whipped cream.","ipa":"/ˈtɹaɪfəl/","sentence":"“There are more cafés in Paris than one, at which to trifle away an idle hour.”","word_in_sentence":"trifle","ko":"\"파리에는 한가한 시간을 보낼 수 있는 카페가 한 곳만 있는 것은 아니니까요.\"","chapter":32},{"lemma":"thrice","difficulty":"C1","gloss":"Three times.","ipa":"[θɾ̪̊äɪs]","sentence":"But I should be thrice a fool if I did it for aught but my own entertainment.","word_in_sentence":"thrice","ko":"하지만 내 자신의 즐거움이 아닌 다른 목적으로 그런다면 나는 세 번이나 바보가 될 것이다.","chapter":2},{"lemma":"melancholy","difficulty":"C1","gloss":"Black bile, formerly thought to be one of the four \"cardinal humours\" of animal bodies.","ipa":"/ˈmɛl.ənˌkɑ.li/","sentence":"Perhaps he had, often, and his melancholy arose from the fact that he could never succeed.","word_in_sentence":"melancholy","ko":"아마도 그는 자주 그랬을 것이고, 그의 우울함은 결코 성공할 수 없다는 사실에서 비롯된 것이었다.","chapter":46},{"lemma":"bashful","difficulty":"C1","gloss":"Shy; not liking to be noticed; socially timid.","ipa":"[ˈbæʃfəɫ]","sentence":"It is not without melancholy that I wander among my recollections of the world of letters in London when first, bashful but eager, I was introduced to it.","word_in_sentence":"bashful","ko":"수줍어하면서도 열정적이었던 내가 처음 런던 문단에 발을 들여놓았을 때의 기억들을 떠올리며 헤매고 있노라면 우울함을 금할 수 없다.","chapter":3},{"lemma":"singularity","difficulty":"C1","gloss":"The state of being singular, distinct, peculiar, uncommon or unusual.","ipa":"/ˌsɪŋɡjəˈlæɹətɪ/","sentence":"It is long since I frequented it, and if the novels that describe its present singularities are accurate much in it is now changed.","word_in_sentence":"singularities","ko":"그곳을 드나든 지 오래되었고, 현재의 특이한 모습들을 묘사한 소설들이 정확하다면 많은 것이 지금은 바뀌었다.","chapter":3},{"lemma":"genteel","difficulty":"C1","gloss":"Affectedly proper or refined; somewhat prudish refinement; excessively polite.","ipa":"/d͡ʒɛnˈtiːl/","sentence":"I do not believe that there was in that genteel Bohemia an intensive culture of chastity, but I do not remember so crude a promiscuity as seems to be practised in the present day.","word_in_sentence":"genteel","ko":"그 점잖은 보헤미아 사회에 순결에 대한 강박적인 문화가 있었다고는 생각하지 않지만, 요즘 행해지는 것 같은 그토록 노골적인 난잡함은 기억나지 않는다.","chapter":3},{"lemma":"chastity","difficulty":"C1","gloss":"The quality of being chaste: the state of abstaining from any sexual activity considered immoral; avoidance of sexual sins.","ipa":"/ˈt͡ʃæstɪti/","sentence":"I do not believe that there was in that genteel Bohemia an intensive culture of chastity, but I do not remember so crude a promiscuity as seems to be practised in the present day.","word_in_sentence":"chastity","ko":"그 점잖은 보헤미아 사회에 순결에 대한 강박적인 문화가 있었다고는 생각하지 않지만, 요즘 행해지는 것 같은 그토록 노골적인 난잡함은 기억나지 않는다.","chapter":3},{"lemma":"promiscuity","difficulty":"C1","gloss":"The state or quality of being promiscuous.","ipa":"/ˌpɹɑm.ɪˈskju.ɪ.ti/","sentence":"I asked Strickland if it did not irk him to live in that promiscuity.","word_in_sentence":"promiscuity","ko":"나는 스트릭랜드에게 그런 난잡한 환경에서 사는 것이 짜증나지 않느냐고 물었다.","chapter":53},{"lemma":"hypocritical","difficulty":"C1","gloss":"Characterized by hypocrisy or being a hypocrite.","ipa":"/hɪpəˈkɹɪtɪkəl/","sentence":"“Of course it would be hypocritical for me to pretend that I regret what Abraham did.","word_in_sentence":"hypocritical","ko":"\"물론 아브라함이 한 일을 후회하지 않는다고 가식을 부리는 것은 위선일 것이다.","chapter":50},{"lemma":"vagary","difficulty":"C2","gloss":"An erratic, unpredictable occurrence or action.","ipa":"/vəˈɡɛɚ.i/","sentence":"We did not think it hypocritical to draw over our vagaries the curtain of a decent silence.","word_in_sentence":"vagaries","ko":"우리는 자신의 방탕함을 품위 있는 침묵의 장막으로 가리는 것을 위선이라고 생각하지 않았다.","chapter":3},{"lemma":"spade","difficulty":"C1","gloss":"A garden tool with a handle and a flat blade for digging. Not to be confused with a shovel which is used for moving earth or other materials.","ipa":"/speɪ̯d/","sentence":"The spade was not invariably called a bloody shovel.","word_in_sentence":"spade","ko":"삽을 언제나 빌어먹을 삽이라고 부르지는 않았다.","chapter":3},{"lemma":"invariably","difficulty":"C1","gloss":"Every time; always, without change.","ipa":"/ɪnˈvɛɹ.i.ə.bli/","sentence":"The spade was not invariably called a bloody shovel.","word_in_sentence":"invariably","ko":"삽을 언제나 빌어먹을 삽이라고 부르지는 않았다.","chapter":3},{"lemma":"excursion","difficulty":"C1","gloss":"A brief recreational trip; a journey out of the usual way.","ipa":"/ɛkˈskɜː.ʃən/","sentence":"I lived near Victoria Station, and I recall long excursions by bus to the hospitable houses of the literary.","word_in_sentence":"excursions","ko":"나는 빅토리아 역 근처에 살았는데, 문인들의 호의적인 집들을 버스로 찾아가던 긴 여행들이 기억난다.","chapter":3},{"lemma":"hospitable","difficulty":"C1","gloss":"cordial and generous towards guests","ipa":"/hɒsˈpɪtəbl̩/","sentence":"I lived near Victoria Station, and I recall long excursions by bus to the hospitable houses of the literary.","word_in_sentence":"hospitable","ko":"나는 빅토리아 역 근처에 살았는데, 문인들의 호의적인 집들을 버스로 찾아가던 긴 여행들이 기억난다.","chapter":3},{"lemma":"timidity","difficulty":"C2","gloss":"The state of being timid; shyness.","ipa":"/tɪˈmɪdɪti/","sentence":"In my timidity I wandered up and down the street while I screwed up my courage to ring the bell; and then, sick with apprehension, was ushered into an airless room full of people.","word_in_sentence":"timidity","ko":"소심한 나는 벨을 누를 용기를 내면서 거리를 이리저리 헤맸고, 그러다가 불안에 떨며 사람들로 가득한 답답한 방으로 안내되었다.","chapter":3},{"lemma":"apprehension","difficulty":"C1","gloss":"The physical act of seizing or taking hold of (something); seizing.","ipa":"/æp.ɹiˈhɛn.ʃən/","sentence":"In my timidity I wandered up and down the street while I screwed up my courage to ring the bell; and then, sick with apprehension, was ushered into an airless room full of people.","word_in_sentence":"apprehension","ko":"소심한 나는 벨을 누를 용기를 내면서 거리를 이리저리 헤맸고, 그러다가 불안에 떨며 사람들로 가득한 답답한 방으로 안내되었다.","chapter":3},{"lemma":"airless","difficulty":"C2","gloss":"Lacking or being without air.","ipa":"/ˈɛə.ləs/","sentence":"They were dark and airless.","word_in_sentence":"airless","ko":"계단은 어둡고 공기가 탁했다.","chapter":11},{"lemma":"excessively","difficulty":"C1","gloss":"To an excessive degree.","ipa":"/ɪkˈsɛsɪvli/","sentence":"To myself my entrance seemed excessively awkward.","word_in_sentence":"excessively","ko":"내가 보기에 내 등장은 지나치게 어색해 보였다.","chapter":8},{"lemma":"unbend","difficulty":"C2","gloss":"To remove a bend so as to make, or allow to become, straight.","ipa":"/ʌnˈbɛnd/","sentence":"I have a recollection of large, unbending women with great noses and rapacious eyes, who wore their clothes as though they were armour; and of little, mouse-like spinsters, with soft voices and a shrewd glance.","word_in_sentence":"unbending","ko":"커다란 코와 탐욕스러운 눈을 가진 키 크고 완고한 여자들이 기억난다. 그들은 옷을 마치 갑옷처럼 입고 다녔다. 그리고 부드러운 목소리와 예리한 눈빛을 가진 쥐 같은 작은 노처녀들도 있었다.","chapter":3},{"lemma":"rapacious","difficulty":"C2","gloss":"Voracious; avaricious.","ipa":"/ɹəˈpeɪ.ʃəs/","sentence":"I have a recollection of large, unbending women with great noses and rapacious eyes, who wore their clothes as though they were armour; and of little, mouse-like spinsters, with soft voices and a shrewd glance.","word_in_sentence":"rapacious","ko":"커다란 코와 탐욕스러운 눈을 가진 키 크고 완고한 여자들이 기억난다. 그들은 옷을 마치 갑옷처럼 입고 다녔다. 그리고 부드러운 목소리와 예리한 눈빛을 가진 쥐 같은 작은 노처녀들도 있었다.","chapter":3},{"lemma":"clothe","difficulty":"C1","gloss":"To adorn or cover with clothing; to dress; to supply clothes or clothing.","ipa":"/ˈkləʊð/","sentence":"He tried to arrange the bed-clothes.","word_in_sentence":"clothes","ko":"그는 침구를 정리하려고 애썼다.","chapter":24},{"lemma":"spinster","difficulty":"C1","gloss":"A woman who has never been married, especially one past the typical marrying age according to social traditions.","ipa":"/ˈspɪnstə/","sentence":"I have a recollection of large, unbending women with great noses and rapacious eyes, who wore their clothes as though they were armour; and of little, mouse-like spinsters, with soft voices and a shrewd glance.","word_in_sentence":"spinsters","ko":"커다란 코와 탐욕스러운 눈을 가진 키 크고 완고한 여자들이 기억난다. 그들은 옷을 마치 갑옷처럼 입고 다녔다. 그리고 부드러운 목소리와 예리한 눈빛을 가진 쥐 같은 작은 노처녀들도 있었다.","chapter":3},{"lemma":"shrewd","difficulty":"C1","gloss":"Showing clever resourcefulness in practical matters.","ipa":"/ʃɹuːd/","sentence":"I don’t think that Alec could have something on his mind for a year or more without my having a pretty shrewd idea of it.”","word_in_sentence":"shrewd","ko":"알렉이 일 년 넘게 무슨 생각을 품고 있는데 내가 그걸 눈치채지 못할 리는 없거든요.\"","chapter":15},{"lemma":"fascinate","difficulty":"C1","gloss":"To evoke an intense interest or attraction in someone.","ipa":"/ˈfæsɪneɪt/","sentence":"You feel I know not what primitive force which repels and yet fascinates you.","word_in_sentence":"fascinates","ko":"당신은 밀어내면서도 동시에 매혹시키는, 형언할 수 없는 원 re of; to startle.","ipa":"/ˌdɪskənˈsɜːt/","sentence":"It was disconcerting and rather horrible.","word_in_sentence":"disconcerting","ko":"그것은 당황스럽고 다소 끔찍했다.","chapter":41},{"lemma":"ascertain","difficulty":"C1","gloss":"To find out definitely; to discover or establish.","ipa":"/ˌæsəˈteɪn/","sentence":"I was conscious of my ignorance, and if Mrs. Strickland was a well-known writer I thought it as well to ascertain the fact before I spoke to her.","word_in_sentence":"ascertain","ko":"나는 내가 무지하다는 것을 의식했고, 만약 스트릭랜드 부인이 유명한 작가라면 그녀와 이야기하기 전에 그 사실을 확인해 두는 것이 좋겠다고 생각했다.","chapter":4},{"lemma":"demurely","difficulty":"C2","gloss":"In a demure manner.","ipa":null,"sentence":"Rose Waterford cast down her eyes demurely to give greater effect to her reply.","word_in_sentence":"demurely","ko":"로즈 워터포드는 자신의 대답에 더 큰 효과를 주기 위해 점잖게 눈을 내리깔았다.","chapter":4},{"lemma":"luncheon","difficulty":"C1","gloss":"A formal meal served in the middle of the day.","ipa":"/ˈlʌntʃ.ən/","sentence":"“She gives luncheon-parties.","word_in_sentence":"luncheon","ko":"\"그분은 오찬 파티를 여세요.","chapter":4},{"lemma":"cynic","difficulty":"C1","gloss":"A person whose outlook is scornfully negative.","ipa":"/ˈsɪnɪk/","sentence":"Rose Waterford was a cynic.","word_in_sentence":"cynic","ko":"로즈 워터포드는 냉소주의자였다.","chapter":4},{"lemma":"lavishness","difficulty":"C2","gloss":"The state or characteristic of being lavish.","ipa":"/ˈlæv.ɪʃ.nɪs/","sentence":"Now and then she invited members of it to her house if they showed an appreciation of her talent and entertained with proper lavishness.","word_in_sentence":"lavishness","ko":"때때로 그녀는 자신의 재능을 인정하고 적절히 호화롭게 접대해 주는 사람들을 집으로 초대했다.","chapter":4},{"lemma":"decorum","difficulty":"C1","gloss":"Appropriate social behavior.","ipa":"/dɪˈkɔːɹəm/","sentence":"Her husband played his part with decorum.","word_in_sentence":"decorum","ko":"그녀의 남편은 품위 있게 자신의 역할을 해냈다.","chapter":6},{"lemma":"aestheticism","difficulty":"C2","gloss":"A doctrine which holds aesthetics or beauty as the highest
