 열정도 사랑 못지않게 폭군적이었습니다.\"","chapter":54},{"lemma":"tyrannical","difficulty":"C1","gloss":"Of, or relating to tyranny or a tyrant.","ipa":"/tɪˈɹænɪkəl/","sentence":"The passion that held Strickland in bondage was no less tyrannical than love.”","word_in_sentence":"tyrannical","ko":"스트릭랜드를 사로잡은 열정도 사랑 못지않게 폭군적이었습니다.\"","chapter":54},{"lemma":"eternally","difficulty":"C1","gloss":"For eternity; forever.","ipa":"/ɪˈtɝ.nə.li/","sentence":"He was eternally a pilgrim, haunted by a divine nostalgia, and the demon within him was ruthless.","word_in_sentence":"eternally","ko":"그는 영원한 순례자였고, 신성한 향수에 사로잡혀 있었으며, 그의 내면에 있는 악마는 무자비했다.","chapter":54},{"lemma":"shatter","difficulty":"C1","gloss":"To violently break something into pieces.","ipa":"/ˈʃæt.ə(ɹ)/","sentence":"There are men whose desire for truth is so great that to attain it they will shatter the very foundation of their world.","word_in_sentence":"shatter","ko":"진리에 대한 욕망이 너무나 커서 그것을 얻기 위해 자신의 세계의 토대까지 산산조각 낼 수 있는 사람들이 있다.","chapter":54},{"lemma":"animate","difficulty":"C1","gloss":"That lives.","ipa":"/ˈæn.ə.mət/","sentence":"I realised in myself the same desire as animated him.","word_in_sentence":"animated","ko":"나는 그를 움직인 것과 같은 욕망이 내 안에도 있음을 깨달았다.","chapter":54},{"lemma":"penury","difficulty":"C2","gloss":"Extreme want; poverty; destitution.","ipa":"/ˈpɛnjʊɹi/","sentence":"He left it on his marriage, and settled down on a small property he had near Quimper to live for the rest of his days in peace; but the failure of an attorney left him suddenly penniless, and neither he nor his wife was willing to live in penury where they had enjoyed consideration.","word_in_sentence":"penury","ko":"결혼과 함께 해군을 떠나 캥페르 근처에 있는 작은 영지에 정착하여 평생을 평화롭게 살려 했지만, 변호사의 파산으로 갑자기 무일푼이 되었고, 그와 아내 모두 한때 존경받던 곳에서 궁핍하게 사는 것을 원치 않았다.","chapter":54},{"lemma":"uninhabited","difficulty":"C1","gloss":"Not inhabited; having no inhabitants.","ipa":"/ˌʌn.ɪnˈhæb.ɪ.tɪd/","sentence":"It was a ring of land round a deep lagoon, uninhabited, and covered only with scrub and wild guava.","word_in_sentence":"uninhabited","ko":"그곳은 깊은 석호를 둘러싼 고리 모양의 땅으로, 사람이 살지 않았고 관목과 야생 구아바만이 덮고 있었다.","chapter":54},{"lemma":"guava","difficulty":"C1","gloss":"A tropical tree or shrub of the myrtle family, Psidium guajava.","ipa":"/ˈɡwɑːvə/","sentence":"It was a ring of land round a deep lagoon, uninhabited, and covered only with scrub and wild guava.","word_in_sentence":"guava","ko":"그곳은 깊은 석호를 둘러싼 고리 모양의 땅으로, 사람이 살지 않았고 관목과 야생 구아바만이 덮고 있었다.","chapter":54},{"lemma":"intrepid","difficulty":"C1","gloss":"Fearless; bold; brave.","ipa":"/ɪnˈtɹɛpɪd/","sentence":"With the intrepid woman who was his wife, and a few natives, he landed there, and set about building a house, and clearing the scrub so that he could plant cocoa-nuts.","word_in_sentence":"intrepid","ko":"용감무쌍한 아내와 몇 명의 원주민들과 함께 그곳에 상륙하여 집을 짓고 관목을 베어내어 코코넛을 심을 수 있도록 땅을 개간하기 시작했다.","chapter":54},{"lemma":"barren","difficulty":"C1","gloss":"Not bearing children, childless; hence also unable to bear children, sterile.","ipa":"/ˈbæɹən/","sentence":"That was twenty years before, and now what had been a barren island was a garden.","word_in_sentence":"barren","ko":"그것은 20년 전의 일이었고, 이제 불모의 섬이었던 곳이 정원이 되어 있었다.","chapter":54},{"lemma":"strenuously","difficulty":"C1","gloss":"In a strenuous manner.","ipa":null,"sentence":"“It was hard and anxious work at first, and we worked strenuously, both of us.","word_in_sentence":"strenuously","ko":"\"처음에는 힘들고 불안한 일이었고, 우리 둘 다 열심히 일했습니다.","chapter":54},{"lemma":"mathematic","difficulty":"C2","gloss":"mathematical","ipa":null,"sentence":"We had a piano sent out from France, and she has taught them to play and to speak English, and I have taught them Latin and mathematics, and we read history together.","word_in_sentence":"mathematics","ko":"프랑스에서 피아노를 가져다 놓았고, 아내는 아이들에게 피아노 치는 법과 영어를 가르쳤으며, 나는 라틴어와 수학을 가르쳤고, 함께 역사를 읽었습니다.","chapter":54},{"lemma":"prosper","difficulty":"C1","gloss":"To be successful; to succeed; to be fortunate or prosperous; to thrive; to make gain.","ipa":"/ˈpɹɒspə(ɹ)/","sentence":"Our trees have prospered, and there is shell on my reef.","word_in_sentence":"prospered","ko":"우리 나무들은 잘 자랐고, 내 암초에는 조개껍데기가 있다.","chapter":54},{"lemma":"untouched","difficulty":"C1","gloss":"Remaining in its original, pristine state, undamaged; not altered.","ipa":"/ʌnˈtʌt͡ʃt/","sentence":"We are untouched by ambition, and what pride we have is due only to our contemplation of the work of our hands.","word_in_sentence":"untouched","ko":"우리는 야심에 물들지 않았고, 우리가 가진 자부심이라고는 오직 우리 손으로 만든 작품을 바라보며 느끼는 것뿐입니다.","chapter":54},{"lemma":"blessedness","difficulty":"C2","gloss":"The condition or state of being blessed; holy.","ipa":"/ˈblɛsɪdnɪs/","sentence":"Ah, mon cher monsieur, they talk of the blessedness of labour, and it is a meaningless phrase, but to me it has the most intense significance.","word_in_sentence":"blessedness","ko":"아, 친애하는 선생님, 사람들은 노동의 축복에 대해 이야기하지만 그것은 무의미한 말일 뿐입니다. 하지만 저에게는 가장 강렬한 의미를 지니고 있습니다.","chapter":54},{"lemma":"stature","difficulty":"C1","gloss":"A person or animal's natural height when standing upright.","ipa":"/ˈstæt͡ʃ.ə/","sentence":"Mr. Coutras was an old Frenchman of great stature and exceeding bulk.","word_in_sentence":"stature","ko":"쿠트라 씨는 키가 크고 몸집이 매우 큰 나이 든 프랑스인이었다.","chapter":55},{"lemma":"complexion","difficulty":"C1","gloss":"The quality, colour, or appearance of the skin on the face.","ipa":"/kəmˈplɛkʃən/","sentence":"His complexion was florid and his hair white.","word_in_sentence":"complexion","ko":"안색은 붉으락했고 머리는 하얗게 세어 있었다.","chapter":55},{"lemma":"florid","difficulty":"C2","gloss":"Having a rosy or pale red colour; ruddy.","ipa":"/ˈflɒɹɪd/","sentence":"His complexion was florid and his hair white.","word_in_sentence":"florid","ko":"안색은 붉으락했고 머리는 하얗게 세어 있었다.","chapter":55},{"lemma":"curio","difficulty":"C2","gloss":"A strange and interesting object; something that evokes curiosity.","ipa":"/ˈkjʊə̯ɹiˌəʊ̯/","sentence":"He received us in a room that might have been in a house in a provincial town in France, and the one or two Polynesian curios had an odd look.","word_in_sentence":"curios","ko":"그는 프랑스의 어느 지방 도시 집에 있을 법한 방에서 우리를 맞이했는데, 한두 점의 폴리네시아 골동품이 묘하게 어울리지 않아 보였다.","chapter":55},{"lemma":"shrewdness","difficulty":"C2","gloss":"The quality of being shrewd.","ipa":null,"sentence":"He took my hand in both of his—they were huge—and gave me a hearty look, in which, however, was great shrewdness.","word_in_sentence":"shrewdness","ko":"그는 거대한 두 손으로 내 손을 감싸 쥐고는 진심 어린 눈빛으로 나를 바라보았는데, 그 시선에는 예리한 통찰력이 깃들어 있었다.","chapter":55},{"lemma":"enfant","difficulty":"C1","gloss":{"en":"A child","ko":"어린이","zh":"小孩"},"ipa":"","sentence":"When he shook hands with Capitaine Brunot he enquired politely after Madame et les enfants.","word_in_sentence":"enfants","ko":"브뤼노 선장과 악수할 때는 정중하게 마담과 아이들 안부를 물었다.","chapter":55},{"lemma":"resonant","difficulty":"C1","gloss":"Resounding, echoing.","ipa":"/ˈɹɛzənənt/","sentence":"He had a deep, resonant voice, fitted to his massive frame, and a keen sense of the dramatic.","word_in_sentence":"resonant","ko":"그는 거대한 체구에 어울리는 깊고 울림 있는 목소리와 예리한 극적 감각을 지니고 있었다.","chapter":55},{"lemma":"chiefess","difficulty":"C2","gloss":"Synonym of chieftainess, a female chief.","ipa":"/tʃiːˈfɛs/","sentence":"I was down at Taravao to see the chiefess, and Ata sent for me to see you.”","word_in_sentence":"chiefess","ko":"타라바오에 족장 부인을 보러 갔다가, 아타가 당신을 진찰해 달라고 저를 불렀습니다.\"","chapter":55},{"lemma":"retainer","difficulty":"C1","gloss":"Any thing or person that retains.","ipa":"/ɹɪˈteɪn.ə/","sentence":"It appears that Dr. Coutras had gone one day to Taravao in order to see an old chiefess who was ill, and he gave a vivid picture of the obese old lady, lying in a huge bed, smoking cigarettes, and surrounded by a crowd of dark-skinned retainers.","word_in_sentence":"retainers","ko":"쿠트라 박사가 어느 날 병든 늙은 족장 할머니를 보러 타라바오에 갔던 모양인데, 그는 거대한 침대에 누워 담배를 피우며 검은 피부의 하인들에게 둘러싸여 있던 그 비만한 노부인의 모습을 생생하게 묘사해 주었다.","chapter":55},{"lemma":"indigène","difficulty":"C2","gloss":{"en":"A native or indigenous person of a particular region.","ko":"원주민","zh":"土著人"},"ipa":"","sentence":"When he had seen her he was taken into another room and given dinner—raw fish, fried bananas, and chicken—que sais-je, the typical dinner of the indigène—and while he was eating it he saw a young girl being driven away from the door in tears.","word_in_sentence":"indigène","ko":"할머니를 진찰한 후 그는 다른 방으로 안내되어 저녁을 대접받았는데—생선회, 튀긴 바나나, 닭고기—뭐 그런 것들로, 전형적인 원주민 식사였다—그가 식사를 하고 있는데 어떤 젊은 소녀가 문 앞에서 울면서 쫓겨나는 것을 보았다.","chapter":55},{"lemma":"crumpled","difficulty":"C1","gloss":"simple past and past participle of crumple","ipa":null,"sentence":"She thrust into his hand a crumpled piece of newspaper, and when he opened it he found in it a hundred-franc note.","word_in_sentence":"crumpled","ko":"그녀는 그의 손에 구겨진 신문지 조각을 밀어 넣었고, 그것을 펼쳐보니 안에 백 프랑 지폐가 들어 있었다.","chapter":55},{"lemma":"bystander","difficulty":"C1","gloss":"A person who, although present at some event, does not take part in it; an observer, witness, or spectator.","ipa":"/ˈbaɪˌstænd.ə(ɹ)/","sentence":"“Who is the Red One?” he asked of one of the bystanders.","word_in_sentence":"bystanders","ko":"\"빨간 머리가 누구냐?\" 그가 구경꾼 중 한 명에게 물었다.","chapter":55},{"lemma":"relish","difficulty":"C1","gloss":"A pleasant taste.","ipa":"/ˈɹɛl.ɪʃ/","sentence":"I did not relish fourteen kilometres over a bad pathway, and there was no chance that I could get back to Papeete that night.","word_in_sentence":"relish","ko":"험한 길을 14킬로미터나 걸어가는 것도 내키지 않았고, 그날 밤 파페에테로 돌아올 가능성도 전혀 없었거든요.","chapter":55},{"lemma":"perspire","difficulty":"C2","gloss":"To emit (sweat or perspiration) through the skin's pores.","ipa":"/pəˈspaɪə(ɹ)/","sentence":"His temper was certainly no better when he arrived, perspiring freely and thirsty.","word_in_sentence":"perspiring","ko":"땀을 뻘뻘 흘리며 목이 마른 채로 도착했을 때 그의 기분은 확실히 나아지지 않았다.","chapter":55},{"lemma":"vexation","difficulty":"C2","gloss":"The action of physically annoying or irritating a person or an animal; (countable) an instance of this; also, a physical discomfort or disorder.","ipa":"/vɛkˈseɪʃn̩/","sentence":"He gave the doctor a look of vexation.","word_in_sentence":"vexation","ko":"그는 의사를 짜증스럽게 바라보았다.","chapter":55},{"lemma":"intrusion","difficulty":"C1","gloss":"The forcible inclusion or entry of an external group or individual; the act of intruding.","ipa":"/ɪnˈtɹuːʒən/","sentence":"He was surprised to see him, and resented the intrusion.","word_in_sentence":"intrusion","ko":"의사를 보고 놀랐고, 침입을 못마땅해했다.","chapter":55},{"lemma":"ache","difficulty":"C1","gloss":"To suffer pain; to be the source of, or be in, pain, especially continued dull pain; to be distressed.","ipa":"/ˈeɪk/","sentence":"“You can treat them like dogs, you can beat them till your arm aches, and still they love you.”","word_in_sentence":"aches","ko":"\"개처럼 대해도 되고, 팔이 아플 때까지 때려도 여전히 사랑한다니까.\"","chapter":55},{"lemma":"papeete","difficulty":"C2","gloss":"The capital city of French Polynesia.","ipa":null,"sentence":"Next time anyone went to Papeete","word_in_sentence":"Papeete","ko":"다음에 누군가 파페에테에 갈 때","chapter":55},{"lemma":"quinine","difficulty":"C1","gloss":"An alkaloid with the chemical formula C₂₀H₂₄N₂O₂, originally derived from cinchona bark (from plants of the genus Cinchona), used to treat malaria and as an ingredient of tonic water, which presents as a bitter colourless powder; also, a drug containing quinine or a chemical compound derived from it.","ipa":"/kwɪˈniːn/","sentence":"I was going to send for some quinine.”","word_in_sentence":"quinine","ko":"키니네를 좀 구해 달라고 부탁하려던 참이었어.\"","chapter":55},{"lemma":"thickening","difficulty":"C1","gloss":"The process of making something, or becoming, thick or viscous.","ipa":"/ˈθɪkənɪŋ/","sentence":"Do you not see the thickening of your features and a look—how shall I describe it?—the books call it lion-faced.","word_in_sentence":"thickening","ko":"얼굴 윤곽이 두꺼워지고 어떤 표정이—어떻게 표현해야 할까요—의학서에서는 사자상이라고 부르는 모습이 보이지 않습니까.","chapter":55},{"lemma":"leper","difficulty":"C1","gloss":"A person who has leprosy, a person suffering from Hansen's disease.","ipa":"/ˈlɛpɚ/","sentence":"“When you look at yourself in the glass you see the typical appearance of the leper.”","word_in_sentence":"leper","ko":"\"거울을 들여다보면 전형적인 나병 환자의 모습이 보일 겁니다.\"","chapter":55},{"lemma":"leprosy","difficulty":"C1","gloss":"An infectious disease caused by the bacterium Mycobacterium leprae, gradually producing nerve damage and patches of skin necrosis and historically handled by permanently quarantining its sufferers.","ipa":"/ˈlɛpɹəsi/","sentence":"“Do you intend to tell me that I have leprosy?”","word_in_sentence":"leprosy","ko":"\"내가 나병에 걸렸다고 말씀하시는 겁니까?\"","chapter":55},{"lemma":"inestimable","difficulty":"C2","gloss":"Not able to be estimated; not able to be calculated, computed or comprehended, as because of great scale, degree or magnitude.","ipa":"/ɪˈnɛːs.tɪ.mə.bəl/","sentence":"He felt always the furious hatred that must seize a man condemned when he compared himself with the doctor, sane and healthy, who had the inestimable privilege of life.","word_in_sentence":"inestimable","ko":"그는 항상 사형선고를 받은 자가 느낄 수밖에 없는 맹렬한 증오를 느꼈다. 정신이 온전하고 건강하며 삶이라는 헤아릴 수 없는 특권을 누리는 의사와 자신을 비교할 때마다 말이다.","chapter":55},{"lemma":"disfigure","difficulty":"C2","gloss":"to irreversibly damage the shape or structure of something, negatively affecting its appearance or functionality without completely destroying it.","ipa":"/dɪsˈfɪɡə/","sentence":"Nothing of emotion could be seen on his face, disfigured already by the loathsome disease.","word_in_sentence":"disfigured","ko":"이미 혐오스러운 병으로 일그러진 그의 얼굴에서는 어떤 감정도 읽을 수 없었다.","chapter":55},{"lemma":"unaccountable","difficulty":"C1","gloss":"Inexplicable; unable to be accounted for or explained.","ipa":"/ˌʌnəˈkaʊntəbl̩/","sentence":"he asked at last, pointing to the persons on the verandah, now sitting in unusual, unaccountable silence.","word_in_sentence":"unaccountable","ko":"마침내 그가 물었다. 지금 이상할 정도로 설명할 수 없는 침묵 속에 앉아 있는 베란다의 사람들을 가리키며.","chapter":55},{"lemma":"tiding","difficulty":"C2","gloss":"news; new information","ipa":"/ˈtaɪdɪŋ/","sentence":"It is fitting that the bearer of important tidings should be rewarded.","word_in_sentence":"tidings","ko":"중요한 소식을 전하는 자는 보상을 받는 것이 마땅하오.","chapter":55},{"lemma":"sequestration","difficulty":"C1","gloss":"The process or act of sequestering; a putting aside or separating.","ipa":null,"sentence":"At that time there was no rigid sequestration on the islands, and lepers, if they chose, were allowed to go free.","word_in_sentence":"sequestration","ko":"그 당시 섬에는 엄격한 격리 조치가 없었고, 나병 환자들은 원한다면 자유롭게 돌아다닐 수 있었다.","chapter":55},{"lemma":"leav","difficulty":"C2","gloss":{"en":"Having or showing a tendency to leave or depart.","ko":"떠나는","zh":"离去的"},"ipa":"","sentence":"If thou leavest me I shall hang myself on the tree that is behind the house.","word_in_sentence":"leavest","ko":"당신이 나를 떠난다면 나는 집 뒤에 있는 나무에 목을 매어 죽겠어요.","chapter":55},{"lemma":"forcible","difficulty":"C1","gloss":"Done by force, forced.","ipa":null,"sentence":"There was something immensely forcible in the way she spoke.","word_in_sentence":"forcible","ko":"그녀가 말하는 방식에는 엄청나게 강력한 무언가가 있었다.","chapter":55},{"lemma":"shouldst","difficulty":"C2","gloss":"second-person singular simple past indicative of shall","ipa":"/ʃʊdst/","sentence":"“Why shouldst thou stay with me?","word_in_sentence":"shouldst","ko":"\"왜 나와 함께 있으려 하느냐?","chapter":55},{"lemma":"canst","difficulty":"C2","gloss":"second-person singular simple present indicative of can","ipa":"/kænst/","sentence":"Thou canst go back to Papeete, and thou wilt soon find another white man.","word_in_sentence":"canst","ko":"너는 파페에테로 돌아가서 곧 다른 백인 남자를 찾을 수 있을 것이다.","chapter":55},{"lemma":"wilt","difficulty":"C1","gloss":"To droop or become limp and flaccid (as a dying leaf or flower).","ipa":"/wɪlt/","sentence":"“Thou wilt not go?”","word_in_sentence":"wilt","ko":"\"가지 않을 거야?\"","chapter":55},{"lemma":"goest","difficulty":"C2","gloss":"second-person singular simple present indicative of go","ipa":null,"sentence":"Whither thou goest I will go, too.”","word_in_sentence":"goest","ko":"당신이 가는 곳이면 어디든 나도 따라가겠습니다.\"","chapter":55},{"lemma":"fortitude","difficulty":"C1","gloss":"Mental or emotional strength that enables courage in the face of adversity.","ipa":"/ˈfɔːtɪtjuːd/","sentence":"For a moment Strickland’s fortitude was shaken, and a tear filled each of his eyes and trickled slowly down his cheeks.","word_in_sentence":"fortitude","ko":"순간 스트릭랜드의 의연함이 흔들렸고, 그의 두 눈에 눈물이 고여 뺨을 따라 천천히 흘러내렸다.","chapter":55},{"lemma":"stoical","difficulty":"C2","gloss":"Enduring pain and hardship without showing feeling or complaint.","ipa":"/ˈstoʊ.ɪk.əl/","sentence":"“I did not like him, I have told you he was not sympathetic to me, but as I walked slowly down to Taravao I could not prevent an unwilling admiration for the stoical courage which enabled him to bear perhaps the most dreadful of human afflictions.","word_in_sentence":"stoical","ko":"나는 그를 좋아하지 않았고, 그가 내게 호감을 주는 인물이 아니었다고 이미 말했지만, 타라바오로 천천히 걸어 내려가면서 나는 인간이 겪을 수 있는 가장 끔찍한 고통을 견뎌낼 수 있게 해주는 그의 금욕적인 용기에 대해 마지못해 감탄하지 않을 수 없었다.","chapter":55},{"lemma":"grandchild","difficulty":"C1","gloss":"A child of someone's child.","ipa":null,"sentence":"First Tané, the boy, had left the house, and then, a little time afterwards, the old woman and her grandchild.","word_in_sentence":"grandchild","ko":"먼저 소년 타네가 집을 떠났고, 그 후 얼마 지나지 않아 노파와 그녀의 손자도 떠났다.","chapter":55},{"lemma":"sufferer","difficulty":"C1","gloss":"One who suffers; one who is afflicted.","ipa":null,"sentence":"No one went near the plantation, for, as you know, the natives have a very lively horror of the disease, and in the old days when it was discovered the sufferer was killed; but sometimes, when the village boys were scrambling about the hills, they would catch sight of the white man, with his great red beard, wandering about.","word_in_sentence":"sufferer","ko":"아무도 농장 근처에 가지 않았는데, 아시다시피 원주민들은 그 병에 대해 매우 생생한 공포를 갖고 있어서 옛날에는 환자가 발견되면 죽여버렸기 때문이었다. 하지만 가끔 마을 소년들이 언덕을 뛰어다니다가 커다란 붉은 수염을 기른 그 백인이 돌아다니는 모습을 목격하곤 했다.","chapter":55},{"lemma":"horrified","difficulty":"C1","gloss":"Struck with horror.","ipa":null,"sentence":"She knew that the natives looked upon her with the same horrified aversion as they looked upon Strickland, and she kept out of their way.","word_in_sentence":"horrified","ko":"그녀는 원주민들이 자신을 스트릭랜드를 보는 것과 같은 끔찍한 혐오감으로 바라본다는 것을 알고 있었고, 그들의 눈에 띄지 않으려 했다.","chapter":55},{"lemma":"aversion","difficulty":"C1","gloss":"Opposition or repugnance of mind; fixed dislike often without any conscious reasoning.","ipa":"/əˈvɜʒən/","sentence":"She knew that the natives looked upon her with the same horrified aversion as they looked upon Strickland, and she kept out of their way.","word_in_sentence":"aversion","ko":"그녀는 원주민들이 자신을 스트릭랜드를 보는 것과 같은 끔찍한 혐오감으로 바라본다는 것을 알고 있었고, 그들의 눈에 띄지 않으려 했다.","chapter":55},{"lemma":"cher","difficulty":"C1","gloss":"Alternative spelling of 'cher.","ipa":null,"sentence":"“Mais non, mon cher monsieur, men are always the same.","word_in_sentence":"cher","ko":"\"아니에요, 친애하는 선생님, 사람들은 언제나 똑같습니다.","chapter":55},{"lemma":"desolation","difficulty":"C1","gloss":"The act of desolating or laying waste; destruction of inhabitants; depopulation.","ipa":"/ˌdɛsəˈleɪʃən/","sentence":"Everywhere was desolation.","word_in_sentence":"desolation","ko":"사방이 황폐했다.","chapter":55},{"lemma":"primeval","difficulty":"C1","gloss":"Belonging to the first ages.","ipa":"/ˌpɹaɪˈmi.vəl/","sentence":"There was something primeval there and terrible.","word_in_sentence":"primeval","ko":"거기에는 원시적이고 끔찍한 무언가가 있었다.","chapter":56},{"lemma":"abode","difficulty":"C1","gloss":"Act of waiting; delay.","ipa":"/əˈboʊd/","sentence":"He had the sensation that here was the abode of pain.","word_in_sentence":"abode","ko":"그는 이곳이 고통의 거처라는 느낌을 받았다.","chapter":55},{"lemma":"unearthly","difficulty":"C2","gloss":"Not of the earth; non-terrestrial.","ipa":"/ʌnˈɝθ.li/","sentence":"As he approached the house he was struck by the unearthly silence, and at first he thought it was deserted.","word_in_sentence":"unearthly","ko":"집에 가까워지자 그는 이 세상 것이 아닌 듯한 적막에 놀랐고, 처음에는 집이 비어 있다고 생각했다.","chapter":55},{"lemma":"ascend","difficulty":"C1","gloss":"To move upward, to fly, to soar.","ipa":"/əˈsɛnd/","sentence":"She went to the house, ascended the few steps that led to the verandah, and entered.","word_in_sentence":"ascended","ko":"그녀는 집으로 가서 베란다로 이어지는 몇 개의 계단을 올라 안으로 들어갔다.","chapter":55},{"lemma":"sickly","difficulty":"C1","gloss":"Frequently ill or in poor health; weakly.","ipa":"/ˈsɪkli/","sentence":"As she opened the door he smelt the sickly sweet smell which makes the neighbourhood of the leper nauseous.","word_in_sentence":"sickly","ko":"그녀가 문을 열자 나병환자 근처에서 나는 역겨운 달콤하고 비릿한 냄새가 그의 코를 찔렀다.","chapter":55},{"lemma":"nauseous","difficulty":"C1","gloss":"Causing nausea; sickening or disgusting.","ipa":"/ˈnɔʃəs/","sentence":"As she opened the door he smelt the sickly sweet smell which makes the neighbourhood of the leper nauseous.","word_in_sentence":"nauseous","ko":"그녀가 문을 열자 나병환자 근처에서 나는 역겨운 달콤하고 비릿한 냄새가 그의 코를 찔렀다.","chapter":55},{"lemma":"hoarse","difficulty":"C1","gloss":"Having a dry, harsh tone to the voice, as a result of a sore throat, age, emotion, etc.","ipa":"/hɔːs/","sentence":"It had become hoarse and indistinct.","word_in_sentence":"hoarse","ko":"목소리가 쉬고 불분명해져 있었다.","chapter":55},{"lemma":"indistinct","difficulty":"C1","gloss":"not clearly defined or not having a sharp outline; faint or dim","ipa":"/ˌɪndɪsˈtɪŋkt/","sentence":"It had become hoarse and indistinct.","word_in_sentence":"indistinct","ko":"목소리가 쉬고 불분명해져 있었다.","chapter":55},{"lemma":"superhuman","difficulty":"C1","gloss":"Beyond what is possible for a human being.","ipa":null,"sentence":"Then at last she smiled, and there was in her eyes a look of superhuman love.","word_in_sentence":"superhuman","ko":"그제야 마침내 그녀가 미소를 지었는데, 그 눈에는 초인간적인 사랑의 빛이 담겨 있었다.","chapter":55},{"lemma":"awed","difficulty":"C1","gloss":"simple past and past participle of awe","ipa":"/ɔːd/","sentence":"And he was awed.","word_in_sentence":"awed","ko":"그리고 경외감을 느꼈다.","chapter":55},{"lemma":"imperceptibly","difficulty":"C2","gloss":"Not noticeably; such that it cannot be detected, through being too small or too fast, etc.","ipa":null,"sentence":"Then two years more went by, or perhaps three, for time passes imperceptibly in Tahiti, and it is hard to keep count of it; but at last a message was brought to Dr. Coutras that Strickland was dying.","word_in_sentence":"imperceptibly","ko":"그렇게 2년이 더 지났고, 어쩌면 3년이었을지도 모른다. 타히티에서는 시간이 눈에 띄지 않게 흘러가서 정확히 세기가 어렵기 때문이다. 하지만 마침내 스트릭랜드가 죽어가고 있다는 전갈이 쿠트라 박사에게 전해졌다.","chapter":56},{"lemma":"besought","difficulty":"C2","gloss":"simple past and past participle of beseech","ipa":"/bɪˈsɔːt/","sentence":"Ata had waylaid the cart that took the mail into Papeete, and besought the man who drove it to go at once to the doctor.","word_in_sentence":"besought","ko":"아타가 파페에테로 우편을 가져가는 마차를 가로막고, 마차를 모는 사람에게 즉시 의사에게 가달라고 간청했던 것이다.","chapter":56},{"lemma":"overgrown","difficulty":"C1","gloss":"Having large numbers of plants which have become too big, and are hence spoiling the picturesqueness of a garden.","ipa":null,"sentence":"The path was overgrown, and it was clear that for years now it had remained all but untrodden.","word_in_sentence":"overgrown","ko":"길은 풀이 우거져 있었고, 수년 동안 거의 사람이 다니지 않았다는 것이 분명했다.","chapter":56},{"lemma":"untrodden","difficulty":"C2","gloss":"That has never been trod upon; unexplored, unspoiled.","ipa":null,"sentence":"The path was overgrown, and it was clear that for years now it had remained all but untrodden.","word_in_sentence":"untrodden","ko":"길은 풀이 우거져 있었고, 수년 동안 거의 사람이 다니지 않았다는 것이 분명했다.","chapter":56},{"lemma":"stumble","difficulty":"C1","gloss":"A fall, trip or substantial misstep.","ipa":"/ˈstʌmbəl/","sentence":"Sometimes he had to stumble along the bed of the stream, and sometimes he had to push through shrubs, dense and thorny; often he was obliged to climb over rocks in order to avoid the hornet-nests that hung on the trees over his head.","word_in_sentence":"stumble","ko":"때로는 개울바닥을 따라 비틀거리며 걸어야 했고, 때로는 빽빽하고 가시가 많은 관목들을 헤치고 나아가야 했다. 머리 위 나무에 매달린 말벌집을 피하기 위해 바위를 기어올라야 하는 경우도 자주 있었다.","chapter":56},{"lemma":"thorny","difficulty":"C1","gloss":"Having thorns or spines.","ipa":"/ˈθɔɹni/","sentence":"Sometimes he had to stumble along the bed of the stream, and sometimes he had to push through shrubs, dense and thorny; often he was obliged to climb over rocks in order to avoid the hornet-nests that hung on the trees over his head.","word_in_sentence":"thorny","ko":"때로는 개울바닥을 따라 비틀거리며 걸어야 했고, 때로는 빽빽하고 가시가 많은 관목들을 헤치고 나아가야 했다. 머리 위 나무에 매달린 말벌집을 피하기 위해 바위를 기어올라야 하는 경우도 자주 있었다.","chapter":56},{"lemma":"hornet","difficulty":"C1","gloss":"A large wasp, of the genus Vespa, having a brown-and-yellow-striped body and the ability to inflict a serious sting.","ipa":"/ˈhɔɹ.nɪt/","sentence":"Sometimes he had to stumble along the bed of the stream, and sometimes he had to push through shrubs, dense and thorny; often he was obliged to climb over rocks in order to avoid the hornet-nests that hung on the trees over his head.","word_in_sentence":"hornet","ko":"때로는 개울바닥을 따라 비틀거리며 걸어야 했고, 때로는 빽빽하고 가시가 많은 관목들을 헤치고 나아가야 했다. 머리 위 나무에 매달린 말벌집을 피하기 위해 바위를 기어올라야 하는 경우도 자주 있었다.","chapter":56},{"lemma":"unkempt","difficulty":"C1","gloss":"Uncombed; dishevelled.","ipa":"/ˌʌnˈkɛmpt/","sentence":"It was with a sigh of relief that at last he came upon the little unpainted house, extraordinarily bedraggled now, and unkempt; but here too was the same intolerable silence.","word_in_sentence":"unkempt","ko":"마침내 그 작은 페인트칠하지 않은 집에 도착했을 때 그는 안도의 한숨을 내쉬었다. 집은 지금 몹시 초라하고 관리되지 않은 모습이었지만, 여기에도 똑같이 견딜 수 없는 정적이 흘렀다.","chapter":56},{"lemma":"unconcernedly","difficulty":"C2","gloss":"In an unconcerned manner.","ipa":null,"sentence":"He walked up, and a little boy, playing unconcernedly in the sunshine, started at his approach and fled quickly away: to him the stranger was the enemy.","word_in_sentence":"unconcernedly","ko":"그가 걸어가자 햇빛 속에서 태평하게 놀고 있던 어린 소년이 그의 접근에 깜짝 놀라며 재빨리 달아났다. 그 아이에게 낯선 사람은 적이었다.","chapter":56},{"lemma":"stench","difficulty":"C1","gloss":"a strong foul smell; a stink.","ipa":"/stɛnt͡ʃ/","sentence":"The stench that assailed him turned him horribly sick.","word_in_sentence":"stench","ko":"그를 덮친 악취가 그를 끔찍하게 메스껍게 만들었다.","chapter":56},{"lemma":"assail","difficulty":"C2","gloss":"To attack with harsh words or violent force (also figuratively).","ipa":"/əˈseɪl/","sentence":"The stench that assailed him turned him horribly sick.","word_in_sentence":"assailed","ko":"그를 덮친 악취가 그를 끔찍하게 메스껍게 만들었다.","chapter":56},{"lemma":"cheroot","difficulty":"C2","gloss":"A cigar with square-cut ends.","ipa":"/ʃəˈɹuːt/","sentence":"Again the beastly stench almost made him faint, and he lit a cheroot.","word_in_sentence":"cheroot","ko":"다시 그 지독한 악취가 그를 기절시킬 뻔했고, 그는 체루트에 불을 붙였다.","chapter":56},{"lemma":"ceile","difficulty":"C2","gloss":{"en":"To celebrate or commemorate","ko":"기념하다","zh":"庆祝"},"ipa":"","sentence":"From floor to ceiling the walls were covered with a strange and elaborate composition.","word_in_sentence":"ceiling","ko":"바닥부터 천장까지 벽면은 기이하고 정교한 구성으로 뒤덮여 있었다.","chapter":56},{"lemma":"indescribably","difficulty":"C2","gloss":"In an indescribable manner.","ipa":null,"sentence":"It was indescribably wonderful and mysterious.","word_in_sentence":"indescribably","ko":"그것은 형언할 수 없이 경이롭고 신비로웠다.","chapter":56},{"lemma":"delve","difficulty":"C1","gloss":"To dig into the ground, especially with a shovel.","ipa":"/dɛlv/","sentence":"It was the work of a man who had delved into the hidden depths of nature and had discovered secrets which were beautiful and fearful too.","word_in_sentence":"delved","ko":"그것은 자연의 숨겨진 깊은 곳까지 파고들어 아름답고 동시에 두려운 비밀들을 발견한 사람의 작품이었다.","chapter":56},{"lemma":"obscene","difficulty":"C1","gloss":"Offensive to standards of decency or morality.","ipa":"/əbˈsiːn/","sentence":"It was beautiful and obscene.","word_in_sentence":"obscene","ko":"그것은 아름답고 동시에 외설적이었다.","chapter":56},{"lemma":"wring","difficulty":"C1","gloss":"Often followed by out: to squeeze or twist (something moist) tightly so that liquid is forced out.","ipa":"/ɹɪŋ/","sentence":"The words were wrung from him, and he did not know he had spoken.","word_in_sentence":"wrung","ko":"그 말은 저절로 튀어나온 것이었고, 그는 자신이 말했다는 것조차 깨닫지 못했다.","chapter":56},{"lemma":"mutilated","difficulty":"C1","gloss":"simple past and past participle of mutilate","ipa":null,"sentence":"Then his eyes fell on the bed of mats in the corner, and he went up, and he saw the dreadful, mutilated, ghastly object which had been Strickland.","word_in_sentence":"mutilated","ko":"그때 그의 시선이 구석에 있는 돗자리 침대 위로 떨어졌고, 그는 다가가서 스트릭랜드였던 것의 끔찍하고 불구가 되고 무시무시한 모습을 보았다.","chapter":56},{"lemma":"battered","difficulty":"C1","gloss":"simple past and past participle of batter","ipa":"/ˈbætəd/","sentence":"Dr. Coutras made an effort of will and bent over that battered horror.","word_in_sentence":"battered","ko":"쿠트라 박사는 의지력을 발휘해 그 처참하게 망가진 끔찍한 몰골 위로 몸을 굽혔다.","chapter":56},{"lemma":"distraught","difficulty":"C1","gloss":"Deeply hurt, saddened, or worried; incapacitated by distress.","ipa":"/dɪsˈtɹɔːt/","sentence":"“Good Heavens, my nerves are all distraught,” he said.","word_in_sentence":"distraught","ko":"\"맙소사, 내 신경이 완전히 엉망이군.\" 그가 말했다.","chapter":56},{"lemma":"girth","difficulty":"C1","gloss":"A band passed under the belly of an animal, which holds a saddle or a harness saddle in place.","ipa":"/ɡɝθ/","sentence":"She came in, like a ship in full sail, an imposing creature, tall and stout, with an ample bust and an obesity girthed in alarmingly by straight-fronted corsets.","word_in_sentence":"girthed","ko":"그녀는 돛을 가득 단 배처럼 들어왔는데, 키가 크고 건장하며 풍만한 가슴과 직선형 코르셋으로 무섭도록 조여진 비만한 몸매를 가진 위압적인 인물이었다.","chapter":57},{"lemma":"alarmingly","difficulty":"C1","gloss":"In an alarming way, frighteningly.","ipa":"/əˈlɑɹm.ɪŋ.li/","sentence":"She came in, like a ship in full sail, an imposing creature, tall and stout, with an ample bust and an obesity girthed in alarmingly by straight-fronted corsets.","word_in_sentence":"alarmingly","ko":"그녀는 돛을 가득 단 배처럼 들어왔는데, 키가 크고 건장하며 풍만한 가슴과 직선형 코르셋으로 무섭도록 조여진 비만한 몸매를 가진 위압적인 인물이었다.","chapter":57},{"lemma":"corset","difficulty":"C1","gloss":"A woman's foundation garment, reinforced with stays, that supports the waistline, hips and bust.","ipa":"/ˈkɔː(ɹ).sɪt/","sentence":"She came in, like a ship in full sail, an imposing creature, tall and stout, with an ample bust and an obesity girthed in alarmingly by straight-fronted corsets.","word_in_sentence":"corsets","ko":"그녀는 돛을 가득 단 배처럼 들어왔는데, 키가 크고 건장하며 풍만한 가슴과 직선형 코르셋으로 무섭도록 조여진 비만한 몸매를 가진 위압적인 인물이었다.","chapter":57},{"lemma":"enervate","difficulty":"C2","gloss":"To reduce strength or energy; debilitate.","ipa":"/ˌɛn.ə(ɹ)ˈveɪt/","sentence":"She had not yielded for an instant to the enervating charm of the tropics, but contrariwise was more active, more worldly, more decided than anyone in a temperate clime would have thought it possible to be.","word_in_sentence":"enervating","ko":"그녀는 열대 지방의 나른한 매력에 한 순간도 굴복하지 않았으며, 오히려 온대 기후에 사는 누구라도 가능하리라 생각했을 것보다 더 활동적이고, 더 세속적이고, 더 단호했다.","chapter":57},{"lemma":"contrariwise","difficulty":"C2","gloss":"in the contrary or opposite way, order, or direction","ipa":null,"sentence":"She had not yielded for an instant to the enervating charm of the tropics, but contrariwise was more active, more worldly, more decided than anyone in a temperate clime would have thought it possible to be.","word_in_sentence":"contrariwise","ko":"그녀는 열대 지방의 나른한 매력에 한 순간도 굴복하지 않았으며, 오히려 온대 기후에 사는 누구라도 가능하리라 생각했을 것보다 더 활동적이고, 더 세속적이고, 더 단호했다.","chapter":57},{"lemma":"worldly","difficulty":"C1","gloss":"Concerned with human or earthly matters, physical as opposed to spiritual.","ipa":"/ˈwɜː(ɹ)ldli/","sentence":"She had not yielded for an instant to the enervating charm of the tropics, but contrariwise was more active, more worldly, more decided than anyone in a temperate clime would have thought it possible to be.","word_in_sentence":"worldly","ko":"그녀는 열대 지방의 나른한 매력에 한 순간도 굴복하지 않았으며, 오히려 온대 기후에 사는 누구라도 가능하리라 생각했을 것보다 더 활동적이고, 더 세속적이고, 더 단호했다.","chapter":57},{"lemma":"temperate","difficulty":"C1","gloss":"Specifically, moderate in temperature.","ipa":"/ˈtɛmpəɹət/","sentence":"She had not yielded for an instant to the enervating charm of the tropics, but contrariwise was more active, more worldly, more decided than anyone in a temperate clime would have thought it possible to be.","word_in_sentence":"temperate","ko":"그녀는 열대 지방의 나른한 매력에 한 순간도 굴복하지 않았으며, 오히려 온대 기후에 사는 누구라도 가능하리라 생각했을 것보다 더 활동적이고, 더 세속적이고, 더 단호했다.","chapter":57},{"lemma":"clime","difficulty":"C2","gloss":"A particular region defined by its weather or climate.","ipa":"/klaɪm/","sentence":"She had not yielded for an instant to the enervating charm of the tropics, but contrariwise was more active, more worldly, more decided than anyone in a temperate clime would have thought it possible to be.","word_in_sentence":"clime","ko":"그녀는 열대 지방의 나른한 매력에 한 순간도 굴복하지 않았으며, 오히려 온대 기후에 사는 누구라도 가능하리라 생각했을 것보다 더 활동적이고, 더 세속적이고, 더 단호했다.","chapter":57},{"lemma":"anecdote","difficulty":"C1","gloss":"A short account of a real incident or person, often humorous or interesting.","ipa":"/ˈæn.ɪkˌdoʊt/","sentence":"She was evidently a copious talker, and now poured forth a breathless stream of anecdote and comment.","word_in_sentence":"anecdote","ko":"그녀는 분명히 말이 많은 사람이었고, 지금도 숨 가쁘게 일화와 논평을 쏟아내고 있었다.","chapter":57},{"lemma":"exorcise","difficulty":"C2","gloss":"To drive out (an evil spirit) from a person, place or thing, especially by an incantation or prayer.","ipa":"/ˈɛk.sɔɹˌsaɪz/","sentence":"The demon which possessed him was exorcised at last, and with the completion of the work, for which all his life had been a painful preparation, rest descended on his remote and tortured soul.","word_in_sentence":"exorcised","ko":"그를 사로잡았던 악마가 마침내 쫓겨났고, 평생을 고통스러운 준비 과정으로 보낸 그 작업이 완성되면서 그의 외롭고 고통받던 영혼에 안식이 내려왔다.","chapter":57},{"lemma":"endlessness","difficulty":"C2","gloss":"The state or characteristic of being endless.","ipa":"/ˈɛnd.lɪs.nəs/","sentence":"It gave you an awful sense of the infinity of space and of the endlessness of time.","word_in_sentence":"endlessness","ko":"무한한 공간과 끝없는 시간에 대한 경외감을 불러일으켰어요.","chapter":57},{"lemma":"banyan","difficulty":"C1","gloss":"An Indian trader, merchant, cashier, or money changer.","ipa":"/ˈbæn.jæn/","sentence":"Because he painted the trees I see about me every day, the cocoa-nuts, the banyans, the flamboyants, the alligator-pears, I have seen them ever since differently, as though there were in them a spirit and a mystery which I am ever on the point of seizing and which forever escapes me.","word_in_sentence":"banyans","ko":"그가 내가 매일 보는 나무들—코코넛, 반얀, 플람보얀트, 아보카도—을 그렸기 때문에, 그 후로 나는 그 나무들을 다르게 보게 되었어요. 마치 그 안에 내가 막 붙잡을 듯하면서도 영원히 빠져나가는 정신과 신비가 있는 것처럼 말이에요.","chapter":57},{"lemma":"materialist","difficulty":"C1","gloss":"Someone who is materialistic, concerned only with material possessions.","ipa":"/məˈtiːɹɪəlɪst/","sentence":"I am a materialist, and I am a gross, fat man—Falstaff, eh?—the lyrical mode does not become me.","word_in_sentence":"materialist","ko":"나는 유물론자이고, 뚱뚱하고 속물적인 인간이다. 팰스태프 같은 놈 말이다. 서정적인 어조는 나에게 어울리지 않는다.","chapter":57},{"lemma":"lyrical","difficulty":"C1","gloss":"Appropriate for or suggestive of singing.","ipa":"/ˈlɪɹɪkəl/","sentence":"I am a materialist, and I am a gross, fat man—Falstaff, eh?—the lyrical mode does not become me.","word_in_sentence":"lyrical","ko":"나는 유물론자이고, 뚱뚱하고 속물적인 인간이다. 팰스태프 같은 놈 말이다. 서정적인 어조는 나에게 어울리지 않는다.","chapter":57},{"lemma":"sightless","difficulty":"C2","gloss":"Without sight; blind; unseeing.","ipa":null,"sentence":"“When he grew blind he would sit hour after hour in those two rooms that he had painted, looking at his works with sightless eyes, and seeing, perhaps, more than he had ever seen in his life before.","word_in_sentence":"sightless","ko":"\"시력을 잃은 후 그는 자신이 그림을 그린 그 두 방에서 시간마다 앉아 있곤 했다. 보이지 않는 눈으로 자신의 작품들을 바라보며, 아마도 살아생전 그 어느 때보다 더 많은 것을 보고 있었을 것이다.","chapter":57},{"lemma":"undisturbed","difficulty":"C1","gloss":"Not disturbed or agitated.","ipa":null,"sentence":"To the end his mind remained serene and undisturbed.","word_in_sentence":"undisturbed","ko":"끝까지 그의 마음은 평온하고 흔들리지 않았다.","chapter":57},{"lemma":"dissuade","difficulty":"C1","gloss":"To convince not to try or do.","ipa":"/dɪˈsweɪd/","sentence":"I must tell you that I thought it my duty to dissuade her.”","word_in_sentence":"dissuade","ko":"나는 그녀를 말려야 한다고 생각했다는 것을 말씀드려야겠습니다.\"","chapter":57},{"lemma":"barbarous","difficulty":"C1","gloss":"Not classical or pure.","ipa":"/ˈbɑː(ɹ)bəɹəs/","sentence":"I would not stay to witness the barbarous deed, and it was only afterwards that I heard what she had done.","word_in_sentence":"barbarous","ko":"나는 그 야만적인 행위를 지켜볼 수 없어서 자리를 떠났고, 그녀가 무슨 일을 저질렀는지는 나중에야 들을 수 있었다.","chapter":57},{"lemma":"paraffin","difficulty":"C1","gloss":"A petroleum-based thin and colourless fuel oil.","ipa":"/ˈpɛɹ.ə.fɪn/","sentence":"She poured paraffin on the dry floors and on the pandanus-mats, and then she set fire.","word_in_sentence":"paraffin","ko":"그녀는 마른 바닥과 판다누스 매트에 파라핀을 부은 다음 불을 질렀다.","chapter":57},{"lemma":"ember","difficulty":"C1","gloss":"A piece of coal or wood glowing by heat; a hot coal.","ipa":"/ˈɛm.bə/","sentence":"In a little while nothing remained but smouldering embers, and a great masterpiece existed no longer.","word_in_sentence":"embers","ko":"얼마 지나지 않아 그을린 재만 남았고, 위대한 걸작은 더 이상 존재하지 않았다.","chapter":57},{"lemma":"opaque","difficulty":"C1","gloss":"Neither reflecting nor emitting light.","ipa":"/əʊˈpeɪk/","sentence":"They were sombre blues, opaque like a delicately carved bowl in lapis lazuli, and yet with a quivering lustre that suggested the palpitation of mysterious life; there were purples, horrible like raw and putrid flesh, and yet with a glowing, sensual passion that called up vague memories of the Roman Empire of Heliogabalus; there were reds, shrill like the berries of holly—one thought of Christmas in England, and the snow, the good cheer, and the pleasure of children—and yet by some magic softened till they had the swooning tenderness of a dove’s breast; there were deep yellows that died with an unnatural passion into a green as fragrant as the spring and as pure as the sparkling water of a mountain brook.","word_in_sentence":"opaque","ko":"청금석으로 정교하게 조각한 그릇처럼 불투명한 음울한 청색들이 있었는데, 그러면서도 신비로운 생명의 고동을 암시하는 떨리는 광택을 띠고 있었다. 날것의 썩은 살점처럼 끔찍한 자주색들이 있었는데, 그러면서도 헬리오가발루스 시대 로마 제국의 막연한 기억을 불러일으키는 타오르는 관능적 열정을 품고 있었다. 호랑가시나무 열매처럼 날카로운 적색들이 있었는데—영국의 크리스마스와 눈, 즐거운 축제, 아이들의 기쁨을 떠올리게 했다—그러면서도 어떤 마법에 의해 부드러워져서 비둘기 가슴의 황홀한 부드러움을 지니고 있었다. 부자연스러운 열정으로 죽어가면서 봄처럼 향기롭고 산골 시냇물처럼 맑고 반짝이는 초록으로 변해가는 깊은 황색들이 있었다.","chapter":57},{"lemma":"delicately","difficulty":"C1","gloss":"In a delicate manner; exquisitely.","ipa":"/ˈdɛlɪkətli/","sentence":"They were sombre blues, opaque like a delicately carved bowl in lapis lazuli, and yet with a quivering lustre that suggested the palpitation of mysterious life; there were purples, horrible like raw and putrid flesh, and yet with a glowing, sensual passion that called up vague memories of the Roman Empire of Heliogabalus; there were reds, shrill like the berries of holly—one thought of Christmas in England, and the snow, the good cheer, and the pleasure of children—and yet by some magic softened till they had the swooning tenderness of a dove’s breast; there were deep yellows that died with an unnatural passion into a green as fragrant as the spring and as pure as the sparkling water of a mountain brook.","word_in_sentence":"delicately","ko":"청금석으로 정교하게 조각한 그릇처럼 불투명한 음울한 청색들이 있었는데, 그러면서도 신비로운 생명의 고동을 암시하는 떨리는 광택을 띠고 있었다. 날것의 썩은 살점처럼 끔찍한 자주색들이 있었는데, 그러면서도 헬리오가발루스 시대 로마 제국의 막연한 기억을 불러일으키는 타오르는 관능적 열정을 품고 있었다. 호랑가시나무 열매처럼 날카로운 적색들이 있었는데—영국의 크리스마스와 눈, 즐거운 축제, 아이들의 기쁨을 떠올리게 했다—그러면서도 어떤 마법에 의해 부드러워져서 비둘기 가슴의 황홀한 부드러움을 지니고 있었다. 부자연스러운 열정으로 죽어가면서 봄처럼 향기롭고 산골 시냇물처럼 맑고 반짝이는 초록으로 변해가는 깊은 황색들이 있었다.","chapter":57},{"lemma":"carve","difficul ":"그것들은 지나칠 정도로 호화로웠다.","chapter":57},{"lemma":"odour","difficulty":"C1","gloss":"Alternative spelling of odor.","ipa":null,"sentence":"They were heavy with tropical odours.","word_in_sentence":"odours","ko":"열대의 향기가 짙게 배어 있었다.","chapter":57},{"lemma":"enchant","difficulty":"C1","gloss":"To attract and delight, to charm.","ipa":"/ɪnˈt͡ʃænt/","sentence":"It was enchanted fruit, to taste which might open the gateway to God knows what secrets of the soul and to mysterious palaces of the imagination.","word_in_sentence":"enchanted","ko":"그것은 마법에 걸린 과일이었고, 맛을 보는 순간 영혼의 어떤 비밀과 상상 속 신비로운 궁전으로 통하는 문이 열릴지도 몰랐다.","chapter":57},{"lemma":"unawaited","difficulty":"C2","gloss":{"en":"Unexpected or unanticipated.","ko":"미리예상 못한","zh":"未预料的"},"ipa":"","sentence":"They were sullen with unawaited dangers, and to eat them might turn a man to beast or god.","word_in_sentence":"unawaited","ko":"그것들은 예기치 못한 위험으로 음침했고, 먹는다면 사람을 짐승이나 신으로 바꿔놓을지도 몰랐다.","chapter":57},{"lemma":"apéritif","difficulty":"C2","gloss":"An alcoholic drink served before a meal as an appetiser.","ipa":"/ɑːˌpɛɹɪˈtiːf/","sentence":"Here are the apéritifs.","word_in_sentence":"apéritifs","ko":"여기 식전주가 있어.","chapter":57},{"lemma":"pandanu","difficulty":"C2","gloss":{"en":"A type of tree or its leaves.","ko":"판다나무","zh":"棕榈树"},"ipa":"","sentence":"According to the gracious custom of the island, presents were given me by the persons with whom I had been thrown in contact—baskets made of the leaves of the cocoa-nut tree, mats of pandanus, fans; and Tiaré gave me three little pearls and three jars of guava-jelly made with her own plump hands.","word_in_sentence":"pandanus","ko":"섬의 우아한 관습에 따라, 내가 인연을 맺었던 사람들이 나에게 선물을 주었다—코코넛 나무 잎으로 만든 바구니, 판다누스로 짠 돗자리, 부채들이었고, 티아레는 작은 진주 세 개와 자신의 통통한 손으로 직접 만든 구아바 젤리 세 병을 주었다.","chapter":58},{"lemma":"billowy","difficulty":"C2","gloss":"Swelling or swollen into large waves; full of billows or surges; resembling billows.","ipa":"/ˈbɪ.ləʊ.(w)i/","sentence":"When the mail-boat, stopping for twenty-four hours on its way from Wellington to San Francisco, blew the whistle that warned the passengers to get on board, Tiaré clasped me to her vast bosom, so that I seemed to sink into a billowy sea, and pressed her red lips to mine.","word_in_sentence":"billowy","ko":"웰링턴에서 샌프란시스코로 가는 도중 이십사 시간 정박하는 우편선이 승객들에게 승선하라는 경적을 울렸을 때, 티아레는 나를 그녀의 거대한 품에 안아서 마치 내가 물결치는 바다 속으로 빠져드는 것 같았고, 그녀의 붉은 입술을 내 입술에 눌렀다.","chapter":58},{"lemma":"gingerly","difficulty":"C1","gloss":"In a cautious and delicate manner; (very) carefully or cautiously.","ipa":"/ˈdʒɪn(d)ʒəli/","sentence":"And when we steamed slowly out of the lagoon, making our way gingerly through the opening in the reef, and then steered for the open sea, a certain melancholy fell upon me.","word_in_sentence":"gingerly","ko":"우리가 석호에서 천천히 빠져나와 산호초 틈새를 조심스럽게 통과한 다음 망망대해를 향해 나아갔을 때, 어떤 우울함이 나를 사로잡았다.","chapter":58},{"lemma":"gracefully","difficulty":"C1","gloss":"In a graceful manner.","ipa":"/ˈɡɹeɪsfəli/","sentence":"Her face, thin and not much lined, was of the sort that ages gracefully, so that you thought in youth she must have been a much handsomer woman than in fact she was.","word_in_sentence":"gracefully","ko":"야위고 주름이 많지 않은 그녀의 얼굴은 우아하게 나이 드는 부류여서, 젊었을 때는 실제보다 훨씬 더 아름다운 여인이었을 거라는 생각이 들었다.","chapter":58},{"lemma":"handsomer","difficulty":"C2","gloss":"comparative form of handsome: more handsome","ipa":null,"sentence":"Her face, thin and not much lined, was of the sort that ages gracefully, so that you thought in youth she must have been a much handsomer woman than in fact she was.","word_in_sentence":"handsomer","ko":"야위고 주름이 많지 않은 그녀의 얼굴은 우아하게 나이 드는 부류여서, 젊었을 때는 실제보다 훨씬 더 아름다운 여인이었을 거라는 생각이 들었다.","chapter":58},{"lemma":"becomingly","difficulty":"C2","gloss":"In a becoming manner.","ipa":"/bɪˈkʌmɪŋli/","sentence":"Her hair, not yet very gray, was becomingly arranged, and her black gown was modish.","word_in_sentence":"becomingly","ko":"아직 그리 희지 않은 머리카락은 보기 좋게 정리되어 있었고, 검은 드레스는 세련되었다.","chapter":58},{"lemma":"modish","difficulty":"C2","gloss":"Conforming with fashion or style.","ipa":"/ˈməʊdɪʃ/","sentence":"Her hair, not yet very gray, was becomingly arranged, and her black gown was modish.","word_in_sentence":"modish","ko":"아직 그리 희지 않은 머리카락은 보기 좋게 정리되어 있었고, 검은 드레스는 세련되었다.","chapter":58},{"lemma":"outlive","difficulty":"C1","gloss":"To live longer than; continue to live after the death of; overlive; survive.","ipa":"/aʊtˈlɪv/","sentence":"I remembered having heard that her sister, Mrs. MacAndrew, outliving her husband but a couple of years, had left money to Mrs. Strickland; and by the look of the house and the trim maid who opened the door I judged that it was a sum adequate to keep the widow in modest comfort.","word_in_sentence":"outliving","ko":"그녀의 언니인 맥앤드류 부인이 남편보다 겨우 두 해 더 살다가 스트릭랜드 부인에게 돈을 남겼다는 이야기를 들은 기억이 났다. 집의 모습과 문을 열어준 단정한 하녀를 보니, 과부가 소박하게나마 편안히 살 만한 충분한 액수였던 것 같았다.","chapter":58},{"lemma":"shamefully","difficulty":"C1","gloss":"In a shameful manner.","ipa":"/ˈʃeɪmfəli/","sentence":"If you haven’t read his book your education has been shamefully neglected, and you must repair the omission at once.","word_in_sentence":"shamefully","ko":"그분의 책을 읽지 않으셨다면 교양이 부끄럽게 부족한 거니까, 당장 그 빈틈을 메우셔야 해요.","chapter":58},{"lemma":"omission","difficulty":"C1","gloss":"The act of omitting.","ipa":"/oʊˈmɪʃən/","sentence":"If you haven’t read his book your education has been shamefully neglected, and you must repair the omission at once.","word_in_sentence":"omission","ko":"그분의 책을 읽지 않으셨다면 교양이 부끄럽게 부족한 거니까, 당장 그 빈틈을 메우셔야 해요.","chapter":58},{"lemma":"bony","difficulty":"C1","gloss":"Resembling, having the appearance or consistence of, or relating to bone; osseous.","ipa":"/ˈbəʊni/","sentence":"Mr. Van Busche Taylor was a very thin man with a large, bald head, bony and shining; and under the great dome of his skull his face, yellow, with deep lines in it, looked very small.","word_in_sentence":"bony","ko":"반 부셰 테일러 씨는 매우 마른 사람으로 크고 대머리인 머리가 뼈만 남아 번들거렸고, 그 거대한 두개골 돔 아래 깊은 주름이 패인 누런 얼굴이 매우 작아 보였다.","chapter":58},{"lemma":"exceedingly","difficulty":"C1","gloss":"To a great or unusual degree, extent, etc.; extremely","ipa":"/ɪkˈsiːdɪŋli/","sentence":"He was quiet and exceedingly polite.","word_in_sentence":"exceedingly","ko":"그는 조용하고 극도로 정중했다.","chapter":58},{"lemma":"bloodless","difficulty":"C1","gloss":"Lacking blood; ashen, anaemic.","ipa":null,"sentence":"He spoke with the accent of New England, and there was about his demeanour a bloodless frigidity which made me ask myself why on earth he was busying himself with Charles Strickland.","word_in_sentence":"bloodless","ko":"뉴잉글랜드 억양으로 말했고, 그의 태도에는 피 한 방울 없는 냉담함이 있어서 나는 도대체 왜 이 사람이 찰스 스트릭랜드에게 관심을 갖는지 의아했다.","chapter":58},{"lemma":"frigidity","difficulty":"C2","gloss":"The state of being frigid; coldness; lack of heat.","ipa":null,"sentence":"He spoke with the accent of New England, and there was about his demeanour a bloodless frigidity which made me ask myself why on earth he was busying himself with Charles Strickland.","word_in_sentence":"frigidity","ko":"뉴잉글랜드 억양으로 말했고, 그의 태도에는 피 한 방울 없는 냉담함이 있어서 나는 도대체 왜 이 사람이 찰스 스트릭랜드에게 관심을 갖는지 의아했다.","chapter":58},{"lemma":"tickle","difficulty":"C1","gloss":"The act of tickling.","ipa":"/ˈtɪkl̩/","sentence":"I had been slightly tickled at the gentleness which Mrs. Strickland put into her mention of her husband’s name, and while the pair conversed I took stock of the room in which we sat.","word_in_sentence":"tickled","ko":"스트릭랜드 부인이 남편의 이름을 언급할 때 담아낸 부드러움에 나는 약간 우스꽝스러움을 느꼈고, 두 사람이 대화를 나누는 동안 우리가 앉아 있는 방을 살펴보았다.","chapter":58},{"lemma":"gentleness","difficulty":"C1","gloss":"The state of being gentle.","ipa":"/ˈd͡ʒɛntl̩nəs/","sentence":"I had been slightly tickled at the gentleness which Mrs. Strickland put into her mention of her husband’s name, and while the pair conversed I took stock of the room in which we sat.","word_in_sentence":"gentleness","ko":"스트릭랜드 부인이 남편의 이름을 언급할 때 담아낸 부드러움에 나는 약간 우스꽝스러움을 느꼈고, 두 사람이 대화를 나누는 동안 우리가 앉아 있는 방을 살펴보았다.","chapter":58},{"lemma":"converse","difficulty":"C1","gloss":"To talk; to engage in conversation.","ipa":"/kənˈvɝs/","sentence":"I had been slightly tickled at the gentleness which Mrs. Strickland put into her mention of her husband’s name, and while the pair conversed I took stock of the room in which we sat.","word_in_sentence":"conversed","ko":"스트릭랜드 부인이 남편의 이름을 언급할 때 담아낸 부드러움에 나는 약간 우스꽝스러움을 느꼈고, 두 사람이 대화를 나누는 동안 우리가 앉아 있는 방을 살펴보았다.","chapter":58},{"lemma":"cretonne","difficulty":"C2","gloss":"A strong, heavy fabric of cotton, linen or rayon, used to make curtains and upholstery.","ipa":null,"sentence":"Gone were the Morris papers and gone the severe cretonnes, gone were the Arundel prints that had adorned the walls of her drawing-room in Ashley Gardens; the room blazed with fantastic colour, and I wondered if she knew that those varied hues, which fashion had imposed upon her, were due to the dreams of a poor painter in a South Sea island.","word_in_sentence":"cretonnes","ko":"모리스 벽지도 사라지고 엄숙한 크레톤 천도 사라졌으며, 애슐리 가든스의 응접실 벽을 장식했던 아런델 판화들도 모두 사라졌다. 이제 그 방은 환상적인 색채로 눈부시게 빛났는데, 유행이 그녀에게 강요한 그 다채로운 색조들이 남태평양 어느 섬의 가난한 화가의 꿈에서 비롯된 것임을 그녀가 알고 있는지 나는 궁금했다.","chapter":58},{"lemma":"arundel","difficulty":"C1","gloss":"A market town and civil parish with a town council in Arun district, West Sussex, England (OS grid ref TQ0107).","ipa":"/ˈæɹəndəl/","sentence":"Gone were the Morris papers and gone the severe cretonnes, gone were the Arundel prints that had adorned the walls of her drawing-room in Ashley Gardens; the room blazed with fantastic colour, and I wondered if she knew that those varied hues, which fashion had imposed upon her, were due to the dreams of a poor painter in a South Sea island.","word_in_sentence":"Arundel","ko":"모리스 벽지도 사라지고 엄숙한 크레톤 천도 사라졌으며, 애슐리 가든스의 응접실 벽을 장식했던 아런델 판화들도 모두 사라졌다. 이제 그 방은 환상적인 색채로 눈부시게 빛났는데, 유행이 그녀에게 강요한 그 다채로운 색조들이 남태평양 어느 섬의 가난한 화가의 꿈에서 비롯된 것임을 그녀가 알고 있는지 나는 궁금했다.","chapter":58},{"lemma":"kneel","difficulty":"C1","gloss":"To rest on one's bent knees, sometimes only one; to move to such a position.","ipa":"/niːl/","sentence":"Their eyes rested on a nude woman suckling a baby, while a girl was kneeling by their side holding out a flower to the indifferent child.","word_in_sentence":"kneeling","ko":"그들의 시선은 아기에게 젖을 먹이는 나체 여인에게 머물렀는데, 한 소녀가 그들 곁에 무릎을 꿇고 무관심한 아이에게 꽃을 내밀고 있었다.","chapter":58},{"lemma":"wrinkle","difficulty":"C1","gloss":"A small furrow, ridge or crease in an otherwise smooth surface.","ipa":"/ˈɹɪŋkl̩/","sentence":"Looking over them was a wrinkled, scraggy hag.","word_in_sentence":"wrinkled","ko":"그들을 내려다보고 있는 것은 주름투성이에 앙상한 노파였다.","chapter":58},{"lemma":"scraggy","difficulty":"C2","gloss":"Rough and irregular; jagged.","ipa":"/ˈskɹæɡi/","sentence":"Looking over them was a wrinkled, scraggy hag.","word_in_sentence":"scraggy","ko":"그들을 내려다보고 있는 것은 주름투성이에 앙상한 노파였다.","chapter":58},{"lemma":"insinuate","difficulty":"C1","gloss":"To hint; to suggest tacitly (usually something bad) while avoiding a direct statement.","ipa":"/ɪnˈsɪnjueɪt/","sentence":"The conversation proceeded, and I marvelled at the tact with which Mr. Van Busche Taylor avoided all subjects that might have been in the least embarrassing, and at the ingenuity with which Mrs. Strickland, without saying a word that was untrue, insinuated that her relations with her husband had always been perfect.","word_in_sentence":"insinuated","ko":"대화가 이어졌고, 나는 반 부셰 테일러 씨가 조금이라도 난처할 수 있는 모든 주제를 피해가는 재치와, 스트릭랜드 부인이 거짓말은 한 마디도 하지 않으면서도 남편과의 관계가 항상 완벽했다고 넌지시 암시하는 교묘함에 감탄했다.","chapter":58},{"lemma":"graceful","difficulty":"C1","gloss":"Having or showing grace in movement, shape, or proportion.","ipa":"/ˈɡɹeɪsfʊl/","sentence":"Holding his hostess’ hand, he made her a graceful, though perhaps too elaborate, speech of thanks, and left us.","word_in_sentence":"graceful","ko":"그는 여주인의 손을 잡고 우아하지만 다소 과장된 감사 인사를 건넨 뒤 우리를 떠났다.","chapter":58},{"lemma":"airily","difficulty":"C2","gloss":"In an airy manner.","ipa":"/ˈeɹ.ə.li/","sentence":"“Oh, yes,” she answered airily.","word_in_sentence":"airily","ko":"\"아, 그래요.\" 그녀가 가볍게 대답했다.","chapter":58},{"lemma":"overtax","difficulty":"C2","gloss":"To tax to an excessive degree.","ipa":"/ˌəʊvə(ɹ)ˈtæks/","sentence":"They thought I was overtaxing my strength.”","word_in_sentence":"overtaxing","ko":"제가 너무 무리하고 있다고 생각했나 봐요.\"","chapter":58},{"lemma":"pukka","difficulty":"C2","gloss":"Genuine or authentic; hence of behaviour: correct, socially acceptable or proper.","ipa":"/ˈpʌkə/","sentence":"“He’s by way of being a pukka soldier, you know,” said Mrs. Ronaldson gaily.","word_in_sentence":"pukka","ko":"\"정말 군인다운 군인이라고 할 수 있어요.\" 로널드슨 부인이 명랑하게 말했다.","chapter":58},{"lemma":"breezy","difficulty":"C1","gloss":"With a breeze blowing, with a lively wind, pleasantly windy.","ipa":"/ˈbɹiːzi/","sentence":"Robert was breezy.","word_in_sentence":"breezy","ko":"로버트는 활기찼다.","chapter":58},{"lemma":"rattle","difficulty":"C1","gloss":"To create a rattling sound by shaking or striking.","ipa":"/ˈɹæ.təl/","sentence":"“Well, I don’t mind confessing it, I have a rattling good time at the front.","word_in_sentence":"rattling","ko":"\"솔직히 고백하자면, 전선에서 정말 즐거운 시간을 보내고 있어요.","chapter":58},{"lemma":"impressively","difficulty":"C1","gloss":"In an impressive manner; forcibly.","ipa":null,"sentence":"“The mills of God grind slowly, but they grind exceeding small,” he said, somewhat impressively.","word_in_sentence":"impressively","ko":"\"신의 맷돌은 천천히 돌지만, 아주 곱게 간다네.\" 그가 다소 인상적으로 말했다.","chapter":58},{"lemma":"pious","difficulty":"C1","gloss":"Of or pertaining to piety, exhibiting piety, devout, god-fearing.","ipa":"/ˈpaɪəs/","sentence":"Mrs. Strickland and Mrs. Ronaldson looked down with a slightly pious expression which indicated, I felt sure, that they thought the quotation was from Holy Writ.","word_in_sentence":"pious","ko":"스트릭랜드 부인과 로널드슨 부인은 약간 경건한 표정으로 고개를 숙였는데, 그 인용구가 성경에서 나온 것이라고 생각하고 있음이 분명했다.","chapter":58},{"lemma":"unconvinced","difficulty":"C1","gloss":"not convinced or lacking conviction","ipa":null,"sentence":"Indeed, w him, with my mind’s eye, on the schooner on which he worked, wearing nothing but a pair of dungarees; and at night, when the boat sailed along easily before a light breeze, and the sailors were gathered on the upper deck, while the captain and the supercargo lolled in deck-chairs, smoking their pipes, I saw him dance with another lad, dance wildly, to the wheezy music of the concertina.","word_in_sentence":"lolled","ko":"나는 마음의 눈으로 그를 보았다. 그가 일하던 스쿠너호에서 작업복 바지 한 벌만 걸친 채로 있는 모습을, 그리고 밤에 배가 가벼운 바람을 받으며 순조롭게 항해할 때, 선원들이 상갑판에 모여 있고 선장과 화물 담당관이 갑판 의자에 기대어 파이프 담배를 피우고 있을 때, 그가 다른 젊은이와 함께 아코디언의 쌕쌕거리는 음악에 맞춰 격렬하게 춤추는 모습을.","chapter":58},{"lemma":"blasphemous","difficulty":"C1","gloss":"Lacking piety or respect for the sacred; resembling blasphemy.","ipa":"/ˈblæs.fəm.əs/","sentence":"A quotation from the Bible came to my lips, but I held my tongue, for I know that clergymen think it a little blasphemous when the laity poach upon their preserves.","word_in_sentence":"blasphemous","ko":"성경 구절이 입가에 맴돌았지만, 나는 입을 다물었다. 성직자들은 평신도가 자신들의 영역을 침범하는 것을 다소 신성모독적이라고 여긴다는 것을 알고 있었기 때문이다.","chapter":58},{"lemma":"laity","difficulty":"C1","gloss":"People of a church who are not ordained clergy or clerics.","ipa":"/ˈleɪ.ə.ti/","sentence":"A quotation from the Bible came to my lips, but I held my tongue, for I know that clergymen think it a little blasphemous when the laity poach upon their preserves.","word_in_sentence":"laity","ko":"성경 구절이 입가에 맴돌았지만, 나는 입을 다물었다. 성직자들은 평신도가 자신들의 영역을 침범하는 것을 다소 신성모독적이라고 여긴다는 것을 알고 있었기 때문이다.","chapter":58},{"lemma":"poach","difficulty":"C1","gloss":"To cook (something) in simmering or very hot liquid (usually water; sometimes wine, broth, or otherwise).","ipa":"/ˈpoʊt͡ʃ/","sentence":"A quotation from the Bible came to my lips, but I held my tongue, for I know that clergymen think it a little blasphemous when the laity poach upon their preserves.","word_in_sentence":"poach","ko":"성경 구절이 입가에 맴돌았지만, 나는 입을 다물었다. 성직자들은 평신도가 자신들의 영역을 침범하는 것을 다소 신성모독적이라고 여긴다는 것을 알고 있었기 때문이다.","chapter":58},{"lemma":"shilling","difficulty":"C1","gloss":"A coin formerly used in the United Kingdom, Ireland, Malta, Australia, New Zealand and many other Commonwealth countries worth twelve old pence, or one twentieth of a pound sterling.","ipa":"/ˈʃɪlɪŋ/","sentence":"He remembered the days when you could get thirteen Royal Natives for a shilling.","word_in_sentence":"shilling","ko":"그는 1실링으로 로열 네이티브 담배 13개비를 살 수 있었던 시절을 기억하고 있었다.","chapter":58}];
const MAX_WRONG = 7;

let currentWord = null;
let guessed = new Set();
let wrongCount = 0;
let wins = 0, losses = 0, streak = 0;
let filterMode = 'C1+';
let usedIndices = new Set();

const gc = document.getElementById('gallows').getContext('2d');

document.getElementById('cnt-c1').textContent = ALL_WORDS.length;
document.getElementById('cnt-c2').textContent = ALL_WORDS.filter(w => w.difficulty === 'C2').length;

function getPool() {
  if (filterMode === 'C2') return ALL_WORDS.filter(w => w.difficulty === 'C2');
  return ALL_WORDS;
}

function setFilter(mode) {
  filterMode = mode;
  document.getElementById('btn-c1').className = mode === 'C1+' ? 'active' : '';
  document.getElementById('btn-c2').className = mode === 'C2' ? 'active' : '';
  usedIndices.clear();
  nextWord();
}

function nextWord() {
  const pool = getPool();
  if (usedIndices.size >= pool.length) usedIndices.clear();
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); } while (usedIndices.has(idx));
  usedIndices.add(idx);

  currentWord = pool[idx];
  guessed = new Set();
  wrongCount = 0;

  document.getElementById('result').style.display = 'none';
  document.getElementById('keyboard').style.display = 'flex';

  renderGallows();
  renderWord();
  renderHints();
  buildKeyboard();
}

function renderGallows() {
  gc.clearRect(0, 0, 200, 180);
  gc.strokeStyle = '#bbb'; gc.lineWidth = 2;
  // Base
  gc.beginPath(); gc.moveTo(20, 170); gc.lineTo(80, 170); gc.stroke();
  // Pole
  gc.beginPath(); gc.moveTo(50, 170); gc.lineTo(50, 20); gc.stroke();
  // Top
  gc.beginPath(); gc.moveTo(50, 20); gc.lineTo(130, 20); gc.stroke();
  // Rope
  gc.beginPath(); gc.moveTo(130, 20); gc.lineTo(130, 40); gc.stroke();

  gc.strokeStyle = '#333'; gc.lineWidth = 2;
  if (wrongCount >= 1) { gc.beginPath(); gc.arc(130, 52, 12, 0, Math.PI*2); gc.stroke(); } // Head
  if (wrongCount >= 2) { gc.beginPath(); gc.moveTo(130, 64); gc.lineTo(130, 110); gc.stroke(); } // Body
  if (wrongCount >= 3) { gc.beginPath(); gc.moveTo(130, 75); gc.lineTo(110, 95); gc.stroke(); } // Left arm
  if (wrongCount >= 4) { gc.beginPath(); gc.moveTo(130, 75); gc.lineTo(150, 95); gc.stroke(); } // Right arm
  if (wrongCount >= 5) { gc.beginPath(); gc.moveTo(130, 110); gc.lineTo(112, 140); gc.stroke(); } // Left leg
  if (wrongCount >= 6) { gc.beginPath(); gc.moveTo(130, 110); gc.lineTo(148, 140); gc.stroke(); } // Right leg
  if (wrongCount >= 7) { // Face
    gc.fillStyle = '#ef4444';
    gc.beginPath(); gc.arc(126, 49, 1.5, 0, Math.PI*2); gc.fill(); // Left eye
    gc.beginPath(); gc.arc(134, 49, 1.5, 0, Math.PI*2); gc.fill(); // Right eye
    gc.beginPath(); gc.moveTo(126, 57); gc.lineTo(134, 57); gc.stroke(); // Mouth
  }
}

function renderWord() {
  const el = document.getElementById('word-letters');
  const letters = currentWord.lemma.split('').map(ch => {
    if (guessed.has(ch.toLowerCase())) return `<span class="revealed">${ch}</span>`;
    if (wrongCount >= MAX_WRONG) return `<span class="wrong-reveal">${ch}</span>`;
    return '<span class="blank">_</span>';
  }).join('');
  const badge = `<span class="diff-badge ${currentWord.difficulty}">${currentWord.difficulty}</span>`;
  el.innerHTML = letters + ' ' + badge;
}

function renderHints() {
  document.getElementById('hint-gloss').textContent = currentWord.gloss;
  document.getElementById('hint-chapter').textContent = currentWord.chapter;

  // Blank out the word in sentence
  const sentence = currentWord.sentence;
  const word = currentWord.word_in_sentence;
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const blanked = sentence.replace(re, '<span class="blank-word">' + '_'.repeat(word.length) + '</span>');
  document.getElementById('hint-sentence').innerHTML = blanked;
  document.getElementById('hint-ko').textContent = currentWord.ko;
}

function buildKeyboard() {
  const el = document.getElementById('keyboard');
  el.innerHTML = '';
  for (let i = 0; i < 26; i++) {
    const ch = String.fromCharCode(65 + i);
    const btn = document.createElement('div');
    btn.className = 'key';
    btn.textContent = ch;
    btn.onclick = () => guess(ch.toLowerCase(), btn);
    el.appendChild(btn);
  }
}

function guess(ch, btn) {
  if (guessed.has(ch) || wrongCount >= MAX_WRONG) return;
  guessed.add(ch);

  const inWord = currentWord.lemma.toLowerCase().includes(ch);
  if (inWord) {
    btn.classList.add('correct', 'used');
  } else {
    btn.classList.add('wrong', 'used');
    wrongCount++;
  }

  renderGallows();
  renderWord();

  // Check win
  const allRevealed = currentWord.lemma.toLowerCase().split('').every(c => guessed.has(c));
  if (allRevealed) endGame(true);
  else if (wrongCount >= MAX_WRONG) endGame(false);
}

function addToMissedList(data) {
  const el = document.createElement('div');
  el.className = 'missed-entry';
  const word = data.word_in_sentence;
  const re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  const highlighted = data.sentence.replace(re, '<mark>$1</mark>');
  el.innerHTML = `
    <div class="word-head">
      <span class="lemma">${data.lemma}</span>
      <span class="badge ${data.difficulty}">${data.difficulty}</span>
      ${data.ipa ? '<span class="ipa">' + data.ipa + '</span>' : ''}
    </div>
    <div class="gloss">${data.gloss}</div>
    <div class="sentence">${highlighted}</div>
    ${data.ko ? '<div class="ko">' + data.ko + '</div>' : ''}
  `;
  document.getElementById('missed-list').prepend(el);
  document.getElementById('missed-controls').style.display = 'flex';
}

function printMissed() {
  const hdr = document.getElementById('print-header');
  const total = document.getElementById('missed-list').children.length;
  hdr.querySelector('h1').textContent = 'The Moon and Sixpence — Missed Words';
  hdr.querySelector('p').textContent = total + ' words to review';
  window.print();
}

function endGame(won) {
  document.getElementById('keyboard').style.display = 'none';
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';

  if (won) {
    wins++; streak++;
    document.getElementById('result-msg').innerHTML = '<span style="color:#16a34a">Correct!</span>';
  } else {
    losses++; streak = 0;
    document.getElementById('result-msg').innerHTML = '<span style="color:#dc2626">Game over</span>';
    renderWord();
    addToMissedList(currentWord);
  }

  document.getElementById('result-answer').textContent = currentWord.lemma;
  document.getElementById('result-ipa').textContent = currentWord.ipa || '';
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
  document.getElementById('stat-streak').textContent = streak;
}

// Keyboard input
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('result').style.display !== 'none') {
    nextWord(); return;
  }
  const ch = e.key.toLowerCase();
  if (ch.length === 1 && ch >= 'a' && ch <= 'z') {
    const btns = document.querySelectorAll('.keyboard .key');
    const idx = ch.charCodeAt(0) - 97;
    if (btns[idx] && !btns[idx].classList.contains('used')) {
      guess(ch, btns[idx]);
    }
  }
});

nextWord();
</script>
