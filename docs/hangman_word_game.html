A very light state of sleep, almost awake.","ipa":"/ˈslʌm.bə/","sentence":"Finally I gave him a draught, and he sank into uneasy slumber.","word_in_sentence":"slumber","ko":"마침내 나는 그에게 수면제를 주었고, 그는 불안한 잠에 빠져들었다.","chapter":35},{"lemma":"serene","difficulty":"C1","gloss":"Calm, peaceful, unruffled.","ipa":"/səˈɹin/","sentence":"To the end his mind remained serene and undisturbed.","word_in_sentence":"serene","ko":"끝까지 그의 마음은 평온하고 흔들리지 않았다.","chapter":57},{"lemma":"obedient","difficulty":"C1","gloss":"Willing to comply with the commands, orders, or instructions of those in authority; biddable.","ipa":"/əˈbiːdɪənt/","sentence":"He seemed to have lost all power of will; he was like an obedient child.","word_in_sentence":"obedient","ko":"그는 모든 의지력을 잃어버린 것 같았다. 마치 순종적인 아이 같았다.","chapter":35},{"lemma":"wrench","difficulty":"C1","gloss":"A movement that twists or pulls violently; a tug.","ipa":"/ɹɛnt͡ʃ/","sentence":"It gave me a sudden wrench of the heart-strings.","word_in_sentence":"wrench","ko":"갑자기 가슴이 찢어지는 듯했다.","chapter":35},{"lemma":"abyss","difficulty":"C1","gloss":"Hell; the bottomless pit; primeval chaos; a confined subterranean ocean.","ipa":"/əˈbɪs/","sentence":"I wondered what an abyss of cruelty she must have looked into that in horror she refused to live.","word_in_sentence":"abyss","ko":"그녀가 공포에 질려 살기를 거부할 만큼 어떤 잔혹함의 심연을 들여다보았을까 궁금했다.","chapter":35},{"lemma":"complication","difficulty":"C1","gloss":"The act or process of complicating.","ipa":"/ˌkɒm.plɪˈkeɪ.ʃən/","sentence":"Stroeve went twice a day to the hospital to enquire after his wife, who still declined to see him; and came away at first relieved and hopeful because he was told that she seemed to be growing better, and then in despair because, the complication which the doctor had feared having ensued, recovery was impossible.","word_in_sentence":"complication","ko":"스트루브는 하루에 두 번씩 병원에 가서 아직도 그를 만나기를 거부하는 아내의 안부를 물었고, 처음에는 그녀가 나아지고 있는 것 같다는 말을 듣고 안도하며 희망을 품고 돌아왔지만, 의사가 우려했던 합병증이 생겨 회복이 불가능하다는 말을 듣고는 절망에 빠져 돌아왔다.","chapter":36},{"lemma":"ensue","difficulty":"C1","gloss":"To follow (a leader, inclination etc.).","ipa":"/ɪnˈsuː/","sentence":"The Chink was not backward to defend himself, and a very lively quarrel ensued.","word_in_sentence":"ensued","ko":"중국인도 뒤지지 않고 자신을 변호했고, 매우 격렬한 말다툼이 벌어졌다.","chapter":51},{"lemma":"pitiful","difficulty":"C1","gloss":"So appalling or sad that one feels or should feel sorry for it; eliciting pity.","ipa":"/ˈpɪt.ɪ.fl̩/","sentence":"The nurse was pitiful to his distress, but she had little to say that could console him.","word_in_sentence":"pitiful","ko":"간호사는 그의 괴로움을 불쌍히 여겼지만, 그를 위로할 만한 말은 거의 해줄 수 없었다.","chapter":36},{"lemma":"volubility","difficulty":"C2","gloss":"the state of being voluble","ipa":null,"sentence":"His volubility had left him at last, and he sank down wearily on my sofa.","word_in_sentence":"volubility","ko":"그토록 수다스럽던 그가 마침내 말문이 막혔고, 지친 듯 내 소파에 털썩 주저앉았다.","chapter":36},{"lemma":"condolence","difficulty":"C1","gloss":"Comfort, support or sympathy.","ipa":"/kənˈdoʊləns/","sentence":"I felt that no words of condolence availed, and I let him lie there quietly.","word_in_sentence":"condolence","ko":"어떤 위로의 말도 소용없을 것 같아서, 나는 그를 조용히 그대로 누워 있게 두었다.","chapter":36},{"lemma":"limply","difficulty":"C2","gloss":"In a limp manner, without support or resistance.","ipa":null,"sentence":"He lay on his back limply, as though all the strength had gone out of his limbs, and presently I saw that he had fallen asleep.","word_in_sentence":"limply","ko":"그는 마치 팔다리에서 모든 힘이 빠진 것처럼 축 늘어져 등을 대고 누워 있었고, 곧 그가 잠들어버린 것을 나는 알 수 있었다.","chapter":36},{"lemma":"necessitate","difficulty":"C1","gloss":"To make necessary; to behove; to require (something) to be brought about.","ipa":"/nɪˈsɛsɪteɪt/","sentence":"The circumstances of Blanche Stroeve’s death necessitated all manner of dreadful formalities, but at last we were allowed to bury her.","word_in_sentence":"necessitated","ko":"블랑슈 스트루브의 죽음으로 인해 온갖 끔찍한 절차들을 거쳐야 했지만, 마침내 우리는 그녀를 매장할 수 있게 되었다.","chapter":37},{"lemma":"formality","difficulty":"C1","gloss":"The state of being formal.","ipa":"/fɔːrˈmælɪti/","sentence":"The circumstances of Blanche Stroeve’s death necessitated all manner of dreadful formalities, but at last we were allowed to bury her.","word_in_sentence":"formalities","ko":"블랑슈 스트루브의 죽음으로 인해 온갖 끔찍한 절차들을 거쳐야 했지만, 마침내 우리는 그녀를 매장할 수 있게 되었다.","chapter":37},{"lemma":"hearse","difficulty":"C1","gloss":"A framework of wood or metal placed over the coffin or tomb of a deceased person, and covered with a pall; also, a temporary canopy bearing wax lights and set up in a church, under which the coffin was placed during the funeral ceremonies.","ipa":"/hɜːs/","sentence":"Dirk and I alone followed the hearse to the cemetery.","word_in_sentence":"hearse","ko":"디르크와 나만이 영구차를 따라 묘지까지 갔다.","chapter":37},{"lemma":"trot","difficulty":"C1","gloss":"A gait of a person or animal faster than a walk but slower than a run.","ipa":"/tɹɑt/","sentence":"We went at a foot-pace, but on the way back we trotted, and there was something to my mind singularly horrible in the way the driver of the hearse whipped up his horses.","word_in_sentence":"trotted","ko":"우리는 걸음걸이로 갔지만, 돌아오는 길에는 속보로 갔는데, 영구차 마부가 말들에게 채찍을 가하는 모습이 내 마음에는 묘하게 끔찍하게 느껴졌다.","chapter":37},{"lemma":"ruthlessly","difficulty":"C1","gloss":"In a ruthless manner; with cruelty; without pity or compassion.","ipa":"/ˈɹuːθ.ləs.li/","sentence":"He did not answer, but I went on ruthlessly:","word_in_sentence":"ruthlessly","ko":"그는 대답하지 않았지만 나는 무정하게 말을 계속했다.","chapter":37},{"lemma":"slacken","difficulty":"C2","gloss":"To gradually decrease in intensity or tautness; to become slack; to lag.","ipa":"/ˈslæ.kən/","sentence":"Slackening his pace for a moment, he leaned over and spoke.","word_in_sentence":"Slackening","ko":"잠시 속도를 늦춘 그가 몸을 기울이며 말을 걸었다.","chapter":37},{"lemma":"garb","difficulty":"C1","gloss":"Fashion, style of dressing oneself up.","ipa":"/ɡɑː(ɹ)b/","sentence":"His garb of woe suggested that he had lost in one catastrophe every relation he had in the world, even to cousins by marriage twice removed.","word_in_sentence":"garb","ko":"그의 상복 차림새는 마치 한 번의 재앙으로 이 세상의 모든 친척들을, 심지어 두 다리 건너 인척까지도 잃었다는 듯한 인상을 주었다.","chapter":38},{"lemma":"plumpness","difficulty":"C2","gloss":"The quality or state of being plump.","ipa":"/ˈplʌmpnəs/","sentence":"His plumpness and his red, fat cheeks made his mourning not a little incongruous.","word_in_sentence":"plumpness","ko":"그의 통통한 몸매와 붉고 살찐 볼은 그의 상복 차림을 적잖이 어울리지 않게 만들었다.","chapter":38},{"lemma":"buffoonery","difficulty":"C2","gloss":"The behaviour expected of a buffoon; foolishness, silliness.","ipa":"/bəˈfuːnəɹi/","sentence":"It was cruel that his extreme unhappiness should have in it something of buffoonery.","word_in_sentence":"buffoonery","ko":"그의 극도의 불행 속에 어딘가 우스꽝스러운 면이 있다는 것은 잔인한 일이었다.","chapter":38},{"lemma":"rejoinder","difficulty":"C2","gloss":"The defendant's answer to the replication.","ipa":"/ɹɪˈd͡ʒɔɪndɚ/","sentence":"I made an appropriate rejoinder, and he smiled wanly.","word_in_sentence":"rejoinder","ko":"나는 적절한 대답을 했고, 그는 쓸쓸하게 미소를 지었다.","chapter":38},{"lemma":"revisit","difficulty":"C1","gloss":"To visit again.","ipa":"/ɹiːˈvɪzɪt/","sentence":"I think I’d forgotten it all; I seemed to have come so far away from my father’s house that I was shy at the idea of revisiting it; but now I feel it’s my only refuge.”","word_in_sentence":"revisiting","ko":"모든 것을 잊어버린 것 같았어요. 아버지 집에서 너무 멀리 떨어져 나온 것 같아서 다시 찾아간다는 생각에 주저하게 되었는데, 이제는 그곳이 나의 유일한 피난처라는 생각이 듭니다.\"","chapter":38},{"lemma":"bruise","difficulty":"C1","gloss":"To strike (a person), originally with something flat or heavy, but now specifically in such a way as to discolour the skin without breaking it; to contuse.","ipa":"/bɹuːz/","sentence":"He was sore and bruised, and his thoughts went back to the tenderness of his mother’s love.","word_in_sentence":"bruised","ko":"그는 아프고 상처투성이였으며, 어머니의 따뜻한 사랑이 그리웠다.","chapter":38},{"lemma":"resiliency","difficulty":"C1","gloss":"Synonym of resilience.","ipa":null,"sentence":"The ridicule he had endured for years seemed now to weigh him down, and the final blow of Blanche’s treachery had robbed him of the resiliency which had made him take it so gaily.","word_in_sentence":"resiliency","ko":"수년간 견뎌온 조롱이 이제 그를 짓누르는 듯했고, 블랑슈의 배신이라는 마지막 일격이 그동안 그로 하여금 그 모든 것을 유쾌하게 받아들일 수 있게 해주던 회복력을 앗아가 버렸다.","chapter":38},{"lemma":"speck","difficulty":"C1","gloss":"A tiny spot or particle, especially of dirt.","ipa":"/spɛk/","sentence":"Everything was always in its place, and no where could you see a speck of dust.","word_in_sentence":"speck","ko":"모든 것이 항상 제자리에 있었고, 어디에서도 먼지 한 점을 찾아볼 수 없었다.","chapter":38},{"lemma":"mania","difficulty":"C1","gloss":"Violent derangement of mind; madness; insanity.","ipa":"/ˈmeɪ.ni.ə/","sentence":"It is her mania.","word_in_sentence":"mania","ko":"그것이 아내의 고질병이었다.","chapter":48},{"lemma":"toil","difficulty":"C1","gloss":"Labour, work, especially of a grueling nature.","ipa":"/tɔɪl/","sentence":"I saw a neat little old woman, with cheeks like apples, toiling away from morning to night, through the long years, to keep her house trim and spruce.","word_in_sentence":"toiling","ko":"나는 사과 같은 볼을 한 단정한 작은 노부인이 긴 세월 동안 아침부터 밤까지 쉬지 않고 일하며 집을 깔끔하고 단정하게 유지하는 모습을 떠올렸다.","chapter":38},{"lemma":"gnarl","difficulty":"C2","gloss":"A knot in wood; a knurl or a protuberance with twisted grain, on a tree.","ipa":"/nɑː(ɹ)l/","sentence":"His father was a spare old man, his hands gnarled after the work of a lifetime, silent and upright; in the evening he read the paper aloud, while his wife and daughter (now married to the captain of a fishing smack), unwilling to lose a moment, bent over their sewing.","word_in_sentence":"gnarled","ko":"그의 아버지는 마른 노인으로, 평생의 노동으로 거칠어진 손을 가졌으며, 과묵하고 꼿꼿했다. 저녁이면 그는 신문을 소리 내어 읽었고, 그의 아내와 딸(지금은 어선 선장과 결혼했다)은 한 순간도 허비하지 않으려는 듯 바느질에 몰두했다.","chapter":38},{"lemma":"civilisation","difficulty":"C1","gloss":"UK, Ireland, Australia, New Zealand, South Africa, Hong Kong, and Commonwealth spelling of civilization.","ipa":"/ˌsɪv.ɪ.laɪˈzeɪ.ʃən/","sentence":"They sounded strangely in the tropical night thousands of miles from civilisation.","word_in_sentence":"civilisation","ko":"문명에서 수천 마일 떨어진 열대의 밤에 그 선율들은 이상하게 들렸습니다.","chapter":53},{"lemma":"diligently","difficulty":"C1","gloss":"In a diligent manner, with appropriate effort, carefully.","ipa":"/ˈdɪlɪd͡ʒ(ə)ntli/","sentence":"Nothing ever happened in that little town, left behind by the advance of civilisation, and one year followed the next till death came, like a friend, to give rest to those who had laboured so diligently.","word_in_sentence":"diligently","ko":"문명의 발전에서 뒤처진 그 작은 마을에서는 아무 일도 일어나지 않았고, 해가 바뀌고 또 바뀌어 마침내 죽음이 친구처럼 찾아와 그토록 부지런히 일해온 사람들에게 안식을 주었다.","chapter":38},{"lemma":"flaxen","difficulty":"C2","gloss":"Made of or resembling flax fibers.","ipa":"/ˈflæk.sən/","sentence":"She was a little girl with blue eyes and a flaxen pigtail.","word_in_sentence":"flaxen","ko":"파란 눈에 아마색 땋은 머리를 한 어린 소녀였어요.","chapter":38},{"lemma":"pigtail","difficulty":"C2","gloss":"The tail of a pig.","ipa":"/ˈpɪɡ.teɪl/","sentence":"She was a little girl with blue eyes and a flaxen pigtail.","word_in_sentence":"pigtail","ko":"파란 눈에 아마색 땋은 머리를 한 어린 소녀였어요.","chapter":38},{"lemma":"quietness","difficulty":"C2","gloss":"Absence of sound; silence or hush.","ipa":null,"sentence":"We must see the beauty of quietness.","word_in_sentence":"quietness","ko":"우리는 고요함의 아름다움을 보아야 한다.","chapter":38},{"lemma":"inconspicuously","difficulty":"C2","gloss":"In an inconspicuous manner; so as not to attract attention or appear unusual or out of the ordinary.","ipa":null,"sentence":"We must go through life so inconspicuously that Fate does not notice us.","word_in_sentence":"inconspicuously","ko":"우리는 운명이 우리를 알아차리지 못하도록 눈에 띄지 않게 살아가야 한다.","chapter":38},{"lemma":"meek","difficulty":"C1","gloss":"Humble, non-boastful, modest, meager, or self-effacing.","ipa":"/miːk/","sentence":"She was no longer the meek, soft native girl, but a determined woman.","word_in_sentence":"meek","ko":"그녀는 더 이상 온순하고 부드러운 원주민 소녀가 아니라 단호한 여자였다.","chapter":55},{"lemma":"renunciation","difficulty":"C1","gloss":"The act of rejecting or renouncing something as invalid.","ipa":null,"sentence":"To me it was his broken spirit that expressed itself, and I rebelled against his renunciation.","word_in_sentence":"renunciation","ko":"내게는 그것이 그의 꺾인 정신이 드러내는 표현이었고, 나는 그의 체념에 반발했다.","chapter":38},{"lemma":"glisten","difficulty":"C2","gloss":"To reflect light with a glittering luster; to sparkle, coruscate, glint or flash.","ipa":"/ˈɡlɪsən/","sentence":"His kind eyes glistened.","word_in_sentence":"glistened","ko":"그의 다정한 눈이 반짝였다.","chapter":38},{"lemma":"garish","difficulty":"C1","gloss":"Overly ostentatious; so colorful as to be in bad taste.","ipa":"/ˈɡɛəɹɪʃ/","sentence":"They must look queer in their garish frames on the walls of the peasant house.","word_in_sentence":"garish","ko":"농가 벽에 걸린 화려한 액자 속에서 그 그림들은 분명 어색해 보일 것이다.","chapter":38},{"lemma":"impel","difficulty":"C2","gloss":"To urge a person; to press on; to incite to action or motion via intrinsic motivation.","ipa":"/ɪmˈpɛl/","sentence":"Something impelled him to go to the studio, some obscure desire for self-torture, and yet he dreaded the anguish that he foresaw.","word_in_sentence":"impelled","ko":"무언가가 그를 화실로 향하게 했다. 자기 자신을 괴롭히려는 어떤 막연한 욕망이었지만, 동시에 그는 예상되는 고통을 두려워했다.","chapter":39},{"lemma":"horribly","difficulty":"C1","gloss":"In a horrible way; very badly.","ipa":"/ˈhɔɹəbli/","sentence":"He felt horribly sick.","word_in_sentence":"horribly","ko":"그는 끔찍하게 속이 메스꺼웠다.","chapter":39},{"lemma":"ascent","difficulty":"C1","gloss":"The act of ascending; a motion upwards.","ipa":"/əˈsɛnt/","sentence":"He remembered how often he had waited for a minute or two on the landing to get his breath after the ascent, and how absurdly his impatience to see Blanche had taken it away again.","word_in_sentence":"ascent","ko":"계단을 오르고 나서 숨을 고르기 위해 층계참에서 1, 2분 기다리곤 했던 일들이 떠올랐고, 블랑슈를 보고 싶은 조급함이 그 숨을 다시 가쁘게 만들었던 것도 우스울 정도였다.","chapter":39},{"lemma":"absurdly","difficulty":"C1","gloss":"In an absurd fashion.","ipa":"/æbˈsɝd.li/","sentence":"He remembered how often he had waited for a minute or two on the landing to get his breath after the ascent, and how absurdly his impatience to see Blanche had taken it away again.","word_in_sentence":"absurdly","ko":"계단을 오르고 나서 숨을 고르기 위해 층계참에서 1, 2분 기다리곤 했던 일들이 떠올랐고, 블랑슈를 보고 싶은 조급함이 그 숨을 다시 가쁘게 만들었던 것도 우스울 정도였다.","chapter":39},{"lemma":"desertion","difficulty":"C1","gloss":"The act of deserting.","ipa":"/dɪˈzɜːʃən/","sentence":"The apartment had no look of desertion.","word_in_sentence":"desertion","ko":"아파트에는 버려진 기색이 전혀 없었다.","chapter":39},{"lemma":"tidiness","difficulty":"C2","gloss":"The quality of being tidy.","ipa":null,"sentence":"His wife’s tidiness was one of the traits which had so much pleased him; his own upbringing had given him a tender sympathy for the delight in orderliness; and when he had seen her instinctive desire to put each thing in its appointed place it had given him a little warm feeling in his heart.","word_in_sentence":"tidiness","ko":"아내의 정돈된 생활은 그를 그토록 기쁘게 했던 특징 중 하나였다. 그 자신의 성장 배경이 질서를 좋아하는 마음에 대한 따뜻한 공감을 심어주었고, 모든 것을 제자리에 두려는 그녀의 본능적인 욕구를 보았을 때 그의 마음에 작은 따뜻함을 안겨주었다.","chapter":39},{"lemma":"neatly","difficulty":"C1","gloss":"In a neat manner.","ipa":"/ˈniːtli/","sentence":"The drawing-room at the Hôtel de la Fleur was a small room, with a cottage piano, and a suite of mahogany furniture, covered in stamped velvet, neatly arranged around the walls.","word_in_sentence":"neatly","ko":"호텔 드 라 플뢰르의 응접실은 작은 방으로, 소형 피아노 한 대와 도장을 찍은 벨벳으로 덮인 마호가니 가구 한 벌이 벽을 따라 단정하게 배치되어 있었다.","chapter":51},{"lemma":"nightdress","difficulty":"C2","gloss":"A nightgown; (usually female) attire designed to be worn to bed.","ipa":"/ˈnaɪt.dɹes/","sentence":"The bedroom looked as though she had just left it: the brushes were neatly placed on the toilet-table, one on each side of the comb; someone had smoothed down the bed on which she had spent her last night in the studio; and her nightdress in a little case lay on the pillow.","word_in_sentence":"nightdress","ko":"침실은 그녀가 방금 나간 것처럼 보였다. 빗들은 화장대 위에 빗을 사이에 두고 양쪽에 하나씩 가지런히 놓여 있었고, 누군가 그녀가 작업실에서 보낸 마지막 밤을 지낸 침대를 매끄럽게 정리해 놓았으며, 작은 케이스에 든 잠옷이 베개 위에 놓여 있었다.","chapter":39},{"lemma":"methodicalness","difficulty":"C2","gloss":"The property of being methodical.","ipa":null,"sentence":"Her methodicalness made her suicide more deliberate.","word_in_sentence":"methodicalness","ko":"그녀의 체계적인 성격이 자살을 더욱 의도적인 것으로 만들었다.","chapter":39},{"lemma":"cupboard","difficulty":"C1","gloss":"A board or table used to openly hold and display silver plate and other dishware; a sideboard; a buffet.","ipa":"/ˈkʌb.əd/","sentence":"He had a sudden vision of her standing in the kitchen—it was hardly larger than a cupboard—washing the plates and glasses, the forks and spoons, giving the knives a rapid polish on the knife-board; and then putting everything away, giving the sink a scrub, and hanging the dish-cloth up to dry—it was there still, a gray torn rag; then looking round to see that everything was clean and nice.","word_in_sentence":"cupboard","ko":"그는 갑자기 그녀가 부엌에 서 있는 모습이 눈에 떠올랐다—찬장보다 조금 클 뿐인 그 부엌에서 접시와 잔들, 포크와 숟가락을 씻고, 칼판에 칼들을 재빠르게 닦아내고, 그런 다음 모든 것을 제자리에 정리하고, 개수대를 문지르고, 행주를 걸어 말리는—그 행주는 아직도 거기 있었다, 회색빛 너덜너덜한 걸레가—그리고 나서 모든 것이 깨끗하고 말끔한지 둘러보는 모습이.","chapter":39},{"lemma":"brocade","difficulty":"C1","gloss":"A thick heavy fabric into which raised patterns have been woven, originally in gold and silver; more recently any cloth incorporating raised, woven patterns.","ipa":"/bɹəˈkeɪd/","sentence":"There were bits of old brocade on the walls, and the piano was covered with a piece of silk, beautiful and tarnished; in one corner was a copy of the Venus of Milo, and in another of the Venus of the Medici.","word_in_sentence":"brocade","ko":"벽에는 낡은 비단 조각들이 걸려 있었고, 피아노는 아름답지만 빛바랜 비단으로 덮여 있었다. 한쪽 구석에는 밀로의 비너스 복제품이, 다른 구석에는 메디치의 비너스 복제품이 놓여 있었다.","chapter":39},{"lemma":"tarnish","difficulty":"C1","gloss":"Oxidation or discoloration, especially of a decorative metal exposed to air.","ipa":"/ˈtɑːnɪʃ/","sentence":"There were bits of old brocade on the walls, and the piano was covered with a piece of silk, beautiful and tarnished; in one corner was a copy of the Venus of Milo, and in another of the Venus of the Medici.","word_in_sentence":"tarnished","ko":"벽에는 낡은 비단 조각들이 걸려 있었고, 피아노는 아름답지만 빛바랜 비단으로 덮여 있었다. 한쪽 구석에는 밀로의 비너스 복제품이, 다른 구석에는 메디치의 비너스 복제품이 놓여 있었다.","chapter":39},{"lemma":"surmount","difficulty":"C2","gloss":"To get or be over without touching or resting on; to overcome.","ipa":"/sɚˈmaʊnt/","sentence":"Here and there was an Italian cabinet surmounted with Delft, and here and there a bas-relief.","word_in_sentence":"surmounted","ko":"여기저기에는 델프트 도자기를 올린 이탈리아식 캐비닛이 있었고, 또 여기저기에는 부조가 있었다.","chapter":39},{"lemma":"angrily","difficulty":"C1","gloss":"In an angry manner; under the influence of anger.","ipa":"/ˈæŋ.ɡɹə.li/","sentence":"He flung it back against the wall angrily—what did he mean by leaving it","word_in_sentence":"angrily","ko":"그는 화가 나서 캔버스를 벽에 다시 기대어 세웠다—도대체 왜 그것을 거기","chapter":39},{"lemma":"mater","difficulty":"C1","gloss":"Mother.","ipa":"/ˈmeɪtɚ/","sentence":"No mater whose the picture, he could not leave it there in the dust, and he raised it; but then curiosity got the better of him.","word_in_sentence":"mater","ko":"누구의 그림이든 상관없이, 그는 그것을 먼지 속에 그대로 둘 수 없어서 일으켜 세웠다. 하지만 그때 호기심이 그를 사로잡았다.","chapter":39},{"lemma":"swam","difficulty":"C1","gloss":"simple past of swim","ipa":"/swæm/","sentence":"Stroeve’s head swam.","word_in_sentence":"swam","ko":"스트루브의 머리가 어지러웠다.","chapter":39},{"lemma":"inarticulate","difficulty":"C2","gloss":"Not articulated in normal words.","ipa":"/ɪn.ɑɹˈtɪk.jə.lət/","sentence":"Grief and jealousy and rage seized him, and he cried out hoarsely; he was inarticulate; he clenched his fists and raised them threateningly at an invisible enemy.","word_in_sentence":"inarticulate","ko":"슬픔과 질투와 분노가 그를 사로잡았고, 그는 쉰 목소리로 외쳤다. 말이 제대로 나오지 않았다. 주먹을 꽉 쥐고 보이지 않는 적을 향해 위협적으로 치켜들었다.","chapter":39},{"lemma":"threateningly","difficulty":"C2","gloss":"In a threatening manner.","ipa":null,"sentence":"Grief and jealousy and rage seized him, and he cried out hoarsely; he was inarticulate; he clenched his fists and raised them threateningly at an invisible enemy.","word_in_sentence":"threateningly","ko":"슬픔과 질투와 분노가 그를 사로잡았고, 그는 쉰 목소리로 외쳤다. 말이 제대로 나오지 않았다. 주먹을 꽉 쥐고 보이지 않는 적을 향해 위협적으로 치켜들었다.","chapter":39},{"lemma":"rummage","difficulty":"C1","gloss":"To arrange (cargo, goods, etc.) in the hold of a ship; to move or rearrange such goods.","ipa":"/ˈɹʌm.ɪd͡ʒ/","sentence":"He could see nothing that would serve his purpose; he rummaged about his painting things; somehow he could not find a thing; he was frantic.","word_in_sentence":"rummaged","ko":"목적에 맞는 것은 아무것도 보이지 않았다. 그는 화구들을 뒤져보았지만 어찌된 일인지 아무것도 찾을 수 없었다. 그는 미쳐버릴 것 같았다.","chapter":39},{"lemma":"frantic","difficulty":"C1","gloss":"Insane, mentally unstable.","ipa":"/ˈfɹæntɪk/","sentence":"He could see nothing that would serve his purpose; he rummaged about his painting things; somehow he could not find a thing; he was frantic.","word_in_sentence":"frantic","ko":"목적에 맞는 것은 아무것도 보이지 않았다. 그는 화구들을 뒤져보았지만 어찌된 일인지 아무것도 찾을 수 없었다. 그는 미쳐버릴 것 같았다.","chapter":39},{"lemma":"scraper","difficulty":"C1","gloss":"An instrument by which the soles of shoes are cleaned from mud by drawing them across it.","ipa":"/ˈskɹeɪpɚ/","sentence":"I moved a little to see it better, and my foot knocked against the scraper.","word_in_sentence":"scraper","ko":"더 잘 보려고 조금 움직였는데, 내 발이 신발 닦개에 부딪혔다.","chapter":39},{"lemma":"brandish","difficulty":"C2","gloss":"To move or swing a weapon back and forth, particularly if demonstrating anger, threat or skill.","ipa":"/ˈbɹændɪʃ/","sentence":"As Stroeve told me this he became as excited as when the incident occurred, and he took hold of a dinner-knife on the table between us, and brandished it.","word_in_sentence":"brandished","ko":"스트루브가 나에게 이 이야기를 할 때 그는 그 일이 벌어졌을 때만큼이나 흥분했고, 우리 사이 테이블 위에 있던 식칼을 집어 들고 휘둘렀다.","chapter":39},{"lemma":"tremulous","difficulty":"C2","gloss":"Trembling, quivering, or shaking.","ipa":"/ˈtɹɛmjʊləs/","sentence":"He looked at me with a tremulous smile.","word_in_sentence":"tremulous","ko":"그는 떨리는 미소를 지으며 나를 바라보았다.","chapter":39},{"lemma":"incoherent","difficulty":"C1","gloss":"Not making logical sense; not logically connected or consistent.","ipa":null,"sentence":"Stroeve tried to talk to me about the picture, but he was incoherent, and I had to guess at what he meant.","word_in_sentence":"incoherent","ko":"스트루브는 그 그림에 대해 나와 이야기하려 했지만, 말이 앞뒤가 맞지 않아서 나는 그의 뜻을 짐작해야 했다.","chapter":39},{"lemma":"unsuspected","difficulty":"C2","gloss":"Not suspected; not having raised suspicion.","ipa":null,"sentence":"He had found, not himself, as the phrase goes, but a new soul with unsuspected powers.","word_in_sentence":"unsuspected","ko":"그는 흔히 말하는 자기 자신을 찾은 것이 아니라, 예상치 못한 힘을 가진 새로운 영혼을 찾았다.","chapter":39},{"lemma":"simplification","difficulty":"C1","gloss":"The act of simplifying or something that has been simplified.","ipa":"/ˌsɪm.plɪ.fɪˈkeɪ.ʃən/","sentence":"I knew nothing of the simplification at which he aimed.","word_in_sentence":"simplification","ko":"나는 그가 추구하던 단순화에 대해 전혀 알지 못했다.","chapter":42},{"lemma":"miraculous","difficulty":"C1","gloss":"By supernatural or uncommon causes, e.g. by a god; that cannot be explained in terms of normal events.","ipa":"/mɪˈɹæk.jʊ.ləs/","sentence":"It was not only the bold simplification of the drawing which showed so rich and so singular a personality; it was not only the painting, though the flesh was painted with a passionate sensuality which had in it something miraculous; it was not only the solidity, so that you felt extraordinarily the weight of the body; there was also a spirituality, troubling and new, which led the imagination along unsuspected ways, and suggested dim empty spaces, lit only by the eternal stars, where the soul, all naked, adventured fearful to the discovery of new mysteries.","word_in_sentence":"miraculous","ko":"그토록 풍부하고 독특한 개성을 보여주는 것은 단지 대담한 소묘의 단순화만이 아니었다. 단지 회화 기법만도 아니었다. 비록 살결이 기적적인 무언가를 담은 열정적인 관능미로 그려졌지만 말이다. 단지 육체의 무게감을 놀라울 정도로 느끼게 하는 견고함만도 아니었다. 거기에는 또한 불안하고 새로운 영성이 있어서, 상상력을 예상치 못한 길로 이끌고, 영원한 별들만이 비추는 희미하고 공허한 공간들을 암시했다. 그곳에서 벌거벗은 영혼이 새로운 신비의 발견을 향해 두려워하며 모험을 떠나는 곳을.","chapter":39},{"lemma":"solidity","difficulty":"C1","gloss":"The state or quality of being solid.","ipa":"/səˈlɪdɪti/","sentence":"It was not only the bold simplification of the drawing which showed so rich and so singular a personality; it was not only the painting, though the flesh was painted with a passionate sensuality which had in it something miraculous; it was not only the solidity, so that you felt extraordinarily the weight of the body; there was also a spirituality, troubling and new, which led the imagination along unsuspected ways, and suggested dim empty spaces, lit only by the eternal stars, where the soul, all naked, adventured fearful to the discovery of new mysteries.","word_in_sentence":"solidity","ko":"그토록 풍부하고 독특한 개성을 보여주는 것은 단지 대담한 소묘의 단순화만이 아니었다. 단지 회화 기법만도 아니었다. 비록 살결이 기적적인 무언가를 담은 열정적인 관능미로 그려졌지만 말이다. 단지 육체의 무게감을 놀라울 정도로 느끼게 하는 견고함만도 아니었다. 거기에는 또한 불안하고 새로운 영성이 있어서, 상상력을 예상치 못한 길로 이끌고, 영원한 별들만이 비추는 희미하고 공허한 공간들을 암시했다. 그곳에서 벌거벗은 영혼이 새로운 신비의 발견을 향해 두려워하며 모험을 떠나는 곳을.","chapter":39},{"lemma":"adventured","difficulty":"C2","gloss":"simple past and past participle of adventure","ipa":null,"sentence":"It was not only the bold simplification of the drawing which showed so rich and so singular a personality; it was not only the painting, though the flesh was painted with a passionate sensuality which had in it something miraculous; it was not only the solidity, so that you felt extraordinarily the weight of the body; there was also a spirituality, troubling and new, which led the imagination along unsuspected ways, and suggested dim empty spaces, lit only by the eternal stars, where the soul, all naked, adventured fearful to the discovery of new mysteries.","word_in_sentence":"adventured","ko":"그토록 풍부하고 독특한 개성을 보여주는 것은 단지 대담한 소묘의 단순화만이 아니었다. 단지 회화 기법만도 아니었다. 비록 살결이 기적적인 무언가를 담은 열정적인 관능미로 그려졌지만 말이다. 단지 육체의 무게감을 놀라울 정도로 느끼게 하는 견고함만도 아니었다. 거기에는 또한 불안하고 새로운 영성이 있어서, 상상력을 예상치 못한 길로 이끌고, 영원한 별들만이 비추는 희미하고 공허한 공간들을 암시했다. 그곳에서 벌거벗은 영혼이 새로운 신비의 발견을 향해 두려워하며 모험을 떠나는 곳을.","chapter":39},{"lemma":"rhetorical","difficulty":"C1","gloss":"Part of or similar to rhetoric, the use of language as a means to persuade.","ipa":"/ɹɪˈtɔɹɪkəl/","sentence":"If I am rhetorical it is because Stroeve was rhetorical.","word_in_sentence":"rhetorical","ko":"내가 수사적으로 말하는 것은 스트루브가 수사적이었기 때문이다.","chapter":39},{"lemma":"novelette","difficulty":"C2","gloss":"A short novel, synonymous with novella.","ipa":"/nɒvəˈlɛt/","sentence":"(Do we not know that man in moments of emotion expresses himself naturally in the terms of a novelette?)","word_in_sentence":"novelette","ko":"(감정에 휩싸인 순간 인간이 자연스럽게 통속소설의 어투로 자신을 표현한다는 것을 우리는 알지 않는가?)","chapter":39},{"lemma":"carelessly","difficulty":"C1","gloss":"Giving the appearance of carelessness; relaxedly.","ipa":"/ˈkɛɹləsli/","sentence":"But one fact he made clear to me; people talk of beauty lightly, and having no feeling for words, they use that one carelessly, so that it loses its force; and the thing it stands for, sharing its name with a hundred trivial objects, is deprived of dignity.","word_in_sentence":"carelessly","ko":"하지만 그가 내게 분명히 해준 사실이 하나 있었다. 사람들은 아름다움에 대해 가볍게 말하고, 언어에 대한 감각이 없어서 그 단어를 함부로 사용하므로 그 힘을 잃게 만든다는 것이었다. 그리고 그 단어가 가리키는 대상은 수많은 하찮은 것들과 이름을 공유하게 되어 존엄성을 박탈당한다는 것이었다.","chapter":39},{"lemma":"deprive","difficulty":"C1","gloss":"Used with “of”, to take something away from (someone) and keep it away; to deny someone something.","ipa":"/dɪˈpɹaɪv/","sentence":"“Yes; for I knew that here was a work of genius, and I did not think we had the right to deprive the world of it.","word_in_sentence":"deprive","ko":"\"그렇습니다. 그것이 천재의 작품이라는 것을 알았고, 우리가 세상에서 그것을 빼앗을 권리는 없다고 생각했기 때문입니다.","chapter":57},{"lemma":"charlatan","difficulty":"C1","gloss":"A mountebank, someone who addresses crowds in the street; (especially), an itinerant seller of medicines or drugs.","ipa":"/ˈʃɑɹlətən/","sentence":"Like the charlatan who counterfeits a spiritual force he has sometimes felt, they lose the power they have abused.","word_in_sentence":"charlatan","ko":"때때로 느꼈던 영적 힘을 가짜로 흉내 내는 허풍쟁이처럼, 그들은 자신이 남용했던 힘을 잃어버린다.","chapter":39},{"lemma":"counterfeit","difficulty":"C1","gloss":"False, especially of money; intended to deceive or carry appearance of being genuine.","ipa":"/ˈkaʊn.tɚˌfɪt/","sentence":"Like the charlatan who counterfeits a spiritual force he has sometimes felt, they lose the power they have abused.","word_in_sentence":"counterfeits","ko":"때때로 느꼈던 영적 힘을 가짜로 흉내 내는 허풍쟁이처럼, 그들은 자신이 남용했던 힘을 잃어버린다.","chapter":39},{"lemma":"unconquerable","difficulty":"C2","gloss":"Not conquerable; indomitable.","ipa":"/ʌnˈkɒŋkəɹəbəl/","sentence":"It seemed to emphasise the unconquerable spirit of man.","word_in_sentence":"unconquerable","ko":"그것이 인간의 불굴의 정신을 강조하는 것 같았다.","chapter":48},{"lemma":"dumbfound","difficulty":"C2","gloss":"To confuse and bewilder; to leave speechless.","ipa":"/ˈdʌm.faʊnd/","sentence":"I was dumbfounded.","word_in_sentence":"dumbfounded","ko":"나는 어안이 벙벙했다.","chapter":39},{"lemma":"soften","difficulty":"C1","gloss":"To make something soft or softer.","ipa":"/ˈsɔf(t)ən/","sentence":"I hoped that the grief which now seemed intolerable would be softened by the lapse of time, and a merciful forgetfulness would help him to take up once more the burden of life.","word_in_sentence":"softened","ko":"지금은 견딜 수 없을 것 같은 슬픔도 시간이 흐르면서 누그러지고, 자비로운 망각이 그로 하여금 다시 한번 삶의 짐을 짊어지는 데 도움이 되기를 바랐다.","chapter":39},{"lemma":"lapse","difficulty":"C1","gloss":"A temporary failure; a slip.","ipa":"/læps/","sentence":"I hoped that the grief which now seemed intolerable would be softened by the lapse of time, and a merciful forgetfulness would help him to take up once more the burden of life.","word_in_sentence":"lapse","ko":"지금은 견딜 수 없을 것 같은 슬픔도 시간이 흐르면서 누그러지고, 자비로운 망각이 그로 하여금 다시 한번 삶의 짐을 짊어지는 데 도움이 되기를 바랐다.","chapter":39},{"lemma":"forgetfulness","difficulty":"C1","gloss":"The quality of being forgetful; proneness to let slip from the mind.","ipa":"/fəˈɡɛtfʊlnɪs/","sentence":"I hoped that the grief which now seemed intolerable would be softened by the lapse of time, and a merciful forgetfulness would help him to take up once more the burden of life.","word_in_sentence":"forgetfulness","ko":"지금은 견딜 수 없을 것 같은 슬픔도 시간이 흐르면서 누그러지고, 자비로운 망각이 그로 하여금 다시 한번 삶의 짐을 짊어지는 데 도움이 되기를 바랐다.","chapter":39},{"lemma":"unpleasurable","difficulty":"C2","gloss":"That gives displeasure.","ipa":null,"sentence":"He was young still, and in a few years he would look back on all his misery with a sadness in which there would be something not unpleasurable.","word_in_sentence":"unpleasurable","ko":"그는 아직 젊었고, 몇 년 후면 자신의 모든 비참함을 돌아보며 불쾌하지만은 않은 무언가가 담긴 슬픔을 느끼게 될 것이었다.","chapter":39},{"lemma":"repulsion","difficulty":"C1","gloss":"The act of repelling or the condition of being repelled.","ipa":"/ɹɪˈpʌlʃən/","sentence":"The sight of him brought back to me all the horror which I was not unwilling to forget, and I felt in me a sudden repulsion for the cause of it.","word_in_sentence":"repulsion","ko":"그의 모습을 보자 잊고 싶었던 모든 공포가 되살아났고, 그 원인에 대한 갑작스러운 혐오감이 내 안에서 솟구쳤다.","chapter":40},{"lemma":"cordially","difficulty":"C1","gloss":"In a cordial, warm, friendly or heartfelt manner.","ipa":"/ˈkɔɹd͡ʒəli/","sentence":"“You’re in a great hurry,” he said cordially.","word_in_sentence":"cordially","ko":"\"참 급하시는군요.\" 그가 다정하게 말했다.","chapter":40},{"lemma":"geniality","difficulty":"C2","gloss":"The quality of being genial; friendly cheerfulness; warmth of disposition and manners.","ipa":null,"sentence":"It was characteristic of him to display geniality with anyone who showed a disinclination to meet him, and the coolness of my greeting can have left him in little doubt of that.","word_in_sentence":"geniality","ko":"자신을 만나기 꺼리는 기색을 보이는 사람에게는 누구든 친근함을 과시하는 것이 그의 특징이었고, 내가 차갑게 인사한 것만 봐도 그는 충분히 눈치챘을 것이다.","chapter":40},{"lemma":"disinclination","difficulty":"C2","gloss":"The state of being disinclined; want of propensity, desire, or affection; slight aversion or dislike","ipa":"/ˌdɪsɪŋklɪˈneɪʃən/","sentence":"It was characteristic of him to display geniality with anyone who showed a disinclination to meet him, and the coolness of my greeting can have left him in little doubt of that.","word_in_sentence":"disinclination","ko":"자신을 만나기 꺼리는 기색을 보이는 사람에게는 누구든 친근함을 과시하는 것이 그의 특징이었고, 내가 차갑게 인사한 것만 봐도 그는 충분히 눈치챘을 것이다.","chapter":40},{"lemma":"stationer","difficulty":"C2","gloss":"A person or business that sells stationery.","ipa":null,"sentence":"At last we passed a stationer’s, and it occurred to me that I might as well buy some paper.","word_in_sentence":"stationer","ko":"마침내 우리는 문구점을 지나게 되었고, 종이를 좀 사는 것도 괜찮겠다는 생각이 들었다.","chapter":40},{"lemma":"frigidly","difficulty":"C2","gloss":"In a frigid manner; coldly; icily.","ipa":null,"sentence":"“You might wait for an invitation,” I retorted frigidly.","word_in_sentence":"frigidly","ko":"\"초대를 받고 나서 그러시지요.\" 내가 차갑게 응수했다.","chapter":40},{"lemma":"creditable","difficulty":"C1","gloss":"Credible or believable.","ipa":"/ˈkɹɛdɪtəbəl/","sentence":"“Damn it all,” I said, more violently because I had an inkling my motive was none too creditable, “I don’t want to know you.”","word_in_sentence":"creditable","ko":"\"젠장,\" 내 동기가 그리 떳떳하지 못하다는 것을 어렴풋이 알았기에 더욱 격렬하게 말했다. \"당신을 알고 싶지 않습니다.\"","chapter":40},{"lemma":"insolently","difficulty":"C2","gloss":"In an insolent manner.","ipa":null,"sentence":"“I suppose you are hard up,” I remarked insolently.","word_in_sentence":"insolently","ko":"\"돈이 궁한 모양이군.\" 내가 건방지게 말했다.","chapter":40},{"lemma":"deprave","difficulty":"C2","gloss":"To speak ill of; to depreciate; to malign; to revile","ipa":"/dɪˈpɹeɪv/","sentence":"What he said had a hateful truth in it, and another defect of my character is that I enjoy the company of those, however depraved, who can give me a Roland for my Oliver.","word_in_sentence":"depraved","ko":"그의 말에는 미워할 만큼 진실한 구석이 있었고, 내 성격의 또 다른 결함은 아무리 타락한 자라도 나에게 맞받아칠 수 있는 사람들과 어울리는 것을 즐긴다는 것이었다.","chapter":40},{"lemma":"abhorrence","difficulty":"C2","gloss":"Extreme aversion or detestation; the feeling of utter dislike or loathing.","ipa":"/æbˈhɔɹ.n̩(t)s/","sentence":"I began to feel that my abhorrence for Strickland could only be sustained by an effort on my part.","word_in_sentence":"abhorrence","ko":"스트릭랜드에 대한 나의 혐오감은 내가 의식적으로 노력해야만 유지할 수 있는 것임을 깨닫기 시작했다.","chapter":40},{"lemma":"disapprobation","difficulty":"C2","gloss":"An act or expression of condemnation or disapproval, especially on moral grounds.","ipa":"/dɪsˌæpɹəˈbeɪʃən/","sentence":"I recognised my moral weakness, but saw that my disapprobation had in it already something of a pose; and I knew that if I felt it, his own keen instinct had discovered it, too.","word_in_sentence":"disapprobation","ko":"나는 내 도덕적 나약함을 인정했지만, 내 비난에는 이미 어딘가 가식적인 면이 있음을 알았다. 그리고 내가 그것을 느꼈다면, 그의 예리한 직감 역시 그것을 간파했으리라는 것을 알았다.","chapter":40},{"lemma":"taciturnity","difficulty":"C2","gloss":"The trait of being taciturn.","ipa":null,"sentence":"I left him the last word, and sought refuge in a shrug of the shoulders and taciturnity.","word_in_sentence":"taciturnity","ko":"나는 그에게 마지막 말을 양보하고, 어깨를 으쓱하며 침묵 속으로 도피했다.","chapter":40},{"lemma":"sensibility","difficulty":"C1","gloss":"The ability to sense, feel or perceive; responsiveness to sensory stimuli; sensitivity.","ipa":"/ˌsɛnsɪˈbɪlɪti/","sentence":"Until long habit has blunted the sensibility, there is something disconcerting to the writer in the instinct which causes him to take an interest in the singularities of human nature so absorbing that his moral sense is powerless against it.","word_in_sentence":"sensibility","ko":"오랜 습관이 감수성을 무디게 만들기 전까지는, 인간 본성의 특이한 면에 빠져들어 도덕적 감각마저 무력하게 만드는 본능이 작가에게는 당황스러운 것이다.","chapter":41},{"lemma":"contemplation","difficulty":"C1","gloss":"The act of contemplating; musing; being highly concentrated in thought","ipa":"/ˌkɒntəmˈpleɪʃən/","sentence":"We are untouched by ambition, and what pride we have is due only to our contemplation of the work of our hands.","word_in_sentence":"contemplation","ko":"우리는 야심에 물들지 않았고, 우리가 가진 자부심이라고는 오직 우리 손으로 만든 작품을 바라보며 느끼는 것뿐입니다.","chapter":54},{"lemma":"scoundrel","difficulty":"C1","gloss":"A mean, worthless fellow; a rascal; a villain; a person without honor or virtue.","ipa":"/ˈskaʊ̯ndɹəl/","sentence":"The character of a scoundrel, logical and complete, has a fascination for his creator which is an outrage to law and order.","word_in_sentence":"scoundrel","ko":"논리적이고 완전한 악한의 성격은 창조자에게 법과 질서에 대한 모독이라 할 만한 매혹을 안겨준다.","chapter":41},{"lemma":"gusto","difficulty":"C1","gloss":"Enthusiasm; enjoyment, vigor.","ipa":"/ˈɡʌstoʊ/","sentence":"I expect that Shakespeare devised Iago with a gusto which he never knew when, weaving moonbeams with his fancy, he imagined Desdemona.","word_in_sentence":"gusto","ko":"셰익스피어가 달빛을 상상력으로 엮어 데스데모나를 창조할 때는 결코 느끼지 못했던 열정으로 이아고를 고안해냈으리라 생각한다.","chapter":41},{"lemma":"moonbeam","difficulty":"C2","gloss":"A shaft of moonlight.","ipa":"/ˈmun.bim/","sentence":"I expect that Shakespeare devised Iago with a gusto which he never knew when, weaving moonbeams with his fancy, he imagined Desdemona.","word_in_sentence":"moonbeams","ko":"셰익스피어가 달빛을 상상력으로 엮어 데스데모나를 창조할 때는 결코 느끼지 못했던 열정으로 이아고를 고안해냈으리라 생각한다.","chapter":41},{"lemma":"gratifie","difficulty":"C2","gloss":{"en":"A feeling of pleasure or satisfaction.","ko":"기쁨","zh":"愉悦"},"ipa":"","sentence":"It may be that in his rogues the writer gratifies instincts deep-rooted in him, which the manners and customs of a civilised world have forced back to the mysterious recesses of the subconscious.","word_in_sentence":"gratifies","ko":"작가는 자신의 악역들을 통해 문명 세계의 예의와 관습에 의해 잠재의식의 신비로운 깊은 곳으로 밀려난, 자신 안에 깊이 뿌리박힌 본능들을 충족시키는 것일지도 모른다.","chapter":41},{"lemma":"scalpel","difficulty":"C1","gloss":"A small straight knife with a very sharp blade used for surgery, dissection and craftwork.","ipa":"/ˈskælpəl/","sentence":"I applied the scalpel boldly.","word_in_sentence":"scalpel","ko":"나는 과감하게 메스를 들이댔다.","chapter":41},{"lemma":"boldly","difficulty":"C1","gloss":"In a bold manner; with confidence.","ipa":"/ˈbəʊldli/","sentence":"I applied the scalpel boldly.","word_in_sentence":"boldly","ko":"나는 과감하게 메스를 들이댔다.","chapter":41},{"lemma":"mince","difficulty":"C1","gloss":"Finely chopped meat; minced meat.","ipa":"/mɪns/","sentence":"His callousness was inhuman, and in my indignation I was not inclined to mince my words.","word_in_sentence":"mince","ko":"그의 냉혹함은 비인간적이었고, 분개한 나는 말을 에둘러 할 생각이 없었다.","chapter":41},{"lemma":"twinge","difficulty":"C1","gloss":"To have a sudden, pinching or sharp pain in a specific part of the body, like a twitch.","ipa":"/twɪnd͡ʒ/","sentence":"“As a mere matter of curiosity I wish you’d tell me, have you felt the smallest twinge of remorse for Blanche Stroeve’s death?”","word_in_sentence":"twinge","ko":"\"순전히 호기심에서 묻는 건데, 블랑슈 스트루브의 죽음에 대해 조금이라도 양심의 가책을 느낀 적이 있습니까?\"","chapter":41},{"lemma":"impassive","difficulty":"C2","gloss":"Having, or revealing, no emotion.","ipa":"/ɪmˈpæsɪv/","sentence":"I watched his face for some change of expression, but it remained impassive.","word_in_sentence":"impassive","ko":"나는 그의 얼굴에 표정 변화가 있는지 살펴보았지만, 여전히 무표정했다.","chapter":41},{"lemma":"discerning","difficulty":"C1","gloss":"present participle and gerund of discern","ipa":"/dɪˈsɜːn.iŋ/","sentence":"“You are a discerning fellow.","word_in_sentence":"discerning","ko":"\"당신은 참으로 눈이 밝은 사람이군.","chapter":41},{"lemma":"governess","difficulty":"C1","gloss":"A woman paid to educate children in their own home.","ipa":"/ˈɡʌvɚnəs/","sentence":"“She was a governess in the family of some Roman prince, and the son of the house seduced her.","word_in_sentence":"governess","ko":"\"그녀는 어떤 로마 귀족 집안의 가정교사였는데, 그 집 아들이 그녀를 유혹했다.","chapter":41},{"lemma":"seduce","difficulty":"C1","gloss":"To beguile or lure (someone) away from duty, accepted principles, or proper conduct; to lead astray.","ipa":"/sɪˈd(j)uːs/","sentence":"“She was a governess in the family of some Roman prince, and the son of the house seduced her.","word_in_sentence":"seduced","ko":"\"그녀는 어떤 로마 귀족 집안의 가정교사였는데, 그 집 아들이 그녀를 유혹했다.","chapter":41},{"lemma":"assorted","difficulty":"C1","gloss":"simple past and past participle of assort","ipa":null,"sentence":"I had often wondered why that ill-assorted pair had married, but just that explanation had never occurred to me.","word_in_sentence":"assorted","ko":"나는 그 어울리지 않는 부부가 왜 결혼했는지 종종 궁금해했지만, 바로 그런 설명은 생각해본 적이 없었다.","chapter":41},{"lemma":"tranquillity","difficulty":"C1","gloss":"The state of being tranquil; peacefulness, the absence of disturbance or stress; serenity; calm.","ipa":"/tɹæŋˈkwɪl.ɪ.ti/","sentence":"Her tranquillity was like the sullen calm that broods over an island which has been swept by a hurricane.","word_in_sentence":"tranquillity","ko":"그녀의 평온함은 허리케인에 휩쓸린 섬 위에 드리워진 음울한 고요와 같았다.","chapter":41},{"lemma":"brood","difficulty":"C1","gloss":"The young of certain animals, especially a group of young birds or fowl hatched at one time by the same mother.","ipa":"/bɹuːd/","sentence":"Her tranquillity was like the sullen calm that broods over an island which has been swept by a hurricane.","word_in_sentence":"broods","ko":"그녀의 평온함은 허리케인에 휩쓸린 섬 위에 드리워진 음울한 고요와 같았다.","chapter":41},{"lemma":"cynicism","difficulty":"C1","gloss":"A distrustful attitude.","ipa":"/ˈsɪn.ɪˌsɪzəm/","sentence":"Strickland interrupted my reflections with an observation the profound cynicism of which startled me.","word_in_sentence":"cynicism","ko":"스트릭랜드가 깊은 냉소주의가 담긴 말로 내 생각을 가로막았는데, 그 말이 나를 놀라게 했다.","chapter":41},{"lemma":"reassuring","difficulty":"C1","gloss":"present participle and gerund of reassure","ipa":"/ɹiːəˈʃɔːɹɪŋ/","sentence":"“It must be reassuring to you to know that you certainly run no risk of incurring the resentment of the women you come in contact with,” I retorted.","word_in_sentence":"reassuring","ko":"\"당신과 접촉하는 여자들의 원한을 살 위험은 전혀 없다는 걸 아니 안심이 되겠군요.\" 내가 쏘아붙였다.","chapter":41},{"lemma":"incur","difficulty":"C1","gloss":"To bring upon oneself or expose oneself to, especially something inconvenient, harmful, or onerous; to become liable or subject to.","ipa":"/ɪnˈkɜː/","sentence":"“It must be reassuring to you to know that you certainly run no risk of incurring the resentment of the women you come in contact with,” I retorted.","word_in_sentence":"incurring","ko":"\"당신과 접촉하는 여자들의 원한을 살 위험은 전혀 없다는 걸 아니 안심이 되겠군요.\" 내가 쏘아붙였다.","chapter":41},{"lemma":"puzzling","difficulty":"C1","gloss":"present participle and gerund of puzzle","ipa":null,"sentence":"Then I came to the question which had seemed to me most puzzling.","word_in_sentence":"puzzling","ko":"그때 나는 가장 당황스러웠던 문제에 이르렀다.","chapter":41},{"lemma":"horrify","difficulty":"C2","gloss":"To cause to feel extreme apprehension or unease; to cause to experience horror.","ipa":"/ˈhɔɹəfaɪ/","sentence":"“At first she was horrified.”","word_in_sentence":"horrified","ko":"\"처음에 그 여자는 소스라치게 놀랐어.\"","chapter":41},{"lemma":"wreak","difficulty":"C1","gloss":"To cause harm; to afflict; to inflict; to harm or injure; to let out harm.","ipa":"/ɹik/","sentence":"His life was strangely divorced from material things, and it was as though his body at times wreaked a fearful revenge on his spirit.","word_in_sentence":"wreaked","ko":"그의 삶은 물질적인 것들과 이상하게 분리되어 있었고, 마치 그의 육체가 때때로 그의 정신에 무서운 복수를 가하는 것 같았다.","chapter":41},{"lemma":"prudence","difficulty":"C1","gloss":"The quality or state of being prudent: circumspection and good judgment in knowing how best to act; (countable, archaic) an instance of this.","ipa":"/ˈpɹuːd(ə)n(t)s/","sentence":"It was an obsession so complete that there was no room in his soul for prudence or gratitude.","word_in_sentence":"prudence","ko":"그것은 너무나 완전한 강박이어서 그의 영혼에는 신중함이나 감사함이 들어설 여지가 없었다.","chapter":41},{"lemma":"imprison","difficulty":"C1","gloss":"To put in or as if in prison; confine somebody against their will.","ipa":"/ɪmˈpɹɪzən/","sentence":"The soul of man wanders through the uttermost regions of the universe, and she seeks to imprison it in the circle of her account-book.","word_in_sentence":"imprison","ko":"인간의 영혼이 우주의 가장 먼 곳까지 방황하는데, 그녀는 그것을 자신의 가계부 테두리 안에 가두려 한다.","chapter":41},{"lemma":"hindrance","difficulty":"C1","gloss":"Something which hinders: something that holds back or causes problems with something else.","ipa":"/ˈhɪndɹəns/","sentence":"I can’t overcome my desire, but I hate it; it imprisons my spirit; I look forward to the time when I shall be free from all desire and can give myself without hindrance to my work.","word_in_sentence":"hindrance","ko":"욕망을 극복할 수는 없지만 증오한다. 욕망이 내 영혼을 가둔다. 모든 욕망에서 해방되어 방해받지 않고 작업에 몰두할 수 있는 때를 고대한다.","chapter":41},{"lemma":"helpmate","difficulty":"C2","gloss":"A person who supplies help or companionship.","ipa":null,"sentence":"Women are the instruments of my pleasure; I have no patience with their claim to be helpmates, partners, companions.”","word_in_sentence":"helpmates","ko":"여자들은 내 쾌락의 도구일 뿐이다. 그들이 동반자니, 파트너니, 벗이니 하며 내세우는 주장에는 참을성이 없다.","chapter":41},{"lemma":"interjection","difficulty":"C2","gloss":"An exclamation or filled pause; a word or phrase with no particular grammatical relation to a sentence, often an expression of emotion.","ipa":"/ˌɪn.tɚˈd͡ʒɛk.ʃən/","sentence":"But neither here nor elsewhere do I pretend to give his exact words; his vocabulary was small, and he had no gift for framing sentences, so that one had to piece his meaning together out of interjections, the expression of his face, gestures and hackneyed phrases.","word_in_sentence":"interjections","ko":"하지만 여기서든 다른 곳에서든 나는 그의 정확한 말을 전한다고 주장하지는 않는다. 그의 어휘는 빈약했고 문장을 구성하는 재능도 없어서, 감탄사와 표정, 몸짓, 그리고 진부한 구절들을 짜맞춰 그의 의미를 파악해야 했다.","chapter":41},{"lemma":"chattel","difficulty":"C1","gloss":"Tangible, movable property.","ipa":"/ˈt͡ʃæt.l̩/","sentence":"“You should have lived at a time when women were chattels and men the masters of slaves,” I said.","word_in_sentence":"chattels","ko":"\"당신은 여자가 재산이고 남자가 노예의 주인이던 시대에 태어났어야 했군요.\" 내가 말했다.","chapter":41},{"lemma":"coherently","difficulty":"C2","gloss":"In a coherent manner.","ipa":null,"sentence":"I could not help laughing at this remark, made in all seriousness; but he went on, walking up and down the room like a caged beast, intent on expressing what he felt, but found such difficulty in putting coherently.","word_in_sentence":"coherently","ko":"진지하게 내뱉은 이 말에 웃음을 참을 수 없었지만, 그는 계속해서 우리에 갇힌 짐승처럼 방 안을 오가며 자신이 느끼는 것을 표현하려 애썼다. 하지만 일관성 있게 말로 옮기는 데 큰 어려움을 겪고 있었다.","chapter":41},{"lemma":"uttermost","difficulty":"C2","gloss":"Outermost.","ipa":"/ˈʌtəɹmoʊst/","sentence":"The soul of man wanders through the uttermost regions of the universe, and she seeks to imprison it in the circle of her account-book.","word_in_sentence":"uttermost","ko":"인간의 영혼이 우주의 가장 먼 곳까지 방황하는데, 그녀는 그것을 자신의 가계부 테두리 안에 가두려 한다.","chapter":41},{"lemma":"contemptuous","difficulty":"C1","gloss":"Showing contempt; expressing disdain; showing a lack of respect.","ipa":"/kənˈtɛmp.t͡ʃu.əs/","sentence":"He stopped in front of my chair, and stood looking down at me with an expression in which I read a contemptuous amazement.","word_in_sentence":"contemptuous","ko":"그는 내 의자 앞에 멈춰 서서 경멸적인 놀라움이 담긴 표정으로 나를 내려다보았다.","chapter":41},{"lemma":"truthfully","difficulty":"C1","gloss":"In a truthful manner","ipa":"/ˈtɹuːθ.fəl.i/","sentence":"I thought over his question, for I wanted to answer it truthfully, at all events to my soul.","word_in_sentence":"truthfully","ko":"나는 그의 질문을 곰곰 생각해보았다. 적어도 내 양심에는 진실하게 대답하고 싶었기 때문이다.","chapter":41},{"lemma":"unbalanced","difficulty":"C1","gloss":"not balanced, without equilibrium","ipa":null,"sentence":"Blanche Stroeve didn’t commit suicide because I left her, but because she was a foolish and unbalanced woman.","word_in_sentence":"unbalanced","ko":"블랑슈 스트루브가 자살한 것은 내가 그녀를 떠났기 때문이 아니라, 그녀가 어리석고 불안정한 여자였기 때문입니다.","chapter":41},{"lemma":"unimportant","difficulty":"C1","gloss":"petty; not important or noteworthy","ipa":"/ˌʌnɪmˈpɔːtənt/","sentence":"It was unimportant.","word_in_sentence":"unimportant","ko":"그것은 중요하지 않았다.","chapter":43},{"lemma":"cosy","difficulty":"C1","gloss":"Affording comfort and warmth; snug; social and comfortable.","ipa":"/ˈkoʊzi/","sentence":"I thought of the happy life that pair had led in the cosy studio in Montmartre, Stroeve and his wife, their simplicity, kindness, and hospitality; it seemed to me cruel that it should have been broken to pieces by a ruthless chance; but the cruellest thing of all was that in fact it made no great difference.","word_in_sentence":"cosy","ko":"몽마르트르의 아늑한 화실에서 스트루브와 그의 아내가 보냈던 행복한 나날들, 그들의 순박함과 친절함, 그리고 후한 인정을 생각해보니, 무자비한 우연에 의해 그 모든 것이 산산조각 난 것이 잔혹하게 느껴졌다. 하지만 무엇보다 잔혹한 것은 사실 그것이 별로 중요하지 않다는 점이었다.","chapter":41},{"lemma":"cruell","difficulty":"C2","gloss":"Obsolete spelling of cruel.","ipa":null,"sentence":"I thought of the happy life that pair had led in the cosy studio in Montmartre, Stroeve and his wife, their simplicity, kindness, and hospitality; it seemed to me cruel that it should have been broken to pieces by a ruthless chance; but the cruellest thing of all was that in fact it made no great difference.","word_in_sentence":"cruellest","ko":"몽마르트르의 아늑한 화실에서 스트루브와 그의 아내가 보냈던 행복한 나날들, 그들의 순박함과 친절함, 그리고 후한 인정을 생각해보니, 무자비한 우연에 의해 그 모든 것이 산산조각 난 것이 잔혹하게 느껴졌다. 하지만 무엇보다 잔혹한 것은 사실 그것이 별로 중요하지 않다는 점이었다.","chapter":41},{"lemma":"wretchedness","difficulty":"C2","gloss":"An unhappy state of mental or physical suffering.","ipa":"/ˈɹɛt͡ʃɪdnəs/","sentence":"The world went on, and no one was a penny the worse for all that wretchedness.","word_in_sentence":"wretchedness","ko":"세상은 계속 돌아갔고, 그 모든 비참함에도 불구하고 누구 하나 손해 보는 사람은 없었다.","chapter":41},{"lemma":"inane","difficulty":"C1","gloss":"Lacking sense or meaning, often to the point of boredom or annoyance.","ipa":"/ɪˈneɪn/","sentence":"It all seemed useless and inane.","word_in_sentence":"inane","ko":"모든 것이 무의미하고 공허해 보였다.","chapter":41},{"lemma":"humouredly","difficulty":"C2","gloss":"In the specified kind of humour. See good-humouredly, bad-humouredly, ill-humouredly.","ipa":null,"sentence":"He chuckled good-humouredly.","word_in_sentence":"humouredly","ko":"그는 유쾌하게 킬킬 웃었다.","chapter":41},{"lemma":"yearn","difficulty":"C1","gloss":"To have a strong desire for something or to do something; to long for or to do something.","ipa":"/jɜːn/","sentence":"Sooner or later the human being in you will yearn for the common bonds of humanity.”","word_in_sentence":"yearn","ko":"조만간 당신 안의 인간적인 면이 인간다운 유대를 갈망하게 될 것이다.","chapter":41},{"lemma":"conceive","difficulty":"C1","gloss":"To have a child; to become pregnant (with).","ipa":"/kənˈsiːv/","sentence":"He stood before me, motionless, with a mocking smile in his eyes; but for all that, for a moment I had an inkling of a fiery, tortured spirit, aiming at something greater than could be conceived by anything that was bound up with the flesh.","word_in_sentence":"conceived","ko":"그는 내 앞에 움직이지 않고 서서 눈에 조롱하는 미소를 띠고 있었다. 하지만 그럼에도 불구하고 한순간 나는 육체에 얽매인 그 어떤 것으로도 상상할 수 없는 더 위대한 무언가를 추구하는, 불타오르고 고뇌하는 영혼의 기미를 감지했다.","chapter":41},{"lemma":"fleeting","difficulty":"C1","gloss":"Passing quickly; of short duration.","ipa":"/ˈfliːtɪŋ/","sentence":"I had a fleeting glimpse of a pursuit of the ineffable.","word_in_sentence":"fleeting","ko":"나는 형언할 수 없는 것을 추구하는 모습을 잠깐 엿보았다.","chapter":41},{"lemma":"vacuity","difficulty":"C2","gloss":"Emptiness.","ipa":"/væˈkjuːɪtɪ/","sentence":"His pretentiousness will only expose his vacuity.","word_in_sentence":"vacuity","ko":"그의 허세는 오직 그의 공허함만을 드러낼 뿐이다.","chapter":42},{"lemma":"lathe","difficulty":"C1","gloss":"To invite; bid; ask.","ipa":"/leɪð/","sentence":"The lathe painted to look like iron is seen to be but a lathe.","word_in_sentence":"lathe","ko":"철처럼 보이게 칠한 선반도 결국은 그저 선반일 뿐임이 드러난다.","chapter":42},{"lemma":"peculiarity","difficulty":"C1","gloss":"The quality or state of being peculiar; individuality; singularity.","ipa":"/pɪˌkjuliˈɛɹɪti/","sentence":"No affectation of peculiarity can conceal a commonplace mind.","word_in_sentence":"peculiarity","ko":"어떤 기이함의 가식도 평범한 정신을 감출 수는 없다.","chapter":42},{"lemma":"innermost","difficulty":"C1","gloss":"Farthest inside or towards the center or middle.","ipa":"/ˈɪnɚmoʊst/","sentence":"To the acute observer no one can produce the most casual work without disclosing the innermost secrets of his soul.","word_in_sentence":"innermost","ko":"예리한 관찰자에게는 누구든 아무리 대수롭지 않은 작품이라도 만들면서 자신의 영혼 깊숙한 비밀을 드러내지 않을 수 없다.","chapter":42},{"lemma":"treasured","difficulty":"C1","gloss":"Valued; especially, having a personal value.","ipa":"/ˈtɹɛʒəd/","sentence":"Most of them have found their way into museums, and the rest are the treasured possessions of wealthy amateurs.","word_in_sentence":"treasured","ko":"그 그림들 대부분은 박물관으로 들어갔고, 나머지는 부유한 수집가들의 소중한 소장품이 되었다.","chapter":42},{"lemma":"impressionist","difficulty":"C1","gloss":"One who adheres to the theory or method of impressionism.","ipa":null,"sentence":"At that time I had the greatest admiration for the impressionists.","word_in_sentence":"impressionists","ko":"그 당시 나는 인상파 화가들을 가장 크게 찬탄하고 있었다.","chapter":42},{"lemma":"clumsiness","difficulty":"C2","gloss":"A lack of coordination or elegance; the condition or quality of being clumsy.","ipa":"/ˈklʌm.zi.nəs/","sentence":"First of all I was taken aback by what seemed to me the clumsiness of his technique.","word_in_sentence":"clumsiness","ko":"무엇보다 먼저 나를 당황하게 한 것은 그의 기법이 서투르다고 여겨진 점이었다.","chapter":42},{"lemma":"draughtsman","difficulty":"C2","gloss":"A person skilled at drawing engineering or architectural plans.","ipa":"/ˈdɹɑːftsmən/","sentence":"Accustomed to the drawing of the old masters, and convinced that Ingres was the greatest draughtsman of recent times, I thought that Strickland drew very badly.","word_in_sentence":"draughtsman","ko":"고전 거장들의 소묘에 익숙하고 앵그르가 근세 최고의 소묘가라고 확신하던 나는 스트릭랜드가 그림을 매우 못 그린다고 생각했다.","chapter":42},{"lemma":"caricature","difficulty":"C1","gloss":"A pictorial representation of someone in which distinguishing features are exaggerated for comic effect.","ipa":"/ˈkɛɹɪkət͡ʃʊɚ/","sentence":"To my eyes the faces looked like caricatures.","word_in_sentence":"caricatures","ko":"내 눈에는 그 얼굴들이 캐리커처 같아 보였다.","chapter":42},{"lemma":"cabdriver","difficulty":"C2","gloss":"One who drives a taxi for a living.","ipa":null,"sentence":"There were two or three pictures of the forest at Fontainebleau and several of streets in Paris: my first feeling was that they might have been painted by a drunken cabdriver.","word_in_sentence":"cabdriver","ko":"퐁텐블로 숲을 그린 그림이 두세 점 있었고 파리 거리를 그린 그림이 몇 점 있었는데, 처음 든 생각은 술 취한 마차꾼이 그린 것 같다는 것이었다.","chapter":42},{"lemma":"bewildered","difficulty":"C1","gloss":"Baffled, confused, mystified, at a loss, not thinking clearly, or uncertain.","ipa":"/bəˈwɪldɚd/","sentence":"I was perfectly bewildered.","word_in_sentence":"bewildered","ko":"나는 완전히 어리둥절했다.","chapter":42},{"lemma":"stupendous","difficulty":"C1","gloss":"Astonishingly great or large; huge; enormous.","ipa":"/stuˈpɛndəs/","sentence":"It was genius, and it was stupendous and overwhelming.","word_in_sentence":"stupendous","ko":"그것은 천재성이었고, 경이롭고 압도적이었다.","chapter":57},{"lemma":"incomprehensible","difficulty":"C1","gloss":"Impossible or very difficult to understand.","ipa":"/ˌɪnkɑmpɹəˈhɛnsɪbəl/","sentence":"It passed through my mind that the whole thing was a stupendous, incomprehensible farce.","word_in_sentence":"incomprehensible","ko":"이 모든 것이 엄청나고 이해할 수 없는 희극이라는 생각이 머릿속을 스쳐 지나갔다.","chapter":42},{"lemma":"acuteness","difficulty":"C2","gloss":"The quality of being acute or pointed","ipa":null,"sentence":"Now that I look back I am more than ever impressed by Stroeve’s acuteness.","word_in_sentence":"acuteness","ko":"지금 돌이켜보니 스트루브의 예리함에 더욱 감탄하게 된다.","chapter":42},{"lemma":"unimpressed","difficulty":"C1","gloss":"Not impressed.","ipa":null,"sentence":"But if I was puzzled and disconcerted, I was not unimpressed.","word_in_sentence":"unimpressed","ko":"하지만 당황스럽고 어리둥절했지만, 감명을 받지 않은 것은 아니었다.","chapter":42},{"lemma":"colossal","difficulty":"C1","gloss":"Extremely large or on a great scale.","ipa":"/kəˈlɒsəl/","sentence":"Even I, in my colossal ignorance, could not but feel that here, trying to express itself, was real power.","word_in_sentence":"colossal","ko":"무지몽매한 나조차도 여기서 자신을 표현하려 애쓰는 것이 진정한 힘이라는 것을 느끼지 않을 수 없었다.","chapter":42},{"lemma":"analyse","difficulty":"C1","gloss":"British standard spelling of analyze.","ipa":null,"sentence":"They gave me an emotion that I could not analyse.","word_in_sentence":"analyse","ko":"그것들은 내가 분석할 수 없는 감정을 불러일으켰다.","chapter":42},{"lemma":"seethe","difficulty":"C2","gloss":"Of a liquid or other substance, or a container holding it: to be boiled (vigorously); to become boiling hot.","ipa":"/siːð/","sentence":"Their brain is seething with ideas, and they can only tell you that the umbrella of the gardener’s aunt is in the house.","word_in_sentence":"seething","ko":"머릿속에는 온갖 생각들이 끓어오르는데, 정작 할 수 있는 말이라고는 정원사 아주머니의 우산이 집에 있다는 것뿐이다.","chapter":42},{"lemma":"gardener","difficulty":"C1","gloss":"One who gardens; one who grows plants or cultivates a garden.","ipa":"/ˈɡɑɹd.n̩.ɚ/","sentence":"Their brain is seething with ideas, and they can only tell you that the umbrella of the gardener’s aunt is in the house.","word_in_sentence":"gardener","ko":"머릿속에는 온갖 생각들이 끓어오르는데, 정작 할 수 있는 말이라고는 정원사 아주머니의 우산이 집에 있다는 것뿐이다.","chapter":42},{"lemma":"prodigious","difficulty":"C1","gloss":"In a positive sense: marvellous, wonderful; (specifically) extremely talented, especially at a young age.","ipa":"/pɹəˈdɪd͡ʒəs/","sentence":"The final impression I received was of a prodigious effort to express some state of the soul, and in this effort, I fancied, must be sought the explanation of what so utterly perplexed me.","word_in_sentence":"prodigious","ko":"내가 마지막으로 받은 인상은 영혼의 어떤 상태를 표현하려는 엄청난 노력이었고, 나를 그토록 완전히 당황시킨 것의 해답도 바로 이 노력에서 찾아야 한다고 생각했다.","chapter":42},{"lemma":"simplify","difficulty":"C1","gloss":"To make simpler, either by reducing in complexity, reducing to component parts, or making easier to understand.","ipa":"/ˈsɪmplɪfaɪ/","sentence":"He did not hesitate to simplify or to distort if he could get nearer to that unknown thing he sought.","word_in_sentence":"simplify","ko":"자신이 추구하는 미지의 것에 더 가까이 다가갈 수 있다면 단순화하거나 왜곡하는 것도 서슴지 않았다.","chapter":42},{"lemma":"compel","difficulty":"C1","gloss":"To drive together, round up.","ipa":"/kəmˈpɛl/","sentence":"It was as though he had become aware of the soul of the universe and were compelled to express it.","word_in_sentence":"compelled","ko":"마치 그가 우주의 영혼을 깨닫게 되어 그것을 표현하지 않을 수 없게 된 것 같았다.","chapter":42},{"lemma":"unmove","difficulty":"C2","gloss":"To move (something) back to its original place; undo or reverse the motion of.","ipa":null,"sentence":"Though these pictures confused and puzzled me, I could not be unmoved by the emotion that was patent in them; and, I knew not why, I felt in myself a feeling that with regard to Strickland was the last I had ever expected to experience.","word_in_sentence":"unmoved","ko":"이 그림들이 나를 혼란스럽게 하고 당황시켰지만, 그 안에 드러난 감정에 무감각할 수는 없었다. 그리고 이유는 모르겠지만, 스트릭랜드에 대해서는 결코 느끼리라 예상하지 못했던 감정을 내 안에서 느꼈다.","chapter":42},{"lemma":"perilous","difficulty":"C1","gloss":"Dangerous, full of peril.","ipa":"/ˈpɛɹ.ɪ.ləs/","sentence":"I do not know what infinite yearning possesses you, so that you are driven to a perilous, lonely search for some goal where you expect to find a final release from the spirit that torments you.","word_in_sentence":"perilous","ko":"어떤 무한한 갈망이 당신을 사로잡고 있는지 모르겠지만, 그 때문에 당신을 괴롭히는 정신으로부터 최종적인 해방을 찾을 수 있으리라 기대하는 어떤 목표를 향해 위험하고 외로운 탐색에 내몰리고 있는 것입니다.","chapter":42},{"lemma":"pilgrim","difficulty":"C1","gloss":"One who travels, especially on a journey to visit sites of religious significance.","ipa":"/ˈpɪlɡɹɪm/","sentence":"I see you as the eternal pilgrim to some shrine that perhaps does not exist.","word_in_sentence":"pilgrim","ko":"나는 당신을 아마도 존재하지 않을지도 모르는 어떤 성지를 향한 영원한 순례자로 봅니다.","chapter":42},{"lemma":"sentimentalist","difficulty":"C2","gloss":"A person who is sentimental.","ipa":null,"sentence":"“You are a dreadful sentimentalist, my poor friend.”","word_in_sentence":"sentimentalist","ko":"\"자네는 정말 지독한 감상주의자야, 불쌍한 친구.\"","chapter":42},{"lemma":"glean","difficulty":"C1","gloss":"To collect (fruit, grain, or other produce) from a field, an orchard, etc., after the main gathering or harvest.","ipa":"/ɡliːn/","sentence":"From his own conversation I was able to glean nothing.","word_in_sentence":"glean","ko":"그 자신의 대화에서 나는 아무것도 알아낼 수 없었다.","chapter":43},{"lemma":"vocation","difficulty":"C1","gloss":"A divine calling to establish one's lifestyle.","ipa":"/voʊˈkeɪʃən/","sentence":"I think I should have shown a strong vocation in boyhood, crushed by the will of his father or sacrificed to the necessity of earning a living; I should have pictured him impatient of the restraints of life; and in the struggle between his passion for art and the duties of his station I could have aroused sympathy for him.","word_in_sentence":"vocation","ko":"나는 그에게 소년 시절부터 강한 소명 의식이 있었지만 아버지의 뜻에 짓눌리거나 생계를 꾸려야 하는 필요에 희생되었다고 보여주었을 것이다. 그가 삶의 속박에 조바심을 내는 모습을 그렸을 것이고, 예술에 대한 열정과 자신의 지위에 따른 의무 사이의 갈등에서 그에 대한 동정심을 불러일으킬 수 있었을 것이다.","chapter":43},{"lemma":"latent","difficulty":"C1","gloss":"Existing or present but concealed or inactive.","ipa":"/ˈleɪ.tənt/","sentence":"A latent gift might reveal itself on acquaintance with the painters and writers whose society his wife sought; or domestic incompatability might turn him upon himself; a love affair might fan into bright flame a fire which I could have shown smouldering dimly in his heart.","word_in_sentence":"latent","ko":"잠재된 재능이 그의 아내가 사귀던 화가들과 작가들과의 교제를 통해 드러날 수도 있었을 것이고, 가정 불화가 그를 자기 내면으로 돌리게 했을 수도 있었을 것이며, 연애 사건이 그의 마음속에서 희미하게 타오르고 있던 불씨를 밝은 불꽃으로 부채질했을 수도 있었을 것이다.","chapter":43},{"lemma":"incompatability","difficulty":"C2","gloss":"Misspelling of incompatibility.","ipa":null,"sentence":"A latent gift might reveal itself on acquaintance with the painters and writers whose society his wife sought; or domestic incompatability might turn him upon himself; a love affair might fan into bright flame a fire which I could have shown smouldering dimly in his heart.","word_in_sentence":"incompatability","ko":"잠재된 재능이 그의 아내가 사귀던 화가들과 작가들과의 교제를 통해 드러날 수도 있었을 것이고, 가정 불화가 그를 자기 내면으로 돌리게 했을 수도 있었을 것이며, 연애 사건이 그의 마음속에서 희미하게 타오르고 있던 불씨를 밝은 불꽃으로 부채질했을 수도 있었을 것이다.","chapter":43},{"lemma":"smoulder","difficulty":"C2","gloss":"Alternative form of smolder.","ipa":"/ˈsməʊldə(ɹ)/","sentence":"In a little while nothing remained but smouldering embers, and a great masterpiece existed no longer.","word_in_sentence":"smouldering","ko":"얼마 지나지 않아 그을린 재만 남았고, 위대한 걸작은 더 이상 존재하지 않았다.","chapter":57},{"lemma":"nagging","difficulty":"C1","gloss":"present participle and gerund of nag","ipa":null,"sentence":"I should have abandoned the facts and made her a nagging, tiresome woman, or else a bigoted one with no sympathy for the claims of the spirit.","word_in_sentence":"nagging","ko":"나는 사실을 버리고 그녀를 잔소리꾼에 성가신 여자로, 아니면 정신적 요구에 대해 전혀 이해심이 없는 편협한 여자로 만들었을 것이다.","chapter":43},{"lemma":"tiresome","difficulty":"C1","gloss":"Causing fatigue or boredom; wearisome.","ipa":"/ˈtaɪɹsəm/","sentence":"I should have abandoned the facts and made her a nagging, tiresome woman, or else a bigoted one with no sympathy for the claims of the spirit.","word_in_sentence":"tiresome","ko":"나는 사실을 버리고 그녀를 잔소리꾼에 성가신 여자로, 아니면 정신적 요구에 대해 전혀 이해심이 없는 편협한 여자로 만들었을 것이다.","chapter":43},{"lemma":"bigote","difficulty":"C2","gloss":{"en":"To wear a false mustache or beard as a disguise.","ko":"가면모","zh":"假胡子"},"ipa":"","sentence":"I should have abandoned the facts and made her a nagging, tiresome woman, or else a bigoted one with no sympathy for the claims of the spirit.","word_in_sentence":"bigoted","ko":"나는 사실을 버리고 그녀를 잔소리꾼에 성가신 여자로, 아니면 정신적 요구에 대해 전혀 이해심이 없는 편협한 여자로 만들었을 것이다.","chapter":43},{"lemma":"unsuitable","difficulty":"C1","gloss":"Not suitable.","ipa":"/ʌnˈsuːtəbəl/","sentence":"I think I should have emphasised his patience with the unsuitable mate, and the compassion which made him unwilling to throw off the yoke that oppressed him.","word_in_sentence":"unsuitable","ko":"나는 부적절한 배우자에 대한 그의 인내심과, 자신을 억압하는 멍에를 벗어던지기를 꺼리게 만든 연민을 강조했을 것이다.","chapter":43},{"lemma":"oppress","difficulty":"C1","gloss":"To keep down by unjust force.","ipa":"/əˈpɹɛs/","sentence":"I think I should have emphasised his patience with the unsuitable mate, and the compassion which made him unwilling to throw off the yoke that oppressed him.","word_in_sentence":"oppressed","ko":"나는 부적절한 배우자에 대한 그의 인내심과, 자신을 억압하는 멍에를 벗어던지기를 꺼리게 만든 연민을 강조했을 것이다.","chapter":43},{"lemma":"forsake","difficulty":"C1","gloss":"To abandon, to give up, to leave (permanently), to renounce (someone or something).","ipa":"/fɔːˈseɪk/","sentence":"An effective story might also have been made by bringing him into contact with some old painter whom the pressure of want or the desire for commercial success had made false to the genius of his youth, and who, seeing in Strickland the possibilities which himself had wasted, influenced him to forsake all and follow the divine tyranny of art.","word_in_sentence":"forsake","ko":"궁핍의 압박이나 상업적 성공에 대한 욕망 때문에 젊은 시절의 천재성을 배반한 늙은 화가와 그를 접촉시켜, 그 화가가 스트릭랜드에게서 자신이 낭비한 가능성을 보고 모든 것을 버리고 예술의 신성한 폭정을 따르도록 영향을 미치게 함으로써 효과적인 이야기를 만들 수도 있었을 것이다.","chapter":43},{"lemma":"duller","difficulty":"C2","gloss":"One who, or that which, dulls.","ipa":null,"sentence":"The facts are much duller.","word_in_sentence":"duller","ko":"사실은 훨씬 더 따분하다.","chapter":43},{"lemma":"mildly","difficulty":"C1","gloss":"In a mild manner.","ipa":"/ˈmaɪldli/","sentence":"Until he married he led the ordinary life of his fellows, gambling mildly on the Exchange, interested to the extent of a sovereign or two on the result of the Derby or the Oxford and Cambridge Race.","word_in_sentence":"mildly","ko":"결혼하기 전까지 그는 동료들과 다름없는 평범한 생활을 했다. 증권거래소에서 소소하게 투기를 하고, 더비나 옥스퍼드-케임브리지 경마 결과에 1, 2파운드 정도 걸며 관심을 보였다.","chapter":43},{"lemma":"proficiency","difficulty":"C1","gloss":"Ability, skill, competence.","ipa":"/pɹəˈfɪʃənsi/","sentence":"The years during which he was struggling to acquire proficiency in a difficult art were monotonous, and I do not know that there was anything significant in the shifts to which he was put to earn enough money to keep him.","word_in_sentence":"proficiency","ko":"어려운 예술에서 숙련도를 쌓기 위해 고군분투했던 그 세월들은 단조로웠고, 생계를 유지할 만큼 돈을 벌기 위해 그가 해야 했던 온갖 일들에 특별한 의미가 있었다고는 생각하지 않는다.","chapter":43},{"lemma":"monotonous","difficulty":"C1","gloss":"Having an unvarying pitch or tone.","ipa":"/məˈnɒtənəs/","sentence":"The years during which he was struggling to acquire proficiency in a difficult art were monotonous, and I do not know that there was anything significant in the shifts to which he was put to earn enough money to keep him.","word_in_sentence":"monotonous","ko":"어려운 예술에서 숙련도를 쌓기 위해 고군분투했던 그 세월들은 단조로웠고, 생계를 유지할 만큼 돈을 벌기 위해 그가 해야 했던 온갖 일들에 특별한 의미가 있었다고는 생각하지 않는다.","chapter":43},{"lemma":"picaresque","difficulty":"C2","gloss":"Of or pertaining to adventurers or rogues.","ipa":"/pɪkəˈɹɛsk/","sentence":"He must have acquired experiences which would form abundant material for a picaresque novel of modern Paris, but he remained aloof, and judging from his conversation there was nothing in those years that had made a particular impression on him.","word_in_sentence":"picaresque","ko":"그는 현대 파리를 배경으로 한 피카레스크 소설의 풍부한 소재가 될 만한 경험들을 쌓았을 것이다. 하지만 그는 초연함을 유지했고, 그의 대화로 판단해보건대 그 세월 동안 그에게 특별한 인상을 남긴 것은 아무것도 없었다.","chapter":43},{"lemma":"aloof","difficulty":"C1","gloss":"At or from a distance, but within view, or at a small distance; apart; away.","ipa":"/əˈluːf/","sentence":"They may spend their whole lives aliens among their kindred and remain aloof among the only scenes they have ever known.","word_in_sentence":"aloof","ko":"평생을 친족들 사이에서 이방인으로 보내고, 지금껏 알아온 유일한 풍경들 속에서도 동떨어져 지낼지도 모른다.","chapter":50},{"lemma":"arduous","difficulty":"C1","gloss":"Needing or using up much energy; testing powers of endurance.","ipa":"/ˈɑɹ.d͡ʒu.əs/","sentence":"But it is unfortunate that I can give no description of the arduous steps by which he reached such mastery over his art as he ever acquired; for if I could show him undaunted by failure, by an unceasing effort of courage holding despair at bay, doggedly persistent in the face of self-doubt, which is the artist’s bitterest enemy, I might excite some sympathy for a personality which, I am all too conscious, must appear singularly devoid of charm.","word_in_sentence":"arduous","ko":"하지만 그가 자신의 예술에서 그 정도의 숙련에 이르기까지 거쳐야 했던 험난한 과정을 묘사할 수 없다는 것은 유감스러운 일이다. 만약 내가 실패에 굴복하지 않고, 끊임없는 용기의 노력으로 절망을 물리치며, 예술가의 가장 쓰라린 적인 자기 의심 앞에서도 완고하게 버텨내는 그의 모습을 보여줄 수 있다면, 매력이 현저히 부족해 보일 수밖에 없다는 것을 나 자신도 너무나 잘 알고 있는 이 인물에 대해 어느 정도 동정심을 불러일으킬 수 있을 텐데 말이다.","chapter":43},{"lemma":"unceasing","difficulty":"C2","gloss":"continuous; continuing indefinitely without stopping","ipa":null,"sentence":"But it is unfortunate that I can give no description of the arduous steps by which he reached such mastery over his art as he ever acquired; for if I could show him undaunted by failure, by an unceasing effort of courage holding despair at bay, doggedly persistent in the face of self-doubt, which is the artist’s bitterest enemy, I might excite some sympathy for a personality which, I am all too conscious, must appear singularly devoid of charm.","word_in_sentence":"unceasing","ko":"하지만 그가 자신의 예술에서 그 정도의 숙련에 이르기까지 거쳐야 했던 험난한 과정을 묘사할 수 없다는 것은 유감스러운 일이다. 만약 내가 실패에 굴복하지 않고, 끊임없는 용기의 노력으로 절망을 물리치며, 예술가의 가장 쓰라린 적인 자기 의심 앞에서도 완고하게 버텨내는 그의 모습을 보여줄 수 있다면, 매력이 현저히 부족해 보일 수밖에 없다는 것을 나 자신도 너무나 잘 알고 있는 이 인물에 대해 어느 정도 동정심을 불러일으킬 수 있을 텐데 말이다.","chapter":43},{"lemma":"doggedly","difficulty":"C2","gloss":"In a way that is stubbornly persistent.","ipa":"/ˈdɔɡədli/","sentence":"But it is unfortunate that I can give no description of the arduous steps by which he reached such mastery over his art as he ever acquired; for if I could show him undaunted by failure, by an unceasing effort of courage holding despair at bay, doggedly persistent in the face of self-doubt, which is the artist’s bitterest enemy, I might excite some sympathy for a personality which, I am all too conscious, must appear singularly devoid of charm.","word_in_sentence":"doggedly","ko":"하지만 그가 자신의 예술에서 그 정도의 숙련에 이르기까지 거쳐야 했던 험난한 과정을 묘사할 수 없다는 것은 유감스러운 일이다. 만약 내가 실패에 굴복하지 않고, 끊임없는 용기의 노력으로 절망을 물리치며, 예술가의 가장 쓰라린 적인 자기 의심 앞에서도 완고하게 버텨내는 그의 모습을 보여줄 수 있다면, 매력이 현저히 부족해 보일 수밖에 없다는 것을 나 자신도 너무나 잘 알고 있는 이 인물에 대해 어느 정도 동정심을 불러일으킬 수 있을 텐데 말이다.","chapter":43},{"lemma":"wrestle","difficulty":"C1","gloss":"To take part in (a wrestling bout or match).","ipa":"/ˈɹɛsl̩/","sentence":"If in the loneliness of his studio he wrestled desperately with the Angel of the Lord he never allowed a soul to divine his anguish.","word_in_sentence":"wrestled","ko":"작업실의 고독 속에서 주님의 천사와 필사적으로 씨름했을지라도, 그는 그 누구도 자신의 고뇌를 눈치채지 못하게 했다.","chapter":43},{"lemma":"fragmentariness","difficulty":"C2","gloss":"The quality of being fragmentary.","ipa":null,"sentence":"I am exasperated by the fragmentariness of the facts at my disposal.","word_in_sentence":"fragmentariness","ko":"내가 가진 사실들의 단편적인 성격 때문에 짜증이 난다.","chapter":43},{"lemma":"coherence","difficulty":"C1","gloss":"The quality of cohering, or being coherent; internal consistency.","ipa":"/kəʊˈhɪəɹ.ən(t)s/","sentence":"To give my story coherence I should describe the progress of their tragic union, but I know nothing of the three months during which they lived together.","word_in_sentence":"coherence","ko":"내 이야기에 일관성을 부여하려면 그들의 비극적 결합이 어떻게 진행되었는지 묘사해야 하겠지만, 그들이 함께 살았던 석 달 동안에 대해서는 아무것도 모른다.","chapter":43},{"lemma":"irritate","difficulty":"C1","gloss":"To provoke impatience, anger, or displeasure in.","ipa":"/ˈɪɹ.ɪˌteɪt/","sentence":"While the light lasted and so long as Blanche’s strength endured, I suppose that Strickland painted, and it must have irritated her when she saw him absorbed in his work.","word_in_sentence":"irritated","ko":"빛이 있는 동안, 그리고 블랑슈의 체력이 버티는 한 스트릭랜드는 그림을 그렸을 것이고, 그가 작업에 몰두하는 모습을 보며 그녀는 짜증이 났을 것이다.","chapter":43},{"lemma":"extremity","difficulty":"C1","gloss":"The most extreme or furthest point of something.","ipa":"/ɪkˈstɹɛmɪti/","sentence":"When Strickland suggested that in her surrender to him there was a sense of triumph over Dirk Stroeve, because he had come to her help in her extremity, he opened the door to many a dark conjecture.","word_in_sentence":"extremity","ko":"스트릭랜드가 블랑슈가 자신에게 몸을 맡긴 것에는 극한 상황에서 자신이 그녀를 도와주었기 때문에 더크 스트루브를 이겼다는 승리감이 있었다고 시사했을 때, 그는 수많은 어두운 추측의 문을 열어젖혔다.","chapter":43},{"lemma":"conjecture","difficulty":"C1","gloss":"A statement or an idea which is unproven, but is thought to be true; a guess.","ipa":"/kənˈd͡ʒɛk.t͡ʃə(ɹ)/","sentence":"When Strickland suggested that in her surrender to him there was a sense of triumph over Dirk Stroeve, because he had come to her help in her extremity, he opened the door to many a dark conjecture.","word_in_sentence":"conjecture","ko":"스트릭랜드가 블랑슈가 자신에게 몸을 맡긴 것에는 극한 상황에서 자신이 그녀를 도와주었기 때문에 더크 스트루브를 이겼다는 승리감이 있었다고 시사했을 때, 그는 수많은 어두운 추측의 문을 열어젖혔다.","chapter":43},{"lemma":"fathom","difficulty":"C1","gloss":"A man's armspan, generally reckoned to be six feet (about 1.8 metres). Later used to measure the depth of water, but now generally replaced by the metre outside American usage.","ipa":"/ˈfað(ə)m/","sentence":"But who can fathom the subtleties of the human heart?","word_in_sentence":"fathom","ko":"하지만 누가 인간 마음의 미묘함을 헤아릴 수 있겠는가?","chapter":43},{"lemma":"decorous","difficulty":"C2","gloss":"Marked by behaviour, manners, etc., regarded as proper, tasteful, and in accordance with accepted standards; becoming, seemly.","ipa":"/ˈdɛkəɹəs/","sentence":"Certainly not those who expect from it only decorous sentiments and normal emotions.","word_in_sentence":"decorous","ko":"분명히 마음에서 품위 있는 감정과 정상적인 감정만을 기대하는 사람들은 그럴 수 없다.","chapter":43},{"lemma":"strove","difficulty":"C1","gloss":"simple past of strive","ipa":"/ˈstɹɔʊv/","sentence":"She strove to ensnare him with comfort and would not see that comfort meant nothing to him.","word_in_sentence":"strove","ko":"그녀는 안락함으로 그를 사로잡으려 애썼지만 안락함이 그에게는 아무 의미가 없다는 것을 보려 하지 않았다.","chapter":43},{"lemma":"ensnare","difficulty":"C2","gloss":"To entrap; to catch in a snare or trap.","ipa":"/ɛnˈsnɛə/","sentence":"She strove to ensnare him with comfort and would not see that comfort meant nothing to him.","word_in_sentence":"ensnare","ko":"그녀는 안락함으로 그를 사로잡으려 애썼지만 안락함이 그에게는 아무 의미가 없다는 것을 보려 하지 않았다.","chapter":43},{"lemma":"dormant","difficulty":"C1","gloss":"Inactive, sleeping, asleep, suspended.","ipa":"/ˈdɔɹmənt/","sentence":"She pursued him with attentions, and when his passion was dormant sought to excite it, for then at least she had the illusion of holding him.","word_in_sentence":"dormant","ko":"그녀는 온갖 정성으로 그를 쫓아다녔고, 그의 열정이 잠들어 있을 때면 그것을 자극하려 애썼다. 그럴 때만이라도 그를 붙잡고 있다는 착각을 할 수 있었기 때문이다.","chapter":43},{"lemma":"itch","difficulty":"C1","gloss":"A sensation felt on an area of the skin that causes a person or animal to want to scratch said area.","ipa":"/ɪt͡ʃ/","sentence":"Perhaps she knew with her intelligence that the chains she forged only aroused his instinct of destruction, as the plate-glass window makes your fingers itch for half a brick; but her heart, incapable of reason, made her continue on a course she knew was fatal.","word_in_sentence":"itch","ko":"아마 그녀는 자신의 지성으로 알고 있었을 것이다. 자신이 만드는 사슬이 오히려 그의 파괴 본능만 자극할 뿐이라는 것을, 마치 판유리창이 사람으로 하여금 벽돌 반 조각을 집어 던지고 싶은 충동을 불러일으키는 것처럼 말이다. 하지만 이성을 잃은 그녀의 마음은 치명적이라는 것을 알면서도 그 길을 계속 걷게 만들었다.","chapter":43},{"lemma":"tragically","difficulty":"C1","gloss":"In a tragic manner.","ipa":null,"sentence":"It is an irony that they should so tragically have affected others.","word_in_sentence":"tragically","ko":"그런 것들이 다른 사람들에게 그토록 비극적인 영향을 끼쳤다는 것은 아이러니다.","chapter":43},{"lemma":"tremendously","difficulty":"C1","gloss":"Greatly; enormously","ipa":null,"sentence":"His real life consisted of dreams and of tremendously hard work.","word_in_sentence":"tremendously","ko":"그의 진짜 삶은 꿈과 엄청나게 힘든 작업으로 이루어져 있었다.","chapter":43},{"lemma":"unreality","difficulty":"C2","gloss":"Lack of reality or real existence.","ipa":null,"sentence":"Here lies the unreality of fiction.","word_in_sentence":"unreality","ko":"여기에 소설의 비현실성이 있다.","chapter":43},{"lemma":"untrue","difficulty":"C1","gloss":"False; not true.","ipa":"/ʌnˈtɹuː/","sentence":"For in men, as a rule, love is but an episode which takes its place among the other affairs of the day, and the emphasis laid on it in novels gives it an importance which is untrue to life.","word_in_sentence":"untrue","ko":"일반적으로 남자들에게 사랑이란 하루의 다른 일들 사이에 자리 잡는 하나의 에피소드에 불과한데, 소설에서 그것에 부여하는 강조는 삶의 진실과 맞지 않는 중요성을 부여하기 때문이다.","chapter":43},{"lemma":"encroach","difficulty":"C2","gloss":"to seize, appropriate","ipa":"/ɪŋˈkɹəʊtʃ/","sentence":"They have a faculty of concentration on that which occupies them at the moment, and it irks them if one encroaches on the other.","word_in_sentence":"encroaches","ko":"그들은 그 순간 자신을 사로잡고 있는 것에 집중하는 능력이 있으며, 한 영역이 다른 영역을 침범하면 짜증을 낸다.","chapter":43},{"lemma":"elsewhither","difficulty":"C2","gloss":"To some other place; in some other direction.","ipa":"/ˈɛlswɪðə/","sentence":"His soul aimed elsewhither.","word_in_sentence":"elsewhither","ko":"그의 영혼은 다른 곳을 향하고 있었다.","chapter":43},{"lemma":"orgy","difficulty":"C1","gloss":"Secret rites or ceremonies, typically involving riotous and dissolute behavior, including dancing, drunkenness and indiscriminate sexual activity, undertaken in honor of various pagan gods or goddesses (such as Attis, Bacchus, Ceres, Dionysus, Osiris, etc).","ipa":"/ˈɔː.d͡ʒi/","sentence":"He had violent passions, and on occasion desire seized his body so that he was driven to an orgy of lust, but he hated the instincts that robbed him of his self-possession.","word_in_sentence":"orgy","ko":"그는 격렬한 정념을 품고 있었고, 때로는 욕망이 그의 몸을 사로잡아 광란의 육욕에 빠져들게 했지만, 자제력을 앗아가는 그런 본능들을 증오했다.","chapter":43},{"lemma":"debauchery","difficulty":"C1","gloss":"Excessive indulgence in sensual pleasures; scandalous/immoral activities; involving sex, alcohol, or drugs without inhibition.","ipa":"/dɪˈbɑ.t͡ʃə.ɹi/","sentence":"I think, even, he hated the inevitable partner in his debauchery.","word_in_sentence":"debauchery","ko":"심지어 그는 자신의 방탕한 행위에 불가피하게 동반되는 상대방까지도 미워했던 것 같다.","chapter":43},{"lemma":"serenely","difficulty":"C2","gloss":"In a serene manner.","ipa":null,"sentence":"His thoughts floated then serenely in the empyrean, and he felt towards her the horror that perhaps the painted butterfly, hovering about the flowers, feels to the filthy chrysalis from which it has triumphantly emerged.","word_in_sentence":"serenely","ko":"그때 그의 사상은 천상계에서 고요히 떠돌았고, 꽃들 주위를 맴도는 아름다운 나비가 자신이 승리를 거두며 빠져나온 더러운 번데기에 대해 느끼는 것과 같은 혐오감을 그녀에게 느꼈다.","chapter":43},{"lemma":"empyrean","difficulty":"C2","gloss":"The highest heaven, supposed by the ancients to be a region of pure light and fire or else composed of ether, and sometimes seen as the dwelling-place of God or other divine beings; the highest celestial sphere according to ancient and medieval astronomy.","ipa":"/ɛmˌpaɪˈɹiːn̩/","sentence":"His thoughts floated then serenely in the empyrean, and he felt towards her the horror that perhaps the painted butterfly, hovering about the flowers, feels to the filthy chrysalis from which it has triumphantly emerged.","word_in_sentence":"empyrean","ko":"그때 그의 사상은 천상계에서 고요히 떠돌았고, 꽃들 주위를 맴도는 아름다운 나비가 자신이 승리를 거두며 빠져나온 더러운 번데기에 대해 느끼는 것과 같은 혐오감을 그녀에게 느꼈다.","chapter":43},{"lemma":"hover","difficulty":"C1","gloss":"To keep (something, such as an aircraft) in a stationary state in the air.","ipa":"/ˈhɒvə/","sentence":"His thoughts floated then serenely in the empyrean, and he felt towards her the horror that perhaps the painted butterfly, hovering about the flowers, feels to the filthy chrysalis from which it has triumphantly emerged.","word_in_sentence":"hovering","ko":"그때 그의 사상은 천상계에서
