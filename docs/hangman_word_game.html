mbs","ko":"침대 옆에는 우유가 들어있던 빈 병이 하나 있었고, 신문지 조각에는 빵 부스러기 몇 개가 남아 있었다.","chapter":24},{"lemma":"dwelt","difficulty":"C1","gloss":"simple past and past participle of dwell","ipa":"/ˈdwɛlt/","sentence":"His eyes dwelt for a moment on a large can within reach of an outstretched arm.","word_in_sentence":"dwelt","ko":"그의 시선이 팔을 뻗으면 닿을 거리에 있는 큰 통에 잠시 머물렀다.","chapter":24},{"lemma":"outstretched","difficulty":"C1","gloss":"Extended or stretched out.","ipa":"/aʊtˈstɹɛt͡ʃt/","sentence":"His eyes dwelt for a moment on a large can within reach of an outstretched arm.","word_in_sentence":"outstretched","ko":"그의 시선이 팔을 뻗으면 닿을 거리에 있는 큰 통에 잠시 머물렀다.","chapter":24},{"lemma":"thermometer","difficulty":"C1","gloss":"An apparatus used to measure temperature.","ipa":"/θəʴˈmɒmɪtəʴ/","sentence":"I suggested that he should get a thermometer, and a few grapes, and some bread.","word_in_sentence":"thermometer","ko":"나는 그에게 체온계와 포도 몇 송이, 그리고 빵을 사오라고 제안했다.","chapter":24},{"lemma":"clatter","difficulty":"C1","gloss":"To make a rattling sound.","ipa":"/ˈklætɚ/","sentence":"Stroeve, glad to make himself useful, clattered down the stairs.","word_in_sentence":"clattered","ko":"스트루브는 자신이 도움이 될 수 있다는 것에 기뻐하며 계단을 쿵쿵거리며 내려갔다.","chapter":24},{"lemma":"mutter","difficulty":"C1","gloss":"A repressed or obscure utterance; an instance of muttering.","ipa":"/ˈmʌtə/","sentence":"“Damned fool,” muttered Strickland.","word_in_sentence":"muttered","ko":"\"빌어먹을 바보 같으니라고.\" 스트릭랜드가 중얼거렸다.","chapter":24},{"lemma":"feebly","difficulty":"C2","gloss":"In a feeble manner.","ipa":"/ˈfiːbli/","sentence":"It was beating quickly and feebly.","word_in_sentence":"feebly","ko":"맥박은 빠르고 약하게 뛰고 있었다.","chapter":24},{"lemma":"irritably","difficulty":"C2","gloss":"In an irritable manner.","ipa":null,"sentence":"I asked irritably.","word_in_sentence":"irritably","ko":"나는 짜증스럽게 물었다.","chapter":41},{"lemma":"panting","difficulty":"C1","gloss":"present participle and gerund of pant","ipa":"/ˈpæntɪŋ/","sentence":"In ten minutes Stroeve, panting, came back.","word_in_sentence":"panting","ko":"십 분 후 스트루브가 헐떡거리며 돌아왔다.","chapter":24},{"lemma":"cheerfulness","difficulty":"C2","gloss":"The state of being cheerful; joy.","ipa":"/ˈt͡ʃɪɹfəlnəs/","sentence":"Her cheerfulness was the cheerfulness of despair.","word_in_sentence":"cheerfulness","ko":"그녀의 명랑함은 절망의 명랑함이었다.","chapter":41},{"lemma":"beseech","difficulty":"C1","gloss":"To beg or implore something of (a person).","ipa":"/bɪˈsiːt͡ʃ/","sentence":"I beseech you to ask her now.”","word_in_sentence":"beseech","ko":"지금 당장 물어봐 주시기를 간청합니다.\"","chapter":35},{"lemma":"mongrel","difficulty":"C1","gloss":"Someone or something of mixed kind or uncertain origin, especially a dog.","ipa":"/ˈmɑŋ.ɡɹəl/","sentence":"“You have no more spirit than a mongrel cur.","word_in_sentence":"mongrel","ko":"\"당신은 잡종개만도 못한 기개를 가지고 있어요.","chapter":25},{"lemma":"trample","difficulty":"C1","gloss":"To crush something by walking on it.","ipa":"/ˈtɹæmpəl/","sentence":"You lie down on the ground and ask people to trample on you.”","word_in_sentence":"trample","ko":"당신은 땅에 누워서 사람들이 자신을 짓밟아 달라고 부탁하는군요.\"","chapter":25},{"lemma":"ruefully","difficulty":"C2","gloss":"In a rueful manner; causing, feeling, or expressing regret or sorrow.","ipa":null,"sentence":"He looked round the studio ruefully.","word_in_sentence":"ruefully","ko":"그는 화실을 둘러보며 안타까워했다.","chapter":25},{"lemma":"possessor","difficulty":"C1","gloss":"Agent noun of possess; one who possesses","ipa":"[pʰəˈzɛsə(ɹ)]","sentence":"It’s a great burden to its possessors.","word_in_sentence":"possessors","ko":"그걸 가진 사람들에게는 큰 짐이기도 하고.","chapter":25},{"lemma":"wretched","difficulty":"C1","gloss":"Characterized by or feeling deep affliction or distress; very miserable.","ipa":"/ˈɹɛt͡ʃɪd/","sentence":"It’s impossible to leave him in that wretched hole.”","word_in_sentence":"wretched","ko":"그 끔찍한 구멍 같은 곳에 그를 그냥 둘 수는 없어요.\"","chapter":25},{"lemma":"shirk","difficulty":"C1","gloss":"To avoid, especially a duty, responsibility, etc.; to stay away from.","ipa":"/ʃɜːk/","sentence":"“My love, it’s not you who would shirk a little trouble.”","word_in_sentence":"shirk","ko":"\"여보, 당신이 조금의 수고도 마다할 사람이 아니잖아요.\"","chapter":25},{"lemma":"convulsively","difficulty":"C2","gloss":"In a convulsive manner.","ipa":null,"sentence":"Her shoulders shook convulsively.","word_in_sentence":"convulsively","ko":"어깨가 경련하듯 떨렸다.","chapter":25},{"lemma":"facile","difficulty":"C1","gloss":"Easy; contemptibly easy.","ipa":"/ˈfæs.aɪl/","sentence":"In a moment Dirk was on his knees beside her, with his arms round her, kissing her, calling her all sorts of pet names, and the facile tears ran down his own cheeks.","word_in_sentence":"facile","ko":"순식간에 더크가 그녀 곁에 무릎을 꿇고 팔로 감싸 안으며 입맞춤을 하고 온갖 애칭으로 부르기 시작했고, 그의 뺨에도 쉽게 흘러나오는 눈물이 흘러내렸다.","chapter":25},{"lemma":"unkindly","difficulty":"C2","gloss":"Not kind, lacking in friendliness, warm-heartedness or sympathy.","ipa":"/ʌnˈkaɪndli/","sentence":"“Leave me alone,” she said, not unkindly; and then to me, trying to smile: “What must you think of me?”","word_in_sentence":"unkindly","ko":"\"혼자 있게 해줘요.\" 그녀가 말했다. 그리 차갑지 않은 어조였다. 그러고는 나를 향해 억지로 미소를 지으며 말했다. \"제가 어떻게 보일까요?\"","chapter":25},{"lemma":"perplexity","difficulty":"C2","gloss":"The state or quality of being perplexed.","ipa":"/pəɹˈplɛksəti/","sentence":"I gazed at Stroeve with perplexity.","word_in_sentence":"perplexity","ko":"나는 당황스러운 표정으로 스트루브를 바라보았다.","chapter":27},{"lemma":"lassitude","difficulty":"C2","gloss":"Lethargy or lack of energy; fatigue, langour, listlessness","ipa":"/ˈlæsɪˌtjuːd/","sentence":"She gave a gesture of lassitude.","word_in_sentence":"lassitude","ko":"그녀는 지친 듯 손짓을 했다.","chapter":25},{"lemma":"haggard","difficulty":"C1","gloss":"Looking exhausted, worried, or poor in condition","ipa":"/ˈhæɡ.ɚd/","sentence":"She looked at him with haggard eyes.","word_in_sentence":"haggard","ko":"그녀는 초췌한 눈으로 그를 바라보았다.","chapter":25},{"lemma":"drunkard","difficulty":"C1","gloss":"A person who is habitually drunk.","ipa":"/ˈdɹʌŋkɚd/","sentence":"Bring a thief, a drunkard, any outcast off the streets, and I promise you I’ll do everything I can for them gladly.","word_in_sentence":"drunkard","ko":"도둑이든, 주정뱅이든, 거리의 어떤 버림받은 자든 데려와라. 기꺼이 최선을 다해 도와주겠다고 약속한다.","chapter":25},{"lemma":"outcast","difficulty":"C1","gloss":"To cast out; to banish.","ipa":"/ˈaʊtkɑːst/","sentence":"He was an outcast.","word_in_sentence":"outcast","ko":"그는 버림받은 자였다.","chapter":38},{"lemma":"terrify","difficulty":"C1","gloss":"To frighten greatly; to fill with terror.","ipa":"/ˈtɛɹɪfaɪ/","sentence":"I don’t know why, but there’s something in him that terrifies me.","word_in_sentence":"terrifies","ko":"이유는 모르겠지만, 그에게는 나를 공포에 떨게 하는 무언가가 있다.","chapter":25},{"lemma":"pant","difficulty":"C1","gloss":"A quick breathing; a catching of the breath; a gasp: the panting of animals such as a dog with their tong hung out- as a form of thermoregulation.","ipa":"/pænt/","sentence":"She was panting now, and in her face was a terror which was inexplicable.","word_in_sentence":"panting","ko":"그녀는 이제 숨을 헐떡이고 있었고, 그 얼굴에는 설명할 수 없는 공포가 떠올라 있었다.","chapter":25},{"lemma":"inexplicable","difficulty":"C1","gloss":"Impossible to explain; not easily accounted for.","ipa":"/ˌɪn.ɪkˈsplɪ.kə.bl̩/","sentence":"She was panting now, and in her face was a terror which was inexplicable.","word_in_sentence":"inexplicable","ko":"그녀는 이제 숨을 헐떡이고 있었고, 그 얼굴에는 설명할 수 없는 공포가 떠올라 있었다.","chapter":25},{"lemma":"shapeless","difficulty":"C2","gloss":"Without a clearly defined or identifiable shape.","ipa":null,"sentence":"I felt that she was possessed by some shapeless dread which robbed her of all self-control.","word_in_sentence":"shapeless","ko":"그녀는 형체 없는 어떤 두려움에 사로잡혀 자제력을 완전히 잃은 것 같았다.","chapter":25},{"lemma":"consternation","difficulty":"C1","gloss":"Amazement or horror that confounds the faculties, and incapacitates for reflection; terror, combined with amazement; dismay.","ipa":"/ˌkɑn.stɚˈneɪ.ʃən/","sentence":"Stroeve looked at her for a while with puzzled consternation.","word_in_sentence":"consternation","ko":"스트루브는 당황하고 놀란 표정으로 한동안 그녀를 바라보았다.","chapter":25},{"lemma":"dearer","difficulty":"C2","gloss":"comparative form of dear: more dear","ipa":null,"sentence":"“You are my wife; you are dearer to me than anyone in the world.","word_in_sentence":"dearer","ko":"\"당신은 내 아내야. 이 세상 누구보다 소중한 사람이라고.","chapter":25},{"lemma":"neurotic","difficulty":"C1","gloss":"Affected with a neurosis.","ipa":"/n(j)ʊəˈɹɒtɪk/","sentence":"I was a little impatient with her; I had not suspected that she was so neurotic a woman.","word_in_sentence":"neurotic","ko":"나는 그녀에게 약간 짜증이 났다. 그녀가 그토록 신경질적인 여자인 줄은 미처 몰랐던 것이다.","chapter":25},{"lemma":"ghastly","difficulty":"C1","gloss":"Like a ghost in appearance; death-like; pale; pallid; dismal.","ipa":"/ˈɡæs(t).li/","sentence":"His round blue eyes behind the spectacles were ghastly with terror.","word_in_sentence":"ghastly","ko":"안경 너머로 보이는 그의 동그란 파란 눈은 공포로 인해 끔찍하게 일그러져 있었다.","chapter":34},{"lemma":"shiver","difficulty":"C1","gloss":"To tremble or shake, especially when cold or frightened.","ipa":"/ˈʃɪvɚ/","sentence":"A shiver passed through her.","word_in_sentence":"shiver","ko":"그녀의 몸에 전율이 스쳐 지나갔다.","chapter":25},{"lemma":"bewilder","difficulty":"C2","gloss":"To confuse, disorientate, or puzzle someone, especially with many different choices.","ipa":"/bɪˈwɪldə(ɹ)/","sentence":"I was bewildered.","word_in_sentence":"bewildered","ko":"나는 어리둥절했다.","chapter":25},{"lemma":"firmness","difficulty":"C1","gloss":"security; steadfastness; good grip","ipa":"/ˈfɝmnəs/","sentence":"He was by now so worn out that he could not resist my firmness.","word_in_sentence":"firmness","ko":"이제 그는 너무 지쳐서 내 단호함에 저항할 수도 없었다.","chapter":29},{"lemma":"entreaty","difficulty":"C2","gloss":"The act of entreating or beseeching; a strong petition; pressing solicitation; begging.","ipa":"/ɛnˈtɹiːti/","sentence":"It needed a good deal of firmness and still more patience to induce him to come, but he was really too ill to offer any effective resistance to Stroeve’s entreaties and to my determination.","word_in_sentence":"entreaties","ko":"그를 설득해 오게 하려면 상당한 단호함과 그보다 더 많은 인내가 필요했지만, 그는 정말로 너무 아파서 스트루브의 간청과 나의 결심에 효과적으로 저항할 수 없었다.","chapter":26},{"lemma":"doggedness","difficulty":"C2","gloss":"The state of being dogged; persistence; perseverance; tenacity; stubbornness.","ipa":"/ˈdɔɡɪdˌnəs/","sentence":"At one time it looked as though he could not live more than a few hours, and I am convinced that it was only through the Dutchman’s doggedness that he pulled through.","word_in_sentence":"doggedness","ko":"한때는 몇 시간도 더 살지 못할 것 같아 보였고, 그 네덜란드인의 완고한 고집이 아니었다면 그가 회복하지 못했을 것이라고 나는 확신한다.","chapter":26},{"lemma":"querulous","difficulty":"C2","gloss":"Often complaining; suggesting a complaint in expression; fretful, whining.","ipa":"/ˈkwɛɹ(j)ʊləs/","sentence":"It was not that he was exacting and querulous; on the contrary, he never complained, he asked for nothing, he was perfectly silent; but he seemed to resent the care that was taken of him; he received all inquiries about his feelings or his needs with a jibe, a sneer, or an oath.","word_in_sentence":"querulous","ko":"그가 까다롭고 불평이 많아서가 아니었다. 오히려 그는 결코 불평하지 않았고, 아무것도 요구하지 않았으며, 완전히 조용했다. 하지만 그는 자신을 돌봐주는 것을 못마땅해하는 것 같았다. 그의 기분이나 필요한 것에 대한 모든 문의를 비꼬거나 냉소하거나 욕설로 받아넘겼다.","chapter":26},{"lemma":"jibe","difficulty":"C2","gloss":"A facetious or insulting remark; a jeer, a taunt.","ipa":"/d͡ʒaɪb/","sentence":"It was not that he was exacting and querulous; on the contrary, he never complained, he asked for nothing, he was perfectly silent; but he seemed to resent the care that was taken of him; he received all inquiries about his feelings or his needs with a jibe, a sneer, or an oath.","word_in_sentence":"jibe","ko":"그가 까다롭고 불평이 많아서가 아니었다. 오히려 그는 결코 불평하지 않았고, 아무것도 요구하지 않았으며, 완전히 조용했다. 하지만 그는 자신을 돌봐주는 것을 못마땅해하는 것 같았다. 그의 기분이나 필요한 것에 대한 모든 문의를 비꼬거나 냉소하거나 욕설로 받아넘겼다.","chapter":26},{"lemma":"sneer","difficulty":"C1","gloss":"To raise a corner of the upper lip slightly, especially in scorn.","ipa":"/snɪɚ̯/","sentence":"It was not that he was exacting and querulous; on the contrary, he never complained, he asked for nothing, he was perfectly silent; but he seemed to resent the care that was taken of him; he received all inquiries about his feelings or his needs with a jibe, a sneer, or an oath.","word_in_sentence":"sneer","ko":"그가 까다롭고 불평이 많아서가 아니었다. 오히려 그는 결코 불평하지 않았고, 아무것도 요구하지 않았으며, 완전히 조용했다. 하지만 그는 자신을 돌봐주는 것을 못마땅해하는 것 같았다. 그의 기분이나 필요한 것에 대한 모든 문의를 비꼬거나 냉소하거나 욕설로 받아넘겼다.","chapter":26},{"lemma":"detestable","difficulty":"C2","gloss":"Stimulating disgust or detestation; offensive; shocking.","ipa":"/dɪˈtɛstəbl̩/","sentence":"“I think you’re detestable.","word_in_sentence":"detestable","ko":"\"당신이 혐오스럽습니다.","chapter":40},{"lemma":"tenderness","difficulty":"C1","gloss":"A tendency to express warm, compassionate feelings.","ipa":"/ˈtɛn.dɚ.nɪs/","sentence":"Dirk Stroeve, giving up his work entirely, nursed Strickland with tenderness and sympathy.","word_in_sentence":"tenderness","ko":"더크 스트루브는 자신의 일을 완전히 포기하고 스트릭랜드를 다정함과 동정심으로 간병했다.","chapter":26},{"lemma":"dexterous","difficulty":"C2","gloss":"Skillful with one's hands.","ipa":"/ˈdɛkstɹəs/","sentence":"He was dexterous to make him comfortable, and he exercised a cunning of which I should never have thought him capable to induce him to take the medicines prescribed by the doctor.","word_in_sentence":"dexterous","ko":"그는 스트릭랜드를 편안하게 해주는 데 능숙했고, 의사가 처방한 약을 먹도록 유도하기 위해 내가 그에게서 전혀 기대하지 못했을 교활함을 발휘했다.","chapter":26},{"lemma":"prescribe","difficulty":"C1","gloss":"To order (a drug or medical device) for use by a particular patient (under licensed authority).","ipa":"/pɹɪˈskɹaɪb/","sentence":"He was dexterous to make him comfortable, and he exercised a cunning of which I should never have thought him capable to induce him to take the medicines prescribed by the doctor.","word_in_sentence":"prescribed","ko":"그는 스트릭랜드를 편안하게 해주는 데 능숙했고, 의사가 처방한 약을 먹도록 유도하기 위해 내가 그에게서 전혀 기대하지 못했을 교활함을 발휘했다.","chapter":26},{"lemma":"wantonly","difficulty":"C2","gloss":"in a wanton manner.","ipa":"/ˈwɒntənli/","sentence":"Though his means were adequate to the needs of himself and his wife, he certainly had no money to waste; but now he was wantonly extravagant in the purchase of delicacies, out of season and dear, which might tempt Strickland’s capricious appetite.","word_in_sentence":"wantonly","ko":"그의 수입은 자신과 아내의 필요를 충족시키기에 충분했지만, 확실히 낭비할 돈은 없었다. 하지만 이제 그는 스트릭랜드의 변덕스러운 식욕을 돋울 수 있는 진미들을 사는 데 방탕하게 돈을 썼는데, 그것들은 제철이 아니어서 비쌌다.","chapter":26},{"lemma":"tempt","difficulty":"C1","gloss":"To provoke someone to do wrong, especially by promising a reward; to entice.","ipa":"/tɛmpt/","sentence":"The two buildings are placed far apart, so that only the starving should be tempted to make use of them.","word_in_sentence":"tempted","ko":"두 건물은 멀리 떨어져 있어서 오직 굶주린 자들만이 그곳을 이용하려는 유혹을 받도록 되어 있었다.","chapter":47},{"lemma":"tactful","difficulty":"C1","gloss":"Possessing tact; able to deal with people in a sensitive manner.","ipa":"/ˈtæktfəl/","sentence":"I shall never forget the tactful patience with which he persuaded him to take nourishment.","word_in_sentence":"tactful","ko":"나는 그가 스트릭랜드로 하여금 영양분을 섭취하도록 설득한 재치 있는 인내심을 결코 잊지 못할 것이다.","chapter":26},{"lemma":"nourishment","difficulty":"C1","gloss":"The act of nourishing or the state of being nourished.","ipa":"/ˈnʌɹɪʃmənt/","sentence":"I shall never forget the tactful patience with which he persuaded him to take nourishment.","word_in_sentence":"nourishment","ko":"나는 그가 스트릭랜드로 하여금 영양분을 섭취하도록 설득한 재치 있는 인내심을 결코 잊지 못할 것이다.","chapter":26},{"lemma":"rudeness","difficulty":"C1","gloss":"The property of being rude.","ipa":null,"sentence":"He was never put out by Strickland’s rudeness; if it was merely sullen, he appeared not to notice it; if it was aggressive, he only chuckled.","word_in_sentence":"rudeness","ko":"그는 스트릭랜드의 무례함에 결코 화내지 않았다. 그것이 단순히 뚱한 것이라면 알아차리지 못하는 척했고, 공격적이라면 그저 킬킬 웃을 뿐이었다.","chapter":26},{"lemma":"vehemently","difficulty":"C1","gloss":"In a vehement manner; expressing with a strong or forceful attitude.","ipa":"/ˈviː.ə.məntli/","sentence":"There was nothing in her to remind you that she had so vehemently struggled against her husband’s wish to bring Strickland to the studio.","word_in_sentence":"vehemently","ko":"남편이 스트릭랜드를 작업실로 데려오려는 뜻에 그토록 격렬하게 반대했던 그녀의 모습을 떠올리게 하는 구석은 전혀 없었다.","chapter":26},{"lemma":"needful","difficulty":"C1","gloss":"Needed; necessary; mandatory; requisite; indispensable.","ipa":"/ˈniːdfəl/","sentence":"She insisted on doing her share of the offices needful to the sick.","word_in_sentence":"needful","ko":"그녀는 환자에게 필요한 일들을 자신이 맡아서 하겠다고 고집했다.","chapter":26},{"lemma":"forestall","difficulty":"C1","gloss":"To prevent, delay or hinder something by taking precautionary or anticipatory measures; to avert.","ipa":"/fɔː(ɹ)ˈstɔːl/","sentence":"She did not speak to him much, but she was quick to forestall his wants.","word_in_sentence":"forestall","ko":"그녀는 그에게 말을 많이 걸지는 않았지만, 그의 필요를 재빨리 미리 채워주었다.","chapter":26},{"lemma":"bedside","difficulty":"C1","gloss":"A position at the side of one's bed.","ipa":"/ˈbɛdˌsaɪd/","sentence":"I wondered what she thought during the long darkness as she sat by the bedside.","word_in_sentence":"bedside","ko":"그녀가 침대 곁에 앉아 긴 어둠 속에서 무슨 생각을 했을지 나는 궁금했다.","chapter":26},{"lemma":"feverishly","difficulty":"C1","gloss":"With excitement and determination.","ipa":"/ˈfi.vɚ.ɪʃ.li/","sentence":"Strickland was a weird figure as he lay there, thinner than ever, with his ragged red beard and his eyes staring feverishly into vacancy; his illness seemed to have made them larger, and they had an unnatural brightness.","word_in_sentence":"feverishly","ko":"스트릭랜드는 그곳에 누워 있는 모습이 기괴했는데, 전보다 더욱 야위어서 헝클어진 붉은 수염과 열에 들뜬 눈으로 허공을 응시하고 있었다. 병으로 인해 눈이 더 커진 것 같았고, 부자연스럽게 빛나고 있었다.","chapter":26},{"lemma":"unnatural","difficulty":"C1","gloss":"Not natural.","ipa":"/ʌnˈnæt͡ʃ(ə)ɹəl/","sentence":"Strickland was a weird figure as he lay there, thinner than ever, with his ragged red beard and his eyes staring feverishly into vacancy; his illness seemed to have made them larger, and they had an unnatural brightness.","word_in_sentence":"unnatural","ko":"스트릭랜드는 그곳에 누워 있는 모습이 기괴했는데, 전보다 더욱 야위어서 헝클어진 붉은 수염과 열에 들뜬 눈으로 허공을 응시하고 있었다. 병으로 인해 눈이 더 커진 것 같았고, 부자연스럽게 빛나고 있었다.","chapter":26},{"lemma":"scarecrow","difficulty":"C1","gloss":"An effigy, typically made of straw and dressed in old clothes, fixed to a pole in a field to deter birds from eating crops or seeds planted there.","ipa":"/ˈskɛəkɹəʊ/","sentence":"His clothes hung upon him like rags on a scarecrow.","word_in_sentence":"scarecrow","ko":"그의 옷은 허수아비에 걸린 누더기처럼 몸에 걸쳐져 있었다.","chapter":26},{"lemma":"emphasise","difficulty":"C1","gloss":"Alternative spelling of emphasize.","ipa":null,"sentence":"It seemed to emphasise the unconquerable spirit of man.","word_in_sentence":"emphasise","ko":"그것이 인간의 불굴의 정신을 강조하는 것 같았다.","chapter":48},{"lemma":"ungainliness","difficulty":"C2","gloss":"The state of being ungainly.","ipa":null,"sentence":"There was something monumental in his ungainliness.","word_in_sentence":"ungainliness","ko":"그의 어색함에는 뭔가 기념비적인 면이 있었다.","chapter":26},{"lemma":"sensuality","difficulty":"C1","gloss":"The state of being sensual or sensuous.","ipa":"/ˌsɛn.ʃuːˈal.ɪ.tiː/","sentence":"It was not exactly spirituality that was obvious, though the screen of the flesh seemed almost transparent, because there was in his face an outrageous sensuality; but, though it sounds nonsense, it seemed as though his sensuality were curiously spiritual.","word_in_sentence":"sensuality","ko":"육체라는 가림막이 거의 투명해 보일 정도였지만, 그의 얼굴에는 노골적인 관능성이 있었기 때문에 정확히 영성이 드러나 보인다고 할 수는 없었다. 하지만 말이 안 되는 소리 같지만, 그의 관능성이 묘하게 영적인 것처럼 보였다.","chapter":26},{"lemma":"partake","difficulty":"C1","gloss":"To take part in an activity; to participate.","ipa":"/pɑɹˈteɪk/","sentence":"He seemed to partake of those obscure forces of nature which the Greeks personified in shapes part human and part beast, the satyr and the faun.","word_in_sentence":"partake","ko":"그는 그리스인들이 반인반수의 모습으로 의인화했던 자연의 모호한 힘들, 즉 사티로스나 파우누스 같은 존재들과 닮아 있는 것 같았다.","chapter":26},{"lemma":"personify","difficulty":"C2","gloss":"To be an example of; to have all the attributes of.","ipa":"/pə(ɹ)ˈsɒnɪfaɪ/","sentence":"He seemed to partake of those obscure forces of nature which the Greeks personified in shapes part human and part beast, the satyr and the faun.","word_in_sentence":"personified","ko":"그는 그리스인들이 반인반수의 모습으로 의인화했던 자연의 모호한 힘들, 즉 사티로스나 파우누스 같은 존재들과 닮아 있는 것 같았다.","chapter":26},{"lemma":"faun","difficulty":"C2","gloss":"A woodland creature with pointed ears, legs, and short horns of a goat and a fondness for unrestrained revelry.","ipa":"/fɔn/","sentence":"He seemed to partake of those obscure forces of nature which the Greeks personified in shapes part human and part beast, the satyr and the faun.","word_in_sentence":"faun","ko":"그는 그리스인들이 반인반수의 모습으로 의인화했던 자연의 모호한 힘들, 즉 사티로스나 파우누스 같은 존재들과 닮아 있는 것 같았다.","chapter":26},{"lemma":"flay","difficulty":"C2","gloss":"To cause to fly; put to flight; drive off (by frightening).","ipa":"/fleɪ/","sentence":"I thought of Marsyas, whom the god flayed because he had dared to rival him in song.","word_in_sentence":"flayed","ko":"나는 감히 신과 노래 실력을 겨루었다가 신에게 가죽이 벗겨진 마르시아스를 떠올렸다.","chapter":26},{"lemma":"unadventured","difficulty":"C2","gloss":"Not having had adventures.","ipa":null,"sentence":"Strickland seemed to bear in his heart strange harmonies and unadventured patterns, and I foresaw for him an end of torture and despair.","word_in_sentence":"unadventured","ko":"스트릭랜드는 마음속에 기묘한 화음과 아직 시도되지 않은 무늬들을 품고 있는 것 같았고, 나는 그에게 고통과 절망의 종말이 기다리고 있음을 예감했다.","chapter":26},{"lemma":"cadence","difficulty":"C1","gloss":"The act or state of declining or sinking.","ipa":"/ˈkeɪ.dn̩s/","sentence":"The books he liked were queer; sometimes I would find him poring over the poems of Mallarme, and he read them as a child reads, forming the words with his lips, and I wondered what strange emotion he got from those subtle cadences and obscure phrases; and again I found him absorbed in the detective novels of Gaboriau.","word_in_sentence":"cadences","ko":"그가 좋아하는 책들은 기이했다. 때로는 말라르메의 시집을 열심히 들여다보고 있는 그를 발견하곤 했는데, 그는 아이가 읽듯 입술로 단어를 따라 읽었고, 나는 그가 그 미묘한 운율과 모호한 구절들에서 어떤 기묘한 감정을 얻는지 궁금했다. 또 어떤 때는 가보리오의 탐정소설에 빠져 있는 그를 발견하기도 했다.","chapter":26},{"lemma":"irreconcilable","difficulty":"C1","gloss":"Unable to be reconciled; opposed; uncompromising.","ipa":null,"sentence":"I amused myself by thinking that in his choice of books he showed pleasantly the irreconcilable sides of his fantastic nature.","word_in_sentence":"irreconcilable","ko":"그의 책 선택에서 그 환상적인 성격의 화해할 수 없는 양면이 유쾌하게 드러난다고 생각하며 나는 즐거워했다.","chapter":26},{"lemma":"upholstered","difficulty":"C1","gloss":"Covered in or characterized by upholstery.","ipa":null,"sentence":"Stroeve liked his ease, and in his studio were a couple of heavily upholstered arm-chairs and a large divan.","word_in_sentence":"upholstered","ko":"스트루브는 안락함을 좋아해서, 그의 작업실에는 푹신한 안락의자 두 개와 큰 소파가 있었다.","chapter":26},{"lemma":"divan","difficulty":"C1","gloss":"A Muslim council of state, specifically that of viziers of the Ottoman Empire that discussed and recommended new laws and law changes to a higher authority (the sultan).","ipa":"/dɪˈvæn/","sentence":"I had a divan in my sitting-room, and could very well sleep on that.","word_in_sentence":"divan","ko":"거실에 소파가 하나 있었으니 거기서 자는 것쯤은 충분히 괜찮았다.","chapter":29},{"lemma":"affectation","difficulty":"C2","gloss":"An attempt to assume or exhibit what is not natural or real; false display; artificial show.","ipa":"/ˌæf.ɛkˈteɪ.ʃən/","sentence":"No affectation of peculiarity can conceal a commonplace mind.","word_in_sentence":"affectation","ko":"어떤 기이함의 가식도 평범한 정신을 감출 수는 없다.","chapter":42},{"lemma":"stoicism","difficulty":"C1","gloss":"A school of philosophy popularized during the Roman Empire that emphasized reason as a means of understanding the natural state of things, or logos, and as a means of freeing oneself from emotional distress.","ipa":"/ˈstoʊɪsɪzəm/","sentence":"Strickland would not go near them, not from any affectation of stoicism, for I found him seated on a three-legged stool when I went into the studio one day and he was alone, but because he did not like them.","word_in_sentence":"stoicism","ko":"스트릭랜드는 그것들 근처에 가려 하지 않았는데, 금욕주의를 가장하려는 것이 아니었다. 어느 날 내가 작업실에 들어갔을 때 그가 혼자서 다리 셋 달린 의자에 앉아 있는 것을 보았기 때문이다. 그는 단지 그런 것들을 좋아하지 않았을 뿐이었다.","chapter":26},{"lemma":"exasperate","difficulty":"C2","gloss":"To tax the patience of; irk, frustrate, vex, provoke, annoy; to make angry.","ipa":"/ɪɡˈzæsp(ə)ɹeɪt/","sentence":"It often exasperated me to see him.","word_in_sentence":"exasperated","ko":"그런 그를 보면 종종 화가 났다.","chapter":26},{"lemma":"rotund","difficulty":"C2","gloss":"Having a round, spherical or curved shape; circular; orbicular.","ipa":"/ɹoʊˈtʌnd/","sentence":"I smiled, for his appearance, so rotund and yet so startled, could never fail to excite a smile, and then as I came nearer","word_in_sentence":"rotund","ko":"나는 미소를 지었다. 그토록 둥글둥글하면서도 놀란 듯한 그의 모습은 언제나 미소를 자아내지 않을 수 없었기 때문이다. 그런데 가까이 다가가면서","chapter":27},{"lemma":"nearer","difficulty":"C1","gloss":"Less distant; comparative form of near: more near.","ipa":"/ˈnɪəɹə(ɹ)/","sentence":"I smiled, for his appearance, so rotund and yet so startled, could never fail to excite a smile, and then as I came nearer","word_in_sentence":"nearer","ko":"나는 미소를 지었다. 그토록 둥글둥글하면서도 놀란 듯한 그의 모습은 언제나 미소를 자아내지 않을 수 없었기 때문이다. 그런데 가까이 다가가면서","chapter":27},{"lemma":"disconsolate","difficulty":"C2","gloss":"Cheerless, dreary.","ipa":"/dɪsˈkɑnsəlɪt/","sentence":"I noticed that he seemed singularly disconsolate.","word_in_sentence":"disconsolate","ko":"그가 유난히 의기소침해 보인다는 것을 알아차렸다.","chapter":27},{"lemma":"woebegone","difficulty":"C2","gloss":"In a deplorable state.","ipa":"/ˈwoʊbɪɡɔn/","sentence":"He looked woebegone and yet ridiculous, like a man who has fallen into the water with all his clothes on, and, being rescued from death, frightened still, feels that he only looks a fool.","word_in_sentence":"woebegone","ko":"그는 옷을 다 입은 채로 물에 빠졌다가 죽음에서 구조되어 여전히 겁에 질린 채, 자신이 바보처럼 보일 뿐이라는 것을 깨닫는 사람처럼 비참하면서도 우스꽝스러워 보였다.","chapter":27},{"lemma":"harass","difficulty":"C1","gloss":"To annoy (someone) frequently or systematically; to pester.","ipa":"/həˈɹæs/","sentence":"His round blue eyes looked harassed behind his glasses.","word_in_sentence":"harassed","ko":"안경 너머로 그의 둥근 파란 눈이 괴로워 보였다.","chapter":27},{"lemma":"rueful","difficulty":"C2","gloss":"Causing, feeling, or expressing regret or sorrow, especially in a wry or humorous way.","ipa":"/ˈɹuːfl̩/","sentence":"He gave a little start, and then smiled, but his smile was rueful.","word_in_sentence":"rueful","ko":"그는 깜짝 놀라더니 미소를 지었지만, 그의 미소는 슬픈 것이었다.","chapter":27},{"lemma":"disgraceful","difficulty":"C1","gloss":"Bringing or warranting disgrace; shameful.","ipa":"[dɪsˈɡɹeɪsfəɫ]","sentence":"“Why are you idling in this disgraceful fashion?”","word_in_sentence":"disgraceful","ko":"\"왜 이렇게 한심하게 빈둥거리고 있는 거야?\"","chapter":27},{"lemma":"detach","difficulty":"C1","gloss":"To take apart from; to take off.","ipa":"/dɪˈtæt͡ʃ/","sentence":"He said all this slowly, detaching statement from statement with a little awkward silence, and he kept his kind, foolish eyes fixed on mine.","word_in_sentence":"detaching","ko":"그는 이 모든 말을 천천히 했고, 어색한 침묵으로 문장과 문장 사이를 끊어가며 말했으며, 친절하고 어리석은 눈을 내 눈에 고정시키고 있었다.","chapter":27},{"lemma":"unhappily","difficulty":"C1","gloss":"Unfortunately; regrettably.","ipa":null,"sentence":"He glanced unhappily at one of the pictures on the wall.","word_in_sentence":"unhappily","ko":"그는 벽에 걸린 그림 중 하나를 불안한 눈빛으로 바라보았다.","chapter":27},{"lemma":"schoolboy","difficulty":"C1","gloss":"A boy attending school.","ipa":"/ˈskulˌbɔɪ/","sentence":"He stood like a schoolboy with whom a master is finding fault.","word_in_sentence":"schoolboy","ko":"그는 선생님께 꾸중을 듣는 학생처럼 서 있었다.","chapter":27},{"lemma":"parlour","difficulty":"C1","gloss":"Commonwealth standard spelling of parlor.","ipa":"/ˈpɑːlə/","sentence":"For all I know, this picture may still adorn the parlour of the tumbledown little house somewhere near the Quai de la Joliette, and I suppose it could now be sold for fifteen hundred pounds.","word_in_sentence":"parlour","ko":"내가 아는 한, 이 그림은 아직도 케 드 라 졸리에트 근처 어딘가에 있는 허름한 작은 집 응접실을 장식하고 있을지도 모르며, 지금이라면 1500파운드에 팔릴 수 있을 것이다.","chapter":47},{"lemma":"tinkling","difficulty":"C2","gloss":"A tinkle; a tinkling sound.","ipa":null,"sentence":"It was about ten o’ clock at night; I had been dining by myself at a restaurant, and having returned to my small apartment, was sitting in my parlour, reading I heard the cracked tinkling of the bell, and, going into the corridor, opened the door.","word_in_sentence":"tinkling","ko":"밤 열 시쯤이었다. 나는 식당에서 혼자 저녁을 먹고 작은 아파트로 돌아와 응접실에 앉아 책을 읽고 있었는데, 종이 갈라진 소리로 딸랑거리는 것을 듣고 복도로 나가 문을 열었다.","chapter":28},{"lemma":"dimness","difficulty":"C2","gloss":"The state of being dim, poorly illuminated, almost dark.","ipa":null,"sentence":"In the dimness of the landing I could not see him very well, but there was something in his voice that surprised me.","word_in_sentence":"dimness","ko":"어두컴컴한 계단참에서는 그를 잘 볼 수 없었지만, 그의 목소리에는 나를 놀라게 하는 무언가가 있었다.","chapter":28},{"lemma":"abstemious","difficulty":"C2","gloss":"Refraining from freely consuming food or strong drink; sparing in diet; abstinent, temperate.","ipa":"/æbˈstiː.mɪ.əs/","sentence":"I knew he was of abstemious habit or I should have thought he had been drinking.","word_in_sentence":"abstemious","ko":"그가 금주하는 습관이 있다는 것을 알고 있었기에 그렇지 않았다면 술을 마셨다고 생각했을 것이다.","chapter":28},{"lemma":"vehemence","difficulty":"C2","gloss":"An intense concentration, force or power.","ipa":"/ˈviːəmən(t)s/","sentence":"I asked in astonishment at his vehemence.","word_in_sentence":"vehemence","ko":"그의 격렬함에 놀라며 내가 물었다.","chapter":28},{"lemma":"mottle","difficulty":"C2","gloss":"To mark with blotches of different color, or shades of color, as if stained; to spot; to maculate.","ipa":"/ˈmɑ.təl/","sentence":"His face, usually so rosy, was now strangely mottled.","word_in_sentence":"mottled","ko":"평소 그렇게 장밋빛이던 그의 얼굴이 이제는 이상하게 얼룩덜룩했다.","chapter":28},{"lemma":"trickle","difficulty":"C1","gloss":"A very thin river.","ipa":"/ˈtɹɪkəl/","sentence":"He gave a little gasp, and the tears began to trickle down his round cheeks.","word_in_sentence":"trickle","ko":"그는 작게 헐떡이더니 눈물이 동그란 뺨을 타고 흘러내리기 시작했다.","chapter":28},{"lemma":"forbearance","difficulty":"C2","gloss":"Patient self-control; restraint and tolerance under provocation.","ipa":"/fɔːˈbɛː.ɹən(t)s/","sentence":"My first thought was that she had come to the end of her forbearance with his infatuation for Strickland, and, goaded by the latter’s cynical behaviour, had insisted that he should be turned out.","word_in_sentence":"forbearance","ko":"내 첫 번째 생각은 그녀가 스트릭랜드에 대한 남편의 맹목적 열정을 더 이상 참을 수 없게 되었고, 스트릭랜드의 냉소적인 행동에 자극받아 그를 내쫓아야 한다고 고집을 부렸으리라는 것이었다.","chapter":28},{"lemma":"goad","difficulty":"C1","gloss":"A long, pointed stick used to prod animals.","ipa":"/ɡəʊd/","sentence":"My first thought was that she had come to the end of her forbearance with his infatuation for Strickland, and, goaded by the latter’s cynical behaviour, had insisted that he should be turned out.","word_in_sentence":"goaded","ko":"내 첫 번째 생각은 그녀가 스트릭랜드에 대한 남편의 맹목적 열정을 더 이상 참을 수 없게 되었고, 스트릭랜드의 냉소적인 행동에 자극받아 그를 내쫓아야 한다고 고집을 부렸으리라는 것이었다.","chapter":28},{"lemma":"calmness","difficulty":"C1","gloss":"The state of being calm; tranquillity; silence.","ipa":"/ˈkɑ(l)mnəs/","sentence":"I knew her capable of temper, for all the calmness of her manner; and if Stroeve still refused, she might easily have flung out of the studio with vows never to return.","word_in_sentence":"calmness","ko":"그녀의 침착한 태도에도 불구하고 나는 그녀가 화를 낼 수 있는 성격임을 알고 있었다. 만약 스트루브가 계속 거절한다면, 그녀는 다시는 돌아오지 않겠다고 맹세하며 화실에서 뛰쳐나갔을지도 모른다.","chapter":28},{"lemma":"moan","difficulty":"C1","gloss":"A low, mournful cry of pain, sorrow or pleasure.","ipa":"/moʊn/","sentence":"“You don’t understand,” he moaned.","word_in_sentence":"moaned","ko":"\"당신은 이해하지 못해.\" 그가 신음했다.","chapter":28},{"lemma":"hysterical","difficulty":"C1","gloss":"Of, or arising from hysteria.","ipa":"/hɪˈstɛɹɪkəl/","sentence":"“You’re an hysterical ass,” I said a little impatiently.","word_in_sentence":"hysterical","ko":"\"자네는 히스테리를 부리는 바보야.\" 나는 약간 성가신 듯 말했다.","chapter":28},{"lemma":"blunder","difficulty":"C1","gloss":"A clumsy or embarrassing mistake.","ipa":"/ˈblʌn.dɚ/","sentence":"He had a sweet and generous nature, and yet was always blundering; a real feeling for what was beautiful and the capacity to create only what was commonplace; a peculiar delicacy of sentiment and gross manners.","word_in_sentence":"blundering","ko":"그는 다정하고 관대한 성품을 지녔으면서도 늘 실수를 저질렀고, 아름다운 것에 대한 진정한 감각을 가졌으면서도 평범한 것만 창조할 수 있는 능력밖에 없었으며, 독특하게 섬세한 감성과 조야한 매너를 함께 지니고 있었다.","chapter":31},{"lemma":"wearily","difficulty":"C2","gloss":"In a weary manner.","ipa":"/ˈwɪɹɪli/","sentence":"he said wearily.","word_in_sentence":"wearily","ko":"그가 지친 듯 말했다.","chapter":28},{"lemma":"astounded","difficulty":"C1","gloss":"simple past and past participle of astound","ipa":null,"sentence":"I believed him now, and I was astounded.","word_in_sentence":"astounded","ko":"이제 그의 말을 믿었고, 경악했다.","chapter":28},{"lemma":"implore","difficulty":"C1","gloss":"To beg or plead for (something) earnestly or urgently; to beseech.","ipa":"/ɪmˈplɔː/","sentence":"He implored her not to leave him.","word_in_sentence":"implored","ko":"그는 그녀에게 자신을 떠나지 말아달라고 간청했다.","chapter":28},{"lemma":"passionately","difficulty":"C1","gloss":"In a passionate manner.","ipa":"/ˈpæʃənətli/","sentence":"He told her how passionately he loved her, and reminded her of all the devotion he had lavished upon her.","word_in_sentence":"passionately","ko":"그는 자신이 얼마나 열정적으로 그녀를 사랑하는지 말했고, 그녀에게 쏟아부었던 모든 헌신을 상기시켰다.","chapter":28},{"lemma":"lavish","difficulty":"C1","gloss":"Expending or bestowing profusely; profuse; prodigal.","ipa":"/ˈlævɪʃ/","sentence":"He told her how passionately he loved her, and reminded her of all the devotion he had lavished upon her.","word_in_sentence":"lavished","ko":"그는 자신이 얼마나 열정적으로 그녀를 사랑하는지 말했고, 그녀에게 쏟아부었던 모든 헌신을 상기시켰다.","chapter":28},{"lemma":"injurious","difficulty":"C1","gloss":"Causing physical harm or injury; harmful, hurtful.","ipa":"/ɪnˈdʒʊəɹɪəs/","sentence":"Strickland’s injurious calm robbed Stroeve of the rest of his self-control.","word_in_sentence":"injurious","ko":"스트릭랜드의 모독적인 침착함이 스트루브의 남은 자제력마저 앗아갔다.","chapter":28},{"lemma":"stagger","difficulty":"C1","gloss":"An unsteady movement of the body in walking or standing as if one were about to fall; a reeling motion.","ipa":"/ˈstæɡə/","sentence":"He staggered to his feet, but still he would not let her go.","word_in_sentence":"staggered","ko":"그는 비틀거리며 일어났지만, 여전히 그녀를 놓아주려 하지 않았다.","chapter":28},{"lemma":"tumble","difficulty":"C1","gloss":"A fall, especially end over end.","ipa":"/ˈtʌmbl̩/","sentence":"His spectacles had tumbled off in the struggle, and he could not immediately see them.","word_in_sentence":"tumbled","ko":"몸싸움 중에 안경이 떨어져서 당장 찾을 수가 없었다.","chapter":28},{"lemma":"groan","difficulty":"C1","gloss":"A low, mournful sound uttered in pain or grief.","ipa":"/ɡɹəʊn/","sentence":"She heard someone groaning.","word_in_sentence":"groaning","ko":"누군가 신음하는 소리가 들렸대요.","chapter":34},{"lemma":"displeased","difficulty":"C1","gloss":"Not pleased or happy with something.","ipa":"/dɪsˈpliːzd/","sentence":"If in anything I did I displeased you, why didn’t you tell me, and I’d have changed.","word_in_sentence":"displeased","ko":"내가 한 일 중에 당신을 불쾌하게 한 게 있다면, 왜 말해주지 않았어요? 그랬다면 고쳤을 텐데.","chapter":28},{"lemma":"hastily","difficulty":"C1","gloss":"In a hasty manner; quickly or hurriedly.","ipa":"/ˈheɪstɪli/","sentence":"he said hastily.","word_in_sentence":"hastily","ko":"그가 성급하게 말했다.","chapter":28},{"lemma":"shudder","difficulty":"C1","gloss":"To shake nervously, often from fear or horror.","ipa":"/ˈʃʌd.ə/","sentence":"I shuddered.”","word_in_sentence":"shuddered","ko":"나는 몸서리를 쳤다.","chapter":39},{"lemma":"homelike","difficulty":"C2","gloss":"Having the comfortable characteristics of a home.","ipa":null,"sentence":"He looked round his studio wearily; he had loved it because her presence had made it gay and homelike; he shut his eyes for an instant; then he gave her a long look as though to impress on his mind the picture of her.","word_in_sentence":"homelike","ko":"그는 작업실을 지친 듯 둘러보았다. 그녀가 있어서 밝고 아늑했기에 이곳을 사랑했던 것이다. 그는 잠시 눈을 감았다가 그녀의 모습을 마음속에 새기려는 듯 오랫동안 바라보았다.","chapter":28},{"lemma":"recollect","difficulty":"C1","gloss":"To recall; to collect one's thoughts again, especially about past events.","ipa":"/ɹɛkəˈlɛkt/","sentence":"Then he recollected something else.","word_in_sentence":"recollected","ko":"그때 그는 다른 것이 생각났다.","chapter":28},{"lemma":"tremulously","difficulty":"C2","gloss":"In a trembling, quivering, or shaking manner.","ipa":null,"sentence":"“You know as well as I do how Strickland lived,” he said tremulously.","word_in_sentence":"tremulously","ko":"\"스트릭랜드가 어떻게 살았는지 당신도 나만큼 잘 알잖아요.\" 그가 떨리는 목소리로 말했다.","chapter":29},{"lemma":"humiliate","difficulty":"C1","gloss":"To cause to be ashamed; to injure the dignity and self-respect of.","ipa":"/hjuːˈmɪliˌeɪt/","sentence":"When she’s alone and humiliated and broken it would be dreadful if she had nowhere to go.”","word_in_sentence":"humiliated","ko":"그녀가 혼자서 굴욕감에 시달리며 절망에 빠졌을 때 갈 곳이 없다면 끔찍할 것이다.\"","chapter":29},{"lemma":"suddenness","difficulty":"C2","gloss":"The state of being sudden.","ipa":null,"sentence":"I was puzzling over the suddenness of the whole affair.","word_in_sentence":"suddenness","ko":"나는 이 모든 일이 갑작스럽게 벌어진 것에 대해 곰곰 생각하고 있었다.","chapter":29},{"lemma":"unconsciously","difficulty":"C1","gloss":"In an unconscious manner; unknowingly","ipa":"/ˌʌnˈkɑnʃəsli/","sentence":"There was a pencil on the table, and unconsciously he drew a head on the blotting-paper.","word_in_sentence":"unconsciously","ko":"탁자 위에 연필이 하나 있었는데, 그는 무의식중에 흡지 위에 머리 하나를 그렸다.","chapter":29},{"lemma":"blot","difficulty":"C1","gloss":"A blemish, spot or stain made by a coloured substance.","ipa":"/blɒt/","sentence":"There was a pencil on the table, and unconsciously he drew a head on the blotting-paper.","word_in_sentence":"blotting","ko":"탁자 위에 연필이 하나 있었는데, 그는 무의식중에 흡지 위에 머리 하나를 그렸다.","chapter":29},{"lemma":"frightful","difficulty":"C1","gloss":"Afraid, frightened.","ipa":"/ˈfɹaɪtfəl/","sentence":"Oh, if you knew the frightful anguish in my heart.”","word_in_sentence":"frightful","ko":"아, 제 마음속의 끔찍한 고통을 당신이 안다면요.\"","chapter":29},{"lemma":"unworthy","difficulty":"C1","gloss":"Not worthy; lacking value or merit; worthless.","ipa":"/ʌnˈwɝði/","sentence":"I forced myself to go out for hours together in order to leave them by themselves; I wanted to punish myself for suspicions which were unworthy of me; and when I came back I found they didn’t want me—not Strickland, he didn’t care if I was there or not, but Blanche.","word_in_sentence":"unworthy","ko":"나는 억지로 몇 시간씩 밖에 나가서 그들만의 시간을 만들어 주었어요. 나 자신에게 어울리지 않는 의심에 대한 벌을 주고 싶었거든요. 그런데 돌아와 보니 그들은 나를 원하지 않았어요. 스트릭랜드가 아니라—그는 내가 있든 없든 상관하지 않았어요—블랑슈가 말입니다.","chapter":29},{"lemma":"bitterness","difficulty":"C1","gloss":"The quality of having a bitter taste.","ipa":"/ˈbɪtənəs/","sentence":"I looked at her mouth for an expression that could give me a clue to what she felt; I watched her eyes for some tell-tale flash, some hint of dismay or bitterness; I scanned her brow for any passing line that might indicate a settling emotion.","word_in_sentence":"bitterness","ko":"나는 그녀가 무엇을 느끼는지 단서를 얻을 수 있는 표정을 찾아 그녀의 입을 살펴보았고, 무언가를 드러내는 번뜩임이나 당황이나 괴로움의 기색을 찾아 그녀의 눈을 지켜보았으며, 마음속 감정이 굳어지는 것을 나타낼 수도 있는 순간적인 주름살을 찾아 그녀의 이마를 살폈다.","chapter":32},{"lemma":"exhaustion","difficulty":"C1","gloss":"The point of complete depletion, of the state of being used up.","ipa":"/ɪɡˈzɔːs.t͡ʃən/","sentence":"He had reached that stage of exhaustion when he could not stop talking.","word_in_sentence":"exhaustion","ko":"그는 지쳐서 말을 멈출 수 없는 지경에 이르렀다.","chapter":29},{"lemma":"lament","difficulty":"C1","gloss":"An expression of grief, suffering, sadness or regret.","ipa":"/ləˈmɛnt/","sentence":"Now something occurred to him that he had not told me before; now he discussed what he ought to have said instead of what he did say; then he lamented his blindness.","word_in_sentence":"lamented","ko":"이제 전에 내게 말하지 않았던 것이 떠오르기도 하고, 이제 실제로 한 말 대신 했어야 할 말을 논하기도 하고, 그러다가 자신의 맹목을 한탄하기도 했다.","chapter":29},{"lemma":"blindness","difficulty":"C1","gloss":"The condition of being blind; unable to see.","ipa":"/ˈblaɪndnəs/","sentence":"Now something occurred to him that he had not told me before; now he discussed what he ought to have said instead of what he did say; then he lamented his blindness.","word_in_sentence":"blindness","ko":"이제 전에 내게 말하지 않았던 것이 떠오르기도 하고, 이제 실제로 한 말 대신 했어야 할 말을 논하기도 하고, 그러다가 자신의 맹목을 한탄하기도 했다.","chapter":29},{"lemma":"veronal","difficulty":"C2","gloss":"A barbiturate, used formerly to induce sleep.","ipa":null,"sentence":"I gave him a sufficient dose of veronal to insure his unconsciousness for several hours.","word_in_sentence":"veronal","ko":"나는 그가 몇 시간 동안은 의식을 잃고 있을 만큼 충분한 양의 베로날을 주었다.","chapter":29},{"lemma":"insure","difficulty":"C1","gloss":"To provide for compensation if some specified risk occurs. Often agreed by policy (contract) to offer financial compensation in case of an accident, theft or other undesirable event.","ipa":"/ɪnˈʃʊə/","sentence":"I gave him a sufficient dose of veronal to insure his unconsciousness for several hours.","word_in_sentence":"insure","ko":"나는 그가 몇 시간 동안은 의식을 잃고 있을 만큼 충분한 양의 베로날을 주었다.","chapter":29},{"lemma":"unconsciousness","difficulty":"C1","gloss":"The state of lacking consciousness, of being unconscious","ipa":null,"sentence":"I gave him a sufficient dose of veronal to insure his unconsciousness for several hours.","word_in_sentence":"unconsciousness","ko":"나는 그가 몇 시간 동안은 의식을 잃고 있을 만큼 충분한 양의 베로날을 주었다.","chapter":29},{"lemma":"wakeful","difficulty":"C2","gloss":"Awake; not sleeping.","ipa":null,"sentence":"But the bed I made up for myself was sufficiently uncomfortable to give me a wakeful night, and I thought a good deal of what the unlucky Dutchman had told me.","word_in_sentence":"wakeful","ko":"하지만 내가 마련한 잠자리는 충분히 불편해서 밤새 잠을 설쳤고, 나는 그 불운한 네덜란드인이 내게 들려준 이야기를 곰곰히 생각해보았다.","chapter":30},{"lemma":"caress","difficulty":"C1","gloss":"An act of endearment; any act or expression of affection; an embracing, or touching, with tenderness.","ipa":"/kəˈɹɛs/","sentence":"I do not suppose she had ever really cared for her husband, and what I had taken for love was no more than the feminine response to caresses and comfort which in the minds of most women passes for it.","word_in_sentence":"caresses","ko":"그녀가 남편을 진정으로 사랑한 적은 없었을 것이고, 내가 사랑이라고 여겼던 것은 애무와 안락함에 대한 여성적 반응에 지나지 않았을 것이다. 대부분의 여성들 마음속에서는 그것이 사랑으로 통한다.","chapter":30},{"lemma":"rouse","difficulty":"C1","gloss":"An arousal.","ipa":"/ˈɹaʊz/","sentence":"“But I guess Strickland was an ugly customer when he was roused,” said Captain Nichols, reflectively.","word_in_sentence":"roused","ko":"\"하지만 스트릭랜드가 화가 나면 만만치 않은 상대였을 거야.\" 니콜스 선장이 곰곰히 생각하며 말했다.","chapter":47},{"lemma":"gratification","difficulty":"C1","gloss":"The act of gratifying or pleasing, either the mind, or the appetite or taste.","ipa":"/ˌɡɹætɪfɪˈkeɪʃən/","sentence":"It is an emotion made up of the satisfaction in security, pride of property, the pleasure of being desired, the gratification of a household, and it is only by an amiable vanity that women ascribe to it spiritual value.","word_in_sentence":"gratification","ko":"그것은 안전함에서 오는 만족감, 소유에 대한 자부심, 사랑받는다는 기쁨, 가정을 꾸려가는 충족감으로 이루어진 감정이며, 여성들이 여기에 정신적 가치를 부여하는 것은 단지 사랑스러운 허영심 때문이다.","chapter":30},{"lemma":"amiable","difficulty":"C1","gloss":"Friendly; kind; sweet; gracious","ipa":"/ˈeɪ.mi.ə.bəl/","sentence":"It is an emotion made up of the satisfaction in security, pride of property, the pleasure of being desired, the gratification of a household, and it is only by an amiable vanity that women ascribe to it spiritual value.","word_in_sentence":"amiable","ko":"그것은 안전함에서 오는 만족감, 소유에 대한 자부심, 사랑받는다는 기쁨, 가정을 꾸려가는 충족감으로 이루어진 감정이며, 여성들이 여기에 정신적 가치를 부여하는 것은 단지 사랑스러운 허영심 때문이다.","chapter":30},{"lemma":"unravel","difficulty":"C1","gloss":"To cause (something) to no longer be ravelled or tangled; to disentangle, to untangle.","ipa":"/(ˌ)ʌnˈɹævl̩/","sentence":"Who am I that I should seek to unravel the mysterious intricacies of sex?","word_in_sentence":"unravel","ko":"성의 신비로운 복잡함을 풀어내려 하다니, 내가 누구란 말인가?","chapter":30},{"lemma":"intricacy","difficulty":"C2","gloss":"The state or quality of being intricate or entangled.","ipa":"/ˈɪn.tɹɪ.kə.si/","sentence":"Who am I that I should seek to unravel the mysterious intricacies of sex?","word_in_sentence":"intricacies","ko":"성의 신비로운 복잡함을 풀어내려 하다니, 내가 누구란 말인가?","chapter":30},{"lemma":"transference","difficulty":"C1","gloss":"The act of conveying from one place to another; the act of transferring or the fact of being transferred.","ipa":"/tɹænsˈfəɹəns/","sentence":"I think in some curious way the horror which she felt for him was a transference of the horror which she felt for herself because he so strangely troubled her.","word_in_sentence":"transference","ko":"그녀가 그에게 느꼈던 공포는 그가 자신을 이상하게 동요시켰기 때문에 자기 자신에게 느꼈던 공포가 전이된 것이라고 생각한다.","chapter":30},{"lemma":"aloofness","difficulty":"C2","gloss":"The state of being aloof.","ipa":null,"sentence":"His appearance was wild and uncouth; there was aloofness in his eyes and sensuality in his mouth; he was big and strong; he gave the impression of untamed passion; and perhaps she felt in him, too, that sinister element which had made me think of those wild beings of the world’s early history when matter, retaining its early connection with the earth, seemed to possess yet a spirit of its own.","word_in_sentence":"aloofness","ko":"그의 모습은 거칠고 조야했다. 그의 눈에는 냉담함이, 입에는 관능이 있었다. 그는 크고 강했으며, 길들여지지 않은 열정의 인상을 주었다. 그리고 아마도 그녀는 그에게서도 그 불길한 요소를 느꼈을 것이다. 그것은 물질이 대지와의 초기 연결을 유지하며 아직 고유한 정신을 지니고 있는 듯했던 세계 초기 역사의 야생 존재들을 떠올리게 했던 바로 그 요소였다.","chapter":30},{"le t).","ipa":"/kənˈsɪdəɹət/","sentence":"She ceased to be a woman, complex, kind and petulant, considerate and thoughtless; she was a Maenad.","word_in_sentence":"considerate","ko":"그녀는 복잡하고 친절하며 성급하고, 사려 깊으면서도 경솔한 여자이기를 그쳤다. 그녀는 마이나드가 되었다.","chapter":30},{"lemma":"thoughtless","difficulty":"C1","gloss":"Marked by or showing lack of due thought or care.","ipa":"/ˈθɔːtləs/","sentence":"She ceased to be a woman, complex, kind and petulant, considerate and thoughtless; she was a Maenad.","word_in_sentence":"thoughtless","ko":"그녀는 복잡하고 친절하며 성급하고, 사려 깊으면서도 경솔한 여자이기를 그쳤다. 그녀는 마이나드가 되었다.","chapter":30},{"lemma":"fanciful","difficulty":"C1","gloss":"Imaginative or fantastic; ignoring reality.","ipa":"/ˈfænsɪfəl/","sentence":"But perhaps this is very fanciful; and it may be that she was merely bored with her husband and went to Strickland out of a callous curiosity.","word_in_sentence":"fanciful","ko":"하지만 이런 생각은 지나치게 공상적일지도 모른다. 그녀는 단지 남편에게 지루함을 느껴서 냉혹한 호기심으로 스트릭랜드에게 간 것일 수도 있다.","chapter":30},{"lemma":"callous","difficulty":"C1","gloss":"Emotionally hardened; unfeeling and indifferent to the suffering/feelings of others.","ipa":"/ˈkæləs/","sentence":"It was impossible to make him understand that one might be outraged by his callous selfishness.","word_in_sentence":"callous","ko":"그의 냉혹한 이기심에 분개할 수도 있다는 것을 그에게 이해시키는 것은 불가능했다.","chapter":41},{"lemma":"succumb","difficulty":"C1","gloss":"To yield to an overpowering force or overwhelming desire.","ipa":"/səˈkʌm/","sentence":"She may have had no particular feeling for him, but succumbed to his wish from propinquity or idleness, to find then that she was powerless in a snare of her own contriving.","word_in_sentence":"succumbed","ko":"그녀는 그에 대해 특별한 감정이 없었을지도 모르지만, 가까이 있다는 이유로 혹은 무료함 때문에 그의 바람에 굴복했다가, 자신이 스스로 만든 올가미에서 벗어날 수 없음을 깨달았을 수도 있다.","chapter":30},{"lemma":"propinquity","difficulty":"C2","gloss":"Nearness or proximity","ipa":"/pɹəˈpɪŋ.kwɪ.ti/","sentence":"She may have had no particular feeling for him, but succumbed to his wish from propinquity or idleness, to find then that she was powerless in a snare of her own contriving.","word_in_sentence":"propinquity","ko":"그녀는 그에 대해 특별한 감정이 없었을지도 모르지만, 가까이 있다는 이유로 혹은 무료함 때문에 그의 바람에 굴복했다가, 자신이 스스로 만든 올가미에서 벗어날 수 없음을 깨달았을 수도 있다.","chapter":30},{"lemma":"idleness","difficulty":"C2","gloss":"The state of being idle; inactivity.","ipa":"/ˈaɪdəlnəs/","sentence":"She may have had no particular feeling for him, but succumbed to his wish from propinquity or idleness, to find then that she was powerless in a snare of her own contriving.","word_in_sentence":"idleness","ko":"그녀는 그에 대해 특별한 감정이 없었을지도 모르지만, 가까이 있다는 이유로 혹은 무료함 때문에 그의 바람에 굴복했다가, 자신이 스스로 만든 올가미에서 벗어날 수 없음을 깨달았을 수도 있다.","chapter":30},{"lemma":"snare","difficulty":"C1","gloss":"A trap (especially one made from a loop of wire, string, or leather).","ipa":"/snɛ(ə)ɹ/","sentence":"With infinite patience she prepared to snare me and bind me.","word_in_sentence":"snare","ko":"무한한 인내심으로 그녀는 나를 덫에 걸어 묶어두려 했다.","chapter":41},{"lemma":"contriving","difficulty":"C2","gloss":"present participle and gerund of contrive","ipa":null,"sentence":"She may have had no particular feeling for him, but succumbed to his wish from propinquity or idleness, to find then that she was powerless in a snare of her own contriving.","word_in_sentence":"contriving","ko":"그녀는 그에 대해 특별한 감정이 없었을지도 모르지만, 가까이 있다는 이유로 혹은 무료함 때문에 그의 바람에 굴복했다가, 자신이 스스로 만든 올가미에서 벗어날 수 없음을 깨달았을 수도 있다.","chapter":30},{"lemma":"heartlessly","difficulty":"C2","gloss":"In a heartless manner.","ipa":null,"sentence":"It was not strange that he should so heartlessly have betrayed his friends’ confidence, nor that he hesitated not at all to gratify a whim at the cost of another’s misery.","word_in_sentence":"heartlessly","ko":"그가 친구의 신뢰를 그토록 무정하게 배신한 것도, 다른 사람의 불행을 대가로 자신의 변덕을 채우는 데 조금도 주저하지 않은 것도 이상할 게 없었다.","chapter":30},{"lemma":"betray","difficulty":"C1","gloss":"To deliver into the hands of an enemy by treachery or fraud, in violation of trust; to give up treacherously or faithlessly.","ipa":"/bɪˈtɹeɪ/","sentence":"Those who think that a man betrays his character nowhere more clearly than when he is playing a game might on this draw subtle inferences.","word_in_sentence":"betrays","ko":"게임을 할 때만큼 사람의 성격이 명확하게 드러나는 때는 없다고 생각하는 사람들이라면 이것으로부터 미묘한 추론을 할 수 있을 것이다.","chapter":32},{"lemma":"gratify","difficulty":"C2","gloss":"To please.","ipa":"/ˈɡrætɪfaɪ/","sentence":"It was not strange that he should so heartlessly have betrayed his friends’ confidence, nor that he hesitated not at all to gratify a whim at the cost of another’s misery.","word_in_sentence":"gratify","ko":"그가 친구의 신뢰를 그토록 무정하게 배신한 것도, 다른 사람의 불행을 대가로 자신의 변덕을 채우는 데 조금도 주저하지 않은 것도 이상할 게 없었다.","chapter":30},{"lemma":"unselfishness","difficulty":"C2","gloss":"The state of being unselfish.","ipa":null,"sentence":"That is an emotion in which tenderness is an essential part, but Strickland had no tenderness either for himself or for others; there is in love a sense of weakness, a desire to protect, an eagerness to do good and to give pleasure—if not unselfishness, at all events a selfishness which marvellously conceals itself; it has in it a certain diffidence.","word_in_sentence":"unselfishness","ko":"사랑이란 다정함이 필수적인 부분을 차지하는 감정인데, 스트릭랜드에게는 자신에 대해서든 타인에 대해서든 다정함이라는 것이 없었다. 사랑에는 나약함이 있고, 보호하고자 하는 욕구가 있으며, 선을 행하고 기쁨을 주려는 열망이 있다—비이기적이라고 할 수는 없을지라도, 적어도 놀랍도록 교묘하게 자신을 감추는 이기심이 있다. 사랑에는 어떤 수줍음이 깃들어 있다.","chapter":30},{"lemma":"marvellously","difficulty":"C2","gloss":"In a marvellous manner.","ipa":"/ˈmɑːvələsli/","sentence":"That is an emotion in which tenderness is an essential part, but Strickland had no tenderness either for himself or for others; there is in love a sense of weakness, a desire to protect, an eagerness to do good and to give pleasure—if not unselfishness, at all events a selfishness which marvellously conceals itself; it has in it a certain diffidence.","word_in_sentence":"marvellously","ko":"사랑이란 다정함이 필수적인 부분을 차지하는 감정인데, 스트릭랜드에게는 자신에 대해서든 타인에 대해서든 다정함이라는 고 나는 생각했다. 그는 결코 타인의 멍에를 견딜 수 없는 사람이었다.","chapter":30},{"lemma":"uproot","difficulty":"C1","gloss":"To tear up (a plant, etc.) by the roots, or as if by the roots; to extirpate, to root up.","ipa":"/ˌʌpˈɹuːt/","sentence":"I believed him capable of uprooting from his heart, though it might be with agony, so that he was left battered and ensanguined, anything that came between himself and that uncomprehended craving that urged him constantly to he knew not what.","word_in_sentence":"uprooting","ko":"나는 그가 자신과 그 이해할 수 없는 갈망 사이를 가로막는 것이라면 무엇이든, 비록 그것이 고통스럽더라도, 자신이 만신창이가 되고 피투성이가 될지라도, 자신의 마음에서 뿌리째 뽑아낼 수 있는 사람이라고 믿었다. 그 갈망은 끊임없이 그를 자신도 모르는 무언가를 향해 내몰고 있었다.","chapter":30},{"lemma":"ensanguine","difficulty":"C2","gloss":"to stain with blood","ipa":"/ɛnˈsæŋ.ɡwən/","sentence":"I believed him capable of uprooting from his heart, though it might be with agony, so that he was left battered and ensanguined, anything that came between himself and that uncomprehended craving that urged him constantly to he knew not what.","word_in_sentence":"ensanguined","ko":"나는 그가 자신과 그 이해할 수 없는 갈망 사이를 가로막는 것이라면 무엇이든, 비록 그것이 고통스럽더라도, 자신이 만신창이가 되고 피투성이가 될지라도, 자신의 마음에서 뿌리째 뽑아낼 수 있는 사람이라고 믿었다. 그 갈망은 끊임없이 그를 자신도 모르는 무언가를 향해 내몰고 있었다.","chapter":30},{"lemma":"uncomprehende","difficulty":"C2","gloss":{"en":"fail to understand or explain something","ko":"이해 못 함","zh":"不理解"},"ipa":"","sentence":"I believed him capable of uprooting from his heart, though it might be with agony, so that he was left battered and ensanguined, anything that came between himself and that uncomprehended craving that urged him constantly to he knew not what.","word_in_sentence":"uncomprehended","ko":"나는 그가 자신과 그 이해할 수 없는 갈망 사이를 가로막는 것이라면 무엇이든, 비록 그것이 고통스럽더라도, 자신이 만신창이가 되고 피투성이가 될지라도, 자신의 마음에서 뿌리째 뽑아낼 수 있는 사람이라고 믿었다. 그 갈망은 끊임없이 그를 자신도 모르는 무언가를 향해 내몰고 있었다.","chapter":30},{"lemma":"unbecomingly","difficulty":"C2","gloss":"In an unbecoming manner.","ipa":null,"sentence":"He bore himself most unbecomingly.","word_in_sentence":"unbecomingly","ko":"그는 극도로 보기 흉한 행동을 보였다.","chapter":31},{"lemma":"waylay","difficulty":"C2","gloss":"To lie in wait for and attack from ambush.","ipa":"/ˈweɪleɪ/","sentence":"Ata had waylaid the cart that took the mail into Papeete, and besought the man who drove it to go at once to the doctor.","word_in_sentence":"waylaid","ko":"아타가 파페에테로 우편을 가져가는 마차를 가로막고, 마차를 모는 사람에게 즉시 의사에게 가달라고 간청했던 것이다.","chapter":56},{"lemma":"splutter","difficulty":"C2","gloss":"A forceful emission of something, especially in small drops or particles; a spluttering or sputtering.","ipa":"/ˈsplʌtə/","sentence":"He spluttered out words of apology for any wrong he had committed towards her; he told her he loved her devotedly and begged her to return to him.","word_in_sentence":"spluttered","ko":"그는 자신이 그녀에게 저지른 잘못에 대해 더듬거리며 사과했고, 그녀를 헌신적으로 사랑한다고 말하며 자신에게 돌아와 달라고 애원했다.","chapter":31},{"lemma":"devotedly","difficulty":"C2","gloss":"In a devoted manner.","ipa":null,"sentence":"He spluttered out words of apology for any wrong he had committed towards her; he told her he loved her devotedly and begged her to return to him.","word_in_sentence":"devotedly","ko":"그는 자신이 그녀에게 저지른 잘못에 대해 더듬거리며 사과했고, 그녀를 헌신적으로 사랑한다고 말하며 자신에게 돌아와 달라고 애원했다.","chapter":31},{"lemma":"avert","difficulty":"C1","gloss":"To turn aside or away.","ipa":"/əˈvɝt/","sentence":"She would not answer; she walked hurriedly, with averted face.","word_in_sentence":"averted","ko":"그녀는 대답하지 않았다. 얼굴을 돌린 채 서둘러 걸어갔다.","chapter":31},{"lemma":"haste","difficulty":"C1","gloss":"Speed; swiftness; dispatch.","ipa":"/heɪst/","sentence":"Panting a little in his haste, he told her how miserable he was; he besought her to have mercy on him; he promised, if she would forgive him, to do everything she wanted.","word_in_sentence":"haste","ko":"서두르느라 약간 숨을 헐떡이며, 그는 자신이 얼마나 비참한지 말했다. 그녀에게 자비를 베풀어 달라고 간청했다. 그녀가 용서해 준다면 그녀가 원하는 것은 무엇이든 하겠다고 약속했다.","chapter":31},{"lemma":"heartrende","difficulty":"C2","gloss":{"en":"to make someone's heart ache","ko":"심파는","zh":"痛心"},"ipa":"","sentence":"When he told me this he put his hand to his cheek as though he still felt the smart of the blow, and in his eyes was a pain that was heartrending and an amazement that was ludicrous.","word_in_sentence":"heartrending","ko":"그가 내게 이 이야기를 할 때 그는 아직도 그 타격의 아픔을 느끼는 듯 손을 뺨에 갖다 댔고, 그의 눈에는 가슴 아픈 고통과 우스꽝스러운 놀라움이 담겨 있었다.","chapter":31},{"lemma":"overblown","difficulty":"C1","gloss":"Of exaggerated importance; too heavily emphasized, hyped, etc.","ipa":null,"sentence":"He looked like an overblown schoolboy, and though I felt so sorry for him, I could hardly help laughing.","word_in_sentence":"overblown","ko":"그는 덩치만 큰 남학생 같아 보였고, 나는 그가 너무 불쌍했지만 웃음을 참기가 힘들었다.","chapter":31},{"lemma":"inflict","difficulty":"C1","gloss":"To thrust upon; to impose.","ipa":"/ɪnˈflɪkt/","sentence":"Perhaps she got enjoyment out of the torture she inflicted.","word_in_sentence":"inflicted","ko":"아마도 그녀는 자신이 가하는 고문에서 즐거움을 얻었을 것이다.","chapter":31},{"lemma":"sluggish","difficulty":"C1","gloss":"Habitually idle and lazy; slothful; dull; inactive","ipa":"/ˈslʌɡɪʃ/","sentence":"His father was a carpenter, and they dwelt in a little old red-brick house, neat and clean, by the side of a sluggish canal.","word_in_sentence":"sluggish","ko":"그의 아버지는 목수였고, 그들은 완만한 운하 옆에 있는 깔끔하고 깨끗한 작은 낡은 붉은 벽돌집에 살고 있었다.","chapter":31},{"lemma":"stateliness","difficulty":"C2","gloss":"The quality or state of being stately","ipa":null,"sentence":"The streets were wide and empty; for two hundred years the place had been dying, but the houses had the homely stateliness of their time.","word_in_sentence":"stateliness","ko":"거리는 넓고 텅 비어 있었다. 이백 년 동안 그 마을은 쇠락해가고 있었지만, 집들은 그 시대의 소박한 위엄을 간직하고 있었다.","chapter":31},{"lemma":"aroma","difficulty":"C1","gloss":"A smell; especially a pleasant spicy or fragrant one.","ipa":"/əˈɹoʊmə/","sentence":"Rich merchants, sending their wares to the distant Indies, had lived in them calm and prosperous lives, and in their decent decay they kept still an aroma of their splendid past.","word_in_sentence":"aroma","ko":"먼 인도로 상품을 보내던 부유한 상인들이 그 집들에서 평온하고 풍요로운 삶을 살았고, 품위 있게 낡아가는 가운데서도 여전히 찬란했던 과거의 향기를 간직하고 있었다.","chapter":31},{"lemma":"windmill","difficulty":"C1","gloss":"A machine which translates linear motion of wind to rotational motion by means of adjustable vanes called sails.","ipa":"/ˈwɪnd.mɪl/","sentence":"You could wander along the canal till you came to broad green fields, with windmills here and there, in which cattle, black and white, grazed lazily.","word_in_sentence":"windmills","ko":"운하를 따라 걸어가다 보면 넓고 푸른 들판이 나타났고, 여기저기 풍차가 서 있는 가운데 흑백 얼룩의 소들이 느긋하게 풀을 뜯고 있었다.","chapter":31},{"lemma":"graze","difficulty":"C1","gloss":"The act of grazing; a scratching or injuring lightly on passing.","ipa":"/ɡɹeɪz/","sentence":"You could wander along the canal till you came to broad green fields, with windmills here and there, in which cattle, black and white, grazed lazily.","word_in_sentence":"grazed","ko":"운하를 따라 걸어가다 보면 넓고 푸른 들판이 나타났고, 여기저기 풍차가 서 있는 가운데 흑백 얼룩의 소들이 느긋하게 풀을 뜯고 있었다.","chapter":31},{"lemma":"lazily","difficulty":"C1","gloss":"In a lazy manner.","ipa":null,"sentence":"Some lean lazily against the side-posts, humming to themselves or calling to the passer-by in a raucous voice, and some listlessly read.","word_in_sentence":"lazily","ko":"어떤 여자들은 문설주에 나른하게 기대어 혼자 콧노래를 부르거나 지나가는 사람에게 쉰 목소리로 소리를 지르고 있었고, 어떤 여자들은 무기력하게 책을 읽고 있었다.","chapter":47},{"lemma":"boyhood","difficulty":"C1","gloss":"The state or period of being a boy.","ipa":"/ˈbɔɪˌhʊd/","sentence":"I thought that among those surroundings, with their recollections of his boyhood, Dirk Stroeve would forget his unhappiness.","word_in_sentence":"boyhood","ko":"나는 소년 시절의 추억이 깃든 그런 환경 속에서라면 더크 스트루브가 자신의 불행을 잊을 수 있으리라고 생각했다.","chapter":31},{"lemma":"dapper","difficulty":"C1","gloss":"Neat, trim.","ipa":"/ˈdæpə(ɹ)/","sentence":"He had great neatness of person, and he continued to wear his spruce black coat and his bowler hat, always a little too small for him, in a dapper, jaunty manner.","word_in_sentence":"dapper","ko":"몸단장을 매우 깔끔하게 했고, 언제나 자신에게는 조금 작은 중절모와 함께 단정한 검은 코트를 말쑥하고 경쾌하게 차려입고 다녔다.","chapter":31},{"lemma":"jaunty","difficulty":"C1","gloss":"Airy; showy; finical.","ipa":"/ˈd͡ʒɔːn.ti/","sentence":"He had great neatness of person, and he continued to wear his spruce black coat and his bowler hat, always a little too small for him, in a dapper, jaunty manner.","word_in_sentence":"jaunty","ko":"몸단장을 매우 깔끔하게 했고, 언제나 자신에게는 조금 작은 중절모와 함께 단정한 검은 코트를 말쑥하고 경쾌하게 차려입고 다녔다.","chapter":31},{"lemma":"paunch","difficulty":"C2","gloss":"The first compartment of the stomach of a ruminant, the rumen.","ipa":"/pɔːnt͡ʃ/","sentence":"He was getting something of a paunch, and sorrow had no effect on it.","word_in_sentence":"paunch","ko":"배가 나오기 시작했는데, 슬픔은 그것에 아무런 영향도 미치지 못했다.","chapter":31},{"lemma":"bagman","difficulty":"C2","gloss":"A person who collects, transports, or distributes illicit money, especially for the purpose of bribery, extortion, or the making of other improper payments.","ipa":null,"sentence":"He looked more than ever like a prosperous bagman.","word_in_sentence":"bagman","ko":"그 어느 때보다 성공한 외판원 같아 보였다.","chapter":31},{"lemma":"perplexing","difficulty":"C1","gloss":"That causes perplexity.","ipa":"/pɚˈplɛksɪŋ/","sentence":"What a cruel practical joke old Nature played when she flung so many contradictory elements together, and left the man face to face with the perplexing callousness of the universe.","word_in_sentence":"perplexing","ko":"자연이라는 늙은 존재가 그토록 많은 모순된 요소들을 한데 뒤섞어놓고는, 인간을 우주의 당혹스러운 냉혹함과 마주하게 내버려둔 것이야말로 얼마나 잔인한 현실적 농담인가.","chapter":31},{"lemma":"cordiality","difficulty":"C2","gloss":"The quality of being cordial.","ipa":"/kɔːɹˈd͡ʒæl.ɪ.tiː/","sentence":"His cordiality was proof that he knew I had no wish to speak to him.","word_in_sentence":"cordiality","ko":"그의 다정한 태도는 내가 그와 말하고 싶어 하지 않는다는 것을 그가 알고 있다는 증거였다.","chapter":32},{"lemma":"politeness","difficulty":"C1","gloss":"The quality of being polite.","ipa":"/pəˈlaɪtnəs/","sentence":"He was not a man with whom it was worth while wasting politeness.","word_in_sentence":"politeness","ko":"그는 예의를 차릴 가치가 있는 사람이 아니었다.","chapter":32},{"lemma":"bade","difficulty":"C1","gloss":"simple past of bid","ipa":"/bæd/","sentence":"Blanche then held out her hand and bade me good-evening.","word_in_sentence":"bade","ko":"그러자 블랑슈가 손을 내밀며 안녕히 가시라고 인사했다.","chapter":32},{"lemma":"sulkily","difficulty":"C2","gloss":"In a sulky manner.","ipa":null,"sentence":"I followed them rather sulkily to the table at which Strickland always sat, and he called for the board and the chessmen.","word_in_sentence":"sulkily","ko":"나는 다소 뚱한 표정으로 스트릭랜드가 늘 앉던 테이블로 그들을 따라갔고, 그는 체스판과 말을 가져오라고 했다.","chapter":32},{"lemma":"chessman","difficulty":"C2","gloss":"Synonym of chess piece.","ipa":null,"sentence":"I followed them rather sulkily to the table at which Strickland always sat, and he called for the board and the chessmen.","word_in_sentence":"chessmen","ko":"나는 다소 뚱한 표정으로 스트릭랜드가 늘 앉던 테이블로 그들을 따라갔고, 그는 체스판과 말을 가져오라고 했다.","chapter":32},{"lemma":"inscrutable","difficulty":"C1","gloss":"Difficult or impossible to comprehend, fathom, or interpret.","ipa":"/ˌɪnˈskɹuːtəbl̩/","sentence":"I do not know to what inscrutable Nirvana you aim.","word_in_sentence":"inscrutable","ko":"당신이 어떤 불가해한 열반을 목표로 하는지 모르겠습니다.","chapter":42},{"lemma":"motionless","difficulty":"C1","gloss":"At rest, stationary, immobile, not moving.","ipa":"/ˈmoʊʃənlɛs/","sentence":"Her hands lay on her lap motionless, one in the other loosely clasped.","word_in_sentence":"motionless","ko":"그녀의 손은 무릎 위에 움직이지 않은 채 놓여 있었고, 한 손이 다른 손을 느슨하게 감싸고 있었다.","chapter":32},{"lemma":"clasped","difficulty":"C1","gloss":"simple past and past participle of clasp","ipa":"/klæspt/","sentence":"Her hands lay on her lap motionless, one in the other loosely clasped.","word_in_sentence":"clasped","ko":"그녀의 손은 무릎 위에 움직이지 않은 채 놓여 있었고, 한 손이 다른 손을 느슨하게 감싸고 있었다.","chapter":32},{"lemma":"horrid","difficulty":"C1","gloss":"Bristling, rough, rugged.","ipa":"/ˈhɒ.ɹɪd/","sentence":"I knew from what I had heard that she was a woman of violent passions; and that injurious blow that she had given Dirk, the man who had loved her so devotedly, betrayed a sudden temper and a horrid cruelty.","word_in_sentence":"horrid","ko":"내가 들은 바로는 그녀가 격렬한 감정의 소유자라는 것을 알고 있었다. 그리고 그토록 헌신적으로 자신을 사랑했던 남자 더크에게 가한 그 해로운 타격은 갑작스러운 성질과 끔찍한 잔혹함을 드러내는 것이었다.","chapter":32},{"lemma":"housewifery","difficulty":"C2","gloss":"The state or activity of being a housewife; household management, domestic skills.","ipa":"/ˈhaʊswɪf(ə)ɹi/","sentence":"It showed an eagerness for adventure, a readiness for the hand-to-mouth, which the care she took of her home and her love of good housewifery made not a little remarkable.","word_in_sentence":"housewifery","ko":"이는 모험에 대한 열망과 그날그날 살아가는 삶에 대한 각오를 보여주는 것이었는데, 집안을 돌보는 그녀의 세심함과 살림에 대한 애정을 생각하면 적지 않게 놀라운 일이었다.","chapter":32},{"lemma":"demure","difficulty":"C1","gloss":"Modest, quiet, reserved, or serious.","ipa":"/dɪˈmjʊɹ/","sentence":"She must be a woman of complicated character, and there was something dramatic in the contrast of that with her demure appearance.","word_in_sentence":"demure","ko":"그녀는 분명 복잡한 성격의 소유자였고, 그런 면과 그녀의 얌전한 외모 사이의 대조에는 뭔가 극적인 것이 있었다.","chapter":32},{"lemma":"busily","difficulty":"C1","gloss":"In a busy manner; actively.","ipa":null,"sentence":"I was excited by the encounter, and my fancy worked busily while I sought to concentrate myself on the game I was playing.","word_in_sentence":"busily","ko":"나는 그 만남에 흥분했고, 게임에 집중하려고 애쓰는 동안 상상력이 분주하게 돌아갔다.","chapter":32},{"lemma":"vanquish","difficulty":"C1","gloss":"To defeat (someone); to overcome.","ipa":"/ˈvæŋkwɪʃ/","sentence":"I always tried my best to beat Strickland, because he was a player who despised the opponent he vanquished; his exultation in victory made defeat more difficult to bear.","word_in_sentence":"vanquished","ko":"나는 항상 스트릭랜드를 이기려고 최선을 다했는데, 그는 자신이 이긴 상대를 경멸하는 선수였기 때문이다. 승리에 대한 그의 득의양양함은 패배를 더욱 견디기 어렵게 만들었다.","chapter":32},{"lemma":"exultation","difficulty":"C2","gloss":"The act of exulting; great joy at success or victory, or at any advantage gained; rapturous delight","ipa":"/ˌɛɡzʌlˈteɪʃən/","sentence":"Something seemed to twist his heart, and suddenly he felt an exultation, a sense of wonderful freedom.","word_in_sentence":"exultation","ko":"무언가가 그의 심장을 비틀어놓는 것 같았고, 갑자기 그는 환희와 놀라운 자유감을 느꼈다.","chapter":50},{"lemma":"inference","difficulty":"C1","gloss":"The act or process of inferring by deduction or induction.","ipa":"/ˈɪn.fɚ.əns/","sentence":"Those who think that a man betrays his character nowhere more clearly than when he is playing a game might on this draw subtle inferences.","word_in_sentence":"inferences","ko":"게임을 할 때만큼 사람의 성격이 명확하게 드러나는 때는 없다고 생각하는 사람들이라면 이것으로부터 미묘한 추론을 할 수 있을 것이다.","chapter":32},{"lemma":"unwarranted","difficulty":"C1","gloss":"Not warranted; being without warrant, authority, or guaranty; unwarrantable.","ipa":null,"sentence":"No word had been said to give me anything to think about, and any surmises I might make were unwarranted.","word_in_sentence":"unwarranted","ko":"내가 생각해볼 만한 것을 줄 수 있는 말은 한 마디도 나오지 않았고, 내가 할 수 있는 어떤 추측도 근거가 없는 것이었다.","chapter":32},{"lemma":"intrigue","difficulty":"C1","gloss":"A complicated or clandestine plot or scheme intended to effect some purpose by secret artifice; conspiracy; stratagem.","ipa":"/ˈɪntɹiːɡ/","sentence":"I was intrigued.","word_in_sentence":"intrigued","ko":"나는 호기심이 생겼다.","chapter":32},{"lemma":"excitable","difficulty":"C1","gloss":"Easily excited.","ipa":null,"sentence":"Stroeve had always been excitable, but now he was beside himself; there was no reasoning with him.","word_in_sentence":"excitable","ko":"스트루브는 원래 흥분을 잘 하는 성격이었지만, 지금은 완전히 제정신이 아니었다. 그와는 이성적인 대화가 불가능했다.","chapter":33},{"lemma":"tolerable","difficulty":"C1","gloss":"Capable of being borne, tolerated or endured; bearable or endurable.","ipa":"/ˈtɑləɹəbl̩/","sentence":"I thought it probable enough that Blanche Stroeve would not continue to find life with Strickland tolerable, but one of the falsest of proverbs is that you must lie on the bed that you have made.","word_in_sentence":"tolerable","ko":"블랑슈 스트루브가 스트릭랜드와의 생활을 계속 견딜 수 있으리라고는 생각하지 않았지만, '자신이 깐 자리에는 자신이 누워야 한다'는 속담만큼 거짓된 것도 없다.","chapter":33},{"lemma":"proverb","difficulty":"C1","gloss":"A commonly used sentence expressing popular wisdom.","ipa":"/ˈpɹɑvɝb/","sentence":"I thought it probable enough that Blanche Stroeve would not continue to find life with Strickland tolerable, but one of the falsest of proverbs is that you must lie on the bed that you have made.","word_in_sentence":"proverbs","ko":"블랑슈 스트루브가 스트릭랜드와의 생활을 계속 견딜 수 있으리라고는 생각하지 않았지만, '자신이 깐 자리에는 자신이 누워야 한다'는 속담만큼 거짓된 것도 없다.","chapter":33},{"lemma":"evade","difficulty":"C1","gloss":"To get away from by cunning; to avoid by using dexterity, subterfuge, address, or ingenuity; to cleverly escape from","ipa":"/ɪˈveɪd/","sentence":"The experience of life shows that people are constantly doing things which must lead to disaster, and yet by some chance manage to evade the result of their folly.","word_in_sentence":"evade","ko":"인생 경험을 보면 사람들은 끊임없이 재앙으로 이어질 수밖에 없는 일들을 저지르면서도, 어떤 우연한 기회로 자신의 어리석음이 초래할 결과를 피해 나간다.","chapter":33},{"lemma":"humbly","difficulty":"C1","gloss":"In a humble manner.","ipa":"/ˈhʌmbli/","sentence":"When Blanche quarrelled with Strickland she had only to leave him, and her husband was waiting humbly to forgive and forget.","word_in_sentence":"humbly","ko":"블랑슈가 스트릭랜드와 다투면 그냥 그를 떠나기만 하면 되었고, 남편은 겸손하게 용서하고 잊어주기를 기다리고 있었다.","chapter":33},{"lemma":"woeful","difficulty":"C1","gloss":"Full of woe; sorrowful; distressed with grief or calamity.","ipa":"/ˈwəʊfəl/","sentence":"Stroeve gave me a look with his woeful eyes.","word_in_sentence":"woeful","ko":"스트루브가 슬픈 눈으로 나를 바라보았다.","chapter":33},{"lemma":"flippant","difficulty":"C1","gloss":"Showing disrespect through a casual attitude, levity, and a lack of due seriousness; pert.","ipa":"/ˈflɪp.ənt/","sentence":"I was sorry if I had seemed impatient or flippant.","word_in_sentence":"flippant","ko":"내가 성급하거나 경솔하게 보였다면 미안했다.","chapter":33},{"lemma":"unaltered","difficulty":"C1","gloss":"Remaining in its initial state; not changed.","ipa":null,"sentence":"His love for you is unaltered.","word_in_sentence":"unaltered","ko":"당신에 대한 그의 사랑은 변하지 않았다.","chapter":33},{"lemma":"disastrously","difficulty":"C2","gloss":"In a disastrous way. (Of the nature of a disaster; calamitously.)","ipa":"/dɪˈzæs.tɹəs.li/","sentence":"But though I was no less convinced than Stroeve that the connection between Strickland and Blanche would end disastrously, I did not expect the issue to take the tragic form it did.","word_in_sentence":"disastrously","ko":"하지만 스트릭랜드와 블랑슈의 관계가 파멸적으로 끝날 것이라고 스트루브만큼이나 확신했음에도 불구하고, 나는 그 결말이 실제로 일어난 것처럼 비극적인 형태를 띨 것이라고는 예상하지 못했다.","chapter":34},{"lemma":"breathless","difficulty":"C1","gloss":"Having difficulty breathing; gasping.","ipa":"/ˈbɹɛθləs/","sentence":"They are sensual with an unashamed violence that leaves you breathless.","word_in_sentence":"breathless","ko":"그것들은 숨이 막힐 정도로 부끄러움 없는 격렬함으로 관능적이다.","chapter":45},{"lemma":"sultry","difficulty":"C1","gloss":"Hot and humid; sweltering.","ipa":"/ˈsʌltɹi/","sentence":"The summer came, breathless and sultry, and even at night there was no coolness to rest one’s jaded nerves.","word_in_sentence":"sultry","ko":"여름이 왔다. 숨막히고 무더운 여름이었고, 밤이 되어도 지친 신경을 달래줄 서늘함은 찾아볼 수 없었다.","chapter":34},{"lemma":"coolness","difficulty":"C1","gloss":"Moderate chilliness.","ipa":"/ˈkuːlnəs/","sentence":"The summer came, breathless and sultry, and even at night there was no coolness to rest one’s jaded nerves.","word_in_sentence":"coolness","ko":"여름이 왔다. 숨막히고 무더운 여름이었고, 밤이 되어도 지친 신경을 달래줄 서늘함은 찾아볼 수 없었다.","chapter":34},{"lemma":"lamentation","difficulty":"C2","gloss":"The act of lamenting.","ipa":"/ˌlæm.ənˈteɪ.ʃən/","sentence":"Dirk, with his vain lamentations, had begun to bore me, and I avoided his society.","word_in_sentence":"lamentations","ko":"헛된 한탄만 늘어놓는 더크가 지겨워지기 시작했고, 나는 그와의 만남을 피했다.","chapter":34},{"lemma":"freshness","difficulty":"C1","gloss":"The state or quality of being fresh.","ipa":"/ˈfɹɛʃnəs/","sentence":"My thoughts wandered, and I thought of the sunny beaches of Brittany and the freshness of the sea.","word_in_sentence":"freshness","ko":"생각이 딴 곳으로 흘러가면서 브르타뉴의 햇살 가득한 해변과 바다의 상쾌함을 떠올렸다.","chapter":34},{"lemma":"lait","difficulty":"C2","gloss":"To seek; search for; inquire.","ipa":null,"sentence":"By my side was the empty bowl in which the concierge had brought me my café au lait and the fragment of croissant which I had not had appetite enough to eat.","word_in_sentence":"lait","ko":"내 곁에는 관리인이 가져다준 카페오레를 마신 빈 그릇과 식욕이 없어서 다 먹지 못한 크루아상 조각이 놓여 있었다.","chapter":34},{"lemma":"croissant","difficulty":"C1","gloss":"A flaky roll or pastry in a form of a crescent.","ipa":"/kɹəˈsɑnt/","sentence":"By my side was the empty bowl in which the concierge had brought me my café au lait and the fragment of croissant which I had not had appetite enough to eat.","word_in_sentence":"croissant","ko":"내 곁에는 관리인이 가져다준 카페오레를 마신 빈 그릇과 식욕이 없어서 다 먹지 못한 크루아상 조각이 놓여 있었다.","chapter":34},{"lemma":"tinkle","difficulty":"C2","gloss":"To make light metallic sounds, rather like a very small bell.","ipa":"/ˈtɪŋkəl/","sentence":"There was a tinkle at my bell, and I left her to open the door.","word_in_sentence":"tinkle","ko":"벨이 딸랑 울렸고, 나는 그녀가 문을 열도록 내버려 두었다.","chapter":34},{"lemma":"hoarsely","difficulty":"C2","gloss":"With a dry, harsh voice.","ipa":null,"sentence":"“She’s killed herself,” he said hoarsely.","word_in_sentence":"hoarsely","ko":"\"그녀가 자살했어요.\" 그가 쉰 목소리로 말했다.","chapter":34},{"lemma":"gibber","difficulty":"C2","gloss":"Gibberish, unintelligible speech.","ipa":"/ˈd͡ʒɪbə(ɹ)/","sentence":"He gibbered like an idiot.","word_in_sentence":"gibbered","ko":"그는 바보처럼 횡설수설했다.","chapter":34},{"lemma":"thump","difficulty":"C1","gloss":"A blow that produces a muffled sound.","ipa":"/θʌmp/","sentence":"My heart thumped against my ribs, and, I do not know why, I flew into a temper.","word_in_sentence":"thumped","ko":"내 심장이 갈비뼈에 쿵쿵 부딪혔고, 왜 그랬는지 모르겠지만 나는 화가 치밀어 올랐다.","chapter":34},{"lemma":"despairing","difficulty":"C1","gloss":"Feeling, expressing, or caused by despair; hopeless.","ipa":"/dɪˈspɛəɹ.ɪŋ/","sentence":"He made despairing gestures with his hands, but still no words came from his mouth.","word_in_sentence":"despairing","ko":"그는 절망적인 몸짓을 손으로 해댔지만, 여전히 입에서는 아무 말도 나오지 않았다.","chapter":34},{"lemma":"mouthful","difficulty":"C1","gloss":"The amount that will fit in a mouth.","ipa":"/ˈmaʊθfʊl/","sentence":"He gulped down a mouthful, and some of it was spilt on his shirt-front.","word_in_sentence":"mouthful","ko":"그는 한 모금을 꿀꺽 삼켰고, 물 일부가 셔츠 앞가슴에 흘러내렸다.","chapter":34},{"lemma":"magnifying","difficulty":"C1","gloss":"present participle and gerund of magnify","ipa":null,"sentence":"The magnifying-glasses he wore distorted them.","word_in_sentence":"magnifying","ko":"그가 쓴 돋보기가 눈을 일그러뜨리고 있었다.","chapter":34},{"lemma":"distort","difficulty":"C1","gloss":"To bring something out of shape, to misshape.","ipa":"/dɪˈstɔɹt/","sentence":"The magnifying-glasses he wore distorted them.","word_in_sentence":"distorted","ko":"그가 쓴 돋보기가 눈을 일그러뜨리고 있었다.","chapter":34},{"lemma":"blanche","difficulty":"C1","gloss":"A female given name from French.","ipa":null,"sentence":"Blanche was lying on the bed.","word_in_sentence":"Blanche","ko":"블랑슈가 침대에 누워 있었어요.","chapter":34},{"lemma":"oxalic","difficulty":"C2","gloss":"Of or pertaining to oxalic acid or its derivatives.","ipa":"/ɑkˈsælɪk/","sentence":"There was a bottle of oxalic acid on the table.”","word_in_sentence":"oxalic","ko":"탁자 위에는 옥살산 병이 놓여 있었고요.\"","chapter":34},{"lemma":"shriek","difficulty":"C1","gloss":"A sharp, shrill outcry or scream; a shrill wild cry caused by sudden or extreme terror, pain, or the like.","ipa":"/ʃɹiːk/","sentence":"His voice rose to a shriek.","word_in_sentence":"shriek","ko":"그의 목소리가 비명에 가깝게 높아졌다.","chapter":34},{"lemma":"stretcher","difficulty":"C1","gloss":"One who, or that which, stretches.","ipa":"/ˈstɹɛt͡ʃə/","sentence":"And when the ambulance came and they put her on a stretcher, they made me go in the kitchen so that she shouldn’t know I was there.”","word_in_sentence":"stretcher","ko":"그리고 구급차가 와서 그녀를 들것에 올려놓을 때, 그들은 그녀가 내가 거기 있다는 걸 모르게 하려고 나를 부엌으로 보냈다.\"","chapter":34},{"lemma":"gaunt","difficulty":"C1","gloss":"Angular, bony, and lean.","ipa":"/ɡɔːnt/","sentence":"But when we arrived at the hospital, a gaunt, cheerless building, the mere sight of which was enough to make one’s heart sick, and after being directed from this official to that, up endless stairs and through long, bare corridors, found the doctor in charge of the case, we were told that the patient was too ill to see anyone that day.","word_in_sentence":"gaunt","ko":"하지만 우리가 병원에 도착했을 때—보기만 해도 마음이 아플 만큼 을씨년스럽고 삭막한 건물이었다—이 직원에게서 저 직원에게로, 끝없는 계단을 오르고 길고 삭막한 복도를 지나 담당 의사를 찾아갔지만, 환자가 그날은 누구도 만날 수 없을 만큼 위중하다는 말을 들었다.","chapter":34},{"lemma":"offhand","difficulty":"C1","gloss":"Without planning or thinking ahead.","ipa":"/ˌɔfˈhænd/","sentence":"The doctor was a little bearded man in white, with an offhand manner.","word_in_sentence":"offhand","ko":"의사는 수염을 기른 작은 체구의 남자로, 흰 옷을 입고 있었고 무심한 태도를 보였다.","chapter":34},{"lemma":"needlessly","difficulty":"C1","gloss":"In a needless manner.","ipa":null,"sentence":"At first he thought that Dirk was the cause of the disaster, and he was needlessly brusque with him.","word_in_sentence":"needlessly","ko":"처음에 그는 디르크가 이 참사의 원인이라고 생각했고, 불필요하게 그에게 무뚝뚝하게 굴었다.","chapter":34},{"lemma":"brusque","difficulty":"C2","gloss":"Rudely abrupt; curt, unfriendly.","ipa":"/bɹʊsk/","sentence":"At first he thought that Dirk was the cause of the disaster, and he was needlessly brusque with him.","word_in_sentence":"brusque","ko":"처음에 그는 디르크가 이 참사의 원인이라고 생각했고, 불필요하게 그에게 무뚝뚝하게 굴었다.","chapter":34},{"lemma":"faintly","difficulty":"C1","gloss":"In a faint manner; very quietly or lightly.","ipa":"/ˈfeɪntli/","sentence":"Stroeve smiled faintly.","word_in_sentence":"faintly","ko":"스트루브가 희미하게 미소를 지었다.","chapter":38},{"lemma":"fright","difficulty":"C1","gloss":"A state of terror excited by the sudden appearance of danger; sudden and violent fear, usually of short duration; a sudden alarm.","ipa":"/fɹaɪt/","sentence":"It may be that she will get off with a fright.","word_in_sentence":"fright","ko":"그저 놀라는 것으로 끝날 수도 있습니다.","chapter":34},{"lemma":"frigid","difficulty":"C1","gloss":"Very cold; lacking warmth; icy.","ipa":"/ˈfɹɪd͡ʒɪd/","sentence":"There was in his tone a frigid contempt.","word_in_sentence":"frigid","ko":"그의 어조에는 차가운 경멸이 담겨 있었다.","chapter":34},{"lemma":"miserably","difficulty":"C1","gloss":"In a miserable manner.","ipa":null,"sentence":"I gave him books to read, but after a page or two he would put the book down and stare miserably into space.","word_in_sentence":"miserably","ko":"나는 그에게 읽을 책을 주었지만, 한두 페이지 읽고 나면 책을 내려놓고 비참하게 허공을 바라보곤 했다.","chapter":35},{"lemma":"piquet","difficulty":"C2","gloss":"A game of cards for two people, with thirty-two cards, all the deuces, threes, fours, fives, and sixes being set aside.","ipa":"/pɪˈkɛt/","sentence":"During the evening we played innumerable games of piquet, and bravely, not to disappoint my efforts, he tried to appear interested.","word_in_sentence":"piquet","ko":"저녁에는 끝없이 피케 게임을 했고, 내 노력을 헛되게 하지 않으려고 용감하게 관심 있는 척 애썼다.","chapter":35},{"lemma":"bravely","difficulty":"C1","gloss":"In a brave manner.","ipa":"/ˈbɹeɪvli/","sentence":"During the evening we played innumerable games of piquet, and bravely, not to disappoint my efforts, he tried to appear interested.","word_in_sentence":"bravely","ko":"저녁에는 끝없이 피케 게임을 했고, 내 노력을 헛되게 하지 않으려고 용감하게 관심 있는 척 애썼다.","chapter":35},{"lemma":"draught","difficulty":"C1","gloss":"Alternative form of draft in some of its senses.","ipa":"/dɹæft/","sentence":"Finally I gave him a draught, and he sank into uneasy slumber.","word_in_sentence":"draught","ko":"마침내 나는 그에게 수면제를 주었고, 그는 불안한 잠에 빠져들었다.","chapter":35},{"lemma":"slumber","difficulty":"C1","gloss":"
