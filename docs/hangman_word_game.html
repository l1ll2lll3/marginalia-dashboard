ord had a blistering tongue.","word_in_sentence":"blistering","ko":"로즈 워터포드는 독설가였다.","chapter":5},{"lemma":"elegance","difficulty":"C1","gloss":"Grace, refinement, and beauty in movement, appearance, or manners.","ipa":"/ˈɛl.ɪ.ɡəns/","sentence":"She managed her surroundings with elegance.","word_in_sentence":"elegance","ko":"그녀는 주변 환경을 우아하게 꾸며나갔다.","chapter":5},{"lemma":"chintz","difficulty":"C2","gloss":"A painted or stained calico fabric, originally produced in India, and known for its brightly colored designs.","ipa":"/t͡ʃɪnts/","sentence":"Her flat was always neat and cheerful, gay with flowers, and the chintzes in the drawing-room, notwithstanding their severe design, were bright and pretty.","word_in_sentence":"chintzes","ko":"그녀의 아파트는 언제나 깔끔하고 밝았으며, 꽃들로 화사했고, 응접실의 무늬 있는 면직물들도 엄격한 디자인에도 불구하고 밝고 예뻤다.","chapter":5},{"lemma":"comely","difficulty":"C2","gloss":"Of a person: attractive or pleasing to look at; beautiful, handsome; also, attractive but not particularly beautiful or handsome.","ipa":"/ˈkʌmli/","sentence":"The meals in the artistic little dining-room were pleasant; the table looked nice, the two maids were trim and comely; the food was well cooked.","word_in_sentence":"comely","ko":"예술적인 작은 식당에서의 식사는 즐거웠다. 식탁은 보기 좋게 차려져 있었고, 두 하녀는 단정하고 예뻤으며, 음식은 잘 요리되어 있었다.","chapter":5},{"lemma":"housekeeper","difficulty":"C1","gloss":"Someone (traditionally a woman) employed to look after the home, typically by managing domestic servants or superintending household management; also someone with equivalent duties in a hotel, institution etc.","ipa":"/ˈhaʊskipɚ/","sentence":"It was impossible not to see that Mrs. Strickland was an excellent housekeeper.","word_in_sentence":"housekeeper","ko":"스트릭랜드 부인이 훌륭한 주부라는 것을 모를 수가 없었다.","chapter":5},{"lemma":"flannel","difficulty":"C1","gloss":"A soft cloth material originally woven from wool, today often combined with cotton or synthetic fibers.","ipa":"/ˈflænəl/","sentence":"The son—his name was Robert—was a boy of sixteen at Rugby; and you saw him in flannels and a cricket cap, and again in a tail-coat and a stand-up collar.","word_in_sentence":"flannels","ko":"아들—이름은 로버트였다—은 러그비 학교에 다니는 열여섯 살 소년이었다. 사진 속 그는 플란넬 바지에 크리켓 모자를 쓰고 있기도 하고, 연미복에 세워진 칼라를 하고 있기도 했다.","chapter":5},{"lemma":"candid","difficulty":"C1","gloss":"Impartial and free from prejudice.","ipa":"/ˈkæn.dɪd/","sentence":"He had his mother’s candid brow and fine, reflective eyes.","word_in_sentence":"candid","ko":"그는 어머니의 솔직한 이마와 아름답고 사려 깊은 눈을 닮았다.","chapter":5},{"lemma":"profusion","difficulty":"C1","gloss":"abundance; the state of being profuse; a cornucopia","ipa":"/pɹoʊˈfjuʒən/","sentence":"Ata’s father had planted crotons round his property, and they grew in coloured profusion, gay and brilliant; they fenced the land with flame.","word_in_sentence":"profusion","ko":"아타의 아버지는 자신의 땅 둘레에 크로톤을 심어놓았는데, 그것들이 화려한 색깔로 무성하게 자라나 밝고 찬란했다. 그 나무들이 불꽃처럼 땅을 둘러쌌다.","chapter":52},{"lemma":"sedate","difficulty":"C1","gloss":"Remaining composed and dignified, and avoiding too much activity or excitement.","ipa":"/səˈdeɪt/","sentence":"Her hair, thick and dark like her mother’s, fell over her shoulders in fine profusion, and she had the same kindly expression and sedate, untroubled eyes.","word_in_sentence":"sedate","ko":"어머니처럼 짙고 검은 머리카락이 어깨 위로 풍성하게 흘러내렸고, 어머니와 같은 친절한 표정과 차분하고 평온한 눈을 하고 있었다.","chapter":5},{"lemma":"untroubled","difficulty":"C2","gloss":"Without worries; free from care.","ipa":null,"sentence":"Her hair, thick and dark like her mother’s, fell over her shoulders in fine profusion, and she had the same kindly expression and sedate, untroubled eyes.","word_in_sentence":"untroubled","ko":"어머니처럼 짙고 검은 머리카락이 어깨 위로 풍성하게 흘러내렸고, 어머니와 같은 친절한 표정과 차분하고 평온한 눈을 하고 있었다.","chapter":5},{"lemma":"naivete","difficulty":"C2","gloss":"Alternative spelling of naïveté.","ipa":null,"sentence":"Perhaps her naivete was her greatest charm.","word_in_sentence":"naivete","ko":"아마도 그녀의 순진함이 가장 큰 매력이었을 것이다.","chapter":5},{"lemma":"philistine","difficulty":"C1","gloss":"A non-Semitic person from ancient Philistia, a region in the southwest Levant in the Middle East.","ipa":"/ˈfɪlɪstaɪn/","sentence":"“He’s a perfect philistine.”","word_in_sentence":"philistine","ko":"\"그는 완전한 속물이에요.\"","chapter":5},{"lemma":"disparagingly","difficulty":"C2","gloss":"Insultingly.","ipa":null,"sentence":"She said this not disparagingly, but affectionately rather, as though, by acknowledging the worst about him, she wished to protect him from the aspersions of her friends.","word_in_sentence":"disparagingly","ko":"그녀는 이 말을 경멸조로 한 것이 아니라 오히려 애정을 담아 했다. 마치 그의 최악의 면을 인정함으로써 친구들의 비난으로부터 그를 보호하려는 듯했다.","chapter":5},{"lemma":"affectionately","difficulty":"C1","gloss":"In an affectionate manner.","ipa":"/əˈfɛkʃənətli/","sentence":"She said this not disparagingly, but affectionately rather, as though, by acknowledging the worst about him, she wished to protect him from the aspersions of her friends.","word_in_sentence":"affectionately","ko":"그녀는 이 말을 경멸조로 한 것이 아니라 오히려 애정을 담아 했다. 마치 그의 최악의 면을 인정함으로써 친구들의 비난으로부터 그를 보호하려는 듯했다.","chapter":5},{"lemma":"aspersion","difficulty":"C2","gloss":"An attack on somebody's reputation or good name, often in the phrase to cast aspersions upon….","ipa":null,"sentence":"She said this not disparagingly, but affectionately rather, as though, by acknowledging the worst about him, she wished to protect him from the aspersions of her friends.","word_in_sentence":"aspersions","ko":"그녀는 이 말을 경멸조로 한 것이 아니라 오히려 애정을 담아 했다. 마치 그의 최악의 면을 인정함으로써 친구들의 비난으로부터 그를 보호하려는 듯했다.","chapter":5},{"lemma":"shyness","difficulty":"C1","gloss":"The quality of being shy; a fear of social interactions.","ipa":"/ˈʃaɪnəs/","sentence":"I felt a certain shyness at referring to matters which were no concern of mine.","word_in_sentence":"shyness","ko":"나와는 상관없는 일에 대해 언급하는 것이 어딘지 부끄러웠다.","chapter":8},{"lemma":"gibe","difficulty":"C2","gloss":"Alternative spelling of gybe.","ipa":null,"sentence":"I felt sure he was seeking for some gibe, could think of none, and so was forced to silence.","word_in_sentence":"gibe","ko":"나는 그가 비꼬는 말을 찾고 있지만 떠오르지 않아서 어쩔 수 없이 침묵할 수밖에 없다고 확신했다.","chapter":20},{"lemma":"elicit","difficulty":"C1","gloss":"To evoke, educe (emotions, feelings, responses, etc.); to generate, obtain, or provoke as a response or answer.","ipa":"/ɪˈlɪsɪt/","sentence":"She smiled to cover her shyness, and I fancied she had a fear that I would make the sort of gibe that such a confession could hardly have failed to elicit from Rose Waterford.","word_in_sentence":"elicit","ko":"그녀는 수줍음을 감추려고 미소를 지었는데, 나는 그녀가 내가 로즈 워터포드라면 그런 고백을 듣고 틀림없이 했을 법한 조롱을 할까 봐 두려워하는 것 같다고 생각했다.","chapter":5},{"lemma":"awfully","difficulty":"C1","gloss":"Badly, terribly.","ipa":"/ˈɔːfʊli/","sentence":"They’re such awfully nice kids.","word_in_sentence":"awfully","ko":"그렇게 착한 아이들인데.","chapter":12},{"lemma":"uncommonly","difficulty":"C1","gloss":"To an uncommon degree; unusually or extremely.","ipa":null,"sentence":"It was a thoroughly dull party from the beginning, but if you will come I shall be uncommonly grateful.","word_in_sentence":"uncommonly","ko":"처음부터 끝까지 지독히 따분한 파티가 될 텐데, 그래도 와주신다면 정말 고맙겠어요.","chapter":6},{"lemma":"neighbourly","difficulty":"C2","gloss":"Showing the qualities of a friendly and helpful neighbour.","ipa":"/ˈneɪbɚˌli/","sentence":"It was only neighbourly to accept.","word_in_sentence":"neighbourly","ko":"이웃 간의 정으로라도 응해야 할 일이었다.","chapter":6},{"lemma":"gaily","difficulty":"C2","gloss":"Merrily.","ipa":"/ˈɡeɪli/","sentence":"I asked gaily.","word_in_sentence":"gaily","ko":"나는 유쾌하게 물었다.","chapter":27},{"lemma":"jest","difficulty":"C1","gloss":"An act performed for amusement; a joke.","ipa":"/d͡ʒɛst/","sentence":"“You are jesting,” said Strickland.","word_in_sentence":"jesting","ko":"\"농담하시는군요.\" 스트릭랜드가 말했다.","chapter":55},{"lemma":"facetiousness","difficulty":"C2","gloss":"The state of being facetious","ipa":null,"sentence":"Strickland gave the polite little laugh with which people acknowledge a facetiousness in which they see nothing funny, but did not speak.","word_in_sentence":"facetiousness","ko":"스트릭랜드는 전혀 재미있지 않은 농담을 예의상 인정할 때 사람들이 짓는 그런 정중한 웃음을 지었지만, 말은 하지 않았다.","chapter":6},{"lemma":"civilised","difficulty":"C1","gloss":"simple past and past participle of civilise","ipa":"/ˈsɪv.ɪ.laɪzd/","sentence":"But the desire for approbation is perhaps the most deeply seated instinct of civilised man.","word_in_sentence":"civilised","ko":"하지만 인정받고자 하는 욕구는 아마도 문명인이 가진 가장 깊이 뿌리박힌 본능일 것이다.","chapter":14},{"lemma":"ingenuity","difficulty":"C1","gloss":"The ability to solve difficult problems in original, clever, and inventive ways; ingeniousness.","ipa":"/ˌɪnd͡ʒəˈn(j)uːəti/","sentence":"It is hazardous to play poker with them, but their ingenuity adds a peculiar excitement to the best game in the world.","word_in_sentence":"ingenuity","ko":"그들과 포커를 치는 것은 위험하지만, 그들의 기발함은 세상에서 가장 훌륭한 게임에 독특한 흥미를 더해준다.","chapter":46},{"lemma":"indifference","difficulty":"C1","gloss":"The state of being indifferent.","ipa":"/ɪnˈdɪf.ɹəns/","sentence":"They met with indifference, and would part with relief.","word_in_sentence":"indifference","ko":"그들은 무관심하게 만났고, 안도감을 느끼며 헤어질 것이었다.","chapter":6},{"lemma":"tête","difficulty":"C2","gloss":{"en":"The top or upper part of something.","ko":"머리","zh":"頭部"},"ipa":"","sentence":"To avoid the tedium of dining tête-à-tête, to give their servants a rest, because there was no reason to refuse, because they were “owed” a dinner.","word_in_sentence":"tête","ko":"둘만의 지루한 식사를 피하기 위해, 하인들에게 휴식을 주기 위해, 거절할 이유가 없어서, 저녁 식사를 \"빚졌기\" 때문에.","chapter":6},{"lemma":"inconveniently","difficulty":"C2","gloss":"In an inconvenient manner.","ipa":null,"sentence":"The dining-room was inconveniently crowded.","word_in_sentence":"inconveniently","ko":"식당은 불편할 정도로 비좁았다.","chapter":6},{"lemma":"respectability","difficulty":"C1","gloss":"The quality of being respectable.","ipa":"/ɹɪˌspɛktəˈbɪlɪti/","sentence":"The respectability of the party was portentous.","word_in_sentence":"respectability","ko":"그 모임의 점잖음은 실로 대단했다.","chapter":6},{"lemma":"portentous","difficulty":"C2","gloss":"Of momentous or ominous significance.","ipa":"/pɔː(ɹ)ˈtɛntəs/","sentence":"The respectability of the party was portentous.","word_in_sentence":"portentous","ko":"그 모임의 점잖음은 실로 대단했다.","chapter":6},{"lemma":"instinctive","difficulty":"C1","gloss":"Related to or prompted by instinct.","ipa":"/ɪnˈstɪŋktɪv/","sentence":"Everyone talked a little louder than natural in an instinctive desire to make the party go, and there was a great deal of noise in the room.","word_in_sentence":"instinctive","ko":"모든 사람이 파티를 성공시키려는 본능적 욕구로 자연스러운 것보다 조금씩 더 크게 말했고, 방 안에는 소음이 가득했다.","chapter":6},{"lemma":"entree","difficulty":"C1","gloss":"Alternative form of entrée.","ipa":null,"sentence":"Each one talked to his neighbour; to his neighbour on the right during the soup, fish, and entree; to his neighbour on the left during the roast, sweet, and savoury.","word_in_sentence":"entree","ko":"각자 옆 사람과 이야기했다. 수프와 생선, 앙트레 요리 때는 오른쪽 옆 사람과, 로스트와 디저트, 짭짤한 요리 때는 왼쪽 옆 사람과 말이다.","chapter":6},{"lemma":"savoury","difficulty":"C1","gloss":"Alternative form of savory.","ipa":null,"sentence":"Each one talked to his neighbour; to his neighbour on the right during the soup, fish, and entree; to his neighbour on the left during the roast, sweet, and savoury.","word_in_sentence":"savoury","ko":"각자 옆 사람과 이야기했다. 수프와 생선, 앙트레 요리 때는 오른쪽 옆 사람과, 로스트와 디저트, 짭짤한 요리 때는 왼쪽 옆 사람과 말이다.","chapter":6},{"lemma":"anxiously","difficulty":"C1","gloss":"In an anxious manner; with painful uncertainty; solicitously.","ipa":"/ˈæŋ(k).ʃəs.li/","sentence":"Once or twice Mrs. Strickland’s eyes rested on him somewhat anxiously.","word_in_sentence":"anxiously","ko":"한두 번 스트릭랜드 부인의 시선이 다소 걱정스럽게 그에게 머물렀다.","chapter":6},{"lemma":"politely","difficulty":"C1","gloss":"in a polite manner","ipa":"/pəˈlaɪtli/","sentence":"When he shook hands with Capitaine Brunot he enquired politely after Madame et les enfants.","word_in_sentence":"politely","ko":"브뤼노 선장과 악수할 때는 정중하게 마담과 아이들 안부를 물었다.","chapter":55},{"lemma":"clumsily","difficulty":"C1","gloss":"In a clumsy manner or way; without care or finesse, often hurriedly or awkwardly.","ipa":null,"sentence":"It was as though he found in the chaos of the universe a new pattern, and were attempting clumsily, with anguish of soul, to set it down.","word_in_sentence":"clumsily","ko":"마치 그가 우주의 혼돈 속에서 새로운 패턴을 발견하고, 영혼의 고뇌와 함께 서투르게 그것을 기록하려 애쓰고 있는 것 같았다.","chapter":42},{"lemma":"coachman","difficulty":"C1","gloss":"A man who drives a horse-drawn coach, a male coach driver.","ipa":"/ˈkoʊt͡ʃmən/","sentence":"He gave you somewhat the idea of a coachman dressed up for the occasion.","word_in_sentence":"coachman","ko":"그는 어딘지 특별한 날을 위해 차려입은 마부 같은 인상을 주었다.","chapter":6},{"lemma":"ungainly","difficulty":"C2","gloss":"Clumsy; lacking grace.","ipa":"/ʌnˈɡeɪnli/","sentence":"The portraits were a little larger than life-size, and this gave them an ungainly look.","word_in_sentence":"ungainly","ko":"초상화들은 실물보다 조금 더 큰 크기였는데, 그래서 어색해 보였다.","chapter":42},{"lemma":"shaven","difficulty":"C1","gloss":"Having been shaved.","ipa":"/ˈʃeɪvən/","sentence":"He was clean shaven, and his large face looked uncomfortably naked.","word_in_sentence":"shaven","ko":"수염을 깨끗이 밀어서 큰 얼굴이 불편할 정도로 드러나 보였다.","chapter":6},{"lemma":"uncomfortably","difficulty":"C1","gloss":"In an uncomfortable manner.","ipa":null,"sentence":"He was clean shaven, and his large face looked uncomfortably naked.","word_in_sentence":"uncomfortably","ko":"수염을 깨끗이 밀어서 큰 얼굴이 불편할 정도로 드러나 보였다.","chapter":6},{"lemma":"reddish","difficulty":"C1","gloss":"Somewhat red.","ipa":"/ˈɹɛdɪʃ/","sentence":"His hair was reddish, cut very short, and his eyes were small, blue or grey.","word_in_sentence":"reddish","ko":"머리카락은 적갈색으로 아주 짧게 깎았고, 눈은 작으며 파란색 또는 회색이었다.","chapter":6},{"lemma":"alacrity","difficulty":"C2","gloss":"Eagerness; liveliness; enthusiasm.","ipa":"/əˈlækɹɨti/","sentence":"Not only her face, but her whole body, gave a sense of alacrity.","word_in_sentence":"alacrity","ko":"얼굴뿐만 아니라 온몸이 기민함을 드러내고 있었다.","chapter":8},{"lemma":"chatter","difficulty":"C1","gloss":"Talk, especially meaningless or unimportant talk.","ipa":"/ˈtʃætə/","sentence":"I was young enough for them not to feel shy, and they chattered merrily about one thing and another.","word_in_sentence":"chattered","ko":"나는 아이들이 부끄러워하지 않을 만큼 젊었고, 아이들은 이런저런 이야기를 즐겁게 지껄였다.","chapter":7},{"lemma":"merrily","difficulty":"C1","gloss":"In a cheerful or merry way.","ipa":"/ˈmɛɹɪli/","sentence":"I was young enough for them not to feel shy, and they chattered merrily about one thing and another.","word_in_sentence":"merrily","ko":"나는 아이들이 부끄러워하지 않을 만큼 젊었고, 아이들은 이런저런 이야기를 즐겁게 지껄였다.","chapter":7},{"lemma":"extraordinarily","difficulty":"C1","gloss":"In an extraordinary manner.","ipa":null,"sentence":"I was extraordinarily touched.","word_in_sentence":"extraordinarily","ko":"나는 몹시 감동했다.","chapter":10},{"lemma":"agreeable","difficulty":"C1","gloss":"Able to agree; possible to be agreed.","ipa":"/əˈɡɹiːəbl/","sentence":"It was very agreeable under the trees.","word_in_sentence":"agreeable","ko":"나무 아래는 매우 기분 좋았다.","chapter":7},{"lemma":"idly","difficulty":"C1","gloss":"Without specific purpose, intent or effort.","ipa":"/ˈaɪd(ə)lɪ/","sentence":"When in an hour they crowded into a cab to go home, I strolled idly to my club.","word_in_sentence":"idly","ko":"한 시간 후 그들이 마차에 몰려 타고 집으로 돌아갈 때, 나는 한가롭게 클럽으로 걸어갔다.","chapter":7},{"lemma":"unintelligible","difficulty":"C1","gloss":"Not intelligible; unable to be understood.","ipa":"/ˌʌnɪnˈtɛlɪd͡ʒɪbəl/","sentence":"They had little private jokes of their own which, unintelligible to the outsider, amused them enormously.","word_in_sentence":"unintelligible","ko":"그들만의 작은 농담들이 있었는데, 외부인에게는 이해할 수 없는 것들이었지만 그들 자신에게는 엄청나게 재미있는 것들이었다.","chapter":7},{"lemma":"enormously","difficulty":"C1","gloss":"Extremely, greatly: to an enormous degree.","ipa":null,"sentence":"They had little private jokes of their own which, unintelligible to the outsider, amused them enormously.","word_in_sentence":"enormously","ko":"그들만의 작은 농담들이 있었는데, 외부인에게는 이해할 수 없는 것들이었지만 그들 자신에게는 엄청나게 재미있는 것들이었다.","chapter":7},{"lemma":"untoward","difficulty":"C1","gloss":"Unfavourable, adverse, or disadvantageous.","ipa":"/ˌʌn.təˈwɔɹd/","sentence":"This was the first suggestion that anything untoward had happened.","word_in_sentence":"untoward","ko":"이것이 뭔가 좋지 않은 일이 일어났다는 첫 번째 암시였다.","chapter":8},{"lemma":"upstanding","difficulty":"C1","gloss":"Honest; reputable; respectable.","ipa":"/ʌpˈstændɪŋ/","sentence":"I pictured their lives, troubled by no untoward adventure, honest, decent, and, by reason of those two upstanding, pleasant children, so obviously destined to carry on the normal traditions of their race and station, not without significance.","word_in_sentence":"upstanding","ko":"나는 그들의 삶을 그려보았다. 뜻밖의 모험으로 괴로워하지 않고, 정직하고 품위 있으며, 자신들의 인종과 지위의 정상적인 전통을 이어갈 운명이 분명한 그 두 건실하고 사랑스러운 아이들 덕분에 의미 없지 않은 삶을.","chapter":7},{"lemma":"destine","difficulty":"C2","gloss":"to preordain","ipa":"/ˈdɛstɪn/","sentence":"I saw him, the sea gray under the mistral and foam-flecked, watching the vanishing coast of France, which he was destined never to see again; and I thought there was something gallant in his bearing and dauntless in his soul.","word_in_sentence":"destined","ko":"미스트랄 바람 아래 회색빛을 띤 바다에 거품이 일렁이는 가운데, 다시는 보지 못할 운명인 프랑스 해안이 사라져가는 것을 바라보는 그의 모습이 눈에 보였다. 그리고 그의 자세에는 용감함이, 그의 영혼에는 불굴의 정신이 있다고 생각했다.","chapter":48},{"lemma":"insensibly","difficulty":"C2","gloss":"In an insensible manner; without feeling or noticing something.","ipa":null,"sentence":"They would grow old insensibly; they would see their son and daughter come to years of reason, marry in due course—the one a pretty girl, future mother of healthy children; the other a handsome, manly fellow, obviously a soldier; and at last, prosperous in their dignified retirement, beloved by their descendants, after a happy, not unuseful life, in the fullness of their age they would sink into the grave.","word_in_sentence":"insensibly","ko":"그들은 자연스럽게 늙어갈 것이고, 아들과 딸이 분별력을 갖는 나이가 되어 때가 되면 결혼하는 것을 보게 될 것이다. 하나는 예쁜 소녀로 건강한 아이들의 미래 어머니가 되고, 다른 하나는 잘생기고 남자다운 청년으로 분명히 군인이 될 것이다. 그리고 마침내 품위 있는 은퇴 생활에서 번영하며 후손들의 사랑을 받다가, 행복하고 무익하지 않은 삶을 마친 후 충분한 나이에 무덤으로 들어갈 것이다.","chapter":7},{"lemma":"dignified","difficulty":"C1","gloss":"Having an attitude or bearing that connotes respectability and poise.","ipa":"/ˈdɪɡnɪfaɪd/","sentence":"They would grow old insensibly; they would see their son and daughter come to years of reason, marry in due course—the one a pretty girl, future mother of healthy children; the other a handsome, manly fellow, obviously a soldier; and at last, prosperous in their dignified retirement, beloved by their descendants, after a happy, not unuseful life, in the fullness of their age they would sink into the grave.","word_in_sentence":"dignified","ko":"그들은 자연스럽게 늙어갈 것이고, 아들과 딸이 분별력을 갖는 나이가 되어 때가 되면 결혼하는 것을 보게 될 것이다. 하나는 예쁜 소녀로 건강한 아이들의 미래 어머니가 되고, 다른 하나는 잘생기고 남자다운 청년으로 분명히 군인이 될 것이다. 그리고 마침내 품위 있는 은퇴 생활에서 번영하며 후손들의 사랑을 받다가, 행복하고 무익하지 않은 삶을 마친 후 충분한 나이에 무덤으로 들어갈 것이다.","chapter":7},{"lemma":"belove","difficulty":"C2","gloss":"simple past of belive","ipa":"/bɪˈləʊv/","sentence":"They would grow old insensibly; they would see their son and daughter come to years of reason, marry in due course—the one a pretty girl, future mother of healthy children; the other a handsome, manly fellow, obviously a soldier; and at last, prosperous in their dignified retirement, beloved by their descendants, after a happy, not unuseful life, in the fullness of their age they would sink into the grave.","word_in_sentence":"beloved","ko":"그들은 자연스럽게 늙어갈 것이고, 아들과 딸이 분별력을 갖는 나이가 되어 때가 되면 결혼하는 것을 보게 될 것이다. 하나는 예쁜 소녀로 건강한 아이들의 미래 어머니가 되고, 다른 하나는 잘생기고 남자다운 청년으로 분명히 군인이 될 것이다. 그리고 마침내 품위 있는 은퇴 생활에서 번영하며 후손들의 사랑을 받다가, 행복하고 무익하지 않은 삶을 마친 후 충분한 나이에 무덤으로 들어갈 것이다.","chapter":7},{"lemma":"descendant","difficulty":"C1","gloss":"Descending; going down.","ipa":"/dɪˈsɛndənt/","sentence":"They would grow old e it offers has a homely grace.","word_in_sentence":"homely","ko":"그것은 수많은 부부들의 이야기일 것이고, 그것이 제시하는 삶의 패턴에는 소박한 우아함이 있다.","chapter":7},{"lemma":"placid","difficulty":"C1","gloss":"calm and quiet; peaceful; tranquil","ipa":"/ˈplæs.ɪd/","sentence":"Strickland remained placid.","word_in_sentence":"placid","ko":"스트릭랜드는 평온함을 유지했다.","chapter":13},{"lemma":"rivulet","difficulty":"C2","gloss":"A small stream; a streamlet; a gill.","ipa":"/ˈɹɪv.jʊ.lɪt/","sentence":"It reminds you of a placid rivulet, meandering smoothly through green pastures and shaded by pleasant trees, till at last it falls into the vasty sea; but the sea is so calm, so silent, so indifferent, that you are troubled suddenly by a vague uneasiness.","word_in_sentence":"rivulet","ko":"그것은 푸른 목초지를 구불구불 흘러가며 아름다운 나무들의 그늘을 받다가 마침내 광활한 바다로 떨어지는 고요한 시냇물을 연상시킨다. 하지만 그 바다가 너무나 잔잔하고, 너무나 조용하고, 너무나 무관심해서 갑자기 막연한 불안감에 사로잡히게 된다.","chapter":7},{"lemma":"meander","difficulty":"C1","gloss":"One of the turns of a winding, crooked, or involved course.","ipa":"/miˈæn.dɚ/","sentence":"It reminds you of a placid rivulet, meandering smoothly through green pastures and shaded by pleasant trees, till at last it falls into the vasty sea; but the sea is so calm, so silent, so indifferent, that you are troubled suddenly by a vague uneasiness.","word_in_sentence":"meandering","ko":"그것은 푸른 목초지를 구불구불 흘러가며 아름다운 나무들의 그늘을 받다가 마침내 광활한 바다로 떨어지는 고요한 시냇물을 연상시킨다. 하지만 그 바다가 너무나 잔잔하고, 너무나 조용하고, 너무나 무관심해서 갑자기 막연한 불안감에 사로잡히게 된다.","chapter":7},{"lemma":"pasture","difficulty":"C1","gloss":"Land, specifically, an open field, on which livestock is kept for feeding.","ipa":"/ˈpæs.t͡ʃɚ/","sentence":"It reminds you of a placid rivulet, meandering smoothly through green pastures and shaded by pleasant trees, till at last it falls into the vasty sea; but the sea is so calm, so silent, so indifferent, that you are troubled suddenly by a vague uneasiness.","word_in_sentence":"pastures","ko":"그것은 푸른 목초지를 구불구불 흘러가며 아름다운 나무들의 그늘을 받다가 마침내 광활한 바다로 떨어지는 고요한 시냇물을 연상 angerously.","word_in_sentence":"dangerously","ko":"내 마음속에는 더 위험하게 살고 싶은 욕망이 있었다.","chapter":7},{"lemma":"unprepared","difficulty":"C1","gloss":"Not prepared; caught by surprise.","ipa":null,"sentence":"I was not unprepared for jagged rocks and treacherous shoals if I could only have change—change and the excitement of the unforeseen.","word_in_sentence":"unprepared","ko":"변화만 있다면—변화와 예측할 수 없는 것들의 흥분만 있다면, 나는 들쭉날쭉한 바위와 위험한 암초도 각오하고 있었다.","chapter":7},{"lemma":"jagged","difficulty":"C1","gloss":"Unevenly cut; having the texture of something so cut.","ipa":"/ˈd͡ʒæɡɪd/","sentence":"I was not unprepared for jagged rocks and treacherous shoals if I could only have change—change and the excitement of the unforeseen.","word_in_sentence":"jagged","ko":"변화만 있다면—변화와 예측할 수 없는 것들의 흥분만 있다면, 나는 들쭉날쭉한 바위와 위험한 암초도 각오하고 있었다.","chapter":7},{"lemma":"treacherous","difficulty":"C1","gloss":"Exhibiting treachery.","ipa":"/ˈtɹɛt͡ʃəɹəs/","sentence":"I was not unprepared for jagged rocks and treacherous shoals if I could only have change—change and the excitement of the unforeseen.","word_in_sentence":"treacherous","ko":"변화만 있다면—변화와 예측할 수 없는 것들의 흥분만 있다면, 나는 들쭉날쭉한 바위와 위험한 암초도 각오하고 있었다.","chapter":7},{"lemma":"shoal","difficulty":"C1","gloss":"Shallow.","ipa":"/ʃəʊl/","sentence":"There was a little stream that ran not far away, in which he bathed, and down this on occasion would come a shoal of fish.","word_in_sentence":"shoal","ko":"멀지 않은 곳에 작은 개울이 흘렀는데, 그는 거기서 목욕을 했고, 때로는 그 개울로 물고기 떼가 내려오곤 했다.","chapter":52},{"lemma":"unforeseen","difficulty":"C1","gloss":"Not foreseen.","ipa":"/ˌʌnfɔːˈsiːn/","sentence":"I was not unprepared for jagged rocks and treacherous shoals if I could only have change—change and the excitement of the unforeseen.","word_in_sentence":"unforeseen","ko":"변화만 있다면—변화와 예측할 수 없는 것들의 흥분만 있다면, 나는 들쭉날쭉한 바위와 위험한 암초도 각오하고 있었다.","chapter":7},{"lemma":"idiosyncrasy","difficulty":"C2","gloss":"A behavior or way of thinking that is characteristic of a person.","ipa":"/ˌɪdɪəʊˈsɪŋkɹəsi/","sentence":"But I suppose that everyone’s conception of the passion is formed on his own idiosyncrasies, and it is different with every different person.","word_in_sentence":"idiosyncrasies","ko":"하지만 누구나 열정에 대한 개념은 자신만의 특성에 따라 형성되는 것이고, 사람마다 모두 다른 법이다.","chapter":30},{"lemma":"vividness","difficulty":"C2","gloss":"The quality or state of being vivid.","ipa":null,"sentence":"I have been able to invest them with none of those characteristics which make the persons of a book exist with a real life of their own; and, wondering if the fault is mine, I rack my brains to remember idiosyncrasies which might lend them vividness.","word_in_sentence":"vividness","ko":"나는 그들에게 책 속 인물들이 고유한 실제 생명력을 갖게 해주는 특성들을 부여하지 못했다. 혹시 내 잘못인가 싶어서, 그들을 생생하게 만들어줄 수 있는 특이한 점들을 기억해내려고 머리를 쥐어짠다.","chapter":8},{"lemma":"tapestry","difficulty":"C1","gloss":"A heavy woven cloth, often with decorative pictorial designs, normally hung on walls.","ipa":"/ˈtæpəstɹi/","sentence":"As they stand they are like the figures in an old tapestry; they do not separate themselves from the background, and at a distance seem to lose their pattern, so that you have little but a pleasing piece of colour.","word_in_sentence":"tapestry","ko":"지금 상태로는 그들은 오래된 태피스트리 속 인물들 같다. 배경에서 분리되지 않고, 멀리서 보면 무늬가 흐려져서 그저 보기 좋은 색채 덩어리 정도로만 보인다.","chapter":8},{"lemma":"shadowiness","difficulty":"C2","gloss":"The state or property of being shadowy.","ipa":null,"sentence":"There was just that shadowiness about them which you find in people whose lives are part of the social organism, so that they exist in it and by it only.","word_in_sentence":"shadowiness","ko":"그들에게는 사회 조직의 일부로 살아가는 사람들에게서 발견할 수 있는 그런 모호함이 있었다. 그래서 그들은 오직 그 안에서, 그것에 의해서만 존재했다.","chapter":8},{"lemma":"engulf","difficulty":"C1","gloss":"To overwhelm.","ipa":"/ɪŋˈɡʌlf/","sentence":"They are like cells in the body, essential, but, so long as they remain healthy, engulfed in the momentous whole.","word_in_sentence":"engulfed","ko":"그들은 몸속의 세포와 같았다. 필수적이지만, 건강한 상태를 유지하는 한 거대한 전체에 묻혀 있는 존재들이었다.","chapter":8},{"lemma":"momentous","difficulty":"C1","gloss":"Outstanding in importance, of great consequence.","ipa":"/moʊˈmɛn.təs/","sentence":"They seemed to me ugly, but they suggested without disclosing a secret of momentous significance.","word_in_sentence":"momentous","ko":"그림들은 내게 추하게 보였지만, 중대한 의미를 지닌 비밀을 드러내지 않은 채 암시하고 있었다.","chapter":42},{"lemma":"craze","difficulty":"C1","gloss":"A strong habitual desire or fancy.","ipa":"/kɹeɪz/","sentence":"A pleasant, hospitable woman, with a harmless craze for the small lions of literary society; a rather dull man, doing his duty in that state of life in which a merciful Providence had placed him; two nice-looking, healthy children.","word_in_sentence":"craze","ko":"문학계의 소소한 명사들에 대한 무해한 열정을 가진 상냥하고 친절한 여자, 자비로운 섭리가 자신을 놓아준 그 삶의 위치에서 의무를 다하는 다소 따분한 남자, 그리고 잘생기고 건강한 두 아이.","chapter":8},{"lemma":"merciful","difficulty":"C1","gloss":"Showing mercy.","ipa":"/ˈmɜːsɪfl̩/","sentence":"Nature, sometimes so cruel, is sometimes merciful.","word_in_sentence":"merciful","ko":"때로는 그토록 잔혹한 자연이, 때로는 자비롭기도 하다.","chapter":36},{"lemma":"witted","difficulty":"C1","gloss":"having a specified form of wit (intellectual ability)","ipa":"/ˈwɪtɪd/","sentence":"When I reflect on all that happened later, I ask myself if I was thick-witted not to see that there was in Charles Strickland at least something out of the common.","word_in_sentence":"witted","ko":"나중에 일어난 모든 일들을 되돌아볼 때, 찰스 스트릭랜드에게 적어도 범상치 않은 무언가가 있다는 것을 보지 못한 내가 우둔했던 것은 아닌지 자문해본다.","chapter":8},{"lemma":"incalculable","difficulty":"C2","gloss":"Impossible to calculate.","ipa":"/ɪn.kæl.kjə.lə.bl/","sentence":"But because I have learnt that man is incalculable, I should not at this time of day be so surprised by the news that reached me when in the early autumn I returned to London.","word_in_sentence":"incalculable","ko":"하지만 인간이란 예측할 수 없는 존재라는 것을 배웠기 때문에, 이른 가을 런던으로 돌아왔을 때 내게 전해진 소식에 지금이라면 그렇게 놀라지는 않을 것이다.","chapter":8},{"lemma":"sprightly","difficulty":"C2","gloss":"Animated, gay, or vivacious; lively, spirited.","ipa":"/ˈspɹaɪtli/","sentence":"“You look very gay and sprightly,” I said.","word_in_sentence":"sprightly","ko":"\"아주 명랑하고 활기차 보이는군요.\" 내가 말했다.","chapter":8},{"lemma":"malice","difficulty":"C1","gloss":"Intention to harm or deprive in an illegal or immoral way. Desire to take pleasure in another's misfortune.","ipa":"/ˈmælɪs/","sentence":"Malice cannot touch us, nor envy attack.","word_in_sentence":"Malice","ko":"악의도 우리를 건드릴 수 없고, 질투도 우리를 공격할 수 없습니다.","chapter":54},{"lemma":"omnibus","difficulty":"C1","gloss":"A bus (vehicle for transporting large numbers of people along roads).","ipa":"/ˈɒmnɪbəs/","sentence":"for theatres and newspapers, and the rumble of omnibuses on the cobbled pavements?’","word_in_sentence":"omnibuses","ko":"극장이나 신문, 자갈길 위로 굴러가는 마차들의 소음 같은 것들 말입니다.'","chapter":53},{"lemma":"fling","difficulty":"C1","gloss":"An act of throwing, often violently.","ipa":"/ˈflɪŋ/","sentence":"He cursed me, flung down the money and left.","word_in_sentence":"flung","ko":"그는 나에게 욕을 퍼붓고는 돈을 내던지고 나가버렸다.","chapter":23},{"lemma":"obstinate","difficulty":"C1","gloss":"Stubbornly adhering to an opinion, purpose, or course, usually with implied unreasonableness; persistent.","ipa":"/ˈɑb.stə.nət/","sentence":"I’m as obstinate as he is, and I’ll never divorce him.","word_in_sentence":"obstinate","ko":"나도 그 사람만큼 고집이 세니까, 절대 이혼해주지 않을 거야.","chapter":10},{"lemma":"agitated","difficulty":"C1","gloss":"simple past and past participle of agitate","ipa":"/ˈæd͡ʒɪteɪtɪd/","sentence":"He reminded me oddly of an agitated guinea-pig.","word_in_sentence":"agitated","ko":"그는 흥분한 기니피그를 기묘하게 연상시켰다.","chapter":25},{"lemma":"airy","difficulty":"C1","gloss":"Consisting of air.","ipa":"/ˈɛə.ɹi/","sentence":"I tried my best to assume an airy manner.","word_in_sentence":"airy","ko":"나는 최대한 태연한 척 하려고 애썼다.","chapter":11},{"lemma":"jauntily","difficulty":"C2","gloss":"In an airy, showy, or affected manner.","ipa":"/ˈd͡ʒɑn.tɪ.li/","sentence":"She flashed a smile at me, and, protesting an engagement with her dentist, jauntily walked on.","word_in_sentence":"jauntily","ko":"그녀는 나에게 미소를 번뜩 지어 보이고는, 치과 의사와 약속이 있다고 변명하며 경쾌하게 걸어갔다.","chapter":8},{"lemma":"accustom","difficulty":"C2","gloss":"To make familiar by use; to cause to accept; to habituate, familiarize, or inure.","ipa":"/əˈkʌs.təm/","sentence":"I confess that time has now accustomed me to incidents of this character among my acquaintance.","word_in_sentence":"accustomed","ko":"고백하건대 이제는 시간이 흘러 내 지인들 사이에서 이런 성격의 사건들에 익숙해졌다.","chapter":8},{"lemma":"superciliousness","difficulty":"C2","gloss":"The state or quality of being supercilious.","ipa":null,"sentence":"With the superciliousness of extreme youth, I put thirty-five as the utmost limit at which a man might fall in love without making a fool of himself.","word_in_sentence":"superciliousness","ko":"극도로 젊은 나이의 거만함으로, 나는 남자가 바보가 되지 않고 사랑에 빠질 수 있는 최대 한계를 서른다섯으로 잡았다.","chapter":8},{"lemma":"agitation","difficulty":"C1","gloss":"The act of agitating, or the state of being agitated; the state of being disrupted with violence, or with irregular action; commotion.","ipa":"/æ.d͡ʒɪˈteɪ.ʃən/","sentence":"As a rule she was so calm; her agitation now was amazing.","word_in_sentence":"agitation","ko":"평소 그녀는 매우 침착했는데, 지금의 동요는 놀라울 정도였다.","chapter":25},{"lemma":"indiscreet","difficulty":"C2","gloss":"Not discreet; lacking in discretion.","ipa":null,"sentence":"On the other hand, she might wish to keep the affair quiet, and it might be highly indiscreet on my part to give any sign that this strange news had reached me.","word_in_sentence":"indiscreet","ko":"한편으로는 그녀가 이 일을 조용히 처리하고 싶어 할 수도 있고, 이 기이한 소식이 내게 전해졌다는 기색을 내비치는 것은 내 편에서 매우 경솔한 일일 수도 있었다.","chapter":8},{"lemma":"overwhelm","difficulty":"C1","gloss":"To engulf, surge over and submerge.","ipa":"/ˌoʊ.vɚˈʍɛlm/","sentence":"If I really did you’d be overwhelmed with remorse.”","word_in_sentence":"overwhelmed","ko":"내가 정말 그런다면 당신은 후회에 압도될 거예요.\"","chapter":23},{"lemma":"calamity","difficulty":"C1","gloss":"An event resulting in great loss.","ipa":"/kəˈlæmɪti/","sentence":"Her manner suggested to my excited fancy a complete knowledge of the domestic calamity.","word_in_sentence":"calamity","ko":"그녀의 태도는 흥분한 내 상상력에 집안의 재앙을 완전히 알고 있다는 인상을 주었다.","chapter":8},{"lemma":"darken","difficulty":"C1","gloss":"To make dark or darker by reducing light.","ipa":"/ˈdɑɹkən/","sentence":"Even in the darkened room, I could not help seeing that Mrs. Strickland’s face was all swollen with tears.","word_in_sentence":"darkened","ko":"어두운 방 안에서도 스트릭랜드 부인의 얼굴이 눈물로 온통 부어있다는 것을 알 수 있었다.","chapter":8},{"lemma":"unlit","difficulty":"C2","gloss":"Not lit","ipa":null,"sentence":"Her brother-in-law, Colonel MacAndrew, stood in front of the fireplace, warming his back at an unlit fire.","word_in_sentence":"unlit","ko":"그녀의 시숙인 맥앤드류 대령은 벽난로 앞에 서서 불이 켜지지 않은 난로에 등을 대고 몸을 따뜻하게 하고 있었다.","chapter":8},{"lemma":"resent","difficulty":"C1","gloss":"To feel resentment over; to consider as an affront.","ipa":"/ɹiˈzɛnt/","sentence":"I fancied that the Colonel resented the interruption.","word_in_sentence":"resented","ko":"대령이 방해받는 것을 못마땅해한다는 생각이 들었다.","chapter":8},{"lemma":"interruption","difficulty":"C1","gloss":"The act of interrupting, or the state of being interrupted.","ipa":"/ˌɪntəˈɹʌpʃən/","sentence":"I fancied that the Colonel resented the interruption.","word_in_sentence":"interruption","ko":"대령이 방해받는 것을 못마땅해한다는 생각이 들었다.","chapter":8},{"lemma":"unconcerned","difficulty":"C1","gloss":"Indifferent and having no interest; aloof.","ipa":null,"sentence":"“I wasn’t quite sure if you expected me,” I said, trying to seem unconcerned.","word_in_sentence":"unconcerned","ko":"\"제가 올 줄 아셨는지 확실하지 않아서요.\" 나는 태연한 척하며 말했다.","chapter":8},{"lemma":"earthy","difficulty":"C1","gloss":"Resembling dirt or soil (i.e. earth).","ipa":"/ˈɜː.θi/","sentence":"Her skin, never very good, was earthy.","word_in_sentence":"earthy","ko":"원래도 좋지 않던 그녀의 피부는 흙빛이었다.","chapter":8},{"lemma":"decently","difficulty":"C1","gloss":"In a decent manner.","ipa":"/ˈdiːsəntli/","sentence":"I wondered how soon I could decently take my leave, and I asked myself why on earth Mrs. Strickland had allowed me to come.","word_in_sentence":"decently","ko":"언제쯤 품위를 잃지 않고 자리를 뜰 수 있을지 궁금했고, 도대체 스트릭랜드 부인이 왜 내가 오는 것을 허락했는지 자문했다.","chapter":8},{"lemma":"knick","difficulty":"C1","gloss":"Alternative spelling of nick (“to make a notch in”).","ipa":null,"sentence":"There were no flowers, and various knick-knacks, put away during the summer, had not been replaced; there was something cheerless and stiff about the room which had always seemed so friendly; it gave you an odd feeling, as though someone were lying dead on the other side of the wall.","word_in_sentence":"knick","ko":"꽃도 없었고, 여름 동안 치워두었던 여러 장식품들도 제자리에 돌아오지 않았다. 언제나 그토록 친근하게 느껴졌던 방에는 뭔가 쓸쓸하고 경직된 분위기가 있었다. 마치 벽 너머에서 누군가 죽어 누워 있는 것 같은 기묘한 느낌을 주었다.","chapter":8},{"lemma":"knack","difficulty":"C1","gloss":"A readiness in performance; aptness at doing something.","ipa":"/næk/","sentence":"“It happened that I had a knack for drawing.","word_in_sentence":"knack","ko":"\"우연히 그림 그리는 재주가 있었거든요.","chapter":38},{"lemma":"cheerless","difficulty":"C2","gloss":"Devoid of cheer; gloomy.","ipa":null,"sentence":"There were no flowers, and various knick-knacks, put away during the summer, had not been replaced; there was something cheerless and stiff about the room which had always seemed so friendly; it gave you an odd feeling, as though someone were lying dead on the other side of the wall.","word_in_sentence":"cheerless","ko":"꽃도 없었고, 여름 동안 치워두었던 여러 장식품들도 제자리에 돌아오지 않았다. 언제나 그토록 친근하게 느껴졌던 방에는 뭔가 쓸쓸하고 경직된 분위기가 있었다. 마치 벽 너머에서 누군가 죽어 누워 있는 것 같은 기묘한 느낌을 주었다.","chapter":8},{"lemma":"startle","difficulty":"C1","gloss":"To move suddenly, or be excited, on feeling alarm; to start.","ipa":"/ˈstɑɹt(ə)l/","sentence":"I was startled.","word_in_sentence":"startled","ko":"나는 깜짝 놀랐다.","chapter":8},{"lemma":"pang","difficulty":"C1","gloss":"A paroxysm of extreme physical pain or anguish; a feeling of sudden and transitory agony; a throe.","ipa":"/pæŋ/","sentence":"A sudden pang seized him, and his knees felt so weak that he almost fell.","word_in_sentence":"pang","ko":"갑작스러운 고통이 그를 엄습했고, 무릎에 힘이 빠져 거의 쓰러질 뻔했다.","chapter":39},{"lemma":"pretence","difficulty":"C1","gloss":"British standard spelling of pretense.","ipa":"/ˈpɹiːtɛns/","sentence":"It was impossible to keep up our social pretences any longer.","word_in_sentence":"pretences","ko":"더 이상 사교적인 체면을 유지하는 것은 불가능했다.","chapter":8},{"lemma":"blackguard","difficulty":"C2","gloss":"The lowest servant in a household charged with pots, pans, and other kitchen equipment.","ipa":"/ˈblæɡɚd/","sentence":"“All we know is that the blackguard’s gone to Paris.”","word_in_sentence":"blackguard","ko":"\"우리가 아는 건 그 악한이 파리로 갔다는 것뿐이야.\"","chapter":9},{"lemma":"explosively","difficulty":"C2","gloss":"In an explosive manner.","ipa":null,"sentence":"“I suppose you’ve heard that blackguard has deserted her,” he cried explosively.","word_in_sentence":"explosively","ko":"\"그 악한이 부인을 버리고 떠났다는 얘기를 들으셨겠지요.\" 그가 격분하여 소리쳤다.","chapter":8},{"lemma":"vaguely","difficulty":"C1","gloss":"In a vague manner.","ipa":"/ˈveɪɡli/","sentence":"“I vaguely suspected it, I confess.”","word_in_sentence":"vaguely","ko":"\"그런 느낌이 어렴풋이 들긴 했습니다, 솔직히 말하면.\"","chapter":40},{"lemma":"gulp","difficulty":"C1","gloss":"The usual amount swallowed.","ipa":"/ɡʌlp/","sentence":"The Colonel gulped down his whisky.","word_in_sentence":"gulped","ko":"대령은 위스키를 단숨에 들이켰다.","chapter":8},{"lemma":"droop","difficulty":"C1","gloss":"To hang downward; to sag.","ipa":"/ˈdɹuːp/","sentence":"He was a tall, lean man of fifty, with a drooping moustache and grey hair.","word_in_sentence":"drooping","ko":"그는 늘어진 콧수염과 회색 머리를 한 쉰 살의 키 크고 마른 남자였다.","chapter":8},{"lemma":"moustache","difficulty":"C1","gloss":"A growth of facial hair between the nose and the upper lip.","ipa":"/ˈmʌstæʃ/","sentence":"He was a tall, lean man of fifty, with a drooping moustache and grey hair.","word_in_sentence":"moustache","ko":"그는 늘어진 콧수염과 회색 머리를 한 쉰 살의 키 크고 마른 남자였다.","chapter":8},{"lemma":"thrash","difficulty":"C1","gloss":"To beat mercilessly.","ipa":"/θɹæʃ/","sentence":"I’d thrash him within an inch of his life.”","word_in_sentence":"thrash","ko":"죽기 직전까지 두들겨 패 주겠어.\"","chapter":8},{"lemma":"hefty","difficulty":"C1","gloss":"With heft; heavy, strong, vigorous, mighty, impressive","ipa":"/ˈhɛfti/","sentence":"He was a hefty fellow, in the habit of standing no nonsense from his customers, and Tough Bill hesitated.","word_in_sentence":"hefty","ko":"그는 건장한 사내로 손님들의 무례함을 참지 않는 습관이 있었고, 터프 빌은 주저했다.","chapter":47},{"lemma":"chastisement","difficulty":"C2","gloss":"The act of chastising; rebuke; punishment.","ipa":"/ˈt͡ʃæstəzmənt/","sentence":"It is always distressing when outraged morality does not possess the strength of arm to administer direct chastisement on the sinner.","word_in_sentence":"chastisement","ko":"분노한 도덕심이 죄인에게 직접적인 응징을 가할 만한 완력을 갖추지 못했을 때는 언제나 안타까운 법이다.","chapter":8},{"lemma":"sinner","difficulty":"C1","gloss":"A person who, by one particular action, has sinned.","ipa":"/ˈsɪnɚ/","sentence":"It is always distressing when outraged morality does not possess the strength of arm to administer direct chastisement on the sinner.","word_in_sentence":"sinner","ko":"분노한 도덕심이 죄인에게 직접적인 응징을 가할 만한 완력을 갖추지 못했을 때는 언제나 안타까운 법이다.","chapter":8},{"lemma":"beset","difficulty":"C1","gloss":"To surround or hem in.","ipa":"/bɪˈsɛt/","sentence":"I did not then know the besetting sin of woman, the passion to discuss her private affairs with anyone who is willing to listen.","word_in_sentence":"besetting","ko":"그때 나는 여자들의 고질적인 죄악, 즉 기꺼이 들어줄 사람이라면 누구에게든 자신의 사생활을 털어놓고 싶어 하는 열정을 알지 못했다.","chapter":8},{"lemma":"aback","difficulty":"C1","gloss":"Towards the back or rear; backwards.","ipa":"/əˈbæk/","sentence":"I was taken aback.","word_in_sentence":"aback","ko":"나는 당황했다.","chapter":10},{"lemma":"clasp","difficulty":"C1","gloss":"A device with interlocking ck","ko":"십칠 년간 결혼생활을 한 남자가 아내로 하여금 그들의 결혼생활에 문제가 있음을 의심하게 만들 만한 어떤 일들이 있었던 것이 분명했고, 그런 일 없이는 아내를 떠나지 않을 것이 명백했다.","chapter":9},{"lemma":"artful","difficulty":"C1","gloss":"Characterized by, or performed with, cleverness or contrivance; clever, ingenious.","ipa":"/ˈɑːtf(ʊ)l/","sentence":"“That’s where he’s been so artful.","word_in_sentence":"artful","ko":"\"그게 그놈이 교활했던 부분이지.","chapter":9},{"lemma":"sketchy","difficulty":"C1","gloss":"Roughly or hastily laid out; intended for later refinement.","ipa":"/ˈskɛt͡ʃi/","sentence":"Colonel MacAndrew had a very sketchy knowledge of business matters, and I had none at all, so I did not quite understand under what conditions Strickland had left his affairs.","word_in_sentence":"sketchy","ko":"맥앤드류 대령은 사업에 대해 피상적으로만 알고 있었고, 나는 아예 아는 것이 없었기 때문에 스트릭랜드가 어떤 조건으로 자신의 일을 정리했는지 제대로 이해할 수 없었다.","chapter":9},{"lemma":"expletive","difficulty":"C1","gloss":"Serving to fill up, merely for effect, otherwise redundant.","ipa":"/ˈɛksplətɪv/","sentence":"The affair seemed to grow more complicated, and the Colonel, with his expletives and his indignation, confused rather than informed me.","word_in_sentence":"expletives","ko":"사건은 점점 복잡해지는 것 같았고, 대령은 욕설과 분노로 나를 알려주기보다는 오히려 혼란스럽게 만들었다.","chapter":9},{"lemma":"indignation","difficulty":"C1","gloss":"An anger aroused by something perceived as an indignity, notably an offense or injustice.","ipa":"/ˌɪn.dɪɡˈneɪ.ʃən/","sentence":"He spoke with a passion of indignation.","word_in_sentence":"indignation","ko":"그는 격분에 찬 열정으로 말했다.","chapter":41},{"lemma":"austerity","difficulty":"C1","gloss":"Severity of manners or life; extreme rigor or strictness; harsh discipline.","ipa":"/ɔˈstɛɹɪti/","sentence":"Her black dress, simple to austerity, suggested her bereaved condition, and I was innocently astonished that notwithstanding a real emotion she was able to dress the part she had to play according to her notions of seemliness.","word_in_sentence":"austerity","ko":"금욕적일 만큼 소박한 검은 드레스는 그녀의 상중임을 말해주었고, 진정한 감정에도 불구하고 그녀가 품위에 대한 자신의 관념에 따라 자신이 연기해야 할 역할에 맞게 옷차림을 할 수 있다는 사실에 나는 순진하게도 놀랐다.","chapter":10},{"lemma":"bereaved","difficulty":"C1","gloss":"having suffered the death of a loved one","ipa":"/bɪˈɹiːvd/","sentence":"Her black dress, simple to austerity, suggested her bereaved condition, and I was innocently astonished that notwithstanding a real emotion she was able to dress the part she had to play according to her notions of seemliness.","word_in_sentence":"bereaved","ko":"금욕적일 만큼 소박한 검은 드레스는 그녀의 상중임을 말해주었고, 진정한 감정에도 불구하고 그녀가 품위에 대한 자신의 관념에 따라 자신이 연기해야 할 역할에 맞게 옷차림을 할 수 있다는 사실에 나는 순진하게도 놀랐다.","chapter":10},{"lemma":"innocently","difficulty":"C1","gloss":"In an innocent manner.","ipa":"/ˈɪnəsəntli/","sentence":"Her black dress, simple to austerity, suggested her bereaved condition, and I was innocently astonished that notwithstanding a real emotion she was able to dress the part she had to play according to her notions of seemliness.","word_in_sentence":"innocently","ko":"금욕적일 만큼 소박한 검은 드레스는 그녀의 상중임을 말해주었고, 진정한 감정에도 불구하고 그녀가 품위에 대한 자신의 관념에 따라 자신이 연기해야 할 역할에 맞게 옷차림을 할 수 있다는 사실에 나는 순진하게도 놀랐다.","chapter":10},{"lemma":"astonish","difficulty":"C2","gloss":"To surprise greatly.","ipa":"/əˈstɒnɪʃ/","sentence":"I was astonished.","word_in_sentence":"astonished","ko":"나는 깜짝 놀랐다.","chapter":38},{"lemma":"seemliness","difficulty":"C2","gloss":"The property of being seemly, appropriateness of conduct or behavior.","ipa":null,"sentence":"Her black dress, simple to austerity, suggested her bereaved condition, and I was innocently astonished that notwithstanding a real emotion she was able to dress the part she had to play according to her notions of seemliness.","word_in_sentence":"seemliness","ko":"금욕적일 만큼 소박한 검은 드레스는 그녀의 상중임을 말해주었고, 진정한 감정에도 불구하고 그녀가 품위에 대한 자신의 관념에 따라 자신이 연기해야 할 역할에 맞게 옷차림을 할 수 있다는 사실에 나는 순진하게도 놀랐다.","chapter":10},{"lemma":"tremble","difficulty":"C1","gloss":"To shake, quiver, or vibrate.","ipa":"/ˈtɹɛmbl̩/","sentence":"His hands trembled.","word_in_sentence":"trembled","ko":"그의 손이 떨렸다.","chapter":28},{"lemma":"brute","difficulty":"C1","gloss":"Without reason or intelligence (of animals).","ipa":"/bɹuːt/","sentence":"“Brutes,” I said.","word_in_sentence":"Brutes","ko":"\"짐승들이군요.\" 내가 말했다.","chapter":55},{"lemma":"doubtless","difficulty":"C1","gloss":"Characterized by or experiencing no doubt at all, certain; undoubted; undoubting.","ipa":"/ˈdaʊ̯tləs/","sentence":"When you are a little older you will doubtless learn the advantage of minding your own business.","word_in_sentence":"doubtless","ko":"\"좀 더 나이를 드시면 남의 일에 참견하지 않는 것의 장점을 깨닫게 되실 겁니다.","chapter":10},{"lemma":"foresaw","difficulty":"C1","gloss":"simple past of foresee","ipa":"/fɔɹˈsɔ/","sentence":"Something impelled him to go to the studio, some obscure desire for self-torture, and yet he dreaded the anguish that he foresaw.","word_in_sentence":"foresaw","ko":"무언가가 그를 화실로 향하게 했다. 자기 자신을 괴롭히려는 어떤 막연한 욕망이었지만, 동시에 그는 예상되는 고통을 두려워했다.","chapter":39},{"lemma":"compose","difficulty":"C1","gloss":"To make something by merging parts.","ipa":"/kəmˈpəʊz/","sentence":"I foresaw that it would be difficult to make my exit with dignity, and I wished to goodness that I had not returned to London till Mrs. Strickland had composed her difficulties.","word_in_sentence":"composed","ko":"품위 있게 물러나기가 어려울 것 같다는 생각이 들었고, 스트릭랜드 부인이 자신의 문제를 정리할 때까지 런던에 돌아오지 말았어야 했다는 후회가 밀려왔다.","chapter":10},{"lemma":"immerse","difficulty":"C1","gloss":"To place within a fluid (generally a liquid, but also a gas).","ipa":"/ɪˈmɝs/","sentence":"She was immersed in thought.","word_in_sentence":"immersed","ko":"그녀는 생각에 잠겨 있었다.","chapter":10},{"lemma":"infatuate","difficulty":"C2","gloss":"To inspire with unreasoning love, attachment or enthusiasm.","ipa":"/ɪnˈfætjuˌ(w)eɪt/","sentence":"I never dreamed that Charlie was the sort of man to get infatuated with anyone.","word_in_sentence":"infatuated","ko":"찰리가 누군가에게 빠져들 그런 사람이라고는 꿈에도 생각하지 못했어요.","chapter":10},{"lemma":"lunching","difficulty":"C2","gloss":"present participle and gerund of lunch","ipa":"/ˈlʌnt͡ʃɪŋ/","sentence":"Generally when a man falls in love with someone people see them about together, lunching or something, and her friends always come and tell the wife.","word_in_sentence":"lunching","ko":"보통 남자가 누군가와 사랑에 빠지면 사람들이 그들이 함께 다니는 모습을 보게 되고, 점심을 먹거나 뭔가를 하는 것을 보게 되며, 그녀의 친구들이 항상 와서 아내에게 말해준다.","chapter":10},{"lemma":"thunderbolt","difficulty":"C1","gloss":"A flash of lightning accompanied by a crash of thunder.","ipa":"/ˈθʌndə(ɹ)ˌboʊlt/","sentence":"His letter came like a thunderbolt.","word_in_sentence":"thunderbolt","ko":"그의 편지는 청천벽력 같았다.","chapter":10},{"lemma":"surmise","difficulty":"C1","gloss":"Thought, imagination, or conjecture, which may be based upon feeble or scanty evidence; suspicion; guess.","ipa":"/sɜːˈmaɪz/","sentence":"Dr. Coutras surmised she was afraid to go farther in case she met any of the people from the village.","word_in_sentence":"surmised","ko":"쿠트라 박사는 그녀가 마을 사람들을 만날까 봐 더 멀리 가기를 두려워하는 것 같다고 짐작했다.","chapter":55},{"lemma":"nigger","difficulty":"C1","gloss":"A black person; a person of black African descent.","ipa":"/ˈnɪɡə(ɹ)/","sentence":"Yet he was a man who had faced undaunted hurricane and typhoon, and would not have hesitated to fight a dozen unarmed niggers with nothing but a revolver to help him.","word_in_sentence":"niggers","ko":"그런데도 그는 태풍과 허리케인을 두려워하지 않고 맞서던 사나이였고, 권총 하나만 들고도 비무장한 흑인 열두 명과 싸우는 것을 주저하지 않을 사람이었다.","chapter":46},{"lemma":"minstrel","difficulty":"C1","gloss":"Originally, an entertainer employed to juggle, play music, sing, tell stories, etc.; a buffoon, a fool, a jester; later, a medieval (especially travelling) entertainer who would recite and sing poetry, often to their own musical accompaniment.","ipa":"/ˈmɪnstɹ(ə)l/","sentence":"They played together, walked on the front together, listened together to the nigger minstrels; and she had made up her mind to accept him a week before he proposed to her.","word_in_sentence":"minstrels","ko":"그들은 함께 놀고, 함께 해변을 거닐고, 함께 흑인 음유시인들의 노래를 들었다. 그리고 그녀는 그가 청혼하기 일주일 전에 이미 그를 받아들이기로 마음을 정했다.","chapter":10},{"lemma":"irrevocable","difficulty":"C1","gloss":"Unable to be retracted or reversed; final.","ipa":"/iˈɹɛvəkəbəl/","sentence":"My decision is irrevocable.","word_in_sentence":"irrevocable","ko":"내 결정은 번복할 수 없어.","chapter":10},{"lemma":"inhuman","difficulty":"C1","gloss":"Of or pertaining to inhumanity and the indifferently cruel, sadistic or barbaric behavior it brings.","ipa":"/ɪnˈhjuːmən/","sentence":"“He’s inhuman.”","word_in_sentence":"inhuman","ko":"\"그는 인간이 아니야.\"","chapter":26},{"lemma":"clench","difficulty":"C1","gloss":"To grip or hold fast.","ipa":"/klɛnt͡ʃ/","sentence":"I clenched my hands, seeking to control my irritation.","word_in_sentence":"clenched","ko":"나는 주먹을 꽉 쥐고 짜증을 억누르려 애썼다.","chapter":34},{"lemma":"unclench","difficulty":"C2","gloss":"To open (something that was clenched).","ipa":"/ʌnˈklɛnt͡ʃ/","sentence":"She struggled for self-control, and I saw her hands clench and unclench spasmodically.","word_in_sentence":"unclench","ko":"그녀는 자제력을 되찾으려 애썼고, 나는 그녀의 손이 경련적으로 주먹을 쥐었다 폈다 하는 것을 보았다.","chapter":10},{"lemma":"spasmodically","difficulty":"C2","gloss":"In a spasmodic manner; intermittently.","ipa":null,"sentence":"She struggled for self-control, and I saw her hands clench and unclench spasmodically.","word_in_sentence":"spasmodically","ko":"그녀는 자제력을 되찾으려 애썼고, 나는 그녀의 손이 경련적으로 주먹을 쥐었다 폈다 하는 것을 보았다.","chapter":10},{"lemma":"dreadfully","difficulty":"C1","gloss":"In a dreadful manner; terribly.","ipa":"/ˈdɹɛd.fʊl.i/","sentence":"It was dreadfully painful.","word_in_sentence":"dreadfully","ko":"정말 고통스러운 광경이었다.","chapter":10},{"lemma":"solicitude","difficulty":"C2","gloss":"The state of being solicitous; uneasiness of mind occasioned by fear of evil or desire for good; anxiety.","ipa":"/səˈlɪsɪˌt(j)uːd/","sentence":"I think she added this to explain her attitude to me, but I thought it was due to a very natural jealousy rather than to maternal solicitude.","word_in_sentence":"solicitude","ko":"그녀가 자신의 태도를 나에게 설명하려고 이 말을 덧붙인 것 같았지만, 나는 그것이 모성애적 배려라기보다는 지극히 자연스러운 질투심 때문이라고 생각했다.","chapter":10},{"lemma":"bygone","difficulty":"C1","gloss":"Having been or happened in the distant past.","ipa":"/ˈbaɪɡɒn/","sentence":"If he’ll do that we’ll let bygones be bygones.","word_in_sentence":"bygones","ko":"만약 그렇게 한다면 지난 일은 모두 잊어버리겠어요.","chapter":10},{"lemma":"broadminde","difficulty":"C2","gloss":{"en":"To make or become broad-minded.","ko":"넓은 마음","zh":"宽阔心"},"ipa":"","sentence":"I’m a broadminded woman.","word_in_sentence":"broadminded","ko":"나는 마음이 넓은 여자예요.","chapter":10},{"lemma":"infatuation","difficulty":"C1","gloss":"An immensely strong love or sexual attraction.","ipa":null,"sentence":"He must know that his infatuation won’t last.","word_in_sentence":"infatuation","ko":"그의 열정이 오래가지 않을 것이라는 걸 그도 알 텐데요.","chapter":10},{"lemma":"insincerity","difficulty":"C2","gloss":"Property of being insincere, lacking sincerity or truthfulness.","ipa":null,"sentence":"It throws a shadow of insincerity over their most deeply felt emotions.","word_in_sentence":"insincerity","ko":"그것은 그들의 가장 진실한 감정에까지 위선의 그림자를 드리운다.","chapter":10},{"lemma":"taunt","difficulty":"C1","gloss":"To make fun of (someone); to goad (a person) into responding, often in an aggressive manner.","ipa":"/tɔnt/","sentence":"His partner, in a violent letter, sent to his bank, had taunted him with hiding his whereabouts: and Strickland, in a cynical and humourous reply, had told his partner exactly where to find him.","word_in_sentence":"taunted","ko":"그의 동업자가 은행으로 보낸 격렬한 편지에서 그가 행방을 숨기고 있다고 비난했는데, 스트릭랜드는 냉소적이고 유머러스한 답장으로 동업자에게 자신을 어디서 찾을 수 있는지 정확히 알려주었다.","chapter":10},{"lemma":"humourous","difficulty":"C2","gloss":"Alternative spelling of humorous.","ipa":null,"sentence":"His partner, in a violent letter, sent to his bank, had taunted him with hiding his whereabouts: and Strickland, in a cynical and humourous reply, had told his partner exactly where to find him.","word_in_sentence":"humourous","ko":"그의 동업자가 은행으로 보낸 격렬한 편지에서 그가 행방을 숨기고 있다고 비난했는데, 스트릭랜드는 냉소적이고 유머러스한 답장으로 동업자에게 자신을 어디서 찾을 수 있는지 정확히 알려주었다.","chapter":10},{"lemma":"darkly","difficulty":"C1","gloss":"With insufficient light for easy discernment or comprehension.","ipa":"/ˈdɑːkli/","sentence":"She flushed darkly.","word_in_sentence":"darkly","ko":"그녀의 얼굴이 시뻘겋게 달아올랐다.","chapter":10},{"lemma":"instal","difficulty":"C2","gloss":"Alternative spelling of install.","ipa":null,"sentence":"I imagined that she saw her husband installed in a luxurious suite of rooms, dining at one smart restaurant after another, and she pictured his days spent at race-meetings and his evenings at the play.","word_in_sentence":"installed","ko":"나는 그녀가 남편이 호화로운 객실에 머물며 고급 레스토랑을 전전하고, 낮에는 경마장에서 저녁에는 극장에서 시간을 보내는 모습을 상상하고 있으리라 짐작했다.","chapter":10},{"lemma":"pitifully","difficulty":"C2","gloss":"In a pitiful manner.","ipa":null,"sentence":"she said pitifully.","word_in_sentence":"pitifully","ko":"그녀가 애처롭게 말했다.","chapter":10},{"lemma":"weep","difficulty":"C1","gloss":"To cry; to shed tears, especially when accompanied with sobbing or other difficulty speaking, as an expression of emotion such as sadness or joy.","ipa":"/wiːp/","sentence":"She was weeping freely.","word_in_sentence":"weeping","ko":"그녀는 펑펑 울고 있었다.","chapter":10},{"lemma":"indignant","difficulty":"C1","gloss":"Showing anger or indignation, especially at something unjust or wrong.","ipa":"/ɪnˈdɪɡ.nənt/","sentence":"I felt indignant at Strickland’s cold cruelty, and I promised to do all I could to bring him back.","word_in_sentence":"indignant","ko":"스트릭랜드의 냉혹한 잔인함에 분개했고, 그를 데려오기 위해 할 수 있는 모든 일을 하겠다고 약속했다.","chapter":10},{"lemma":"errand","difficulty":"C1","gloss":"A mission or quest.","ipa":"/ˈɛɹənd/","sentence":"During the journey I thought over my errand with misgiving.","word_in_sentence":"errand","ko":"여행하는 동안 나는 불안한 마음으로 내 임무를 생각했다.","chapter":11},{"lemma":"contradiction","difficulty":"C1","gloss":"The act of contradicting.","ipa":"/ˌkɒntɹəˈdɪkʃən/","sentence":"Who could resolve the contradiction?","word_in_sentence":"contradiction","ko":"누가 이런 모순을 해결할 수 있겠는가?","chapter":19},{"lemma":"unhappiness","difficulty":"C1","gloss":"The feeling of not being happy.","ipa":null,"sentence":"Have you never had a moment’s regret for all the unhappiness you caused them?”","word_in_sentence":"unhappiness","ko":"그들에게 끼친 모든 불행에 대해 한 순간이라도 후회해본 적이 없소?\"","chapter":21},{"lemma":"sufficiency","difficulty":"C1","gloss":"The quality or condition of being sufficient.","ipa":null,"sentence":"It was evident that she had been prepared to weep, for she had provided herself with a sufficiency of handkerchiefs; I admired her forethought, but in retrospect it made her tears perhaps less moving.","word_in_sentence":"sufficiency","ko":"그녀가 울 준비를 해왔다는 것은 분명했다. 충분한 양의 손수건을 준비해왔기 때문이었다. 나는 그녀의 선견지명에 감탄했지만, 돌이켜보니 그것이 그녀의 눈물을 덜 감동적으로 만들었을지도 모른다.","chapter":11},{"lemma":"handkerchief","difficulty":"C1","gloss":"A piece of cloth, usually square and often fine and elegant, carried for wiping the face, eyes, nose or hands. Example: He sneezed on his handkerchief during the meeting.","ipa":"/ˈheɪŋkɚt͡ʃɪf/","sentence":"He had even a black border to his handkerchief.","word_in_sentence":"handkerchief","ko":"그는 심지어 손수건에까지 검은 테를 둘렀다.","chapter":38},{"lemma":"forethought","difficulty":"C2","gloss":"Thinking beforehand or in advance, planning; prior or previous consideration; premeditation.","ipa":"/ˈfɔː(ɹ)θɔːt/","sentence":"It was evident that she had been prepared to weep, for she had provided herself with a sufficiency of handkerchiefs; I admired her forethought, but in retrospect it made her tears perhaps less moving.","word_in_sentence":"forethought","ko":"그녀가 울 준비를 해왔다는 것은 분명했다. 충분한 양의 손수건을 준비해왔기 때문이었다. 나는 그녀의 선견지명에 감탄했지만, 돌이켜보니 그것이 그녀의 눈물을 덜 감동적으로 만들었을지도 모른다.","chapter":11},{"lemma":"retrospect","difficulty":"C1","gloss":"Consideration of past times.","ipa":"/ˈɹɛtɹəˌspɛkt/","sentence":"It was evident that she had been prepared to weep, for she had provided herself with a sufficiency of handkerchiefs; I admired her forethought, but in retrospect it made her tears perhaps less moving.","word_in_sentence":"retrospect","ko":"그녀가 울 준비를 해왔다는 것은 분명했다. 충분한 양의 손수건을 준비해왔기 때문이었다. 나는 그녀의 선견지명에 감탄했지만, 돌이켜보니 그것이 그녀의 눈물을 덜 감동적으로 만들었을지도 모른다.","chapter":11},{"lemma":"perturb","difficulty":"C2","gloss":"To disturb; to bother or unsettle.","ipa":"/pəˈtɜːb/","sentence":"I could not decide whether she desired the return of her husband because she loved him, or because she dreaded the tongue of scandal; and I was perturbed by the suspicion that the anguish of love contemned was alloyed in her broken heart with the pangs, sordid to my young mind, of wounded vanity.","word_in_sentence":"perturbed","ko":"그녀가 남편을 사랑해서 그의 귀환을 바라는 것인지, 아니면 세간의 험담이 두려워서인지 판단할 수 없었다. 그리고 경멸당한 사랑의 고뇌가 그녀의 상처받은 마음에서 상처받은 허영심의 고통과 뒤섞여 있다는 의혹이 나를 불안하게 했다. 그 허영심의 고통은 어린 내 마음에는 천박한 것이었다.","chapter":11},{"lemma":"anguish","difficulty":"C1","gloss":"Extreme pain, either of body or mind; excruciating distress.","ipa":"/ˈæŋ.ɡwɪʃ/","sentence":"Whatever anguish she suffered she concealed.","word_in_sentence":"anguish","ko":"어떤 고통을 겪든 그녀는 그것을 숨겼다.","chapter":16},{"lemma":"contemn","difficulty":"C2","gloss":"To disdain; to value at little or nothing; to treat or regard with contempt.","ipa":"/kənˈtɛm/","sentence":"I could not decide whether she desired the return of her husband because she loved him, or because she dreaded the tongue of scandal; and I was perturbed by the suspicion that the anguish of love contemned was alloyed in her broken heart with the pangs, sordid to my young mind, of wounded vanity.","word_in_sentence":"contemned","ko":"그녀가 남편을 사랑해서 그의 귀환을 바라는 것인지, 아니면 세간의 험담이 두려워서인지 판단할 수 없었다. 그리고 경멸당한 사랑의 고뇌가 그녀의 상처받은 마음에서 상처받은 허영심의 고통과 뒤섞여 있다는 의혹이 나를 불안하게 했다. 그 허영심의 고통은 어린 내 마음에는 천박한 것이었다.","chapter":11},{"lemma":"sordid","difficulty":"C1","gloss":"Distasteful, ignoble, vile, or contemptible.","ipa":"/ˈsɔː.dɪd/","sentence":"When he repeated to me the whole sordid little scene I was outraged.","word_in_sentence":"sordid","ko":"그가 그 추잡하고 초라한 장면을 통째로 내게 되풀이해서 들려주었을 때 나는 분노했다.","chapter":31},{"lemma":"contradictory","difficulty":"C1","gloss":"That contradicts something, such as an argument.","ipa":"/ˌkɒntɹəˈdɪkt(ə)ɹi/","sentence":"What a cruel practical joke old Nature played when she flung so many contradictory elements together, and left the man face to face with the perplexing callousness of the universe.","word_in_sentence":"contradictory","ko":"자연이라는 늙은 존재가 그토록 많은 모순된 요소들을 한데 뒤섞어놓고는, 인간을 우주의 당혹스러운 냉혹함과 마주하게 내버려둔 것이야말로 얼마나 잔인한 현실적 농담인가.","chapter":31},{"lemma":"baseness","difficulty":"C2","gloss":"The quality or condition of being base.","ipa":"/ˈbeɪsnəs/","sentence":"I had not yet learnt how contradictory is human nature; I did not know how much pose there is in the sincere, how much baseness in the noble, nor how much goodness in the reprobate.","word_in_sentence":"baseness","ko":"나는 아직 인간의 본성이 얼마나 모순적인지 배우지 못했다. 진실한 것 속에 얼마나 많은 가식이 있는지, 고귀한 것 속에 얼마나 많은 비열함이 있는지, 타락한 자 속에 얼마나 많은 선량함이 있는지 알지 못했다.","chapter":11},{"lemma":"reprobate","difficulty":"C2","gloss":"Rejected; cast off as worthless.","ipa":"/ˈɹɛpɹəbət/","sentence":"I had not yet learnt how contradictory is human nature; I did not know how much pose there is in the sincere, how much baseness in the noble, nor how much goodness in the reprobate.","word_in_sentence":"reprobate","ko":"나는 아직 인간의 본성이 얼마나 모순적인지 배우지 못했다. 진실한 것 속에 얼마나 많은 가식이 있는지, 고귀한 것 속에 얼마나 많은 비열함이 있는지, 타락한 자 속에 얼마나 많은 선량함이 있는지 알지 못했다.","chapter":11},{"lemma":"errant","difficulty":"C1","gloss":"Straying from the proper course or standard, or outside established limits.","ipa":"/ˈɛɹ(ə)nt/","sentence":"I saw myself, too, from the dramatic standpoint, and I was pleased with my role of the trusted friend bringing back the errant husband to his forgiving wife.","word_in_sentence":"errant","ko":"나는 극적인 관점에서 나 자신을 바라보기도 했고, 방황하는 남편을 관용적인 아내에게 데려다주는 신뢰받는 친구라는 내 역할에 만족했다.","chapter":11},{"lemma":"forgiving","difficulty":"C1", ord_in_sentence":"frailties","ko":"사무원들과 점원 아가씨들이 있었고, 오노레 드 발자크의 소설 페이지에서 막 걸어 나온 듯한 늙은 남자들이 있었으며, 인간의 약점으로 이익을 취하는 직업에 종사하는 남녀들이 있었다.","chapter":12},{"lemma":"throng","difficulty":"C1","gloss":"A group of people crowded or gathered closely together.","ipa":"/θɹɒŋ/","sentence":"His gaze rested on the passing throng, but I do not think he saw it.","word_in_sentence":"throng","ko":"그의 시선은 지나가는 군중에 머물러 있었지만, 그가 실제로 그들을 보고 있다고는 생각되지 않았다.","chapter":12},{"lemma":"vitality","difficulty":"C1","gloss":"The capacity to live and develop.","ipa":"/vaɪˈtælɪti/","sentence":"There is in the streets of the poorer quarters of Paris a thronging vitality which excites the blood and prepares the soul for the unexpected.","word_in_sentence":"vitality","ko":"파리의 가난한 동네 거리에는 피를 끓게 하고 영혼을 예상치 못한 일에 대비시키는 활기찬 생명력이 넘쳐흐른다.","chapter":12},{"lemma":"solemnity","difficulty":"C1","gloss":"The quality of being deeply serious and sober or solemn.","ipa":"/səˈlɛmnɪti/","sentence":"The absinthe came, and with due solemnity we dropped water over the melting sugar.","word_in_sentence":"solemnity","ko":"압생트가 나왔고, 우리는 의식을 치르듯 녹아가는 설탕 위에 물을 떨어뜨렸다.","chapter":12},{"lemma":"twinkle","difficulty":"C1","gloss":"To shine with a flickering light; to glimmer.","ipa":"/ˈtwɪŋ.kəl/","sentence":"His eyes twinkled.","word_in_sentence":"twinkled","ko":"그의 눈이 반짝였다.","chapter":12},{"lemma":"eloquent","difficulty":"C1","gloss":"Fluently persuasive and articulate.","ipa":"/ˈɛl.əˌkwənt/","sentence":"The eloquent phrases I had arranged, pathetic or indignant, seemed out of place on the Avenue de Clichy.","word_in_sentence":"eloquent","ko":"내가 준비해온 감동적이거나 분개에 찬 웅변조의 문구들이 클리시 거리에서는 어울리지 않는 것 같았다.","chapter":12},{"lemma":"beastly","difficulty":"C1","gloss":"Pertaining to, or having the form, nature, or habits of, a beast.","ipa":"/ˈbiːstli/","sentence":"“Beastly job for you this, isn’t it?”","word_in_sentence":"Beastly","ko":"\"자네에게는 정말 지긋지긋한 일이겠군, 그렇지?\"","chapter":12},{"lemma":"frightfully","difficulty":"C2","gloss":"In a frightful manner.","ipa":"/ˈfɹaɪtfəli/","sentence":"She’d been frightfully sick.","word_in_sentence":"frightfully","ko":"끔찍하게 토했더래요.","chapter":34},{"lemma":"callousness","difficulty":"C2","gloss":"The quality of being callous; emotional hardheartedness or indifference.","ipa":null,"sentence":"I cannot describe the extraordinary callousness with which he made this reply.","word_in_sentence":"callousness","ko":"그가 이렇게 대답할 때의 그 비정한 냉담함을 나는 도저히 표현할 수 없다.","chapter":12},{"lemma":"monstrous","difficulty":"C1","gloss":"Hideous or frightful.","ipa":"/ˈmɑnstɹəs/","sentence":"“Monstrous.”","word_in_sentence":"Monstrous","ko":"\"괴물 같은 짓이지.\"","chapter":12},{"lemma":"cordial","difficulty":"C1","gloss":"Hearty; sincere; warm; affectionate.","ipa":"/ˈkɔɹ.di.əl/","sentence":"His cordial agreement with all I said cut the ground from under my feet.","word_in_sentence":"cordial","ko":"내가 하는 말에 대한 그의 진심 어린 동의가 내 발밑의 땅을 송두리째 빼버렸다.","chapter":12},{"lemma":"ludicrous","difficulty":"C1","gloss":"Idiotic or unthinkable, often to the point of being funny; amusing by being plainly incongruous or absurd.","ipa":"/ˈluː.dɪ.kɹəs/","sentence":"It made my position complicated, not to say ludicrous.","word_in_sentence":"ludicrous","ko":"이는 내 입장을 복잡하게 만들었고, 우스꽝스럽게 만들기까지 했다.","chapter":12},{"lemma":"persuasive","difficulty":"C1","gloss":"Able to persuade; convincing.","ipa":"/pə(ɹ)ˈsweɪsɪv/","sentence":"I was prepared to be persuasive, touching, and hortatory, admonitory and expostulating, if need be vituperative even, indignant and sarcastic; but what the devil does a mentor do when the sinner makes no bones about confessing his sin?","word_in_sentence":"persuasive","ko":"나는 설득적이고 감동적이며 훈계하는 태도로, 필요하다면 꾸짖고 항의하며, 심지어 신랄하게 비난하고 분개하며 비꼬는 자세까지 취할 준비가 되어 있었다. 하지만 죄인이 자신의 죄를 스스럼없이 고백해버릴 때 도대체 스승은 무엇을 해야 한단 말인가?","chapter":12},{"lemma":"hortatory","difficulty":"C2","gloss":"Giving exhortation or advice; encouraging.","ipa":"/ˈhɔːtətəɹi/","sentence":"The words were ordinary enough, and to my mind there was in them something so hortatory that I almost smiled.","word_in_sentence":"hortatory","ko":"그 말들은 충분히 평범했고, 내 생각에는 그 안에 너무나 설교조인 무언가가 있어서 나는 거의 미소를 지을 뻔했다.","chapter":25},{"lemma":"admonitory","difficulty":"C2","gloss":"Of or pertaining to an admonition; serving to reprove, warn or advise.","ipa":"/ədˈmɑnɪˌtɔɹi/","sentence":"I was prepared to be persuasive, touching, and hortatory, admonitory and expostulating, if need be vituperative even, indignant and sarcastic; but what the devil does a mentor do when the sinner makes no bones about confessing his sin?","word_in_sentence":"admonitory","ko":"나는 설득적이고 감동적이며 훈계하는 태도로, 필요하다면 꾸짖고 항의하며, 심지어 신랄하게 비난하고 분개하며 비꼬는 자세까지 취할 준비가 되어 있었다. 하지만 죄인이 자신의 죄를 스스럼없이 고백해버릴 때 도대체 스승은 무엇을 해야 한단 말인가?","chapter":12},{"lemma":"expostulating","difficulty":"C2","gloss":"present participle and gerund of expostulate","ipa":null,"sentence":"I was prepared to be persuasive, touching, and hortatory, admonitory and expostulating, if need be vituperative even, indignant and sarcastic; but what the devil does a mentor do when the sinner makes no bones about confessing his sin?","word_in_sentence":"expostulating","ko":"나는 설득적이고 감동적이며 훈계하는 태도로, 필요하다면 꾸짖고 항의하며, 심지어 신랄하게 비난하고 분개하며 비꼬는 자세까지 취할 준비가 되어 있었다. 하지만 죄인이 자신의 죄를 스스럼없이 고백해버릴 때 도대체 스승은 무엇을 해야 한단 말인가?","chapter":12},{"lemma":"vituperative","difficulty":"C2","gloss":"Marked by harsh abuse; abusive, often with ranting or railing.","ipa":"/vəˈtuːpɚətɪv/","sentence":"I was prepared to be persuasive, touching, and hortatory, admonitory and expostulating, if need be vituperative even, indignant and sarcastic; but what the devil does a mentor do when the sinner makes no bones about confessing his sin?","word_in_sentence":"vituperative","ko":"나는 설득적이고 감동적이며 훈계하는 태도로, 필요하다면 꾸짖고 항의하며, 심지어 신랄하게 비난하고 분개하며 비꼬는 자세까지 취할 준비가 되어 있었다. 하지만 죄인이 자신의 죄를 스스럼없이 고백해버릴 때 도대체 스승은 무엇을 해야 한단 말인가?","chapter":12},{"lemma":"nettle","difficulty":"C1","gloss":"Most, but not all, subspecies of Urtica dioica (common nettle),","ipa":"[ˈ C1","gloss":"A pig (the animal).","ipa":"/swaɪn/","sentence":"“Everyone will think you a perfect swine.”","word_in_sentence":"swine","ko":"\"모든 사람이 당신을 완전한 인간 쓰레기라고 생각할 텐데요.\"","chapter":12},{"lemma":"loathe","difficulty":"C1","gloss":"To detest, hate, or revile (someone or something).","ipa":"/ˈləʊð/","sentence":"“Won’t it mean anything to you to know that people loathe and despise you?”","word_in_sentence":"loathe","ko":"\"사람들이 당신을 혐오하고 경멸한다는 걸 아는 것이 당신에게는 아무 의미도 없나요?\"","chapter":12},{"lemma":"scornful","difficulty":"C2","gloss":"Showing scorn or disrespect; contemptuous; scathing; withering.","ipa":"/ˈskɔɹnfəl/","sentence":"Then his face grew bitterly scornful.","word_in_sentence":"scornful","ko":"그러자 그의 얼굴에 씁쓸한 경멸의 빛이 떠올랐다.","chapter":12},{"lemma":"disapproval","difficulty":"C1","gloss":"The act of disapproving; condemnation.","ipa":"/dɪsəˈpɹuvəl/","sentence":"I could not stomach his weakness, and he saw my disapproval.","word_in_sentence":"disapproval","ko":"나는 그의 나약함이 역겨웠고, 그는 내 못마땅함을 알아챘다.","chapter":29},{"lemma":"remorse","difficulty":"C1","gloss":"A feeling of regret or sadness for doing wrong or sinning.","ipa":"/ɹɪˈmɔɹs/","sentence":"If I really did you’d be overwhelmed with remorse.”","word_in_sentence":"remorse","ko":"내가 정말 그런다면 당신은 후회에 압도될 거예요.\"","chapter":23},{"lemma":"pique","difficulty":"C1","gloss":"To wound the pride of (someone); to excite to anger; to irritate, to offend.","ipa":"/piːk/","sentence":"“At all events, you can be forced to support your wife and children,” I retorted, somewhat piqued.","word_in_sentence":"piqued","ko":"\"어쨌든 당신은 아내와 아이들을 부양하도록 강제당할 수 있다\"고 나는 다소 화가 나서 반박했다.","chapter":12},{"lemma":"puzzled","difficulty":"C1","gloss":"Confused or perplexed.","ipa":"/ˈpʌ.zl̩d/","sentence":"I began to be more puzzled than before.","word_in_sentence":"puzzled","ko":"나는 전보다 더욱 당황스러워지기 시작했다.","chapter":12},{"lemma":"straiten","difficulty":"C2","gloss":"To make strait; to narrow or confine to a smaller space.","ipa":null,"sentence":"It was true that his hotel pointed to the most straitened circumstances.","word_in_sentence":"straitened","ko":"그가 머물고 있는 호텔을 보면 정말로 극도로 궁핍한 상황임이 분명했다.","chapter":12},{"lemma":"unattractive","difficulty":"C1","gloss":"Not handsome or beautiful or appealing.","ipa":null,"sentence":"She’s comparatively young, and she’s not unattractive.","word_in_sentence":"unattractive","ko":"비교적 젊고, 매력이 없는 것도 아닌데.","chapter":12},{"lemma":"precaution","difficulty":"C1","gloss":"Previous caution or care; caution previously employed to prevent misfortune or to secure good","ipa":"/pɹiːˈkɔːʃən/","sentence":"He had some reason to conceal the fact that he had run away with a woman, and he was using every precaution to hide her whereabouts.","word_in_sentence":"precaution","ko":"그는 어떤 여자와 함께 도망쳤다는 사실을 숨길 이유가 있었고, 그녀의 행방을 감추기 위해 온갖 주의를 기울이고 있었다.","chapter":12},{"lemma":"feign","difficulty":"C1","gloss":"To make a false show or pretence of; to counterfeit or simulate.","ipa":"/feɪn/","sentence":"He looked at me with an astonishment that was certainly not feigned.","word_in_sentence":"feigned","ko":"그는 분명히 꾸며낸 것이 아닌 놀라움으로 나를 바라보았다.","chapter":12},{"lemma":"twopenny","difficulty":"C2","gloss":"Having a value or cost of twopence.","ipa":null,"sentence":"“Do you really care a twopenny","word_in_sentence":"twopenny","ko":"\"정말로 블랑슈 스트루브가","chapter":41},{"lemma":"uproariously","difficulty":"C2","gloss":"In an uproarious manner.","ipa":null,"sentence":"He laughed so uproariously that people sitting near us looked round, and some of them began to laugh too.","word_in_sentence":"uproariously","ko":"그가 너무 요란하게 웃어서 우리 근처에 앉은 사람들이 돌아보았고, 그들 중 몇몇도 따라 웃기 시작했다.","chapter":12},{"lemma":"bitterly","difficulty":"C1","gloss":"In a bitter manner.","ipa":"/ˈbɪtəɹli/","sentence":"Then his face grew bitterly scornful.","word_in_sentence":"bitterly","ko":"그러자 그의 얼굴에 씁쓸한 경멸의 빛이 떠올랐다.","chapter":12},{"lemma":"ingenuous","difficulty":"C2","gloss":"Naive and trusting.","ipa":"/ɪnˈd͡ʒɛn.ju.əs/","sentence":"It was very ingenuous of me.","word_in_sentence":"ingenuous","ko":"참으로 순진한 질문이었다.","chapter":12},{"lemma":"folly","difficulty":"C1","gloss":"Foolishness that results from a lack of foresight or lack of practicality.","ipa":"/ˈfɑli/","sentence":"“I don’t see why, unless it’s folly to say the obvious.”","word_in_sentence":"folly","ko":"\"뻔한 얘기를 하는 게 어리석은 일이 아니라면, 왜 그런지 모르겠군.\"","chapter":12},{"lemma":"vehement","difficulty":"C1","gloss":"Showing strong feelings; passionate; forceful or intense.","ipa":"/ˈviː.ə.mənt/","sentence":"I seemed to feel in him some vehement power that was struggling within him; it gave me the sensation of something very strong, overmastering, that held him, as it were, against his will.","word_in_sentence":"vehement","ko":"그의 내면에서 무언가 격렬한 힘이 몸부림치고 있는 것 같았다. 그것은 마치 그의 의지와는 상관없이 그를 사로잡고 있는 매우 강력하고 압도적인 무언가라는 느낌을 주었다.","chapter":12},{"lemma":"overmaster","difficulty":"C2","gloss":"To overpower or overwhelm.","ipa":null,"sentence":"I seemed to feel in him some vehement power that was struggling within him; it gave me the sensation of something very strong, overmastering, that held him, as it were, against his will.","word_in_sentence":"overmastering","ko":"그의 내면에서 무언가 격렬한 힘이 몸부림치고 있는 것 같았다. 그것은 마치 그의 의지와는 상관없이 그를 사로잡고 있는 매우 강력하고 압도적인 무언가라는 느낌을 주었다.","chapter":12},{"lemma":"rend","difficulty":"C2","gloss":"To separate into parts with force or sudden violence; to split; to burst.","ipa":"/ɹɛnd/","sentence":"He seemed really to be possessed of a devil, and I felt that it might suddenly turn and rend him.","word_in_sentence":"rend","ko":"그는 정말로 악마에 사로잡힌 것 같았고, 그 악마가 갑자기 돌변해서 그를 갈기갈기 찢어버릴지도 모른다는 생각이 들었다.","chapter":12},{"lemma":"curiously","difficulty":"C1","gloss":"In a curious manner; with curiosity; inquisitively.","ipa":"/ˈkjɝi.əsli/","sentence":"I looked at him curiously.","word_in_sentence":"curiously","ko":"나는 그를 호기심 어린 눈으로 바라보았다.","chapter":13},{"lemma":"unbrushed","difficulty":"C2","gloss":"Not brushed","ipa":null,"sentence":"I wondered what a stranger would have taken him to be, sitting there in his old Norfolk jacket and his unbrushed bowler; his trousers were baggy, his hands were not clean; and his face, with the red stubble of the unshaved chin, the little eyes, and the large, aggressive nose, was uncouth and coarse.","word_in_sentence":"unbrushed","ko":"낡은 노퍽 재킷과 솔질하지 않은 중절모를 쓰고 그곳에 앉아 있는 그를 보고 낯선 사람이라면 무엇이라고 생각했을까 궁금했다. 바지는 헐렁했고, 손은 깨끗하지 않았으며, 면도하지 않은 턱의 붉은 수염, 작은 눈, 크고 공격적인 코가 있는 얼굴은 거칠고 조야했다.","chapter":12},{"lemma":"trouser","difficulty":"C1","gloss":"Of or relating to trousers.","ipa":"/ˈtɹaʊzɚ/","sentence":"I wondered what a stranger would have taken him to be, sitting there in his old Norfolk jacket and his unbrushed bowler; his trousers were baggy, his hands were not clean; and his face, with the red stubble of the unshaved chin, the little eyes, and the large, aggressive nose, was uncouth and coarse.","word_in_sentence":"trousers","ko":"낡은 노퍽 재킷과 솔질하지 않은 중절모를 쓰고 그곳에 앉아 있는 그를 보고 낯선 사람이라면 무엇이라고 생각했을까 궁금했다. 바지는 헐렁했고, 손은 깨끗하지 않았으며, 면도하지 않은 턱의 붉은 수염, 작은 눈, 크고 공격적인 코가 있는 얼굴은 거칠고 조야했다.","chapter":12},{"lemma":"baggy","difficulty":"C1","gloss":"Of clothing, very loose-fitting, so as to hang away from the body.","ipa":"/ˈbæɡi/","sentence":"I wondered what a stranger would have taken him to be, sitting there in his old Norfolk jacket and his unbrushed bowler; his trousers were baggy, his hands were not clean; and his face, with the red stubble of the unshaved chin, the little eyes, and the large, aggressive nose, was uncouth and coarse.","word_in_sentence":"baggy","ko":"낡은 노퍽 재킷과 솔질하지 않은 중절모를 쓰고 그곳에 앉아 있는 그를 보고 낯선 사람이라면 무엇이라고 생각했을까 궁금했다. 바지는 헐렁했고, 손은 깨끗하지 않았으며, 면도하지 않은 턱의 붉은 수염, 작은 눈, 크고 공격적인 코가 있는 얼굴은 거칠고 조야했다.","chapter":12},{"lemma":"stubble","difficulty":"C1","gloss":"Short, coarse hair, especially on a man’s face.","ipa":"/ˈstʌb.əl/","sentence":"I wondered what a stranger would have taken him to be, sitting there in his old Norfolk jacket and his unbrushed bowler; his trousers were baggy, his hands were not cle
