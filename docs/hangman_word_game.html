 고요히 떠돌았고, 꽃들 주위를 맴도는 아름다운 나비가 자신이 승리를 거두며 빠져나온 더러운 번데기에 대해 느끼는 것과 같은 혐오감을 그녀에게 느꼈다.","chapter":43},{"lemma":"chrysali","difficulty":"C2","gloss":{"en":"A stage in the life cycle of a butterfly or moth.","ko":"나방의","zh":"蛹期"},"ipa":"","sentence":"His thoughts floated then serenely in the empyrean, and he felt towards her the horror that perhaps the painted butterfly, hovering about the flowers, feels to the filthy chrysalis from which it has triumphantly emerged.","word_in_sentence":"chrysalis","ko":"그때 그의 사상은 천상계에서 고요히 떠돌았고, 꽃들 주위를 맴도는 아름다운 나비가 자신이 승리를 거두며 빠져나온 더러운 번데기에 대해 느끼는 것과 같은 혐오감을 그녀에게 느꼈다.","chapter":43},{"lemma":"triumphantly","difficulty":"C1","gloss":"In a triumphant manner.","ipa":"/traɪˈʌmfəntli/","sentence":"His thoughts floated then serenely in the empyrean, and he felt towards her the horror that perhaps the painted butterfly, hovering about the flowers, feels to the filthy chrysalis from which it has triumphantly emerged.","word_in_sentence":"triumphantly","ko":"그때 그의 사상은 천상계에서 고요히 떠돌았고, 꽃들 주위를 맴도는 아름다운 나비가 자신이 승리를 거두며 빠져나온 더러운 번데기에 대해 느끼는 것과 같은 혐오감을 그녀에게 느꼈다.","chapter":43},{"lemma":"idealist","difficulty":"C1","gloss":"One who adheres to idealism.","ipa":null,"sentence":"It seems strange even to myself, when I have described a man who was cruel, selfish, brutal and sensual, to say that he was a great idealist.","word_in_sentence":"idealist","ko":"잔인하고 이기적이며 야만적이고 관능적인 한 남자를 묘사해놓고서 그가 위대한 이상주의자였다고 말하는 것은, 나 자신에게도 이상하게 느껴진다.","chapter":43},{"lemma":"odious","difficulty":"C1","gloss":"Arousing or meriting strong dislike, aversion, or intense displeasure.","ipa":"/ˈoʊ.di.əs/","sentence":"Strickland was an odious man, but I still think he was a great one.","word_in_sentence":"odious","ko":"스트릭랜드는 혐오스러운 남자였지만, 나는 여전히 그가 위대한 인물이었다고 생각한다.","chapter":43},{"lemma":"attache","difficulty":"C1","gloss":"Alternative form of attaché.","ipa":"/æ.tæˈʃe/","sentence":"A certain importance attaches to the views on art of painters, and this is the natural place for me to set down what I know of Strickland’s opinions of the great artists of the past.","word_in_sentence":"attaches","ko":"화가들의 예술관에는 어느 정도 중요성이 따르기 마련이고, 따라서 이곳이 과거의 위대한 예술가들에 대한 스트릭랜드의 견해를 내가 아는 대로 기록해둘 자연스러운 자리이다.","chapter":44},{"lemma":"conversationalist","difficulty":"C2","gloss":"A person who participates in a conversation.","ipa":"/ˌkɑːnvɚˈseɪʃənəlɪst/","sentence":"Strickland was not a conversationalist, and he had no gift for putting what he had to say in the striking phrase that the listener remembers.","word_in_sentence":"conversationalist","ko":"스트릭랜드는 대화에 능한 사람이 아니었고, 자신이 하고 싶은 말을 듣는 이의 기억에 남을 만한 인상적인 문구로 표현하는 재능도 없었다.","chapter":44},{"lemma":"unusualness","difficulty":"C2","gloss":"The condition or state of being unusual.","ipa":null,"sentence":"He made one laugh sometimes by speaking the truth, but this is a form of humour which gains its force only by its unusualness; it would cease to amuse if it were commonly practised.","word_in_sentence":"unusualness","ko":"그는 때로 진실을 말함으로써 사람들을 웃게 만들었지만, 이런 형태의 유머는 그 드문 성격으로만 힘을 얻는 것이어서, 만약 흔히 행해진다면 재미를 잃을 것이다.","chapter":44},{"lemma":"annoy","difficulty":"C1","gloss":"To disturb or irritate, especially by continued or repeated acts; to bother with unpleasant deeds.","ipa":"/əˈnɔɪ/","sentence":"But I dare say he said it to annoy, and if he did he certainly succeeded.","word_in_sentence":"annoy","ko":"하지만 아마 그는 상대방을 짜증나게 하려고 그런 말을 했을 것이고, 만약 그것이 목적이었다면 분명히 성공했다.","chapter":44},{"lemma":"extravagance","difficulty":"C1","gloss":"Excessive or superfluous expenditure of money.","ipa":"/ɪkˈstɹævəɡən(t)s/","sentence":"I am disappointed that I cannot report any extravagances in his opinions on the old masters.","word_in_sentence":"extravagances","ko":"거장들에 대한 그의 견해에서 별다른 기행을 보고할 수 없다는 것이 실망스럽다.","chapter":44},{"lemma":"disillusion","difficulty":"C2","gloss":"To free or deprive of illusion; to disenchant.","ipa":"/dɪs.ɪˈluːʒən/","sentence":"I feel the need to ascribe to him fantastic theories about his predecessors, and it is with a certain sense of disillusion that I confess he thought about them pretty much as does everybody else.","word_in_sentence":"disillusion","ko":"나는 그에게 선배 화가들에 대한 기상천외한 이론들을 부여하고 싶은 욕구를 느끼는데, 그가 그들에 대해 다른 사람들과 거의 똑같이 생각했다고 고백하는 것은 어느 정도 환멸감을 준다.","chapter":44},{"lemma":"coarseness","difficulty":"C2","gloss":"The property of being coarse, roughness or primitiveness, unrefined or unpolished.","ipa":null,"sentence":"He described the impression that Rembrandt made on him with a coarseness I cannot repeat.","word_in_sentence":"coarseness","ko":"그는 렘브란트가 자신에게 준 인상을 내가 반복할 수 없을 만큼 거친 말로 묘사했다.","chapter":44},{"lemma":"copious","difficulty":"C1","gloss":"Vast in quantity or number, profuse, abundant; taking place on a large scale.","ipa":"/ˈkoʊ.pi.əs/","sentence":"I never heard her speak, but it may be that in private she had a copious conversation.","word_in_sentence":"copious","ko":"그녀가 말하는 것을 들어본 적은 없지만, 사적인 자리에서는 말이 많았을지도 모른다.","chapter":46},{"lemma":"grotesquely","difficulty":"C2","gloss":"In a grotesque manner; disgustingly.","ipa":null,"sentence":"He seemed to see his fellow-creatures grotesquely, and he was angry with them because they were grotesque; life was a confusion of ridiculous, sordid happenings, a fit subject for laughter, and yet it made him sorrowful to laugh.","word_in_sentence":"grotesquely","ko":"그는 동료 인간들을 기괴하게 보는 듯했고, 그들이 기괴하다는 이유로 화를 냈다. 삶은 우스꽝스럽고 추잡한 일들의 혼란이었고, 웃음거리가 될 만한 소재였지만, 그럼에도 웃는다는 것이 그를 슬프게 만들었다.","chapter":44},{"lemma":"sorrowful","difficulty":"C1","gloss":"exhibiting sorrow; dejected; distraught; sad. (of a person)","ipa":"/ˈsɔɹoʊfəl/","sentence":"He seemed to see his fellow-creatures grotesquely, and he was angry with them because they were grotesque; life was a confusion of ridiculous, sordid happenings, a fit subject for laughter, and yet it made him sorrowful to laugh.","word_in_sentence":"sorrowful","ko":"그는 동료 인간들을 기괴하게 보는 듯했고, 그들이 기괴하다는 이유로 화를 냈다. 삶은 우스꽝스럽고 추잡한 일들의 혼란이었고, 웃음거리가 될 만한 소재였지만, 그럼에도 웃는다는 것이 그를 슬프게 만들었다.","chapter":44},{"lemma":"securely","difficulty":"C1","gloss":"In a secure manner; without fear or apprehension; without danger.","ipa":"/səˈkjʊɹli/","sentence":"It is thither that after many wanderings Charles Strickland came, and it is there that he painted the pictures on which his fame most securely rests.","word_in_sentence":"securely","ko":"오랜 방랑 끝에 찰스 스트릭랜드가 도착한 곳이 바로 그곳이었고, 그의 명성을 가장 확고히 떠받치는 그림들을 그린 곳도 바로 거기였다.","chapter":45},{"lemma":"realisation","difficulty":"C1","gloss":"Alternative spelling of realization.","ipa":null,"sentence":"I suppose no artist achieves completely the realisation of the dream that obsesses him, and Strickland, harassed incessantly by his struggle with technique, managed, perhaps, less than others to express the vision that he saw with his mind’s eye; but in Tahiti the circumstances were favourable to him; he found in his surroundings the accidents necessary for his inspiration to become effective, and his later pictures give at least a suggestion of what he sought.","word_in_sentence":"realisation","ko":"어떤 예술가도 자신을 사로잡는 꿈을 완전히 실현하지는 못하는 법이고, 기법과의 끊임없는 투쟁에 시달린 스트릭랜드는 아마도 다른 이들보다도 더 적게 자신이 마음의 눈으로 본 환상을 표현해냈을 것이다. 하지만 타히티에서는 상황이 그에게 유리했다. 그는 주변 환경에서 자신의 영감이 효과를 발휘하는 데 필요한 우연들을 발견했고, 그의 후기 작품들은 적어도 그가 추구했던 것의 암시를 보여준다.","chapter":45},{"lemma":"incessantly","difficulty":"C1","gloss":"In a manner without pause or stop, especially to the point of annoyance; not ceasing.","ipa":"/ɪnˈsɛs.ənt.li/","sentence":"I suppose no artist achieves completely the realisation of the dream that obsesses him, and Strickland, harassed incessantly by his struggle with technique, managed, perhaps, less than others to express the vision that he saw with his mind’s eye; but in Tahiti the circumstances were favourable to him; he found in his surroundings the accidents necessary for his inspiration to become effective, and his later pictures give at least a suggestion of what he sought.","word_in_sentence":"incessantly","ko":"어떤 예술가도 자신을 사로잡는 꿈을 완전히 실현하지는 못하는 법이고, 기법과의 끊임없는 투쟁에 시달린 스트릭랜드는 아마도 다른 이들보다도 더 적게 자신이 마음의 눈으로 본 환상을 표현해냈을 것이다. 하지만 타히티에서는 상황이 그에게 유리했다. 그는 주변 환경에서 자신의 영감이 효과를 발휘하는 데 필요한 우연들을 발견했고, 그의 후기 작품들은 적어도 그가 추구했던 것의 암시를 보여준다.","chapter":45},{"lemma":"disembodied","difficulty":"C1","gloss":"simple past and past participle of disembody","ipa":"/dɪsɪmˈbɒdiːd/","sentence":"It is as though in this far country his spirit, that had wandered disembodied, seeking a tenement, at last was able to clothe itself in flesh.","word_in_sentence":"disembodied","ko":"마치 이 먼 나라에서 육체 없이 떠돌며 거처를 찾던 그의 영혼이 마침내 살과 피를 입을 수 있게 된 것 같았다.","chapter":45},{"lemma":"tenement","difficulty":"C1","gloss":"A building that is rented to multiple tenants, especially a low-rent, run-down one.","ipa":"/ˈtɛnɪmənt/","sentence":"It is as though in this far country his spirit, that had wandered disembodied, seeking a tenement, at last was able to clothe itself in flesh.","word_in_sentence":"tenement","ko":"마치 이 먼 나라에서 육체 없이 떠돌며 거처를 찾던 그의 영혼이 마침내 살과 피를 입을 수 있게 된 것 같았다.","chapter":45},{"lemma":"soberly","difficulty":"C2","gloss":"In a sober manner; temperately; coolly; calmly; gravely; seriously.","ipa":null,"sentence":"But I think my arrival at Tahiti would have driven out of my head matters of much more immediate importance to me, and even after a week I found it not easy to order myself soberly.","word_in_sentence":"soberly","ko":"하지만 타히티에 도착한 것만으로도 나에게 훨씬 더 절박한 문제들조차 머릿속에서 사라져버렸을 것이고, 일주일이 지난 후에도 나는 차분하게 정신을 가다듬기가 쉽지 않았다.","chapter":45},{"lemma":"ghostly","difficulty":"C1","gloss":"Of or pertaining to ghosts or spirits.","ipa":"/ˈɡoʊstli/","sentence":"The sky had still the pallor of dawn, and there was a ghostly silence on the lagoon.","word_in_sentence":"ghostly","ko":"하늘은 여전히 새벽의 창백함을 띠고 있었고, 석호에는 유령 같은 정적이 흘렀다.","chapter":45},{"lemma":"lagoon","difficulty":"C1","gloss":"A shallow body of water separated from deeper sea by a bar.","ipa":"/ləˈɡuːn/","sentence":"The sky had still the pallor of dawn, and there was a ghostly silence on the lagoon.","word_in_sentence":"lagoon","ko":"하늘은 여전히 새벽의 창백함을 띠고 있었고, 석호에는 유령 같은 정적이 흘렀다.","chapter":45},{"lemma":"seaport","difficulty":"C1","gloss":"A town or harbour with facilities for seagoing ships to dock and take on or discharge cargo.","ipa":null,"sentence":"Wellington is trim and neat and English; it reminds you of a seaport town on the South Coast.","word_in_sentence":"seaport","ko":"웰링턴은 단정하고 깔끔하며 영국적이다. 남해안의 항구 도시를 연상시킨다.","chapter":45},{"lemma":"stormy","difficulty":"C1","gloss":"Of or pertaining to storms.","ipa":"/ˈstɔɹmi/","sentence":"And for three days afterwards the sea was stormy.","word_in_sentence":"stormy","ko":"그 후 사흘 동안 바다는 거칠었다.","chapter":45},{"lemma":"desolate","difficulty":"C1","gloss":"To deprive of inhabitants.","ipa":"/ˈdɛsələt/","sentence":"The Pacific is more desolate than other seas; its spaces seem more vast, and the most ordinary journey upon it has somehow the feeling of an adventure.","word_in_sentence":"desolate","ko":"태평양은 다른 바다들보다 더 황량하다. 그 공간은 더 광활해 보이고, 그 위에서 하는 가장 평범한 여행조차 어딘지 모험의 느낌을 준다.","chapter":45},{"lemma":"elixir","difficulty":"C1","gloss":"A liquid which converts lead to gold.","ipa":"/ɪˈlɪksə(ɹ)/","sentence":"The air you breathe is an elixir which prepares you for the unexpected.","word_in_sentence":"elixir","ko":"숨 쉬는 공기는 예상치 못한 일들을 준비시켜 주는 영약이다.","chapter":45},{"lemma":"vouchsafe","difficulty":"C2","gloss":"To graciously give, to condescendingly grant a right, benefit, outcome, etc.; to deign to acknowledge.","ipa":"/ˌvaʊt͡ʃˈseɪf/","sentence":"Nor is it vouchsafed to man in the flesh to know aught that more nearly suggests the approach to the golden realms of fancy than the approach to Tahiti.","word_in_sentence":"vouchsafed","ko":"육신을 지닌 인간에게는 환상의 황금 영역으로 다가가는 것보다 더 가깝게 느껴지는 것을 아는 것이 허락되지 않으니, 그것은 바로 타히티로 다가가는 것이다.","chapter":45},{"lemma":"mysteriously","difficulty":"C1","gloss":"In a mysterious manner.","ipa":null,"sentence":"Sometimes a man hits upon a place to which he mysteriously feels that he belongs.","word_in_sentence":"mysteriously","ko":"때로는 사람이 신비롭게도 자신이 속해 있다고 느끼는 장소를 우연히 발견하기도 한다.","chapter":50},{"lemma":"unsubstantial","difficulty":"C2","gloss":"Insubstantial.","ipa":null,"sentence":"Murea, the sister isle, comes into view in rocky splendour, rising from the desert sea mysteriously, like the unsubstantial fabric of a magic wand.","word_in_sentence":"unsubstantial","ko":"자매 섬인 무레아가 바위투성이의 장관을 이루며 시야에 들어온다. 신비롭게 사막 같은 바다에서 솟아오르는 모습이 마치 마법 지팡이가 만들어낸 실체 없는 직물 같다.","chapter":45},{"lemma":"wand","difficulty":"C1","gloss":"A hand-held narrow rod, usually used for pointing or instructing, or as a traditional emblem of authority.","ipa":"/wɒnd/","sentence":"Murea, the sister isle, comes into view in rocky splendour, rising from the desert sea mysteriously, like the unsubstantial fabric of a magic wand.","word_in_sentence":"wand","ko":"자매 섬인 무레아가 바위투성이의 장관을 이루며 시야에 들어온다. 신비롭게 사막 같은 바다에서 솟아오르는 모습이 마치 마법 지팡이가 만들어낸 실체 없는 직물 같다.","chapter":45},{"lemma":"polynesian","difficulty":"C1","gloss":"Of, from, or pertaining to Polynesia.","ipa":null,"sentence":"They belonged to a Polynesian garden of the Hesperides.","word_in_sentence":"Polynesian","ko":"그것들은 폴리네시아의 헤스페리데스 정원에 속한 것들이었다.","chapter":57},{"lemma":"unholy","difficulty":"C1","gloss":"Not holy; (by extension) evil, impure, or otherwise perverted.","ipa":"/ʌnˈhəʊli/","sentence":"It was the work of a man who knew things which it is unholy for men to know.","word_in_sentence":"unholy","ko":"그것은 인간이 알아서는 안 될 것들을 아는 사람의 작품이었다.","chapter":56},{"lemma":"unveil","difficulty":"C1","gloss":"To remove a veil from; to uncover; to reveal something hidden.","ipa":"/ʌnˈveɪl/","sentence":"The beauty of the island is unveiled as diminishing distance shows you in distincter shape its lovely peaks, but it keeps its secret as you sail by, and, darkly inviolable, seems to fold itself together in a stony, inaccessible grimness.","word_in_sentence":"unveiled","ko":"거리가 줄어들면서 섬의 아름다운 봉우리들이 더욱 뚜렷한 모습을 드러내며 섬의 아름다움이 펼쳐지지만, 배가 지나쳐 갈 때에도 섬은 여전히 비밀을 간직한 채 어둡고 신성불가침한 모습 rlet against the blue sky, flaunt their colour like a cry of passion.","word_in_sentence":"moored","ko":"부두에 정박한 스쿠너들은 단정하고 깔끔하며, 만 따라 늘어선 작은 마을은 하얗고 세련되어 있고, 푸른 하늘을 배경으로 한 진홍빛 플람보얀트들은 열정의 외침처럼 색채를 뽐내고 있다.","chapter":45},{"lemma":"flamboyant","difficulty":"C1","gloss":"Showy, bold or audacious in behaviour, appearance, style, etc.; ostentatious.","ipa":"/flamˈbɔɪ.ənt/","sentence":"A mango grew in front of the house, and at the edge of the clearing were two flamboyants, twin trees, that challenged the gold of the cocoa-nuts with their scarlet flowers.","word_in_sentence":"flamboyants","ko":"집 앞에는 망고나무가 자라고 있었고, 개간지 가장자리에는 두 그루의 플람보얀트가 쌍둥이처럼 서서 주홍빛 꽃으로 코코넛의 황금빛에 맞서고 있었다.","chapter":52},{"lemma":"flaunt","difficulty":"C1","gloss":"To wave or flutter smartly in the wind.","ipa":"/flɔːnt/","sentence":"The schooners moored to the quay are trim and neat, the little town along the bay is white and urbane, and the flamboyants, scarlet against the blue sky, flaunt their colour like a cry of passion.","word_in_sentence":"flaunt","ko":"부두에 정박한 스쿠너들은 단정하고 깔끔하며, 만 따라 늘어선 작은 마을은 하얗고 세련되어 있고, 푸른 하늘을 배경으로 한 진홍빛 플람보얀트들은 열정의 외침처럼 색채를 뽐내고 있다.","chapter":45},{"lemma":"unashamed","difficulty":"C2","gloss":"feeling or showing no shame, embarrassment or remorse","ipa":"/ˌʌnəˈʃeɪmd/","sentence":"They are sensual with an unashamed violence that leaves you breathless.","word_in_sentence":"unashamed","ko":"그것들은 숨이 막힐 정도로 부끄러움 없는 격렬함으로 관능적이다.","chapter":45},{"lemma":"wharf","difficulty":"C1","gloss":"An artificial landing place for ships on a riverbank or shore.","ipa":"/ˈwɔːf/","sentence":"And the crowd that throngs the wharf as the steamer draws alongside is gay and debonair; it is a noisy, cheerful, gesticulating crowd.","word_in_sentence":"wharf","ko":"그리고 기선이 접안할 때 부두에 몰려든 군중은 명랑하고 쾌활하다. 시끄럽고 유쾌하며 몸짓을 크게 하는 군중이다.","chapter":45},{"lemma":"steamer","difficulty":"C1","gloss":"A vessel in which articles are subjected to the action of steam, as in washing and in various processes of manufacture 항상 거절했다), 그리고 내게 호의를 베푸는 듯한 정중한 태도로 빌려간 몇 달러가 내 주머니에서 그의 주머니로 넘어간 것이 그가 내게 선사한 즐거움과 결코 동등하다고 생각하지 않는다.","chapter":46},{"lemma":"debtor","difficulty":"C1","gloss":"A person or firm that owes money; one in debt; one who owes a debt.","ipa":"/ˈdɛt.ə/","sentence":"I remained his debtor.","word_in_sentence":"debtor","ko":"나는 그에게 빚을 지고 있었다.","chapter":46},{"lemma":"reticent","difficulty":"C1","gloss":"Unwilling to communicate; keeping one's thoughts and opinions to oneself; reserved or restrained.","ipa":"/ˈɹɛtɪsənt/","sentence":"It was a matter upon which he was reticent, and with persons of his kind a direct question is never very discreet.","word_in_sentence":"reticent","ko":"그는 이 문제에 대해 말을 아꼈고, 그런 부류의 사람들에게 직접적인 질문은 결코 신중하지 못한 일이었다.","chapter":46},{"lemma":"undeserved","difficulty":"C1","gloss":"Not deserved, earned or merited; unjustifiable or unfair.","ipa":null,"sentence":"He hinted at undeserved misfortune, and there is no doubt that he looked upon himself as the victim of injustice.","word_in_sentence":"undeserved","ko":"그는 부당한 불행을 암시했고, 자신을 불의의 희생자로 여기고 있음에는 의심의 여지가 없었다.","chapter":46},{"lemma":"sympathetically","difficulty":"C1","gloss":"Owing to or showing evidence of sympathy, or affinity; happening through or demonstrating correspondences, whether occult or physiological.","ipa":"/sɪmpəˈθɛtɪk(ə)li/","sentence":"My fancy played with the various forms of fraud and violence, and I agreed with him sympathetically when he remarked that the authorities in the old country were so damned technical.","word_in_sentence":"sympathetically","ko":"내 상상력은 온갖 형태의 사기와 폭력을 떠올렸고, 그가 본국의 당국자들이 너무 빌어먹을 정도로 까다롭다고 말할 때 나는 동정심을 담아 동의했다.","chapter":46},{"lemma":"impair","difficulty":"C1","gloss":"To weaken; to affect negatively; to have a diminishing effect on.","ipa":"/ɪmˈpɛɹ/","sentence":"But it was nice to see that any unpleasantness he had endured in his native land had not impaired his ardent patriotism.","word_in_sentence":"impaired","ko":"하지만 고국에서 겪었던 어떤 불쾌한 일도 그의 열렬한 애국심을 손상시키지 못했다는 것은 보기 좋은 일이었다.","chapter":46},{"lemma":"ardent","difficulty":"C1","gloss":"Full of ardor; expressing passion, spirit, or enthusiasm.","ipa":"/ˈɑːdənt/","sentence":"But it was nice to see that any unpleasantness he had endured in his native land had not impaired his ardent patriotism.","word_in_sentence":"ardent","ko":"하지만 고국에서 겪었던 어떤 불쾌한 일도 그의 열렬한 애국심을 손상시키지 못했다는 것은 보기 좋은 일이었다.","chapter":46},{"lemma":"dyspepsia","difficulty":"C2","gloss":"Any mild disorder of digestion characterised by stomach pain, discomfort, heartburn, and nausea, often following a meal.","ipa":"/dɪsˈpɛp.si.ə/","sentence":"He suffered from dyspepsia, and he might often be seen sucking a tablet of pepsin; in the morning his appetite was poor; but this affliction alone would hardly have impaired his spirits.","word_in_sentence":"dyspepsia","ko":"그는 소화불량에 시달렸고, 펩신 정제를 빨고 있는 모습을 자주 볼 수 있었다. 아침에는 식욕이 없었지만, 이런 고통만으로는 그의 기분을 상하게 하기에 충분하지 않았을 것이다.","chapter":46},{"lemma":"pepsin","difficulty":"C2","gloss":"A digestive enzyme that chemically digests, or breaks down, proteins into shorter chains of amino acids.","ipa":"/ˈpɛpsɪn/","sentence":"He suffered from dyspepsia, and he might often be seen sucking a tablet of pepsin; in the morning his appetite was poor; but this affliction alone would hardly have impaired his spirits.","word_in_sentence":"pepsin","ko":"그는 소화불량에 시달렸고, 펩신 정제를 빨고 있는 모습을 자주 볼 수 있었다. 아침에는 식욕이 없었지만, 이런 고통만으로는 그의 기분을 상하게 하기에 충분하지 않았을 것이다.","chapter":46},{"lemma":"affliction","difficulty":"C1","gloss":"A state of pain, suffering, distress or agony.","ipa":"/əˈflɪk.ʃən/","sentence":"He suffered from dyspepsia, and he might often be seen sucking a tablet of pepsin; in the morning his appetite was poor; but this affliction alone would hardly have impaired his spirits.","word_in_sentence":"affliction","ko":"그는 소화불량에 시달렸고, 펩신 정제를 빨고 있는 모습을 자주 볼 수 있었다. 아침에는 식욕이 없었지만, 이런 고통만으로는 그의 기분을 상하게 하기에 충분하지 않았을 것이다.","chapter":46},{"lemma":"discontent","difficulty":"C1","gloss":"Dissatisfaction.","ipa":"/ˌdɪskənˈtɛnt/","sentence":"He had a greater cause of discontent with life than this.","word_in_sentence":"discontent","ko":"그에게는 이보다 더 큰 인생 불만의 원인이 있었다.","chapter":46},{"lemma":"rashly","difficulty":"C2","gloss":"In a rash manner; hastily or without due consideration; with precipitation.","ipa":null,"sentence":"Eight years before he had rashly married a wife.","word_in_sentence":"rashly","ko":"8년 전 그는 성급하게 아내를 얻었다.","chapter":46},{"lemma":"ordain","difficulty":"C2","gloss":"To prearrange unalterably.","ipa":"/ɔɹˈdeɪn/","sentence":"There are men whom a merciful Providence has undoubtedly ordained to a single life, but who from wilfulness or through circumstances they could not cope with have flown in the face of its decrees.","word_in_sentence":"ordained","ko":"자비로운 섭리가 분명히 독신으로 살도록 정해놓은 남자들이 있는데, 고집 때문이든 감당할 수 없는 상황 때문이든 그 뜻을 거스르는 경우가 있다.","chapter":46},{"lemma":"wilfulness","difficulty":"C2","gloss":"The state or condition of being wilful; stubbornness.","ipa":null,"sentence":"This I meant to do, not from wilfulness, but because I wished to leave Strickland setting out with I know not","word_in_sentence":"wilfulness","ko":"이렇게 하려던 것은 변덕 때문이 아니라, 스트릭랜드가 자신의 상상력을 불러일으킨 미지의 섬들을 향해 외로운 영혼에 어떤 환상을 품고 떠나는 모습으로 끝내고 싶었기 때문이다.","chapter":48},{"lemma":"tightness","difficulty":"C1","gloss":"The quality or degree of being tight.","ipa":null,"sentence":"She gave me an impression of extraordinary tightness.","word_in_sentence":"tightness","ko":"그녀는 나에게 이상할 정도로 팽팽한 인상을 주었다.","chapter":46},{"lemma":"bombazine","difficulty":"C2","gloss":"A twilled or corded fabric made from silk, wool, or cotton dyed black.","ipa":"/ˈbɒmbəziːn/","sentence":"Her plain face with its narrow lips was tight, her skin was stretched tightly over her bones, her smile was tight, her hair was tight, her clothes were tight, and the white drill she wore had all the effect of black bombazine.","word_in_sentence":"bombazine","ko":"좁은 입술의 평범한 얼굴도 팽팽했고, 뼈 위로 팽팽하게 당겨진 피부도, 미소도, 머리카락도, 옷도 모두 팽팽했으며, 그녀가 입은 흰 무명옷은 마치 검은 봄베진 천 같은 효과를 냈다.","chapter":46},{"lemma":"howsoever","difficulty":"C2","gloss":"Regardless of the way in which.","ipa":"/ˌhaʊsoʊˈɛvəɹ/","sentence":"However far he went and in howsoever secret a place he hid himself, I felt sure that Mrs. Nichols, inexorable as fate and remorseless as conscience, would presently rejoin him.","word_in_sentence":"howsoever","ko":"그가 아무리 멀리 가서 아무리 은밀한 곳에 숨는다 해도, 운명처럼 가차없고 양심처럼 무자비한 니콜스 부인이 곧 그를 찾아낼 것이라고 나는 확신했다.","chapter":46},{"lemma":"inexorable","difficulty":"C1","gloss":"Impossible to prevent or stop; inevitable.","ipa":"/ɪnˈɛksɔɹəbəl/","sentence":"However far he went and in howsoever secret a place he hid himself, I felt sure that Mrs. Nichols, inexorable as fate and remorseless as conscience, would presently rejoin him.","word_in_sentence":"inexorable","ko":"그가 아무리 멀리 가서 아무리 은밀한 곳에 숨는다 해도, 운명처럼 가차없고 양심처럼 무자비한 니콜스 부인이 곧 그를 찾아낼 것이라고 나는 확신했다.","chapter":46},{"lemma":"remorseless","difficulty":"C2","gloss":"Without remorse, mercy or pity.","ipa":null,"sentence":"However far he went and in howsoever secret a place he hid himself, I felt sure that Mrs. Nichols, inexorable as fate and remorseless as conscience, would presently rejoin him.","word_in_sentence":"remorseless","ko":"그가 아무리 멀리 가서 아무리 은밀한 곳에 숨는다 해도, 운명처럼 가차없고 양심처럼 무자비한 니콜스 부인이 곧 그를 찾아낼 것이라고 나는 확신했다.","chapter":46},{"lemma":"rejoin","difficulty":"C1","gloss":"To join again; to unite after separation.","ipa":"/ɹɪˈd͡ʒɔɪn/","sentence":"However far he went and in howsoever secret a place he hid himself, I felt sure that Mrs. Nichols, inexorable as fate and remorseless as conscience, would presently rejoin him.","word_in_sentence":"rejoin","ko":"그가 아무리 멀리 가서 아무리 은밀한 곳에 숨는다 해도, 운명처럼 가차없고 양심처럼 무자비한 니콜스 부인이 곧 그를 찾아낼 것이라고 나는 확신했다.","chapter":46},{"lemma":"hobo","difficulty":"C1","gloss":"A wandering homeless person, especially (historical) one illegally travelling by rail or (derogatory) a penniless, unemployed bum.","ipa":"/ˈhoʊ.boʊ/","sentence":"He is not embarrassed by the sans gene of the hobo, nor put out of countenance by the etiquette of the prince.","word_in_sentence":"hobo","ko":"그는 부랑자의 뻔뻔함에 당황하지도 않고, 왕자의 예법에 기죽지도 않는다.","chapter":46},{"lemma":"etiquette","difficulty":"C1","gloss":"The manners or decent behaviour to be observed in social or professional life; conventional decorum; the ceremonial code of polite society.","ipa":"/ˈɛt.ɪˌkɛt/","sentence":"He is not embarrassed by the sans gene of the hobo, nor put out of countenance by the etiquette of the prince.","word_in_sentence":"etiquette","ko":"그는 부랑자의 뻔뻔함에 당황하지도 않고, 왕자의 예법에 기죽지도 않는다.","chapter":46},{"lemma":"composedly","difficulty":"C2","gloss":"In a composed manner.","ipa":null,"sentence":"She did not call him; she gave no sign that she was aware of his existence; she merely walked up and down composedly.","word_in_sentence":"composedly","ko":"그녀는 그를 부르지도 않았고, 그의 존재를 알고 있다는 기색도 보이지 않았다. 그저 차분하게 이리저리 거닐 뿐이었다.","chapter":46},{"lemma":"undaunted","difficulty":"C1","gloss":"Showing courage and resolution.","ipa":null,"sentence":"Yet he was a man who had faced undaunted hurricane and typhoon, and would not have hesitated to fight a dozen unarmed niggers with nothing but a revolver to help him.","word_in_sentence":"undaunted","ko":"그런데도 그는 태풍과 허리케인을 두려워하지 않고 맞서던 사나이였고, 권총 하나만 들고도 비무장한 흑인 열두 명과 싸우는 것을 주저하지 않을 사람이었다.","chapter":46},{"lemma":"revolver","difficulty":"C1","gloss":"A handgun with a revolving chamber enabling several shots to be fired without reloading.","ipa":"/ɹɪˈvɒl.vɚ/","sentence":"Yet he was a man who had faced undaunted hurricane and typhoon, and would not have hesitated to fight a dozen unarmed niggers with nothing but a revolver to help him.","word_in_sentence":"revolver","ko":"그런데도 그는 태풍과 허리케인을 두려워하지 않고 맞서던 사나이였고, 권총 하나만 들고도 비무장한 흑인 열두 명과 싸우는 것을 주저하지 않을 사람이었다.","chapter":46},{"lemma":"digression","difficulty":"C2","gloss":"An aside, an act of straying from the main subject in speech or writing.","ipa":"/daɪˈɡɹɛʃən/","sentence":"I suppose it was a very pretty example of the triumph of spirit over matter, and so my digression has at least the advantage of a moral.","word_in_sentence":"digression","ko":"아마도 이것은 정신이 물질을 이기는 승리의 아주 좋은 본보기였을 것이고, 그러니 내 곁가지 이야기도 최소한 교훈이라는 장점은 있다.","chapter":46},{"lemma":"pauper","difficulty":"C1","gloss":"One who is extremely poor.","ipa":"/ˈpɔ.pɚ/","sentence":"The Asile de Nuit is a large stone building where pauper and vagabond may get a bed for a week, provided their papers are in order and they can persuade the friars in charge that they are workingmen.","word_in_sentence":"pauper","ko":"아질 드 뉘는 거대한 석조 건물로, 빈민과 부랑자들이 서류만 제대로 갖추고 관리하는 수사들에게 자신이 노동자임을 납득시킬 수 있다면 일주일간 잠자리를 얻을 수 있는 곳이었다.","chapter":47},{"lemma":"vagabond","difficulty":"C1","gloss":"A person on a trip of indeterminate destination and/or length of time.","ipa":"/ˈvæ.ɡə.bɒnd/","sentence":"The Asile de Nuit is a large stone building where pauper and vagabond may get a bed for a week, provided their papers are in order and they can persuade the friars in charge that they are workingmen.","word_in_sentence":"vagabond","ko":"아질 드 뉘는 거대한 석조 건물로, 빈민과 부랑자들이 서류만 제대로 갖추고 관리하는 수사들에게 자신이 노동자임을 납득시킬 수 있다면 일주일간 잠자리를 얻을 수 있는 곳이었다.","chapter":47},{"lemma":"friar","difficulty":"C1","gloss":"A member of a mendicant Christian order such as the Augustinians, Carmelites (white friars), Franciscans (grey friars) or the Dominicans (black friars).","ipa":"/ˈfɹaɪə/","sentence":"The Asile de Nuit is a large stone building where pauper and vagabond may get a bed for a week, provided their papers are in order and they can persuade the friars in charge that they are workingmen.","word_in_sentence":"friars","ko":"아질 드 뉘는 거대한 석조 건물로, 빈민과 부랑자들이 서류만 제대로 갖추고 관리하는 수사들에게 자신이 노동자임을 납득시킬 수 있다면 일주일간 잠자리를 얻을 수 있는 곳이었다.","chapter":47},{"lemma":"listlessly","difficulty":"C2","gloss":"In a listless manner; without energy or enthusiasm.","ipa":null,"sentence":"Some lean lazily against the side-posts, humming to themselves or calling to the passer-by in a raucous voice, and some listlessly read.","word_in_sentence":"listlessly","ko":"어떤 여자들은 문설주에 나른하게 기대어 혼자 콧노래를 부르거나 지나가는 사람에게 쉰 목소리로 소리를 지르고 있었고, 어떤 여자들은 무기력하게 책을 읽고 있었다.","chapter":47},{"lemma":"gutter","difficulty":"C1","gloss":"A prepared channel in a surface, especially at the side of a road adjacent to a curb, intended for the drainage of water.","ipa":"/ˈɡʌt.ɚ/","sentence":"Captain Nichols noticed Strickland for his size and his singular appearance among the crowd that waited for the doors to open; they waited listlessly, some walking to and fro, some leaning against the wall, and others seated on the curb with their feet in the gutter; and when they filed into the office he heard the monk who read his papers address him in English.","word_in_sentence":"gutter","ko":"니콜스 선장은 문이 열리기를 기다리는 군중 속에서 스트릭랜드의 체구와 독특한 외모 때문에 그를 눈여겨보았다. 사람들은 무기력하게 기다리고 있었는데, 어떤 이는 이리저리 걸어 다니고, 어떤 이는 벽에 기대어 있고, 또 어떤 이는 발을 시궁창에 담근 채 길가에 앉아 있었다. 그리고 그들이 줄지어 사무실로 들어갈 때, 그의 서류를 읽던 수사가 그에게 영어로 말을 거는 것을 들었다.","chapter":47},{"lemma":"pulpit","difficulty":"C1","gloss":"A raised platform in a church, usually enclosed, where the minister or preacher stands when giving the sermon.","ipa":"/ˈpʊlpɪt/","sentence":"But he did not have a chance to speak to him, since, as he entered the common-room, a monk came in with a huge Bible in his arms, mounted a pulpit which was at the end of the room, and began the service which the wretched outcasts had to endure as the price of their lodging.","word_in_sentence":"pulpit","ko":"하지만 그와 말을 나눌 기회는 없었다. 공동실에 들어서자마자 한 수사가 거대한 성경을 품에 안고 들어와 방 끝에 있는 강단에 올라가서, 이 비참한 버림받은 자들이 잠자리의 대가로 견뎌야 하는 예배를 시작했기 때문이다.","chapter":47},{"lemma":"lodging","difficulty":"C1","gloss":"A place to live or lodge.","ipa":"/ˈlɑd͡ʒɪŋ/","sentence":"Their career was devoid of adventure, if by adventure you mean unexpected or thrilling incident, for their days were occupied in the pursuit of enough money to get a night’s lodging and such food as would stay the pangs of hunger.","word_in_sentence":"lodging","ko":"그들의 생활은 모험이라고는 전혀 없었다. 만약 모험을 예상치 못한 흥미진진한 사건이라고 한다면 말이다. 그들의 하루는 하룻밤 잘 곳과 굶주림의 고통을 달랠 만한 음식을 구할 돈을 찾는 일로 채워졌기 때문이다.","chapter":47},{"lemma":"stalwart","difficulty":"C1","gloss":"Firmly or solidly built.","ipa":"/ˈstɔːl.wət/","sentence":"He and Strickland were assigned to different rooms, and when, thrown out of bed at five in the morning by a stalwart monk, he had made his bed and washed his face, Strickland had already disappeared.","word_in_sentence":"stalwart","ko":"그와 스트릭랜드는 서로 다른 방에 배정되었고, 새벽 다섯 시에 건장한 수사에게 침대에서 쫓겨나 잠자리를 정리하고 세수를 마쳤을 때, 스트릭랜드는 이미 사라진 후였다.","chapter":47},{"lemma":"congregate","difficulty":"C1","gloss":"To collect into an assembly or assemblage; to bring into one place, or into a united body.","ipa":"/ˈkɒŋɡɹəɡeɪt/","sentence":"Captain Nichols wandered about the streets for an hour of bitter cold, and then made his way to the Place Victor Gélu, where the sailor-men are wont to congregate.","word_in_sentence":"congregate","ko":"니콜스 선장은 혹독한 추위 속에서 한 시간 동안 거리를 헤맸고, 그러고 나서 선원들이 모이기 마련인 빅토르 젤뤼 광장으로 향했다.","chapter":47},{"lemma":"doze","difficulty":"C1","gloss":"To sleep lightly or briefly; to nap, snooze.","ipa":"/doʊz/","sentence":"Dozing against the pedestal of a statue, he saw Strickland again.","word_in_sentence":"Dozing","ko":"동상 받침대에 기대어 졸고 있는 스트릭랜드를 다시 발견했다.","chapter":47},{"lemma":"awaken","difficulty":"C1","gloss":"To cause to become awake.","ipa":"/əˈweɪkən/","sentence":"He gave him a kick to awaken him.","word_in_sentence":"awaken","ko":"그는 그를 깨우려고 발로 찼다.","chapter":47},{"lemma":"scramble","difficulty":"C1","gloss":"To move hurriedly to a location, especially by using all limbs against a surface.","ipa":"/ˈskɹæmbl̩/","sentence":"No one went near the plantation, for, as you know, the natives have a very lively horror of the disease, and in the old days when it was discovered the sufferer was killed; but sometimes, when the village boys were scrambling about the hills, they would catch sight of the white man, with his great red beard, wandering about.","word_in_sentence":"scrambling","ko":"아무도 농장 근처에 가지 않았는데, 아시다시피 원주민들은 그 병에 대해 매우 생생한 공포를 갖고 있어서 옛날에는 환자가 발견되면 죽여버렸기 때문이었다. 하지만 가끔 마을 소년들이 언덕을 뛰어다니다가 커다란 붉은 수염을 기른 그 백인이 돌아다니는 모습을 목격하곤 했다.","chapter":55},{"lemma":"companionship","difficulty":"C1","gloss":"The state of having or being a companion.","ipa":"/kəmˈpænjənʃɪp/","sentence":"So they had breakfast, and so began the queer companionship of Charles Strickland and Captain Nichols.","word_in_sentence":"companionship","ko":"그렇게 그들은 아침을 먹었고, 그렇게 찰스 스트릭랜드와 니콜스 선장의 기묘한 동반자 관계가 시작되었다.","chapter":47},{"lemma":"racy","difficulty":"C1","gloss":"Mildly risqué.","ipa":"/ˈɹeɪsi/","sentence":"But I wish I could give here the pictures, coloured and racy, which Captain Nichols’ vivid narrative offered to the imagination.","word_in_sentence":"racy","ko":"하지만 니콜스 선장의 생생한 이야기가 상상력에 제공했던 그 다채롭고 흥미진진한 그림들을 여기서 보여줄 수 있다면 좋겠다.","chapter":47},{"lemma":"multicoloure","difficulty":"C2","gloss":{"en":"To be of many colors.","ko":"색다르다","zh":"多彩的"},"ipa":"","sentence":"I received the impression of a life intense and brutal, savage, multicoloured, and vivacious.","word_in_sentence":"multicoloured","ko":"나는 강렬하고 잔혹하며, 야만적이고 다채로우며 생기 넘치는 삶의 인상을 받았다.","chapter":47},{"lemma":"vivacious","difficulty":"C1","gloss":"Lively and animated; full of life and energy.","ipa":"/vaɪˈveɪʃəs/","sentence":"I received the impression of a life intense and brutal, savage, multicoloured, and vivacious.","word_in_sentence":"vivacious","ko":"나는 강렬하고 잔혹하며, 야만적이고 다채로우며 생기 넘치는 삶의 인상을 받았다.","chapter":47},{"lemma":"mulatto","difficulty":"C1","gloss":"A person of mixed black and white descent, especially a person with one black and one white parent or two mulatto parents.","ipa":"/mʊˈlɑtoʊ/","sentence":"Strickland had downed the mulatto twice, and the mulatto, sober, was a man to be reckoned with.","word_in_sentence":"mulatto","ko":"스트릭랜드가 그 혼혈아를 두 번이나 쓰러뜨렸는데, 술이 깬 그 혼혈아는 만만치 않은 상대였다.","chapter":47},{"lemma":"mariner","difficulty":"C1","gloss":"Synonym of sailor, particularly one on a maritime vessel.","ipa":"/ˈmæɹɪnə/","sentence":"This was the master of a sailors’ boarding-house, a huge mulatto with a heavy fist, who gave the stranded mariner food and shelter till he found him a berth.","word_in_sentence":"mariner","ko":"그는 선원 하숙집 주인으로, 거대한 혼혈인이었는데 주먹이 무거웠고, 좌초된 선원들에게 일자리를 찾아줄 때까지 음식과 잠자리를 제공해주었다.","chapter":47},{"lemma":"berth","difficulty":"C1","gloss":"A place for a vessel to lie at anchor or to moor.","ipa":"/bɜːθ/","sentence":"Twice Strickland refused a berth on tramps sailing for the United States, and once on a collier going to Newcastle.","word_in_sentence":"berth","ko":"스트릭랜드는 미국으로 가는 화물선의 일자리를 두 번 거절했고, 뉴캐슬로 가는 석탄선의 일자리도 한 번 거절했다.","chapter":47},{"lemma":"slatternly","difficulty":"C2","gloss":"Appropriate to or characteristic of a slattern.","ipa":null,"sentence":"He was married to an American woman, obese and slatternly, fallen to this pass by Heaven knows what process of degradation, and every day the boarders took it in turns to help her with the housework.","word_in_sentence":"slatternly","ko":"그는 미국인 여자와 결혼했는데, 비만하고 단정치 못한 여자로 하늘만이 아는 어떤 타락의 과정을 거쳐 이런 처지에 떨어진 사람이었고, 매일 하숙생들이 돌아가며 그녀의 집안일을 도왔다.","chapter":47},{"lemma":"boarder","difficulty":"C1","gloss":"A pupil who lives at school during term time.","ipa":"/ˈbɔədə/","sentence":"He was married to an American woman, obese and slatternly, fallen to this pass by Heaven knows what process of degradation, and every day the boarders took it in turns to help her with the housework.","word_in_sentence":"boarders","ko":"그는 미국인 여자와 결혼했는데, 비만하고 단정치 못한 여자로 하늘만이 아는 어떤 타락의 과정을 거쳐 이런 처지에 떨어진 사람이었고, 매일 하숙생들이 돌아가며 그녀의 집안일을 도왔다.","chapter":47},{"lemma":"smuggle","difficulty":"C1","gloss":"To import or export, illicitly or by stealth, without paying lawful customs charges or duties","ipa":"/ˈsmʌɡəl/","sentence":"Tough Bill not only paid for the canvas, colours, and brushes, but gave Strickland a pound of smuggled tobacco into the bargain.","word_in_sentence":"smuggled","ko":"터프 빌은 캔버스와 물감, 붓값을 지불했을 뿐만 아니라 덤으로 밀수 담배 1파운드까지 스트릭랜드에게 주었다.","chapter":47},{"lemma":"adorn","difficulty":"C1","gloss":"To make more beautiful and attractive; to decorate.","ipa":"/əˈdɔɹn/","sentence":"For all I know, this picture may still adorn the parlour of the tumbledown little house somewhere near the Quai de la Joliette, and I suppose it could now be sold for fifteen hundred pounds.","word_in_sentence":"adorn","ko":"내가 아는 한, 이 그림은 아직도 케 드 라 졸리에트 근처 어딘가에 있는 허름한 작은 집 응접실을 장식하고 있을지도 모르며, 지금이라면 1500파운드에 팔릴 수 있을 것이다.","chapter":47},{"lemma":"tumbledown","difficulty":"C2","gloss":"In disrepair; poorly maintained.","ipa":null,"sentence":"For all I know, this picture may still adorn the parlour of the tumbledown little house somewhere near the Quai de la Joliette, and I suppose it could now be sold for fifteen hundred pounds.","word_in_sentence":"tumbledown","ko":"내가 아는 한, 이 그림은 아직도 케 드 라 졸리에트 근처 어딘가에 있는 허름한 작은 집 응접실을 장식하고 있을지도 모르며, 지금이라면 1500파운드에 팔릴 수 있을 것이다.","chapter":47},{"lemma":"encircle","difficulty":"C1","gloss":"To surround, form a circle around.","ipa":"[n̩.sɹ̩.kɫ̩]","sentence":"I do not know how he had come upon the notion of going to the South Seas, though I remember that his imagination had long been haunted by an island, all green and sunny, encircled by a sea more blue than is found in Northern latitudes.","word_in_sentence":"encircled","ko":"그가 어떻게 남태평양으로 가겠다는 생각을 하게 되었는지는 모르겠지만, 온통 푸르고 햇살 가득한, 북방 지역에서는 볼 수 없는 더욱 푸른 바다에 둘러싸인 섬이 오랫동안 그의 상상을 사로잡고 있었다는 것은 기억한다.","chapter":47},{"lemma":"cling","difficulty":"C1","gloss":"Fruit (especially peach) whose flesh adheres strongly to the pit.","ipa":"/ˈklɪŋ/","sentence":"I suppose that he clung to Captain Nichols because he was acquainted with those parts, and it was Captain Nichols who persuaded him that he would be more comfortable in Tahiti.","word_in_sentence":"clung","ko":"그가 니콜스 선장에게 매달린 것은 선장이 그 지역 사정에 밝았기 때문이었고, 타히티에서 더 편안하게 지낼 수 있을 것이라고 설득한 것도 니콜스 선장이었다.","chapter":47},{"lemma":"stoker","difficulty":"C1","gloss":"A person who stokes, especially one on a steamship or steam train, who stokes coal in the boilers.","ipa":"/ˈstoʊkɚ/","sentence":"A ship bound for Australia had sent to the Sailors’ Home for a stoker in place of one who had thrown himself overboard off Gibraltar in an attack of delirium tremens.","word_in_sentence":"stoker","ko":"호주행 배 한 척이 선원의 집에 화부 한 명을 요청해왔는데, 기존 화부가 지브롤터 앞바다에서 진전섬망 발작을 일으켜 바다에 뛰어들었기 때문이었다.","chapter":47},{"lemma":"providentially","difficulty":"C2","gloss":"In a providential manner.","ipa":null,"sentence":"Strickland had no papers, but that was not a matter to disconcert Tough Bill when he saw a profit (he took the first month’s wages of the sailor for whom he found a berth), and he provided Strickland with those of an English stoker who had providentially died on his hands.","word_in_sentence":"providentially","ko":"스트릭랜드는 신분증명서가 없었지만, 이익이 보이면(그는 일자리를 구해주는 선원의 첫 달 임금을 가져갔다) 터프 빌이 당황할 일은 아니었고, 그는 마침 손에서 죽어준 영국인 화부의 서류를 스트릭랜드에게 제공했다.","chapter":47},{"lemma":"tramp","difficulty":"C1","gloss":"A homeless person; a vagabond.","ipa":"/tɹæmp/","sentence":"He arrived at Taravao, and for the last time tramped the seven kilometres that led to Ata’s house.","word_in_sentence":"tramped","ko":"그는 타라바오에 도착해서, 아타의 집으로 이어지는 7킬로미터 길을 마지막으로 걸어갔다.","chapter":56},{"lemma":"collier","difficulty":"C1","gloss":"A person who produces (e.g., digs, mines, gathers) or sells coal (the fossil fuel type), or transports it from underground, from the soil, or from a seashore.","ipa":"/ˈkɑliɚ/","sentence":"Twice Strickland refused a berth on tramps sailing for the United States, and once on a collier going to Newcastle.","word_in_sentence":"collier","ko":"스트릭랜드는 미국으로 가는 화물선의 일자리를 두 번 거절했고, 뉴캐슬로 가는 석탄선의 일자리도 한 번 거절했다.","chapter":47},{"lemma":"obstinacy","difficulty":"C2","gloss":"The state, or an act, of stubbornness or doggedness.","ipa":"/ˈɑbstɪnəsi/","sentence":"Tough Bill had no patience with an obstinacy which could only result in loss to himself, and on the last occasion he flung both Strickland and Captain Nichols out of his house without more ado.","word_in_sentence":"obstinacy","ko":"터프 빌은 자신의 손해로만 이어질 고집을 참을 수 없었고, 마지막에는 스트릭랜드와 니콜스 선장을 더 이상의 말없이 집에서 내쫓아버렸다.","chapter":47},{"lemma":"adrift","difficulty":"C1","gloss":"Floating at random.","ipa":"/əˈdɹɪft/","sentence":"They found themselves once more adrift.","word_in_sentence":"adrift","ko":"그들은 다시 한번 떠돌이 신세가 되었다.","chapter":47},{"lemma":"sustenance","difficulty":"C1","gloss":"Something that provides support or nourishment.","ipa":"/ˈsʌs.tə.nəns/","sentence":"The Cuillère de Soupe and the Asile de Nuit were both closed to them, and their only sustenance was the wedge of bread which the Bouchée de Pain provided.","word_in_sentence":"sustenance","ko":"퀴예르 드 수프와 아질 드 뉘 모두 그들에게는 문이 닫혀 있었고, 유일한 끼니는 부셰 드 팽에서 주는 빵 한 조각뿐이었다.","chapter":47},{"lemma":"siding","difficulty":"C1","gloss":"A building material which covers and protects the sides of a house or other building.","ipa":"/ˈsaɪdɪŋ/","sentence":"They slept where they could, sometimes in an empty truck on a siding near the station, sometimes in a cart behind a warehouse; but it was bitterly cold, and after an hour or two of uneasy dozing they would tramp the streets again.","word_in_sentence":"siding","ko":"그들은 잠잘 곳이 있으면 어디든 잤는데, 때로는 역 근처 측선의 빈 화차에서, 때로는 창고 뒤편의 수레에서 잤다. 하지만 몹시 추웠고, 한두 시간 불안하게 졸고 나면 다시 거리를 헤매야 했다.","chapter":47},{"lemma":"dozing","difficulty":"C1","gloss":"present participle and gerund of doze","ipa":null,"sentence":"They slept where they could, sometimes in an empty truck on a siding near the station, sometimes in a cart behind a warehouse; but it was bitterly cold, and after an hour or two of uneasy dozing they would tramp the streets again.","word_in_sentence":"dozing","ko":"그들은 잠잘 곳이 있으면 어디든 잤는데, 때로는 역 근처 측선의 빈 화차에서, 때로는 창고 뒤편의 수레에서 잤다. 하지만 몹시 추웠고, 한두 시간 불안하게 졸고 나면 다시 거리를 헤매야 했다.","chapter":47},{"lemma":"promenader","difficulty":"C2","gloss":"Agent noun of promenade; one who promenades.","ipa":null,"sentence":"What they felt the lack of most bitterly was tobacco, and Captain Nichols, for his part, could not do without it; he took to hunting the “Can o’ Beer,” for cigarette-ends and the butt-end of cigars which the promenaders of the night before had thrown away.","word_in_sentence":"promenaders","ko":"그들이 가장 절실하게 그리워한 것은 담배였는데, 니콜스 선장은 특히 담배 없이는 견딜 수 없었다. 그는 \"깡 오 비어\"를 뒤져서 전날 밤 산책객들이 버린 담배꽁초와 시가 꽁초를 찾아다니기 시작했다.","chapter":47},{"lemma":"philosophic","difficulty":"C2","gloss":"Synonym of philosophical.","ipa":"/ˌfɪləˈsɒfɪk/","sentence":"“I’ve tasted worse smoking mixtures in a pipe,” he added, with a philosophic shrug of his shoulders, as he took a couple of cigars from the case I offered him, putting one in his mouth and the other in his pocket.","word_in_sentence":"philosophic","ko":"\"파이프에 넣고 피워본 담배 중에 이것보다 맛없는 것도 있었어.\" 그는 철학적인 어깨짓을 하며 덧붙였다. 내가 내민 시가 케이스에서 두 개비를 꺼내어 하나는 입에 물고 다른 하나는 주머니에 넣으면서 말이다.","chapter":47},{"lemma":"scrape","difficulty":"C1","gloss":"To draw (an object, especially a sharp or angular one), along (something) while exerting pressure.","ipa":"/skɹeɪp/","sentence":"Sometimes a mail steamer would come in, and Captain Nichols, having scraped acquaintance with the timekeeper, would succeed in getting the pair of them a job as stevedores.","word_in_sentence":"scraped","ko":"때로는 우편선이 들어오면, 니콜스 선장이 시간 관리원과 안면을 트고 둘 다 부두 노동자 일자리를 얻는 데 성공하곤 했다.","chapter":47},{"lemma":"timekeeper","difficulty":"C2","gloss":"A device that shows the time; a timepiece.","ipa":null,"sentence":"Sometimes a mail steamer would come in, and Captain Nichols, having scraped acquaintance with the timekeeper, would succeed in getting the pair of them a job as stevedores.","word_in_sentence":"timekeeper","ko":"때로는 우편선이 들어오면, 니콜스 선장이 시간 관리원과 안면을 트고 둘 다 부두 노동자 일자리를 얻는 데 성공하곤 했다.","chapter":47},{"lemma":"stevedore","difficulty":"C2","gloss":"A dockworker involved in loading and unloading cargo, or in supervising such work.","ipa":"/ˈstiːvəˌdɔː(ɹ)/","sentence":"Sometimes a mail steamer would ong the rest.","word_in_sentence":"niggardly","ko":"이 부랑자들은 인색하지 않았고, 돈이 있는 자는 주저 없이 나머지 사람들과 나누어 가졌다.","chapter":47},{"lemma":"storeye","difficulty":"C2","gloss":{"en":"To store or keep something.","ko":"보관하다","zh":"储存"},"ipa":"","sentence":"The Rue Bouterie is a narrow street of one-storeyed houses, each house consisting of but one room; they are like the booths in a crowded fair or the cages of animals in a circus.","word_in_sentence":"storeyed","ko":"부테리 거리는 단층집들이 늘어선 좁은 길인데, 각 집은 방 하나로만 이루어져 있었다. 마치 붐비는 장터의 노점이나 서커스의 동물 우리 같았다.","chapter":47},{"lemma":"raucous","difficulty":"C1","gloss":"Harsh and rough-sounding.","ipa":"/ˈɹɔkəs/","sentence":"Some lean lazily against the side-posts, humming to themselves or calling to the passer-by in a raucous voice, and some listlessly read.","word_in_sentence":"raucous","ko":"어떤 여자들은 문설주에 나른하게 기대어 혼자 콧노래를 부르거나 지나가는 사람에게 쉰 목소리로 소리를 지르고 있었고, 어떤 여자들은 무기력하게 책을 읽고 있었다.","chapter":47},{"lemma":"smear","difficulty":"C1","gloss":"To spread (a substance, especially one that colours or is dirty) across a surface by rubbing.","ipa":"/smiɚ/","sentence":"Italian, Spanish, Japanese, coloured; some are fat and some are thin; and under the thick paint on their faces, the heavy smears on their eyebrows, and the scarlet of their lips, you see the lines of age and the scars of dissipation.","word_in_sentence":"smears","ko":"이탈리아, 스페인, 일본, 유색인종 여자들도 있고, 어떤 이는 뚱뚱하고 어떤 이는 말랐으며, 얼굴에 두껍게 바른 화장과 눈썹에 진하게 칠한 연지, 새빨간 입술 아래로 세월의 주름과 방탕한 삶의 상처가 드러나 보인다.","chapter":47},{"lemma":"dissipation","difficulty":"C1","gloss":"The act of dissipating or dispersing; a state of dispersion or separation; dispersion; waste.","ipa":"/ˌdɪsɪˈpeɪʃən/","sentence":"Italian, Spanish, Japanese, coloured; some are fat and some are thin; and under the thick paint on their faces, the heavy smears on their eyebrows, and the scarlet of their lips, you see the lines of age and the scars of dissipation.","word_in_sentence":"dissipation","ko":"이탈리아, 스페인, 일본, 유색인종 여자들도 있고, 어떤 이는 뚱뚱하고 어 gloss":"Not framed; not having a frame.","ipa":null,"sentence":"“There were a dozen pictures,” she told me, “but they were unframed, and nobody wanted them.","word_in_sentence":"unframed","ko":"\"그림이 열두 점 있었어요.\" 그녀가 내게 말했다. \"하지만 액자도 없었고, 아무도 원하지 않았죠.","chapter":49},{"lemma":"kindliness","difficulty":"C2","gloss":"The state of feeling kindly towards someone or something, or the actions inspired thereby.","ipa":null,"sentence":"Tall and extremely stout, she would have been of imposing presence if the great good-nature of her face had not made it impossible for her to express anything but kindliness.","word_in_sentence":"kindliness","ko":"키가 크고 극도로 뚱뚱했던 그녀는 위압적인 존재감을 풍겼을 텐데, 그녀 얼굴에 깃든 크나큰 선량함 때문에 친절함 외에는 아무것도 표현할 수 없어 보였다.","chapter":49},{"lemma":"fleshy","difficulty":"C1","gloss":"Of, related to, or resembling flesh.","ipa":"/ˈflɛʃi/","sentence":"Her arms were like legs of mutton, her breasts like giant cabbages; her face, broad and fleshy, gave you an impression of almost indecent nakedness, and vast chin succeeded to vast chin.","word_in_sentence":"fleshy","ko":"그녀의 팔은 양다리 같았고, 가슴은 거대한 양배추 같았다. 넓고 살찐 얼굴은 거의 외설스러울 정도로 적나라한 인상을 주었고, 거대한 턱 아래로 또 다른 거대한 턱이 이어졌다.","chapter":49},{"lemma":"indecent","difficulty":"C1","gloss":"Offensive to good taste.","ipa":"/ɪnˈdiːs(ə)nt/","sentence":"Her arms were like legs of mutton, her breasts like giant cabbages; her face, broad and fleshy, gave you an impression of almost indecent nakedness, and vast chin succeeded to vast chin.","word_in_sentence":"indecent","ko":"그녀의 팔은 양다리 같았고, 가슴은 거대한 양배추 같았다. 넓고 살찐 얼굴은 거의 외설스러울 정도로 적나라한 인상을 주었고, 거대한 턱 아래로 또 다른 거대한 턱이 이어졌다.","chapter":49},{"lemma":"nakedness","difficulty":"C1","gloss":"The state or condition of being naked; nudity; bareness; defenselessness; undisguisedness.","ipa":null,"sentence":"You saw man in the nakedness of his primeval instincts, and you were afraid, for you saw yourself.”","word_in_sentence":"nakedness","ko":"당신은 원시적 본능의 적나라한 모습 그대로의 인간을 보았고, 그래서 두려웠던 것이다. 당신 자신을 보았기 때문에.\"","chapter":57},{"lemma":"voluminously","difficulty":"C2","gloss":"In a voluminous manner.","ipa":null,"sentence":"They fell away voluminously into the capaciousness of her bosom.","word_in_sentence":"voluminously","ko":"턱들은 풍성하게 늘어져 그녀의 넓은 가슴팍 속으로 사라져갔다.","chapter":49},{"lemma":"capaciousness","difficulty":"C2","gloss":"The quality of being capacious.","ipa":null,"sentence":"They fell away voluminously into the capaciousness of her bosom.","word_in_sentence":"capaciousness","ko":"턱들은 풍성하게 늘어져 그녀의 넓은 가슴팍 속으로 사라져갔다.","chapter":49},{"lemma":"peal","difficulty":"C2","gloss":"A loud sound, or a succession of loud sounds, as of bells, thunder, cannon, shouts, laughter, of a multitude, etc.","ipa":"/piːl/","sentence":"Her laughter was the most catching I ever heard; it would begin, a low peal in her throat, and would grow louder and louder till her whole vast body shook.","word_in_sentence":"peal","ko":"그녀의 웃음소리는 내가 들어본 것 중 가장 전염성이 강했다. 목구멍 깊은 곳에서 낮게 울려 퍼지기 시작해서 점점 커져가다가 마침내 그녀의 거대한 몸 전체가 흔들릴 정도가 되었다.","chapter":49},{"lemma":"sociably","difficulty":"C2","gloss":"In a sociable manner; with free intercourse; conversibly; familiarly; as a companion.","ipa":null,"sentence":"From morning till night you saw her sitting on a low chair in the kitchen, surrounded by a Chinese cook and two or three native girls, giving her orders, chatting sociably with all and sundry, and tasting the savoury messes she devised.","word_in_sentence":"sociably","ko":"아침부터 밤까지 그녀는 부엌의 낮은 의자에 앉아 중국인 요리사 한 명과 원주민 소녀 두세 명에게 둘러싸인 채 지시를 내리고, 이런저런 사람들과 정겹게 수다를 떨며, 자신이 만들어낸 맛있는 요리들을 맛보고 있었다.","chapter":49},{"lemma":"sundry","difficulty":"C1","gloss":"More than one or two but not very many; a number of, several.","ipa":"/ˈsʌndɹi/","sentence":"From morning till night you saw her sitting on a low chair in the kitchen, surrounded by a Chinese cook and two or three native girls, giving her orders, chatting sociably with all and sundry, and tasting the savoury messes she devised.","word_in_sentence":"sundry","ko":"아침부터 밤까지 그녀는 부엌의 낮은 의자에 앉아 중국인 요리사 한 명과 원주민 소녀 두세 명에게 둘러싸인 채 지시를 내리고, 이런저런 사람들과 정겹게 수다를 떨며, 자신이 만들어낸 맛있는 요리들을 맛보고 있었다.","chapter":49},{"lemma":"adversity","difficulty":"C1","gloss":"The state of adverse conditions; state of misfortune or calamity.","ipa":"/ædˈvɝ.sɪ.ti/","sentence":"There was one man there who had fallen on adversity, and to him she had given board and lodging for several months.","word_in_sentence":"adversity","ko":"그곳에는 불운에 빠진 남자가 한 명 있었는데, 그녀는 그에게 몇 달 동안 숙식을 제공해 주었다.","chapter":49},{"lemma":"laundryman","difficulty":"C2","gloss":"A man who is in the business of laundering.","ipa":null,"sentence":"When the Chinese laundryman refused to wash for him without payment she had sent his things to be washed with hers.","word_in_sentence":"laundryman","ko":"중국인 세탁업자가 돈을 받지 않고는 그의 빨래를 해주지 않겠다고 하자, 그녀는 그의 옷가지들을 자신의 것과 함께 세탁소에 보냈다.","chapter":49},{"lemma":"affability","difficulty":"C2","gloss":"The state or quality of being affable, friendly, or approachable.","ipa":"/ˌæfəˈbɪlɪti/","sentence":"She used him with the same affability as those of her clients who paid their bills once a week.","word_in_sentence":"affability","ko":"그녀는 일주일에 한 번씩 숙박비를 내는 다른 손님들과 똑같이 친절하게 그를 대했다.","chapter":49},{"lemma":"inapt","difficulty":"C2","gloss":"Not apt.","ipa":"/ɪnˈæpt/","sentence":"Age and obesity had made her inapt for love, but she took a keen interest in the amatory affairs of the young.","word_in_sentence":"inapt","ko":"나이와 비만 때문에 그녀는 더 이상 연애에 적합하지 않았지만, 젊은이들의 연애사에는 깊은 관심을 보였다.","chapter":49},{"lemma":"amatory","difficulty":"C2","gloss":"Of or relating to love, especially sexual love.","ipa":"[ˈæ.məˌtɔɹ.i]","sentence":"Age and obesity had made her inapt for love, but she took a keen interest in the amatory affairs of the young.","word_in_sentence":"amatory","ko":"나이와 비만 때문에 그녀는 더 이상 연애에 적합하지 않았지만, 젊은이들의 연애사에는 깊은 관심을 보였다.","chapter":49},{"lemma":"venery","difficulty":"C2","gloss":"The hunting of wild animals.","ipa":"/ˈvɛnəɹi/","sentence":"She looked upon venery as the natural occupation for men and women, and was ever ready with precept and example from her own wide experience.","word_in_sentence":"venery","ko":"그녀는 연애를 남녀의 자연스러운 일로 여겼고, 자신의 풍부한 경험에서 나온 교훈과 실례를 들려주기를 언제나 마다하지 않았다.","chapter":49},{"lemma":"scented","difficulty":"C1","gloss":"Having a pleasant aroma.","ipa":null,"sentence":"But here there was not a sound, and the air was scented with the white flowers of the night.","word_in_sentence":"scented","ko":"하지만 여기서는 아무 소리도 없었고, 공기는 밤에 피는 하얀 꽃들의 향기로 가득했다.","chapter":53},{"lemma":"roam","difficulty":"C1","gloss":"To wander or travel freely and with no specific destination.","ipa":"/ɹəʊm/","sentence":"Tiaré—her father had called her by the name of the white, scented flower which, they tell you, if you have once smelt, will always draw you back to Tahiti in the end, however far you may have roamed—Tiaré remembered Strickland very well.","word_in_sentence":"roamed","ko":"티아레—그녀의 아버지가 하얀 향기로운 꽃의 이름을 따서 지어준 이름인데, 사람들 말로는 한 번이라도 그 향기를 맡으면 아무리 멀리 떠돌아다녀도 결국에는 타히티로 다시 돌아오게 된다고 한다—티아레는 스트릭랜드를 아주 잘 기억하고 있었다.","chapter":49},{"lemma":"birthplace","difficulty":"C1","gloss":"The location where a person was born.","ipa":"/ˈbɝθˌpleɪs/","sentence":"They are strangers in their birthplace, and the leafy lanes they have known from childhood or the populous streets in which they have played, remain but a place of passage.","word_in_sentence":"birthplace","ko":"그들은 태어난 곳에서조차 이방인이며, 어린 시절부터 알아온 나뭇잎 우거진 골목길이나 뛰어놀던 번화한 거리들도 그저 지나가는 장소일 뿐이다.","chapter":50},{"lemma":"populous","difficulty":"C1","gloss":"Having a large population.","ipa":"/ˈpɑpjələs/","sentence":"They are strangers in their birthplace, and the leafy lanes they have known from childhood or the populous streets in which they have played, remain but a place of passage.","word_in_sentence":"populous","ko":"그들은 태어난 곳에서조차 이방인이며, 어린 시절부터 알아온 나뭇잎 우거진 골목길이나 뛰어놀던 번화한 거리들도 그저 지나가는 장소일 뿐이다.","chapter":50},{"lemma":"strangeness","difficulty":"C1","gloss":"The state or quality of being strange, odd or weird.","ipa":null,"sentence":"Perhaps it is this sense of strangeness that sends men far and wide in the search for something permanent, to which they may attach themselves.","word_in_sentence":"strangeness","ko":"아마도 이런 이질감이 사람들로 하여금 자신이 매달릴 수 있는 영속적인 무언가를 찾아 사방팔방으로 떠나게 만드는 것일지도 모른다.","chapter":50},{"lemma":"atavism","difficulty":"C2","gloss":"The reappearance of an ancestral characteristic in an organism after several generations of absence; a throwback.","ipa":"/ˈætəˌvɪzəm/","sentence":"Perhaps some deep-rooted atavism urges the wanderer back to lands which his ancestors left in the dim beginnings of history.","word_in_sentence":"atavism","ko":"아마도 깊이 뿌리박힌 어떤 선조 회귀 본능이 방랑자를 역사의 어스름한 태초에 조상들이 떠났던 땅으로 되돌아가게 하는 것일지도 모른다.","chapter":50},{"lemma":"wanderer","difficulty":"C1","gloss":"someone connected with any number of soccer clubs known as the Wanderers.","ipa":null,"sentence":"Perhaps some deep-rooted atavism urges the wanderer back to lands which his ancestors left in the dim beginnings of history.","word_in_sentence":"wanderer","ko":"아마도 깊이 뿌리박힌 어떤 선조 회귀 본능이 방랑자를 역사의 어스름한 태초에 조상들이 떠났던 땅으로 되돌아가게 하는 것일지도 모른다.","chapter":50},{"lemma":"ancestor","difficulty":"C1","gloss":"One from whom a person is descended, whether on the father's or mother's side, at any distance of time; a progenitor; a forefather; a forebear.","ipa":"/ˈæn.sɛs.tɚ/","sentence":"Perhaps some deep-rooted atavism urges the wanderer back to lands which his ancestors left in the dim beginnings of history.","word_in_sentence":"ancestors","ko":"아마도 깊이 뿌리박힌 어떤 선조 회귀 본능이 방랑자를 역사의 어스름한 태초에 조상들이 떠났던 땅으로 되돌아가게 하는 것일지도 모른다.","chapter":50},{"lemma":"unassuming","difficulty":"C1","gloss":"Modest and having no pretensions or ostentation.","ipa":"/ʌnəˈsjuːmɪŋ/","sentence":"He was a Jew named Abraham, a blond, rather stout young man, shy and very unassuming; but he had remarkable gifts.","word_in_sentence":"unassuming","ko":"그는 아브라함이라는 이름의 유대인으로, 금발에 다소 뚱뚱한 젊은 남자였는데, 수줍음이 많고 매우 겸손했지만 뛰어난 재능을 지니고 있었다.","chapter":50},{"lemma":"brilliance","difficulty":"C1","gloss":"The quality of being exceptionally effulgent (giving off light).","ipa":"/ˈbɹɪljən(t)s/","sentence":"His brilliance was allowed by all.","word_in_sentence":"brilliance","ko":"그의 뛰어난 실력은 모든 사람이 인정하는 바였다.","chapter":50},{"lemma":"coveted","difficulty":"C1","gloss":"simple past and past participle of covet","ipa":"/ˈkʌvɪtɪd/","sentence":"In a few weeks the authorities received his resignation of the coveted position on the staff.","word_in_sentence":"coveted","ko":"몇 주 후 병원 당국은 그가 모두가 탐내던 스태프 자리를 사임한다는 통보를 받았다.","chapter":50},{"lemma":"rumour","difficulty":"C1","gloss":"British, Canada, New Zealand, Australia, and Ireland spelling of rumor.","ipa":"/ˈɹuːmə(ɹ)/","sentence":"It created profound astonishment, and wild rumours were current.","word_in_sentence":"rumours","ko":"그것은 깊은 충격을 불러일으켰고, 온갖 터무니없는 소문들이 돌았다.","chapter":50},{"lemma":"discreditable","difficulty":"C2","gloss":"Able to be discredited.","ipa":null,"sentence":"Whenever a man does anything unexpected, his fellows ascribe it to the most discreditable motives.","word_in_sentence":"discreditable","ko":"사람이 예상치 못한 행동을 할 때마다, 주변 사람들은 그것을 가장 불명예스러운 동기 탓으로 돌리기 마련이다.","chapter":50},{"lemma":"gabardine","difficulty":"C2","gloss":"A type of woolen cloth with a diagonal ribbed texture on one side.","ipa":"/ˈɡæbɚˌdin/","sentence":"One morning the tramp docked at Alexandria, and from the deck he looked at the city, white in the sunlight, and the crowd on the wharf; he saw the natives in their shabby gabardines, the blacks from the Soudan, the noisy throng of Greeks and Italians, the grave Turks in tarbooshes, the sunshine and the blue sky; and something happened to him.","word_in_sentence":"gabardines","ko":"어느 날 아침 화물선이 알렉산드리아에 정박했고, 갑판에서 그는 햇빛 속에 하얗게 빛나는 도시와 부두의 인파를 바라보았다. 남루한 가바딘을 입은 현지인들, 수단에서 온 흑인들, 시끄러운 그리스인과 이탈리아인 무리, 터부시를 쓴 근엄한 터키인들, 햇살과 푸른 하늘을 보았는데, 그때 그에게 무언가가 일어났다.","chapter":50},{"lemma":"tarboosh","difficulty":"C2","gloss":"A red felt or cloth cap with a tassel, worn in the Arab world; a fez.","ipa":"/tɑːˈbuːʃ/","sentence":"One morning the tramp docked at Alexandria, and from the deck he looked at the city, white in the sunlight, and the crowd on the wharf; he saw the natives in their shabby gabardines, the blacks from the Soudan, the noisy throng of Greeks and Italians, the grave Turks in tarbooshes, the sunshine and the blue sky; and something happened to him.","word_in_sentence":"tarbooshes","ko":"어느 날 아침 화물선이 알렉산드리아에 정박했고, 갑판에서 그는 햇빛 속에 하얗게 빛나는 도시와 부두의 인파를 바라보았다. 남루한 가바딘을 입은 현지인들, 수단에서 온 흑인들, 시끄러운 그리스인과 이탈리아인 무리, 터부시를 쓴 근엄한 터키인들, 햇살과 푸른 하늘을 보았는데, 그때 그에게 무언가가 일어났다.","chapter":50},{"lemma":"dissatisfied","difficulty":"C1","gloss":"Feeling or displaying disappointment or a lack of contentment.","ipa":"/dɪsˈsætɪsˌfaɪd/","sentence":"It was like a thunder-clap, he said, and then, dissatisfied with this, he said it was like a revelation.","word_in_sentence":"dissatisfied","ko":"벼락 같은 것이었다고 그는 말했다가, 이 표현에 만족하지 못해 계시 같은 것이었다고 했다.","chapter":50},{"lemma":"knighthood","difficulty":"C1","gloss":"An honour whereby one is made into a knight, and one can thereafter be called Sir.","ipa":null,"sentence":"I ran across him in the street and congratulated him on the knighthood with which his eminent services during the war had been rewarded.","word_in_sentence":"knighthood","ko":"길에서 우연히 그를 만나 전쟁 중 뛰어난 공로로 받은 기사 작위를 축하해 주었다.","chapter":50},{"lemma":"furnish","difficulty":"C1","gloss":"Material used to create an engineered product.","ipa":"/ˈfɝnɪʃ/","sentence":"He had a beautiful old house in Queen Anne Street, and being a man of taste he had furnished it admirably.","word_in_sentence":"furnished","ko":"그는 퀸 앤 스트리트에 아름다운 고택을 소유하고 있었는데, 취향이 좋은 사람답게 집을 훌륭하게 꾸며놓았다.","chapter":50},{"lemma":"admirably","difficulty":"C1","gloss":"In a way worthy of admiration.","ipa":"/ˈæd.mɪɹ.ə.bli/","sentence":"He had a beautiful old house in Queen Anne Street, and being a man of taste he had furnished it admirably.","word_in_sentence":"admirably","ko":"그는 퀸 앤 스트리트에 아름다운 고택을 소유하고 있었는데, 취향이 좋은 사람답게 집을 훌륭하게 꾸며놓았다.","chapter":50},{"lemma":"laughingly","difficulty":"C2","gloss":"With laughter or merriment.","ipa":null,"sentence":"When his wife, a tall, lovely creature in cloth of gold, had left us, I remarked laughingly on the change in his present circumstances from those when we had both been medical students.","word_in_sentence":"laughingly","ko":"금실로 짠 옷을 입은 키 크고 아름다운 그의 아내가 자리를 뜨자, 나는 우리가 둘 다 의대생이었던 시절과 지금 그의 처지가 얼마나 달라졌는지 웃으며 말했다.","chapter":50},{"lemma":"fiddle","difficulty":"C1","gloss":"A violin, a small unfretted stringed instrument with four strings tuned (lowest to highest) G-D-A-E, usually held against the chin, shoulder, chest or on the upper thigh and played with a bow (see also usage notes below).","ipa":"/ˈfɪd(ə)l/","sentence":"I always played second fiddle to him.","word_in_sentence":"fiddle","ko":"나는 항상 그의 들러리 노릇만 했다.","chapter":50},{"lemma":"halfpenny","difficulty":"C1","gloss":"(historical) A discontinued British coin worth half of one penny (old or new).","ipa":"/ˈheɪp(ə)ni/","sentence":"He’s got some twopenny-halfpenny job in the medical at Alexandria—sanitary officer or something like that.","word_in_sentence":"halfpenny","ko":"알렉산드리아 의료부에서 하찮은 일을 하고 있다더군—위생 담당관인가 뭔가 그런 거 말이야.","chapter":50},{"lemma":"sanitary","difficulty":"C1","gloss":"Of or relating to health.","ipa":"/ˈsænɪt(ə)ɹi/","sentence":"He’s got some twopenny-halfpenny job in the medical at Alexandria—sanitary officer or something like that.","word_in_sentence":"sanitary","ko":"알렉산드리아 의료부에서 하찮은 일을 하고 있다더군—위생 담당관인가 뭔가 그런 거 말이야.","chapter":50},{"lemma":"scrofulous","difficulty":"C2","gloss":"Of, related to, or suffering from scrofula (form of tuberculosis tending to cause enlarged lymph nodes and skin inflammation).","ipa":"/ˈskɹɒfjʊləs/","sentence":"I’m told he lives with an ugly old Greek woman and has half a dozen scrofulous kids.","word_in_sentence":"scrofulous","ko":"못생긴 늙은 그리스 여자와 살면서 병든 아이들을 대여섯 명이나 두고 있다고 들었어.","chapter":50},{"lemma":"luxuriously","difficulty":"C2","gloss":"In a manner that involves luxury; in an expensive or indulgent manner.","ipa":null,"sentence":"He puffed luxuriously at the long Corona he was smoking.","word_in_sentence":"luxuriously","ko":"그는 피우고 있던 긴 코로나 시가를 만족스럽게 빨아들였다.","chapter":50},{"lemma":"mingle","difficulty":"C1","gloss":"To intermix; to combine or join, as an individual or part, with other parts, but commonly so as to be distinguishable in the product.","ipa":"/ˈmɪŋ.ɡəl/","sentence":"Tiaré mingled French with English in her conversation, for she used both languages with equal facility.","word_in_sentence":"mingled","ko":"티아레는 대화할 때 프랑스어와 영어를 섞어서 썼는데, 두 언어 모두 똑같이 능숙하게 구사했다.","chapter":51},{"lemma":"unpleasing","difficulty":"C2","gloss":"Not pleasing; unpleasant.","ipa":"/ʌnˈpliːzɪŋ/","sentence":"She spoke them with a singing accent which was not unpleasing.","word_in_sentence":"unpleasing","ko":"그녀는 노래하듯 억양을 넣어 말했는데, 그것이 불쾌하지는 않았다.","chapter":51},{"lemma":"promiscuous","difficulty":"C1","gloss":"Made up of various disparate elements mixed together; of disorderly composition.","ipa":"/pɹəˈmɪs.kju.əs/","sentence":"She’s never been promiscuous like some of these girls—a captain or a first mate, yes, but she’s never been touched by a native.","word_in_sentence":"promiscuous","ko":"다른 아이들처럼 문란하지도 않아. 선장이나 일등항해사 정도야. 원주민한테는 손도 안 댔어.","chapter":51},{"lemma":"respecte","difficulty":"C2","gloss":{"en":"A feeling of great admiration for someone or something.","ko":"존경심","zh":"尊严"},"ipa":"","sentence":"Elle se respecte, vois-tu.","word_in_sentence":"respecte","ko":"Elle se respecte, vois-tu. (그녀는 자존심이 있거든, 알겠지.)","chapter":51},{"lemma":"purser","difficulty":"C2","gloss":"The person responsible for handling the accounts on a ship, or for dealing with the passengers on a ship or aircraft.","ipa":"/ˈpɝsɚ/","sentence":"The purser of the Oahu told me last journey that he hadn’t met a nicer girl in the islands.","word_in_sentence":"purser","ko":"오아후 호의 사무장이 지난번 항해에서 말 y","ko":"호텔 드 라 플뢰르의 응접실은 작은 방으로, 소형 피아노 한 대와 도장을 찍은 벨벳으로 덮인 마호가니 가구 한 벌이 벽을 따라 단정하게 배치되어 있었다.","chapter":51},{"lemma":"enlarge","difficulty":"C1","gloss":"To make (something) larger.","ipa":"/ɪnˈlɑːd͡ʒ/","sentence":"On round tables were photograph albums, and on the walls enlarged photographs of Tiaré and her first husband, Captain Johnson.","word_in_sentence":"enlarged","ko":"둥근 탁자 위에는 사진첩들이 놓여 있었고, 벽에는 티아레와 그녀의 첫 번째 남편인 존슨 선장의 확대 사진들이 걸려 있었다.","chapter":51},{"lemma":"wheezy","difficulty":"C2","gloss":"That wheezes.","ipa":"/ˈwiːzi/","sentence":"Still, though Tiaré was old and fat, on occasion we rolled back the Brussels carpet, brought in the maids and one or two friends of Tiaré’s, and danced, though now to the wheezy music of a gramaphone.","word_in_sentence":"wheezy","ko":"그래도 티아레가 늙고 뚱뚱해졌지만, 때때로 우리는 브뤼셀 카펫을 걷어내고 하녀들과 티아레의 친구 한두 명을 불러들여 춤을 췄다. 지금은 쌕쌕거리는 축음기 음악에 맞춰서 말이다.","chapter":51},{"lemma":"gramaphone","difficulty":"C2","gloss":{"en":"A device for playing gramophone records.","ko":"레코드 플레이어","zh":"背景机"},"ipa":"","sentence":"Still, though Tiaré was old and fat, on occasion we rolled back the Brussels carpet, brought in the maids and one or two friends of Tiaré’s, and danced, though now to the wheezy music of a gramaphone.","word_in_sentence":"gramaphone","ko":"그래도 티아레가 늙고 뚱뚱해졌지만, 때때로 우리는 브뤼셀 카펫을 걷어내고 하녀들과 티아레의 친구 한두 명을 불러들여 춤을 췄다. 지금은 쌕쌕거리는 축음기 음악에 맞춰서 말이다.","chapter":51},{"lemma":"verandah","difficulty":"C1","gloss":"Alternative spelling of veranda.","ipa":"/vəˈɹændə/","sentence":"Then together they went out on the verandah.","word_in_sentence":"verandah","ko":"그러고 나서 둘은 함께 베란다로 나갔다.","chapter":55},{"lemma":"tiare","difficulty":"C2","gloss":"A female given name. Used in Hawaii since the 1980s.","ipa":null,"sentence":"On the verandah the air was scented with the heavy perfume of the tiare, and overhead the Southern Cross shone in a cloudless sky.","word_in_sentence":"tiare","ko":"베란다에는 티아레 꽃의 진한 향기가 공기를 감쌌고, 머리 위로는 구름 한 점 없는 하늘에 남십자성이 빛나고 있었다.","chapter":51},{"lemma":"indulgently","difficulty":"C2","gloss":"In an indulgent manner.","ipa":null,"sentence":"Tiaré smiled indulgently as she remembered the gaiety of a time long passed.","word_in_sentence":"indulgently","ko":"티아레는 오래전 지나간 시절의 흥겨움을 떠올리며 너그럽게 미소 지었다.","chapter":51},{"lemma":"kilometre","difficulty":"C1","gloss":"An SI unit of length equal to 10³ metres. Symbol: km","ipa":"/kɪˈlɒmɪtə/","sentence":"He arrived at Taravao, and for the last time tramped the seven kilometres that led to Ata’s house.","word_in_sentence":"kilometres","ko":"그는 타라바오에 도착해서, 아타의 집으로 이어지는 7킬로미터 길을 마지막으로 걸어갔다.","chapter":56},{"lemma":"luxuriant","difficulty":"C2","gloss":"Abundant in growth or detail.","ipa":"/lʌɡˈzjʊəɹi.ənt/","sentence":"Ah, I wish I could make you see the enchantment of that spot, a corner hidden away from all the world, with the blue sky overhead and the rich, luxuriant trees.","word_in_sentence":"luxuriant","ko":"아, 그 장소의 매혹을 여러분이 볼 수 있게 해드릴 수 있다면 좋겠습니다. 온 세상으로부터 숨겨진 한 모퉁이, 머리 위로는 푸른 하늘이 있고 풍성하고 무성한 나무들이 있는 곳 말입니다.","chapter":53},{"lemma":"tropic","difficulty":"C1","gloss":"Either of the two parallels of latitude 23°26′ north and south of the equator; the farthest points at which the sun can be directly overhead; the boundaries of the torrid zone or tropics.","ipa":"/ˈtɹɒpɪk/","sentence":"Ata’s house stood about eight kilometres from the road that runs round the island, and you went to it along a winding pathway shaded by the luxuriant trees of the tropics.","word_in_sentence":"tropics","ko":"아타의 집은 섬을 둘러싸고 있는 길에서 8킬로미터쯤 떨어진 곳에 서 있었는데, 열대의 무성한 나무들이 그늘을 드리운 구불구불한 오솔길을 따라 가야 했다.","chapter":52},{"lemma":"bungalow","difficulty":"C1","gloss":"A single-storey house, typically with rooms all on one level, or sometimes also with upper rooms set into the roof space.","ipa":"/ˈbʌŋɡələʊ/","sentence":"It was a bungalow of unpainted wood, consisting of two small rooms, and outside was a small shed that served as a kitchen.","word_in_sentence":"bungalow","ko":"페인트칠을 하지 않은 목재로 지은 방갈로였 e.","word_in_sentence":"alligator","ko":"바로 뒤편에는 아보카도를 맺는 나무가 있었고, 사방에는 이 땅에 수입을 가져다주는 코코넛 나무들이 자라고 있었다.","chapter":52},{"lemma":"pear","difficulty":"C1","gloss":"An edible fruit produced by the pear tree, similar to an apple but typically elongated towards the stem.","ipa":"/pɛə/","sentence":"There was a tree just behind which bore alligator pears, and all about were the cocoa-nuts which gave the land its revenue.","word_in_sentence":"pears","ko":"바로 뒤편에는 아보카도를 맺는 나무가 있었고, 사방에는 이 땅에 수입을 가져다주는 코코넛 나무들이 자라고 있었다.","chapter":52},{"lemma":"croton","difficulty":"C2","gloss":"Any of various plants, of the genus Croton, that yield croton oil.","ipa":"/ˈkɹəʊtən/","sentence":"Ata’s father had planted crotons round his property, and they grew in coloured profusion, gay and brilliant; they fenced the land with flame.","word_in_sentence":"crotons","ko":"아타의 아버지는 자신의 땅 둘레에 크로톤을 심어놓았는데, 그것들이 화려한 색깔로 무성하게 자라나 밝고 찬란했다. 그 나무들이 불꽃처럼 땅을 둘러쌌다.","chapter":52},{"lemma":"transfix","difficulty":"C2","gloss":"To render motionless, by arousing terror, amazement or awe.","ipa":null,"sentence":"Then the natives would assemble with spears, and with much shouting would transfix the great startled things as they hurried down to the sea.","word_in_sentence":"transfix","ko":"그러면 원주민들이 창을 들고 모여들어 큰 소리를 지르며 바다로 서둘러 내려가는 놀란 큰 물고기들을 찔러 잡았다.","chapter":52},{"lemma":"scuttle","difficulty":"C1","gloss":"A container like an open bucket (usually to hold and carry coal).","ipa":"/ˈskʌt.l̩/","sentence":"Sometimes Strickland would go down to the reef, and come back with a basket of small, coloured fish that Ata would fry in cocoa-nut oil, or with a lobster; and sometimes she would make a savoury dish of the great land-crabs that scuttled away under your feet.","word_in_sentence":"scuttled","ko":"때로는 스트릭랜드가 산호초까지 내려가서 아타가 코코넛 기름에 튀겨줄 작고 색깔 고운 물고기들이나 바닷가재를 바구니에 담아 돌아오기도 했고, 때로는 아타가 발밑으로 재빨리 달아나는 큰 육지게로 맛있는 요리를 만들어주기도 했다.","chapter":52},{"lemma":"luscious","difficulty":"C1","gloss":"Sweet and pleasant; delicious.","ipa":"/ˈlʌʃəs/","sentence":"Up the mountain were wild-orange trees, and now and then Ata would go with two or three women from the village and return laden with the green, sweet, luscious fruit.","word_in_sentence":"luscious","ko":"산 위에는 야생 오렌지나무들이 있었는데, 가끔 아타는 마을의 여자 둘셋과 함께 올라가서 푸르고 달콤하고 즙이 많은 과일을 잔뜩 따가지고 돌아오곤 했다.","chapter":52},{"lemma":"swarm","difficulty":"C1","gloss":"A large number of insects, especially when in motion or (for bees) migrating to a new colony.","ipa":"/swɔɹm/","sentence":"He swarmed up a tree, and presently threw down a ripe nut.","word_in_sentence":"swarmed","ko":"그는 나무를 재빨리 올라가더니 곧 익은 열매 하나를 던져 내렸다.","chapter":55},{"lemma":"sunburned","difficulty":"C2","gloss":"Alternative form of sunburnt.","ipa":"/ˈsʌn.bɝnd/","sentence":"I saw a middle-aged Frenchman with a big black beard, streaked with gray, a sunburned face, and large, shining eyes.","word_in_sentence":"sunburned","ko":"나는 회색이 섞인 큰 검은 수염을 기른 중년의 프랑스인을 보았는데, 그는 햇볕에 그을린 얼굴과 크고 빛나는 눈을 하고 있었다.","chapter":53},{"lemma":"brunot","difficulty":"C2","gloss":{"en":"Used to express a strong sense of approval or agreement.","ko":"강하게 찬성","zh":"强烈赞同"},"ipa":"","sentence":"Brunot smiled and shrugged his shoulders—“enfin, when he went to live with the girl that Tiaré gave him, he asked me to go and see him.","word_in_sentence":"Brunot","ko":"브뤼노는 미소를 지으며 어깨를 으쓱했다. \"결국 그가 티아레가 소개해준 여자와 살러 갔을 때, 나에게 찾아와 달라고 부탁했어요.","chapter":53},{"lemma":"atoll","difficulty":"C1","gloss":"A type of island consisting of a ribbon reef that nearly or entirely surrounds a lagoon and supports, in most cases, one to many islets on the reef platform.","ipa":"/ˈætɒl/","sentence":"I live on an atoll, a low island, it is a strip of land surrounding a lagoon, and its beauty is the beauty of the sea and sky and the varied colour of the lagoon and the grace of the cocoa-nut trees; but the place where Strickland lived had the beauty of the Garden of Eden.","word_in_sentence":"atoll","ko":"나는 환초, 즉 낮은 섬에 사는데, 그곳은 석호를 둘러싼 땅의 띠 같은 곳이고, 그 아름다움은 바다와 하늘의 아름다움이며 석호의 다채로운 색깔과 야자나무의 우아함입니다. 하지만 스트릭랜드가 살던 곳은 에덴동산의 아름다움을 지니고 있었어요.","chapter":53},{"lemma":"enchantment","difficulty":"C1","gloss":"The act of enchanting or the feeling of being enchanted.","ipa":"/ɪnˈt͡ʃænt.mənt/","sentence":"Ah, I wish I could make you see the enchantment of that spot, a corner hidden away from all the world, with the blue sky overhead and the rich, luxuriant trees.","word_in_sentence":"enchantment","ko":"아, 그 장소의 매혹을 여러분이 볼 수 있게 해드릴 수 있다면 좋겠습니다. 온 세상으로부터 숨겨진 한 모퉁이, 머리 위로는 푸른 하늘이 있고 풍성하고 무성한 나무들이 있는 곳 말입니다.","chapter":53},{"lemma":"fragrant","difficulty":"C1","gloss":"Sweet-smelling; having a pleasant (usually strong) scent or fragrance.","ipa":"/ˈfɹeɪ.ɡɹənt/","sentence":"And it was fragrant and cool.","word_in_sentence":"fragrant","ko":"그곳은 향기롭고 시원했다.","chapter":53},{"lemma":"unmindful","difficulty":"C2","gloss":"Lacking awareness; oblivious.","ipa":null,"sentence":"And here he lived, unmindful of the world and by the world forgotten.","word_in_sentence":"unmindful","ko":"그리고 그는 이곳에서 세상을 잊고 살았고, 세상 또한 그를 잊었다.","chapter":53},{"lemma":"dilapidate","difficulty":"C2","gloss":"To cause to become ruined or put into disrepair.","ipa":"/dɪˈlæp.ɪ.deɪt/","sentence":"The house was dilapidated and none too clean.","word_in_sentence":"dilapidated","ko":"집은 낡아빠졌고 깨끗하지도 않았다.","chapter":53},{"lemma":"plait","difficulty":"C2","gloss":"A flat fold; a doubling, as of cloth; a pleat.","ipa":"/pleɪt/","sentence":"“A girl of fifteen, perhaps, was plaiting pandanus-leaf to make a hat, and an old woman was sitting on her haunches smoking a pipe.","word_in_sentence":"plaiting","ko":"열다섯 살쯤 되어 보이는 소녀가 판다누스 잎을 엮어 모자를 만들고 있었고, 나이 든 여자가 쪼그리고 앉아 파이프 담배를 피우고 있었다.","chapter":53},{"lemma":"pandanus","difficulty":"C2","gloss":"Any of various palm-like plants in the genus Pandanus.","ipa":"/pænˈdeɪnəs/","sentence":"She poured paraffin on the dry floors and on the pandanus-mats, and then she set fire.","word_in_sentence":"pandanus","ko":"그녀는 마른 바닥과 판다누스 매트에 파라핀을 부은 다음 불을 질렀다.","chapter":57},{"lemma":"haunch","difficulty":"C2","gloss":"The area encompassing the upper thigh, hip and buttocks on one side of a human, primate, or quadruped animal, especially one that can sit on its hindquarters.","ipa":"/hɔnt͡ʃ/","sentence":"She was sitting on her haunches in the lean-to that served her as kitchen, watching some mess cooking in a pot.","word_in_sentence":"haunches","ko":"그녀는 부엌으로 쓰는 쪽마루에 쪼그리고 앉아 냄비에서 끓고 있는 무언가를 지켜보고 있었다.","chapter":55},{"lemma":"suckle","difficulty":"C2","gloss":"A teat.","ipa":"/ˈsʌk.əl/","sentence":"She was suckling a new-born child, and another child, stark naked, was playing at her feet.","word_in_sentence":"suckling","ko":"그녀는 갓난아이에게 젖을 먹이고 있었고, 또 다른 아이는 발가벗은 채로 그녀의 발치에서 놀고 있었다.","chapter":53},{"lemma":"matted","difficulty":"C1","gloss":"simple past and past participle of mat","ipa":null,"sentence":"He was an extraordinary figure, with his red beard and matted hair, and his great hairy chest.","word_in_sentence":"matted","ko":"붉은 수염과 헝클어진 머리, 그리고 털이 무성한 넓은 가슴을 한 그의 모습은 기이했다.","chapter":53},{"lemma":"maliciously","difficulty":"C1","gloss":"In a malicious manner, or for malicious reasons.","ipa":null,"sentence":"He smiled maliciously at Tiaré, and with lamentations she told us again the story of how at the sale of Strickland’s effects she had neglected the pictures, but bought an American stove for twenty-seven francs.","word_in_sentence":"maliciously","ko":"그는 티아레를 향해 악의적으로 미소를 지었고, 티아레는 한탄하며 스트릭랜드의 유품 경매에서 그림들은 무시하고 미국제 난로를 27프랑에 샀던 이야기를 다시 들려주었다.","chapter":53},{"lemma":"marriageable","difficulty":"C2","gloss":"Suitable for marriage; nubile.","ipa":null,"sentence":"“Yes; I am keeping them till my daughter is of marriageable age, and then I shall sell them.","word_in_sentence":"marriageable","ko":"\"네, 딸이 결혼할 나이가 될 때까지 보관해두었다가 그때 팔 생각입니다.","chapter":53},{"lemma":"shrub","difficulty":"C1","gloss":"A woody plant smaller than a tree, and usually with several stems from the same base.","ipa":"/ʃɹʌb/","sentence":"When I was building my house in the Paumotus I had slept out for weeks on a harder bed than that, with nothing to shelter me but wild shrubs; and as for vermin, my tough skin should be proof against their malice.","word_in_sentence":"shrubs","ko":"파우모투 제도에 집을 지을 때 나는 몇 주 동안 그보다 더 딱딱한 침상에서 잠을 잤고, 야생 관목 외에는 몸을 가릴 것도 없었으니까요. 벌레들이야 내 거친 피부로는 그들의 악의를 막아낼 수 있을 테고 말입니다.","chapter":53},{"lemma":"vermin","difficulty":"C1","gloss":"Any of various common types of small insects or other animals which cause harm and annoyance.","ipa":"/ˈvɝmɪn/","sentence":"When I was building my house in the Paumotus I had slept out for weeks on a harder bed than that, with nothing to shelter me but wild shrubs; and as for vermin, my tough skin should be proof against their malice.","word_in_sentence":"vermin","ko":"파우모투 제도에 집을 지을 때 나는 몇 주 동안 그보다 더 딱딱한 침상에서 잠을 잤고, 야생 관목 외에는 몸을 가릴 것도 없었으니까요. 벌레들이야 내 거친 피부로는 그들의 악의를 막아낼 수 있을 테고 말입니다.","chapter":53},{"lemma":"concertina","difficulty":"C2","gloss":"A musical instrument, like the various accordions, that is a member of the free-reed family of musical instruments, typically having buttons on both ends.","ipa":"/ˌkɑnsɚˈtinə/","sentence":"The young man had a concertina, and he played the tunes popular on the music-halls a dozen years before.","word_in_sentence":"concertina","ko":"젊은이가 아코디언을 가지고 있어서 십여 년 전 뮤직홀에서 유행했던 곡들을 연주했습니다.","chapter":53},{"lemma":"yawning","difficulty":"C1","gloss":"present participle and gerund of yawn","ipa":"/ˈjɔːnɪŋ/","sentence":"Presently, after loud yawning, the natives went away to sleep, and Strickland and I were left alone.","word_in_sentence":"yawning","ko":"얼마 후 원주민들이 큰 하품을 하며 잠자리에 들어가자, 스트릭랜드와 나만 남게 되었다.","chapter":53},{"lemma":"stillness","difficulty":"C1","gloss":"The quality or state of being still.","ipa":"/ˈstɪlnəs/","sentence":"On my island in the Paumotus there is never at night the complete stillness that there was here.","word_in_sentence":"stillness","ko":"파우모투 제도에 있는 내 섬에서는 밤에도 여기만큼 완전한 고요함은 결코 없다.","chapter":53},{"lemma":"rustle","difficulty":"C1","gloss":"A soft crackling sound similar to the movement of dry leaves.","ipa":"/ˈɹʌsəl/","sentence":"There is the rustle of the myriad animals on the beach, all the little shelled things that crawl about ceaselessly, and there is the noisy scurrying of the land-crabs.","word_in_sentence":"rustle","ko":"해변에는 무수한 동물들이 바스락거리는 소리가 있고, 끊임없이 기어다니는 온갖 조개껍데기를 가진 작은 생물들이 있으며, 육지게들이 시끄럽게 뛰어다니는 소리가 있다.","chapter":53},{"lemma":"myriad","difficulty":"C1","gloss":"Ten thousand; 10,000","ipa":"/ˈmɪɹi.æd/","sentence":"There is the rustle of the myriad animals on the beach, all the little shelled things that crawl about ceaselessly, and there is the noisy scurrying of the land-crabs.","word_in_sentence":"myriad","ko":"해변에는 무수한 동물들이 바스락거리는 소리가 있고, 끊임없이 기어다니는 온갖 조개껍데기를 가진 작은 생물들이 있으며, 육지게들이 시끄럽게 뛰어다니는 소리가 있다.","chapter":53},{"lemma":"ceaselessly","difficulty":"C2","gloss":"Without ceasing.","ipa":null,"sentence":"There is the rustle of the myriad animals on the beach, all the little shelled things that crawl about ceaselessly, and there is the noisy scurrying of the land-crabs.","word_in_sentence":"ceaselessly","ko":"해변에는 무수한 동물들이 바스락거리는 소리가 있고, 끊임없이 기어다니는 온갖 조개껍데기를 가진 작은 생물들이 있으며, 육지게들이 시끄럽게 뛰어다니는 소리가 있다.","chapter":53},{"lemma":"scurrying","difficulty":"C1","gloss":"present participle and gerund of scurry","ipa":null,"sentence":"There is the rustle of the myriad animals on the beach, all the little shelled things that crawl about ceaselessly, and there is the noisy scurrying of the land-crabs.","word_in_sentence":"scurrying","ko":"해변에는 무수한 동물들이 바스락거리는 소리가 있고, 끊임없이 기어다니는 온갖 조개껍데기를 가진 작은 생물들이 있으며, 육지게들이 시끄럽게 뛰어다니는 소리가 있다.","chapter":53},{"lemma":"leaping","difficulty":"C1","gloss":"present participle and gerund of leap","ipa":"/ˈliːpɪŋ/","sentence":"Now and then in the lagoon you hear the leaping of a fish, and sometimes a hurried noisy splashing as a brown shark sends all the other fish scampering for their lives.","word_in_sentence":"l
