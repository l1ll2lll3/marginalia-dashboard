sentence":"afresh","ko":"\"부인은 지금까지 일어난 모든 일을 잊고 새로 시작할 용의가 있습니다.","chapter":12},{"lemma":"reproach","difficulty":"C1","gloss":"A mild rebuke, or an implied criticism.","ipa":"/ɹɪˈpɹoʊt͡ʃ/","sentence":"He did not reproach her.","word_in_sentence":"reproach","ko":"그는 그녀를 비난하지 않았다.","chapter":28},{"lemma":"unmitigated","difficulty":"C1","gloss":"Not mitigated.","ipa":null,"sentence":"“You are a most unmitigated cad.”","word_in_sentence":"unmitigated","ko":"\"당신은 정말 구제불능의 비열한 인간입니다.\"","chapter":12},{"lemma":"seemly","difficulty":"C2","gloss":"Of behavior, appropriate; suited to the occasion or purpose; becoming.","ipa":"/ˈsiːmli/","sentence":"I dare say it would have been more seemly to decline this proposal.","word_in_sentence":"seemly","ko":"이런 제안을 거절하는 것이 더 체면에 맞았을 것이다.","chapter":13},{"lemma":"stout","difficulty":"C1","gloss":"Large; bulky.","ipa":"/staʊt/","sentence":"The doctor was a stout man in shabby clothes, and when he took off his hat I noticed that he was very bald.","word_in_sentence":"stout","ko":"의사는 남루한 옷을 입은 뚱뚱한 남자였는데, 모자를 벗었을 때 나는 그가 매우 대머리라는 것을 알아차렸다.","chapter":50},{"lemma":"peculiarly","difficulty":"C1","gloss":"To greater degree than is usual.","ipa":"/pɪˈkjuljɚli/","sentence":"But the fear of not being able to carry it through effectively has always made me shy of assuming the moral attitude; and in this case the certainty that my sentiments would be lost on Strickland made it peculiarly embarrassing to utter them.","word_in_sentence":"peculiarly","ko":"하지만 효과적으로 해낼 수 없을지도 모른다는 두려움 때문에 나는 늘 도덕적 자세를 취하는 것을 꺼려했고, 이 경우에는 내 감정이 스트릭랜드에게 전혀 통하지 않을 것이 확실했기에 그것을 입 밖에 내는 것이 특히 난처했다.","chapter":13},{"lemma":"liqueur","difficulty":"C1","gloss":"A flavored alcoholic beverage that is usually very sweet and contains a high percentage of alcohol.","ipa":"/lɪˈkjʊə/","sentence":"Then we went to a tavern to have coffee and liqueurs.","word_in_sentence":"liqueurs","ko":"그다음 우리는 커피와 리큐어를 마시러 선술집에 갔다.","chapter":13},{"lemma":"temperament","difficulty":"C1","gloss":"A person's usual manner of thinking, behaving or reacting.","ipa":"/ˈtɛm.pɚ.ə.mənt/","sentence":"It requires the feminine temperament to repeat the same thing three times with unabated zest.","word_in_sentence":"temperament","ko":"같은 말을 세 번 반복해도 열정이 식지 않으려면 여성적 기질이 필요하다.","chapter":13},{"lemma":"unabated","difficulty":"C1","gloss":"Continuing at full strength or intensity.","ipa":"/ʌn.əˈbeɪ.tɪd/","sentence":"It requires the feminine temperament to repeat the same thing three times with unabated zest.","word_in_sentence":"unabated","ko":"같은 말을 세 번 반복해도 열정이 식지 않으려면 여성적 기질이 필요하다.","chapter":13},{"lemma":"zest","difficulty":"C1","gloss":"The outer skin of a citrus fruit, used as a flavouring or garnish.","ipa":"/zɛst/","sentence":"It requires the feminine temperament to repeat the same thing three times with unabated zest.","word_in_sentence":"zest","ko":"같은 말을 세 번 반복해도 열정이 식지 않으려면 여성적 기질이 필요하다.","chapter":13},{"lemma":"solace","difficulty":"C1","gloss":"Comfort or consolation in a time of loneliness or distress.","ipa":"/ˈsɒl.ɪs/","sentence":"I solaced myself by thinking that it would be useful for me to find out what I could about Strickland’s state of mind.","word_in_sentence":"solaced","ko":"나는 스트릭랜드의 심리 상태에 대해 알아낼 수 있는 것들을 찾아보는 일이 내게 도움이 될 거라고 생각하며 스스로를 위로했다.","chapter":13},{"lemma":"talker","difficulty":"C1","gloss":"A person who talks, especially one who gives a speech, or is loquacious or garrulous.","ipa":null,"sentence":"But this was not an easy thing to do, for Strickland was not a fluent talker.","word_in_sentence":"talker","ko":"하지만 이는 쉬운 일이 아니었는데, 스트릭랜드가 말을 유창하게 하는 사람이 아니었기 때문이다.","chapter":13},{"lemma":"hackneyed","difficulty":"C2","gloss":"Repeated too often.","ipa":"/ˈhækniːd/","sentence":"To use the hackneyed phrase, here he found himself.","word_in_sentence":"hackneyed","ko":"진부한 표현을 쓰자면, 여기서 그는 자기 자신을 찾았다.","chapter":45},{"lemma":"sincerity","difficulty":"C1","gloss":"The quality or state of being sincere.","ipa":"/sɪnˈsɛɹəti/","sentence":"Perhaps it was sincerity.","word_in_sentence":"sincerity","ko":"아마도 그것은 진실함이었을 것이다.","chapter":13},{"lemma":"harlot","difficulty":"C1","gloss":"A female prostitute.","ipa":"/ˈhɑːlət/","sentence":"There were a number of harlots in the tavern: some were sitting with men, others by themselves; and presently I noticed that one of these was looking at us.","word_in_sentence":"harlots","ko":"선술집에는 여러 명의 창녀들이 있었는데, 어떤 이들은 남자들과 함께 앉아 있고 어떤 이들은 혼자 있었다. 그런데 곧 그중 한 명이 우리를 바라보고 있다는 것을 알아챘다.","chapter":13},{"lemma":"pidgin","difficulty":"C1","gloss":"An amalgamation of two disparate languages, used by two populations having no common language as a lingua franca to communicate with each other, lacking formalized grammar and having a small, utilitarian vocabulary and no native speakers.","ipa":"/ˈpɪ.d͡ʒən/","sentence":"She tried to talk to him, partly by signs, partly in pidgin French, which, for some reason, she thought would be more comprehensible to him, and she had half a dozen phrases of English.","word_in_sentence":"pidgin","ko":"그녀는 그와 이야기를 나누려 했는데, 부분적으로는 손짓으로, 부분적으로는 어떤 이유에서인지 그가 더 잘 알아들을 거라고 생각한 어설픈 프랑스어로, 그리고 영어 구문 서너 개를 써가며 말했다.","chapter":13},{"lemma":"eagerly","difficulty":"C1","gloss":"In an eager manner.","ipa":"/ˈiɡɚli/","sentence":"She made me translate what she could only express in her own tongue, and eagerly asked for the meaning of his replies.","word_in_sentence":"eagerly","ko":"그녀는 자기 말로만 표현할 수 있는 것들을 내가 번역해 달라고 했고, 그의 대답이 무슨 뜻인지 열심히 물어보았다.","chapter":13},{"lemma":"flattered","difficulty":"C1","gloss":"In a positive mood because of a comment or action which causes one to feel proud of oneself.","ipa":null,"sentence":"“I’m not flattered.”","word_in_sentence":"flattered","ko":"\"별로 기분 좋지 않아.\"","chapter":13},{"lemma":"pleasantly","difficulty":"C1","gloss":"In a pleasant manner; so as to achieve a pleasant result.","ipa":"/ˈplɛzəntli/","sentence":"Life was ordered too pleasantly.","word_in_sentence":"pleasantly","ko":"삶은 너무나 기분 좋게 정돈되어 있었다.","chapter":17},{"lemma":"ungracious","difficulty":"C2","gloss":"Not gracious; unkind or cold-hearted.","ipa":"/ʌnˈɡɹeɪʃəs/","sentence":"It seemed to me a little ungracious to decline an invitation of that sort, and I ascribed his refusal to lack of money.","word_in_sentence":"ungracious","ko":"그런 종류의 초대를 거절하는 것은 다소 무례한 일로 여겨졌고, 나는 그의 거절을 돈이 없기 때문이라고 생각했다.","chapter":13},{"lemma":"ascribe","difficulty":"C1","gloss":"To attribute (a cause or characteristic) to someone or something.","ipa":"/əˈskɹaɪb/","sentence":"Whenever a man does anything unexpected, his fellows ascribe it to the most discreditable motives.","word_in_sentence":"ascribe","ko":"사람이 예상치 못한 행동을 할 때마다, 주변 사람들은 그것을 가장 불명예스러운 동기 탓으로 돌리기 마련이다.","chapter":50},{"lemma":"impatiently","difficulty":"C1","gloss":"In an impatient manner.","ipa":"/ɪmˈpeɪʃəntli/","sentence":"I cried impatiently.","word_in_sentence":"impatiently","ko":"나는 조급하게 소리쳤다.","chapter":34},{"lemma":"redden","difficulty":"C2","gloss":"To become red or redder.","ipa":"/ˈɹɛdn̩/","sentence":"Perhaps she reddened under her paint.","word_in_sentence":"reddened","ko":"아마도 그녀는 화장 밑에서 얼굴이 빨갛게 달아올랐을 것이다.","chapter":13},{"lemma":"poli","difficulty":"C1","gloss":{"en":"A type of jellyfish.","ko":"연체류","zh":"海鞘动物"},"ipa":"","sentence":"“Monsieur n’est pas poli,” she said.","word_in_sentence":"poli","ko":"\"무슈는 예의가 없군요.\" 그녀가 말했다.","chapter":13},{"lemma":"distaste","difficulty":"C1","gloss":"A feeling of dislike, aversion or antipathy.","ipa":"/dɪsˈteɪst/","sentence":"There was a real distaste in his face, and yet it was the face of a coarse and sensual man.","word_in_sentence":"distaste","ko":"그의 얼굴에는 진짜 혐오감이 드러나 있었는데, 그럼에도 그것은 거칠고 관능적인 남자의 얼굴이었다.","chapter":13},{"lemma":"unsatisfactory","difficulty":"C1","gloss":"Inadequate, substandard or not satisfactory.","ipa":"/ˌʌnsætɪsˈfækt(ə)ɹi/","sentence":"I remember what he said about him because it was so unsatisfactory.","word_in_sentence":"unsatisfactory","ko":"그가 브뤼헐에 대해 한 말이 너무나 불만족스러웠기 때문에 나는 그것을 기억하고 있다.","chapter":44},{"lemma":"perplex","difficulty":"C2","gloss":"To cause to feel baffled; to puzzle.","ipa":"/pɚˈplɛks/","sentence":"Strickland perplexed me.","word_in_sentence":"perplexed","ko":"스트릭랜드는 나를 당황스럽게 했다.","chapter":14},{"lemma":"undoubted","difficulty":"C1","gloss":"Without doubt; without question; certain.","ipa":"/ʌnˈdaʊtɪd/","sentence":"I tried to persuade myself than an obscure feeling of revolt had been gradually coming to a head in his slow mind, but to challenge this was the undoubted fact that he had never shown any impatience with the monotony of his life.","word_in_sentence":"undoubted","ko":"그의 둔한 정신 속에서 막연한 반항심이 서서히 고조되어 왔다고 스스로를 설득해보려 했지만, 이에 반박하는 명백한 사실은 그가 자신의 단조로운 삶에 대해 한 번도 조바심을 보인 적이 없다는 것이었다.","chapter":14},{"lemma":"monotony","difficulty":"C1","gloss":"Tedium as a result of repetition or a lack of variety.","ipa":"/məˈnɑtəni/","sentence":"I tried to persuade myself than an obscure feeling of revolt had been gradually coming to a head in his slow mind, but to challenge this was the undoubted fact that he had never shown any impatience with the monotony of his life.","word_in_sentence":"monotony","ko":"그의 둔한 정신 속에서 막연한 반항심이 서서히 고조되어 왔다고 스스로를 설득해보려 했지만, 이에 반박하는 명백한 사실은 그가 자신의 단조로운 삶에 대해 한 번도 조바심을 보인 적이 없다는 것이었다.","chapter":14},{"lemma":"intolerable","difficulty":"C1","gloss":"Not tolerable; not capable of being borne or endured.","ipa":"/ɪnˈtɑləɹəbl̩/","sentence":"The thought of her suffering was intolerable.","word_in_sentence":"intolerable","ko":"그녀가 고통받았을 생각을 하니 견딜 수가 없었다.","chapter":39},{"lemma":"boredom","difficulty":"C1","gloss":"The state of being bored.","ipa":"/ˈbɔɹ.dəm/","sentence":"If, seized by an intolerable boredom, he had determined to be a painter merely to break with irksome ties, it would have been comprehensible, and commonplace; but commonplace is precisely what I felt he was not.","word_in_sentence":"boredom","ko":"만약 참을 수 없는 권태감에 사로잡혀 성가신 속박에서 벗어나려는 목적만으로 화가가 되기로 결심했다면, 그것은 이해할 만하고 평범한 일이었을 것이다. 하지만 평범함이야말로 그에게는 전혀 어울리지 않는다고 내가 느끼는 바였다.","chapter":14},{"lemma":"irksome","difficulty":"C2","gloss":"Marked by irritation or annoyance; disagreeable; troublesome by reason of long continuance or repetition","ipa":"/ˈɜɹksəm/","sentence":"It was irksome.","word_in_sentence":"irksome","ko":"그것은 성가신 것이었다.","chapter":43},{"lemma":"devise","difficulty":"C1","gloss":"To use one’s intellect to plan or design (something).","ipa":"/dɪˈvaɪz/","sentence":"I expect that Shakespeare devised Iago with a gusto which he never knew when, weaving moonbeams with his fancy, he imagined Desdemona.","word_in_sentence":"devised","ko":"셰익스피어가 달빛을 상상력으로 엮어 데스데모나를 창조할 때는 결코 느끼지 못했던 열정으로 이아고를 고안해냈으리라 생각한다.","chapter":41},{"lemma":"fetched","difficulty":"C1","gloss":"simple past and past participle of fetch","ipa":null,"sentence":"“All that seems to me very far-fetched,” she said acidly.","word_in_sentence":"fetched","ko":"\"그런 말씀은 모두 너무 억지스럽게 들립니다.\" 그녀가 신랄하게 말했다.","chapter":15},{"lemma":"relentlessly","difficulty":"C1","gloss":"In a relentless manner.","ipa":"/ɹɪˈlɛntləsli/","sentence":"It was this: I asked myself whether there was not in his soul some deep-rooted instinct of creation, which the circumstances of his life had obscured, but which grew relentlessly, as a cancer may grow in the living tissues, till at last it took possession of his whole being and forced him irresistibly to action.","word_in_sentence":"relentlessly","ko":"그것은 이런 것이었다. 나는 그의 영혼 깊숙한 곳에 창조의 본능이 뿌리박혀 있었던 것은 아닐까 하고 자문해보았다. 그의 삶의 환경이 그 본능을 가려왔지만, 암이 살아있는 조직에서 자라나듯 그것이 무자비하게 성장하여 마침내 그의 존재 전체를 장악하고 그를 거부할 수 없는 행동으로 내몰았던 것은 아닐까.","chapter":14},{"lemma":"irresistibly","difficulty":"C1","gloss":"In an irresistible manner.","ipa":null,"sentence":"It was this: I asked myself whether there was not in his soul some deep-rooted instinct of creation, which the circumstances of his life had obscured, but which grew relentlessly, as a cancer may grow in the living tissues, till at last it took possession of his whole being and forced him irresistibly to action.","word_in_sentence":"irresistibly","ko":"그것은 이런 것이었다. 나는 그의 영혼 깊숙한 곳에 창조의 본능이 뿌리박혀 있었던 것은 아닐까 하고 자문해보았다. 그의 삶의 환경이 그 본능을 가려왔지만, 암이 살아있는 조직에서 자라나듯 그것이 무자비하게 성장하여 마침내 그의 존재 전체를 장악하고 그를 거부할 수 없는 행동으로 내몰았던 것은 아닐까.","chapter":14},{"lemma":"cuckoo","difficulty":"C1","gloss":"Any of various birds, of the family Cuculidae within the order Cuculiformes, famous for laying its eggs in the nests of other species; but especially a common cuckoo (Cuculus canorus), that has a characteristic two-note call.","ipa":"/ˈkuː.kuː/","sentence":"The cuckoo lays its egg in the strange bird’s nest, and when the young one is hatched it shoulders its foster-brothers out and breaks at last the nest that has sheltered it.","word_in_sentence":"cuckoo","ko":"뻐꾸기는 다른 새의 둥지에 알을 낳고, 새끼가 부화하면 양부모의 새끼들을 밀어내고 마침내 자신을 보살펴준 둥지를 부숴버린다.","chapter":14},{"lemma":"vigilance","difficulty":"C1","gloss":"Alert watchfulness.","ipa":"/ˈvɪd͡ʒɪlɪns/","sentence":"But how strange it was that the creative instinct should seize upon this dull stockbroker, to his own ruin, perhaps, and to the misfortune of such as were dependent on him; and yet no stranger than the way in which the spirit of God has seized men, powerful and rich, pursuing them with stubborn vigilance till at last, conquered, they have abandoned the joy of the world and the love of women for the painful austerities of the cloister.","word_in_sentence":"vigilance","ko":"하지만 창조적 본능이 이 따분한 주식중개인을 사로잡아, 아마도 그 자신을 파멸로 이끌고 그에게 의존하는 사람들을 불행하게 만든다는 것이 얼마나 기이한 일인가. 그러나 하나님의 영이 권력 있고 부유한 사람들을 사로잡아 완강한 경계심으로 그들을 추적하다가 마침내 그들을 굴복시켜 세상의 기쁨과 여인의 사랑을 버리고 수도원의 고통스러운 금욕생활로 향하게 하는 방식보다 더 기이하지는 않다.","chapter":14},{"lemma":"cloister","difficulty":"C1","gloss":"such an arcade in a monastery;","ipa":"/ˈklɔɪstɚ/","sentence":"But how strange it was that the creative instinct should seize upon this dull stockbroker, to his own ruin, perhaps, and to the misfortune of such as were dependent on him; and yet no stranger than the way in which the spirit of God has seized men, powerful and rich, pursuing them with stubborn vigilance till at last, conquered, they have abandoned the joy of the world and the love of women for the painful austerities of the cloister.","word_in_sentence":"cloister","ko":"하지만 창조적 본능이 이 따분한 주식중개인을 사로잡아, 아마도 그 자신을 파멸로 이끌고 그에게 의존하는 사람들을 불행하게 만든다는 것이 얼마나 기이한 일인가. 그러나 하나님의 영이 권력 있고 부유한 사람들을 사로잡아 완강한 경계심으로 그들을 추적하다가 마침내 그들을 굴복시켜 세상의 기쁨과 여인의 사랑을 버리고 수도원의 고통스러운 금욕생활로 향하게 하는 방식보다 더 기이하지는 않다.","chapter":14},{"lemma":"cataclysm","difficulty":"C1","gloss":"A sudden, violent event.","ipa":"/ˈkætəˌklɪzm̩/","sentence":"With some men it needs a cataclysm, as a stone may be broken to fragments by the fury of a torrent; but with some it comes gradually, as a stone may be worn away by the ceaseless fall of a drop of water.","word_in_sentence":"cataclysm","ko":"어떤 사람에게는 격류의 분노로 돌이 산산조각 나듯 격변이 필요하지만, 어떤 사람에게는 물방울이 끊임없이 떨어져 돌이 닳아 없어지듯 점진적으로 찾아온다.","chapter":14},{"lemma":"torrent","difficulty":"C1","gloss":"A violent flow, as of water, lava, etc.; a stream suddenly raised and running rapidly, as down a precipice.","ipa":"/ˈtɒɹ.ənt/","sentence":"She turned on him with a torrent of abuse.","word_in_sentence":"torrent","ko":"그녀는 그에게 돌아서서 욕설을 퍼부었다.","chapter":51},{"lemma":"ceaseless","difficulty":"C1","gloss":"Without an end.","ipa":"/ˈsiːsləs/","sentence":"And above all, ceaseless like time, is the dull roar of the breakers on the reef.","word_in_sentence":"ceaseless","ko":"그리고 무엇보다도, 시간처럼 끊임없이 암초에 부딪히는 파도의 둔탁한 굉음이 있다.","chapter":53},{"lemma":"directness","difficulty":"C2","gloss":"The state or quality of being direct.","ipa":null,"sentence":"Strickland had the directness of the fanatic and the ferocity of the apostle.","word_in_sentence":"directness","ko":"스트릭랜드는 광신도의 직설적인 성격과 사도의 격렬함을 지니고 있었다.","chapter":14},{"lemma":"fanatic","difficulty":"C1","gloss":"Fanatical.","ipa":"/fəˈnaʔɪk/","sentence":"Strickland had the directness of the fanatic and the ferocity of the apostle.","word_in_sentence":"fanatic","ko":"스트릭랜드는 광신도의 직설적인 성격과 사도의 격렬함을 지니고 있었다.","chapter":14},{"lemma":"ferocity","difficulty":"C1","gloss":"The condition of being ferocious.","ipa":"/fəˈɹɑsɪti/","sentence":"Strickland had the directness of the fanatic and the ferocity of the apostle.","word_in_sentence":"ferocity","ko":"스트릭랜드는 광신도의 직설적인 성격과 사도의 격렬함을 지니고 있었다.","chapter":14},{"lemma":"apostle","difficulty":"C1","gloss":"A missionary, or leader of a religious mission, especially one in the early Christian Church (but see Apostle).","ipa":"/əˈpɑsl̩/","sentence":"Strickland had the directness of the fanatic and the ferocity of the apostle.","word_in_sentence":"apostle","ko":"스트릭랜드는 광신도의 직설적인 성격과 사도의 격렬함을 지니고 있었다.","chapter":14},{"lemma":"obsess","difficulty":"C1","gloss":"To be preoccupied with a single topic or emotion.","ipa":"/əbˈsɛs/","sentence":"“Do you know how men can be so obsessed by love that they are deaf and blind to everything else in the world?","word_in_sentence":"obsessed","ko":"\"사랑에 사로잡힌 남자들이 세상의 다른 모든 것에 귀머거리가 되고 눈멀어버리는 경우를 아시나요?","chapter":54},{"lemma":"blighter","difficulty":"C2","gloss":"One who blights.","ipa":null,"sentence":"The blighter came round this morning—the master, you know; when he saw my drawing he just raised his eyebrows and walked on.”","word_in_sentence":"blighter","ko":"\"그 자식이 오늘 아침에 왔어요. 선생 말이에요. 내 그림을 보더니 그냥 눈썹만 치켜올리고 지나가더군요.\"","chapter":14},{"lemma":"eyebrow","difficulty":"C1","gloss":"The hair that grows over the bone ridge above the eye socket.","ipa":"/ˈaɪˌbɹaʊ/","sentence":"Dr. Coutras raised his eyebrows.","word_in_sentence":"eyebrows","ko":"쿠트라 박사는 눈썹을 치켜올렸다.","chapter":55},{"lemma":"deceive","difficulty":"C1","gloss":"To trick or mislead.","ipa":"/dɪˈsiːv/","sentence":"I’ve never been so deceived in a man as I was in George Rainey.","word_in_sentence":"deceived","ko":"조지 레이니만큼 나를 속인 남자는 없었다.","chapter":51},{"lemma":"unconventional","difficulty":"C1","gloss":"Not adhering to custom, convention, or accepted standards.","ipa":null,"sentence":"It is not difficult to be unconventional in the eyes of the world when your unconventionality is but the convention of your set.","word_in_sentence":"unconventional","ko":"당신의 비관습성이 단지 당신이 속한 집단의 관습에 불과할 때, 세상 사람들 눈에 비관습적으로 보이는 것은 어려운 일이 아니다.","chapter":14},{"lemma":"unconventionality","difficulty":"C2","gloss":"The state of being unconventional.","ipa":"/ˌʌnkənˌvɛn(t)ʃəˈnaləti/","sentence":"It is not difficult to be unconventional in the eyes of the world when your unconventionality is but the convention of your set.","word_in_sentence":"unconventionality","ko":"당신의 비관습성이 단지 당신이 속한 집단의 관습에 불과할 때, 세상 사람들 눈에 비관습적으로 보이는 것은 어려운 일이 아니다.","chapter":14},{"lemma":"inordinate","difficulty":"C1","gloss":"Excessive; unreasonable or inappropriate in magnitude.","ipa":"/ɪnˈɔːdɪnət/","sentence":"It affords you then an inordinate amount of self-esteem.","word_in_sentence":"inordinate","ko":"그러면 당신은 엄청난 자존감을 얻게 된다.","chapter":14},{"lemma":"approbation","difficulty":"C2","gloss":"The act of approving; an assenting to the propriety of a thing with some degree of pleasure or satisfaction; approval, sanction, commendation or official recognition.","ipa":"/ˌæp.ɹoʊˈbeɪ.ʃən/","sentence":"But the desire for approbation is perhaps the most deeply seated instinct of civilised man.","word_in_sentence":"approbation","ko":"하지만 인정받고자 하는 욕구는 아마도 문명인이 가진 가장 깊이 뿌리박힌 본능일 것이다.","chapter":14},{"lemma":"hurriedly","difficulty":"C1","gloss":"In a hurried manner.","ipa":"/ˈhɝɪdli/","sentence":"She would not answer; she walked hurriedly, with averted face.","word_in_sentence":"hurriedly","ko":"그녀는 대답하지 않았다. 얼굴을 돌린 채 서둘러 걸어갔다.","chapter":31},{"lemma":"sling","difficulty":"C1","gloss":"To throw with a circular or arcing motion.","ipa":"/ˈslɪŋ/","sentence":"No one runs so hurriedly to the cover of respectability as the unconventional woman who has exposed herself to the slings and arrows of outraged propriety.","word_in_sentence":"slings","ko":"분별없는 행동으로 세상의 분노와 비난에 자신을 노출시킨 파격적인 여자만큼 체면치레라는 은신처로 급히 달려가는 사람은 없다.","chapter":14},{"lemma":"propriety","difficulty":"C1","gloss":"The particular character or essence of someone or something; individuality.","ipa":"/pɹəˈpɹaɪəti/","sentence":"No one runs so hurriedly to the cover of respectability as the unconventional woman who has exposed herself to the slings and arrows of outraged propriety.","word_in_sentence":"propriety","ko":"분별없는 행동으로 세상의 분노와 비난에 자신을 노출시킨 파격적인 여자만큼 체면치레라는 은신처로 급히 달려가는 사람은 없다.","chapter":14},{"lemma":"bravado","difficulty":"C1","gloss":"A swaggering show of defiance or courage.","ipa":"/bɹɑːˈvɑːdoʊ/","sentence":"It is the bravado of ignorance.","word_in_sentence":"bravado","ko":"그것은 무지에서 나오는 허세일 뿐이다.","chapter":14},{"lemma":"peccadillo","difficulty":"C2","gloss":"A small flaw or sin.","ipa":"/ˌpɛ.kəˈdɪ.loʊ/","sentence":"They mean only that they do not fear reproaches for peccadillos which they are convinced none will discover.","word_in_sentence":"peccadillos","ko":"그들이 말하는 것은 단지 아무도 발견하지 못할 것이라고 확신하는 사소한 잘못에 대한 비난을 두려워하지 않는다는 뜻일 뿐이다.","chapter":14},{"lemma":"satirical","difficulty":"C1","gloss":"Of, pertaining to, or connected with satire.","ipa":"/səˈtɪɹɪkəl/","sentence":"And once I sought to be satirical.","word_in_sentence":"satirical","ko":"그리고 한번은 내가 풍자적으로 말해보려 했다.","chapter":14},{"lemma":"maxim","difficulty":"C1","gloss":"A self-evident axiom or premise; a pithy expression of a general principle or rule.","ipa":"/ˈmæk.sɪm/","sentence":"“You evidently don’t believe in the maxim: Act so that every one of your actions is capable of being made into a universal rule.”","word_in_sentence":"maxim","ko":"\"당신은 분명히 이런 격언을 믿지 않는 모양이군요. 당신의 모든 행동이 보편적 법칙이 될 수 있도록 행동하라는.\"","chapter":14},{"lemma":"stronghold","difficulty":"C1","gloss":"A place built to withstand attack; a fortress.","ipa":"/ˈstɹɒŋhəʊld/","sentence":"It is the spy seated in the central stronghold of the ego.","word_in_sentence":"stronghold","ko":"그것은 자아의 중심 요새에 앉아 있는 스파이다.","chapter":14},{"lemma":"vigilant","difficulty":"C1","gloss":"Watchful, especially for danger or disorder; alert; wary","ipa":"/ˈvɪd͡ʒɪlənt/","sentence":"Man’s desire for the approval of his fellows is so strong, his dread of their censure so violent, that he himself has brought his enemy within his gates; and it keeps watch over him, vigilant always in the interests of its master to crush any half-formed desire to break away from the herd.","word_in_sentence":"vigilant","ko":"동료들의 인정을 받고자 하는 인간의 욕망은 너무나 강하고, 그들의 비난을 두려워하는 마음은 너무나 격렬해서, 인간은 스스로 적을 성문 안으로 불러들였다. 그 적은 항상 경계를 늦추지 않고 그를 감시하며, 주인의 이익을 위해 무리에서 벗어나려는 어떤 미약한 욕망이라도 짓밟으려 한다.","chapter":14},{"lemma":"taskmaster","difficulty":"C2","gloss":"Someone who supervises workers, especially one who imposes hard or burdensome work.","ipa":"/ˈtæskˌmæstɚ/","sentence":"And man, subservient to interests he has persuaded himself are greater than his own, makes himself a slave to his taskmaster.","word_in_sentence":"taskmaster","ko":"그리고 인간은 자신보다 더 위대하다고 스스로를 설득한 이익에 굴복하여, 자신을 그 주인의 노예로 만든다.","chapter":14},{"lemma":"courtier","difficulty":"C1","gloss":"A person in attendance at a royal court.","ipa":"/ˈkɔɹtiɚ/","sentence":"At last, like a courtier fawning on the royal stick that is laid about his shoulders, he prides himself on the sensitiveness of his conscience.","word_in_sentence":"courtier","ko":"마침내 자신의 어깨를 내리치는 왕의 지팡이에 아첨하는 신하처럼, 그는 자신의 양심이 예민한 것을 자랑스러워한다.","chapter":14},{"lemma":"fawn","difficulty":"C1","gloss":"A young deer.","ipa":"/fɔːn/","sentence":"At last, like a courtier fawning on the royal stick that is laid about his shoulders, he prides himself on the sensitiveness of his conscience.","word_in_sentence":"fawning","ko":"마침내 자신의 어깨를 내리치는 왕의 지팡이에 아첨하는 신하처럼, 그는 자신의 양심이 예민한 것을 자랑스러워한다.","chapter":14},{"lemma":"sensitiveness","difficulty":"C2","gloss":"The quality or degree of being sensitive.","ipa":null,"sentence":"It is a melody that he sings to you, and to hear it again in your own heart you want knowledge and sensitiveness and imagination.”","word_in_sentence":"sensitiveness","ko":"그것은 예술가가 당신에게 들려주는 선율이며, 당신 마음속에서 그 선율을 다시 듣기 위해서는 지식과 감수성과 상상력이 필요하오.\"","chapter":19},{"lemma":"powerless","difficulty":"C1","gloss":"Lacking sufficient power or strength.","ipa":"/ˈpaʊɚləs/","sentence":"They said something that words were powerless to utter.","word_in_sentence":"powerless","ko":"그것들은 말로는 표현할 힘이 없는 무언가를 말하고 있었다.","chapter":42},{"lemma":"unintelligent","difficulty":"C2","gloss":"Not intelligent.","ipa":"/ˌʌnənˈtɛləd͡ʒənt/","sentence":"But women are very unintelligent.”","word_in_sentence":"unintelligent","ko":"하지만 여자들은 참 무지해.\"","chapter":14},{"lemma":"brisk","difficulty":"C1","gloss":"Full of liveliness and activity; characterized by quickness of motion or action.","ipa":"/bɹɪsk/","sentence":"Her manner was brisk, and her good-breeding scarcely concealed her conviction that if you were not a soldier you might as well be a counter-jumper.","word_in_sentence":"brisk","ko":"그녀의 태도는 활기찼고, 그녀의 좋은 교양은 군인이 아니라면 점원이나 다름없다는 확신을 간신히 감추고 있었다.","chapter":15},{"lemma":"conceited","difficulty":"C1","gloss":"Having an excessively favourable opinion of one's abilities, appearance, etc.; egotistical and vain.","ipa":null,"sentence":"She hated the Guards, whom she thought conceited, and she could not trust herself to speak of their ladies, who were so remiss in calling.","word_in_sentence":"conceited","ko":"그녀는 거만하다고 생각하는 근위대를 혐오했고, 방문 예의를 소홀히 하는 그들의 부인들에 대해서는 차마 입에 담기도 싫어했다.","chapter":15},{"lemma":"remiss","difficulty":"C1","gloss":"At fault; failing to fulfill responsibility, duty, or obligations.","ipa":"/ɹəˈmɪs/","sentence":"She hated the Guards, whom she thought conceited, and she could not trust herself to speak of their ladies, who were so remiss in calling.","word_in_sentence":"remiss","ko":"그녀는 거만하다고 생각하는 근위대를 혐오했고, 방문 예의를 소홀히 하는 그들의 부인들에 대해서는 차마 입에 담기도 싫어했다.","chapter":15},{"lemma":"plainly","difficulty":"C1","gloss":"In a plain manner; simply; basically.","ipa":"/ˈpleɪnli/","sentence":"Mrs. Strickland was plainly nervous.","word_in_sentence":"plainly","ko":"스트릭랜드 부인은 명백히 초조해하고 있었다.","chapter":15},{"lemma":"hatter","difficulty":"C1","gloss":"A person who makes, sells, or repairs hats.","ipa":"/ˈhætə(ɹ)/","sentence":"“He must be as mad as a hatter,” exclaimed the Colonel.","word_in_sentence":"hatter","ko":"\"완전히 미쳤군!\" 대령이 외쳤다.","chapter":15},{"lemma":"exclaim","difficulty":"C1","gloss":"To cry out suddenly, from some strong emotion.","ipa":"/ɛkˈskleɪm/","sentence":"I exclaimed in surprise.","word_in_sentence":"exclaimed","ko":"나는 놀라서 소리쳤다.","chapter":57},{"lemma":"frown","difficulty":"C1","gloss":"A wrinkling of the forehead with the eyebrows brought together, typically indicating displeasure, severity, or concentration.","ipa":"/fɹaʊn/","sentence":"Mrs. Strickland frowned a little.","word_in_sentence":"frowned","ko":"스트릭랜드 부인이 살짝 눈살을 찌푸렸다.","chapter":15},{"lemma":"daub","difficulty":"C2","gloss":"Excrement or clay used as a bonding material in construction.","ipa":"/dɔb/","sentence":"But you never saw such daubs.","word_in_sentence":"daubs","ko":"하지만 그런 엉터리 그림은 본 적이 없을 거예요.","chapter":15},{"lemma":"chaff","difficulty":"C1","gloss":"The inedible parts of a grain-producing plant.","ipa":"/t͡ʃæf/","sentence":"We used to chaff him.","word_in_sentence":"chaff","ko":"우리는 그를 놀리곤 했어요.","chapter":15},{"lemma":"ponder","difficulty":"C1","gloss":"To wonder, think of deeply.","ipa":"/ˈpɒn.də(ɹ)/","sentence":"Mrs. Strickland pondered deeply for some time.","word_in_sentence":"pondered","ko":"스트릭랜드 부인은 한참 동안 깊이 생각에 잠겼다.","chapter":15},{"lemma":"housewifely","difficulty":"C2","gloss":"Befitting a housewife.","ipa":null,"sentence":"She had put some order into the drawing-room by now, her housewifely instincts having got the better of her dismay; and it no longer bore that deserted look, like a furnished house long to let, which I had noticed on my first visit after the catastrophe.","word_in_sentence":"housewifely","ko":"그녀는 이제 응접실을 어느 정도 정리해 놓았는데, 주부로서의 본능이 당황감을 누르고 발휘된 것이었다. 그래서 그 방은 더 이상 내가 그 참사 후 처음 방문했을 때 보았던, 오랫동안 세를 놓지 못한 가구 딸린 집처럼 황량한 모습을 띠지 않았다.","chapter":15},{"lemma":"dismay","difficulty":"C1","gloss":"To cause to feel apprehension; great sadness, or fear; to deprive of energy","ipa":"/dɪsˈmeɪ/","sentence":"He looked round the squalid attic in dismay.","word_in_sentence":"dismay","ko":"그는 더러운 다락방을 둘러보며 경악했다.","chapter":24},{"lemma":"incongruous","difficulty":"C1","gloss":"Not similar or congruent; not matching or fitting in.","ipa":"/ɪnˈkɑn.ɡɹu.əs/","sentence":"His plumpness and his red, fat cheeks made his mourning not a little incongruous.","word_in_sentence":"incongruous","ko":"그의 통통한 몸매와 붉고 살찐 볼은 그의 상복 차림을 적잖이 어울리지 않게 만들었다.","chapter":38},{"lemma":"unsympathetic","difficulty":"C1","gloss":"Not sympathetic; ill-disposed","ipa":null,"sentence":"“I should have thought I was the last person to be unsympathetic to—to aspirations of that kind.”","word_in_sentence":"unsympathetic","ko":"\"그런 종류의 열망에 대해 내가 가장 몰이해할 사람이라고 생각했을 텐데 말이에요.\"","chapter":15},{"lemma":"aspiration","difficulty":"C1","gloss":"The act of aspiring or ardently desiring; an ardent wish or desire, chiefly after what is elevated or spiritual (with common adjunct adpositions being to and of).","ipa":"/ˌæspəˈɹeɪʃən/","sentence":"“I should have thought I was the last person to be unsympathetic to—to aspirations of that kind.”","word_in_sentence":"aspirations","ko":"\"그런 종류의 열망에 대해 내가 가장 몰이해할 사람이라고 생각했을 텐데 말이에요.\"","chapter":15},{"lemma":"culchaw","difficulty":"C2","gloss":{"en":"A type of rough or unpolished stone.","ko":"거친돌","zh":"粗石"},"ipa":"","sentence":"She spoke of “culchaw” derisively.","word_in_sentence":"culchaw","ko":"그녀는 \"교양\"을 비웃듯이 말했다.","chapter":15},{"lemma":"derisively","difficulty":"C2","gloss":"In a derisive manner; demeaningly, mockingly.","ipa":"/dɪˈɹaɪsɪvli/","sentence":"She spoke of “culchaw” derisively.","word_in_sentence":"derisively","ko":"그녀는 \"교양\"을 비웃듯이 말했다.","chapter":15},{"lemma":"bombshell","difficulty":"C1","gloss":"Any grenade, mortar shell, or artillery shell (hollow metal object) containing a charge that can explode.","ipa":null,"sentence":"I knew that I had a bombshell.","word_in_sentence":"bombshell","ko":"내가 폭탄선언을 하려는 것을 알고 있었다.","chapter":15},{"lemma":"incredulity","difficulty":"C1","gloss":"Unwillingness or inability to believe; doubt about the truth or verisimilitude of something; disbelief.","ipa":"/ˌɪnkɹɪˈdjuːlɪti/","sentence":"Colonel MacAndrew and his wife uttered expressions of incredulity, and Mrs. Strickland sprang to her feet.","word_in_sentence":"incredulity","ko":"맥앤드류 대령과 그의 아내는 믿을 수 없다는 표정을 지었고, 스트릭랜드 부인은 벌떡 일어났다.","chapter":15},{"lemma":"preposterous","difficulty":"C1","gloss":"Absurd, or contrary to common sense.","ipa":"/pɹɪˈpɒstəɹəs/","sentence":"“That’s preposterous,” cried Mrs. MacAndrew.","word_in_sentence":"preposterous","ko":"\"말도 안 돼!\" 맥앤드류 부인이 소리쳤다.","chapter":15},{"lemma":"tartly","difficulty":"C2","gloss":"In a tart manner; sourly or bitterly.","ipa":null,"sentence":"“I wish you had gone over,” I replied, somewhat tartly.","word_in_sentence":"tartly","ko":"\"당신이 직접 가봤으면 좋았을 텐데.\" 나는 다소 신랄하게 대답했다.","chapter":15},{"lemma":"supposition","difficulty":"C1","gloss":"Something that is supposed; an assumption made to account for known facts, conjecture.","ipa":"/ˌsʌpəˈzɪʃən/","sentence":"“You’d have seen that every one of your suppositions was wrong.","word_in_sentence":"suppositions","ko":"\"그랬다면 당신의 추측이 모두 틀렸다는 걸 알았을 거야.","chapter":15},{"lemma":"squalid","difficulty":"C1","gloss":"Extremely dirty and unpleasant.","ipa":"/ˈskwɒlɪd/","sentence":"He looked round the squalid attic in dismay.","word_in_sentence":"squalid","ko":"그는 더러운 다락방을 둘러보며 경악했다.","chapter":24},{"lemma":"doggo","difficulty":"C1","gloss":"Only used in lie doggo.","ipa":null,"sentence":"“Do you think he’s done something that we don’t know about, and is lying doggo on account of the police?”","word_in_sentence":"doggo","ko":"\"혹시 그가 우리가 모르는 무슨 일을 저질렀고, 경찰 때문에 숨어 지내는 건 아닐까요?\"","chapter":15},{"lemma":"acidly","difficulty":"C2","gloss":"sourly; tartly","ipa":null,"sentence":"“All that seems to me very far-fetched,” she said acidly.","word_in_sentence":"acidly","ko":"\"그런 말씀은 모두 너무 억지스럽게 들립니다.\" 그녀가 신랄하게 말했다.","chapter":15},{"lemma":"whim","difficulty":"C1","gloss":"A fanciful impulse, or sudden change of idea.","ipa":"/wɪm/","sentence":"“If it’s just a whim, he’ll get over it.”","word_in_sentence":"whim","ko":"\"단순한 변덕이라면 곧 정신을 차릴 거예요.\"","chapter":15},{"lemma":"coolly","difficulty":"C1","gloss":"At a moderately low temperature.","ipa":"/ˈkuːl.li/","sentence":"“Not out of charity,” I answered coolly.","word_in_sentence":"coolly","ko":"\"동정심에서가 아니야.\" 나는 냉정하게 대답했다.","chapter":20},{"lemma":"raison","difficulty":"C1","gloss":{"en":"A reason or explanation.","ko":"사유","zh":"理由"},"ipa":"","sentence":"Le cœur a ses raisons que","word_in_sentence":"raisons","ko":"마음에는 마음만의 이유가 있나니","chapter":15},{"lemma":"scrubby","difficulty":"C2","gloss":"Covered with or consisting of scrub.","ipa":"/ˈskɹʌbi/","sentence":"How long do you think it’ll be before he gets tired of a scrubby room in a scrubby hotel?","word_in_sentence":"scrubby","ko":"허름한 호텔의 허름한 방에서 얼마나 버틸 수 있을 것 같으세요?","chapter":15},{"lemma":"pallor","difficulty":"C2","gloss":"Unnatural paleness, especially as a sign of sickness or distress.","ipa":"/ˈpælɚ/","sentence":"The sky had still the pallor of dawn, and there was a ghostly silence on the lagoon.","word_in_sentence":"pallor","ko":"하늘은 여전히 새벽의 창백함을 띠고 있었고, 석호에는 유령 같은 정적이 흘렀다.","chapter":45},{"lemma":"gasp","difficulty":"C1","gloss":"To draw in the breath suddenly, as if from a shock.","ipa":"/ɡɑːsp/","sentence":"He gave a gasp.","word_in_sentence":"gasp","ko":"그가 숨을 헐떡였다.","chapter":39},{"lemma":"unscrupulous","difficulty":"C1","gloss":"Without scruples; immoral.","ipa":"/ˌʌnˈskɹuːpjʊləs/","sentence":"Men are so weak, and women are so unscrupulous.","word_in_sentence":"unscrupulous","ko":"남자들은 그렇게 나약하고, 여자들은 그렇게 파렴치하니까요.","chapter":15},{"lemma":"friendliness","difficulty":"C1","gloss":"The quality of being friendly.","ipa":"/ˈfɹɛndlinəs/","sentence":"Mrs. Strickland gave me a look in which I read no great friendliness, but did not answer.","word_in_sentence":"friendliness","ko":"스트릭랜드 부인은 나를 바라보았는데, 그 시선에서 별다른 호의는 읽을 수 없었지만 대답하지는 않았다.","chapter":15},{"lemma":"trembling","difficulty":"C1","gloss":"A tremble.","ipa":"/ˈtɹɛmblɪŋ/","sentence":"She went on in a low and trembling voice:","word_in_sentence":"trembling","ko":"그녀는 낮고 떨리는 목소리로 계속했다:","chapter":15},{"lemma":"forgave","difficulty":"C1","gloss":"simple past of forgive","ipa":"/fə(ɹ)ˈɡeɪv/","sentence":"I knew when he was dying he’d send for me, and I was ready to go; I’d have nursed him like a mother, and at the last I’d have told him that it didn’t matter, I’d loved him always, and I forgave him everything.”","word_in_sentence":"forgave","ko":"그가 죽어갈 때 날 부를 거라는 걸 알았어요. 그러면 기꺼이 가서 어머니처럼 간병해주고, 마지막 순간에는 괜찮다고, 언제나 사랑했고 모든 걸 용서한다고 말해줄 생각이었어요.\"","chapter":15},{"lemma":"grudge","difficulty":"C1","gloss":"Deep-seated and/or long-term animosity or ill will about something or someone, especially due to perceived mistreatment.","ipa":"/ɡɹʌd͡ʒ/","sentence":"After all, you can’t grudge me that.”","word_in_sentence":"grudge","ko":"그 정도는 허락해 주셔야죠.\"","chapter":28},{"lemma":"postpone","difficulty":"C1","gloss":"To delay or put off an event, appointment, etc.","ipa":"/poʊstˈpoʊn/","sentence":"Sometimes it seems as if they grudge the longevity which postpones their chance of an effective scene.","word_in_sentence":"postpones","ko":"때로는 그들이 효과적인 장면을 연출할 기회를 미루는 장수를 원망하는 것처럼 보이기도 한다.","chapter":15},{"lemma":"loathsome","difficulty":"C1","gloss":"Highly offensive; abominable, sickening.","ipa":"/ˈloʊð.səm/","sentence":"I hope he’ll rot with some loathsome disease.","word_in_sentence":"loathsome","ko":"끔찍한 병에 걸려 썩어 죽기를 바라요.","chapter":15},{"lemma":"vindictiveness","difficulty":"C2","gloss":"The condition of being vindictive; a malevolent desire for revenge.","ipa":null,"sentence":"He knew Tough Bill’s vindictiveness.","word_in_sentence":"vindictiveness","ko":"그는 터프 빌의 복수심을 알고 있었다.","chapter":47},{"lemma":"motley","difficulty":"C1","gloss":"Comprising greatly varied elements, to the point of incongruity.","ipa":"/ˈmɒtli/","sentence":"I did not realise how motley are the qualities that go to make up a human being.","word_in_sentence":"motley","ko":"나는 인간을 구성하는 자질들이 얼마나 뒤섞여 있는지 깨닫지 못했던 것이다.","chapter":15},{"lemma":"pettiness","difficulty":"C1","gloss":"The quality of being petty.","ipa":null,"sentence":"Now I am well aware that pettiness and grandeur, malice and charity, hatred and love, can find place side by side in the same human heart.","word_in_sentence":"pettiness","ko":"이제 나는 소심함과 위대함, 악의와 자선, 증오와 사랑이 같은 인간의 마음속에 나란히 자리할 수 있다는 것을 잘 알고 있다.","chapter":15},{"lemma":"grandeur","difficulty":"C1","gloss":"The state of being grand or splendid; magnificence.","ipa":"/ˈɡɹæn.d͡ʒɚ/","sentence":"Now I am well aware that pettiness and grandeur, malice and charity, hatred and love, can find place side by side in the same human heart.","word_in_sentence":"grandeur","ko":"이제 나는 소심함과 위대함, 악의와 자선, 증오와 사랑이 같은 인간의 마음속에 나란히 자리할 수 있다는 것을 잘 알고 있다.","chapter":15},{"lemma":"torment","difficulty":"C1","gloss":"A catapult or other kind of war-engine.","ipa":"/ˈtɔː(ɹ)mɛnt/","sentence":"I saw a tormented spirit striving for the release of expression.","word_in_sentence":"tormented","ko":"나는 표현의 해방을 위해 몸부림치는 고뇌에 찬 영혼을 보았다.","chapter":42},{"lemma":"unstably","difficulty":"C2","gloss":"In an unstable manner.","ipa":null,"sentence":"The soul lives unstably in the body, and is capable of mysterious transformations.","word_in_sentence":"unstably","ko":"영혼은 육체 안에서 불안정하게 살아가며, 신비로운 변화를 겪을 수 있는 것이죠.","chapter":15},{"lemma":"bangle","difficulty":"C1","gloss":"A rigid bracelet or anklet, especially one with no clasp.","ipa":"/ˈbæŋ.ɡəl/","sentence":"Mrs. MacAndrew smoothed down the lap of her gown, and gold bangles fell over her wrists.","word_in_sentence":"bangles","ko":"맥앤드류 부인은 무릎 위의 드레스를 매만졌고, 금팔찌들이 손목 위로 흘러내렸다.","chapter":15},{"lemma":"guile","difficulty":"C1","gloss":"Astuteness often marked by a certain sense of cunning or artful deception.","ipa":"/ɡaɪl/","sentence":"The Colonel stared into vacancy, and I wondered whether anyone could be quite so innocent of guile as he looked.","word_in_sentence":"guile","ko":"대령은 허공을 바라보았고, 나는 과연 누군가가 저렇게 보이는 만큼 순진무구할 수 있을까 하는 생각이 들었다.","chapter":15},{"lemma":"heartless","difficulty":"C1","gloss":"Without feeling, emotion, or concern for others; uncaring; cruel.","ipa":"/ˈhɑɹt.lɪs/","sentence":"“But that doesn’t prevent the fact that Charles Strickland is a heartless beast.”","word_in_sentence":"heartless","ko":"\"하지만 그렇다고 해서 찰스 스트릭랜드가 무정한 짐승이라는 사실이 바뀌는 건 아니에요.\"","chapter":15},{"lemma":"selfishness","difficulty":"C1","gloss":"The quality of being selfish, the condition of putting one's own interests before those of others.","ipa":"/ˈsɛl.fɪʃ.nəs/","sentence":"“I can tell you why he left his wife—from pure selfishness and nothing else whatever.”","word_in_sentence":"selfishness","ko":"\"그가 왜 아내를 떠났는지 말씀드릴 수 있어요. 순전히 이기심 때문이고 다른 이유는 전혀 없습니다.\"","chapter":15},{"lemma":"detain","difficulty":"C1","gloss":"To keep someone from proceeding by holding them back or making claims on their attention.","ipa":"/dɪˈteɪn/","sentence":"Neither wit nor whisky could detain him then.","word_in_sentence":"detain","ko":"그럴 때면 재치도 위스키도 그를 붙잡을 수 없었다.","chapter":46},{"lemma":"shrewdly","difficulty":"C2","gloss":"In a shrewd manner.","ipa":null,"sentence":"She saw shrewdly that the world is quickly bored by the recital of misfortune, and willingly avoids the sight of distress.","word_in_sentence":"shrewdly","ko":"그녀는 세상이 불행담을 듣는 것을 금세 지겨워하고 고통받는 모습을 기꺼이 외면한다는 것을 예리하게 간파하고 있었다.","chapter":16},{"lemma":"recital","difficulty":"C1","gloss":"The act of reciting (the repetition of something that has been memorized); rehearsal","ipa":"/ɹɪˈsaɪtl̩/","sentence":"She saw shrewdly that the world is quickly bored by the recital of misfortune, and willingly avoids the sight of distress.","word_in_sentence":"recital","ko":"그녀는 세상이 불행담을 듣는 것을 금세 지겨워하고 고통받는 모습을 기꺼이 외면한다는 것을 예리하게 간파하고 있었다.","chapter":16},{"lemma":"misadventure","difficulty":"C2","gloss":"An accidental mishap or misfortune.","ipa":null,"sentence":"Whenever she went out—and compassion for her misadventure made her friends eager to entertain her—she bore a demeanour that was perfect.","word_in_sentence":"misadventure","ko":"외출할 때마다—그녀의 불운에 대한 동정심으로 친구들이 그녀를 대접하려 애썼다—그녀는 완벽한 태도를 보였다.","chapter":16},{"lemma":"demeanour","difficulty":"C1","gloss":"UK, Australia, New Zealand, Ireland, and Commonwealth spelling of demeanor.","ipa":null,"sentence":"Whenever she went out—and compassion for her misadventure made her friends eager to entertain her—she bore a demeanour that was perfect.","word_in_sentence":"demeanour","ko":"외출할 때마다—그녀의 불운에 대한 동정심으로 친구들이 그녀를 대접하려 애썼다—그녀는 완벽한 태도를 보였다.","chapter":16},{"lemma":"brazenly","difficulty":"C1","gloss":"In a brazen (shamelessly shocking and offensive) manner.","ipa":"/ˈbɹeɪ.zən.li/","sentence":"She was brave, but not too obviously; cheerful, but not brazenly; and she seemed more anxious to listen to the troubles of others than to discuss her own.","word_in_sentence":"brazenly","ko":"그녀는 용감했지만 지나치게 티를 내지는 않았고, 명랑했지만 뻔뻔스럽지는 않았으며, 자신의 문제를 논하기보다는 다른 사람들의 고민을 들어주려 애쓰는 것 같았다.","chapter":16},{"lemma":"contradict","difficulty":"C1","gloss":"To deny the truth or validity of (a statement or statements).","ipa":"/ˌkɒn.tɹəˈdɪkt/","sentence":"“What I mean is, if anyone talks to you about it, please don’t contradict it if they say he eloped with somebody.”","word_in_sentence":"contradict","ko":"\"제 말은, 만약 누군가 당신에게 이 일에 대해 이야기한다면, 그가 누군가와 도망쳤다고 말할 때 부디 부정하지 말아 달라는 뜻입니다.\"","chapter":16},{"lemma":"elope","difficulty":"C1","gloss":"To run away from home with a paramour.","ipa":"/ɪˈloʊp/","sentence":"“What I mean is, if anyone talks to you about it, please don’t contradict it if they say he eloped with somebody.”","word_in_sentence":"eloped","ko":"\"제 말은, 만약 누군가 당신에게 이 일에 대해 이야기한다면, 그가 누군가와 도망쳤다고 말할 때 부디 부정하지 말아 달라는 뜻입니다.\"","chapter":16},{"lemma":"circulate","difficulty":"C1","gloss":"to move in circles or through a circuit","ipa":"/ˈsɚ.kjʊˌleɪt/","sentence":"I discovered presently that a peculiar story was circulating among her friends.","word_in_sentence":"circulating","ko":"얼마 후 나는 그녀의 친구들 사이에서 기묘한 이야기가 돌고 있다는 것을 알게 되었다.","chapter":16},{"lemma":"singularly","difficulty":"C1","gloss":"Strangely; oddly.","ipa":"/ˈsɪŋɡjəlɚli/","sentence":"I noticed that he seemed singularly disconsolate.","word_in_sentence":"singularly","ko":"그가 유난히 의기소침해 보인다는 것을 알아차렸다.","chapter":27},{"lemma":"exaggerate","difficulty":"C1","gloss":"To overstate, to describe more than the fact.","ipa":"/ɛɡˈzæd͡ʒ.ə.ɹeɪt/","sentence":"Colonel MacAndrew had not exaggerated when he said she would be penniless, and it was necessary for her to earn her own living as quickly as she could.","word_in_sentence":"exaggerated","ko":"맥앤드류 대령이 그녀가 무일푼이 될 것이라고 말했을 때 과장한 것이 아니었고, 그녀로서는 가능한 한 빨리 스스로 생계를 꾸려나가야 했다.","chapter":16},{"lemma":"penniless","difficulty":"C1","gloss":"Lacking even the smallest amount of money.","ipa":"/ˈpɛ.nɪ.ləs/","sentence":"Colonel MacAndrew had not exaggerated when he said she would be penniless, and it was necessary for her to earn her own living as quickly as she could.","word_in_sentence":"penniless","ko":"맥앤드류 대령이 그녀가 무일푼이 될 것이라고 말했을 때 과장한 것이 아니었고, 그녀로서는 가능한 한 빨리 스스로 생계를 꾸려나가야 했다.","chapter":16},{"lemma":"shorthand","difficulty":"C1","gloss":"A rough and rapid method of writing by substituting symbols for letters, words, etc.","ipa":"/ˈʃɔːthænd/","sentence":"She made up her mind to profit by her acquaintance with so many writers, and without loss of time began to learn shorthand and typewriting.","word_in_sentence":"shorthand","ko":"그녀는 그토록 많은 작가들과 아는 사이라는 점을 활용하기로 마음먹고, 시간을 허비하지 않고 속기와 타이핑을 배우기 시작했다.","chapter":16},{"lemma":"typewrite","difficulty":"C2","gloss":"To type using a typewriter.","ipa":null,"sentence":"She made up her mind to profit by her acquaintance with so many writers, and without loss of time began to learn shorthand and typewriting.","word_in_sentence":"typewriting","ko":"그녀는 그토록 많은 작가들과 아는 사이라는 점을 활용하기로 마음먹고, 시간을 허비하지 않고 속기와 타이핑을 배우기 시작했다.","chapter":16},{"lemma":"typist","difficulty":"C1","gloss":"A person who types, a clerical worker who writes letters, etc., using a typewriter.","ipa":"/ˈtaɪpɪst/","sentence":"Her education made it likely that she would be a typist more efficient than the average, and her story made her claims appealing.","word_in_sentence":"typist","ko":"그녀의 교육 배경으로 보아 평균보다 유능한 타이피스트가 될 가능성이 높았고, 그녀의 사연은 그녀의 요청을 호소력 있게 만들었다.","chapter":16},{"lemma":"childless","difficulty":"C1","gloss":"Not having any children.","ipa":null,"sentence":"The MacAndrews, who were childless and in easy circumstances, arranged to undertake the care of the children, and Mrs. Strickland had only herself to provide for.","word_in_sentence":"childless","ko":"자식이 없고 형편이 넉넉한 맥앤드류 부부가 아이들을 돌보기로 했고, 스트릭랜드 부인은 자신만 부양하면 되었다.","chapter":16},{"lemma":"uneventfulness","difficulty":"C2","gloss":"The quality of being uneventful.","ipa":null,"sentence":"My friends pursued their course with uneventfulness; they had no longer any surprises for me, and when I met them I knew pretty well what they would say; even their love-affairs had a tedious banality.","word_in_sentence":"uneventfulness","ko":"내 친구들은 평온하게 자신들의 길을 걸어갔다. 그들에게서 더 이상 놀랄 만한 것은 없었고, 만날 때마다 그들이 무슨 말을 할지 거의 알 수 있었다. 심지어 그들의 연애사조차 지루할 만큼 뻔했다.","chapter":17},{"lemma":"banality","difficulty":"C2","gloss":"The quality of being banal.","ipa":"/bəˈnælɪti/","sentence":"My friends pursued their course with uneventfulness; they had no longer any surprises for me, and when I met them I knew pretty well what they would say; even their love-affairs had a tedious banality.","word_in_sentence":"banality","ko":"내 친구들은 평온하게 자신들의 길을 걸어갔다. 그들에게서 더 이상 놀랄 만한 것은 없었고, 만날 때마다 그들이 무슨 말을 할지 거의 알 수 있었다. 심지어 그들의 연애사조차 지루할 만큼 뻔했다.","chapter":17},{"lemma":"terminus","difficulty":"C1","gloss":"The end or final point of something.","ipa":"/ˈtɜːmɪnəs/","sentence":"We were like tram-cars running on their lines from terminus to terminus, and it was possible to calculate within small limits the number of passengers they would carry.","word_in_sentence":"terminus","ko":"우리는 종점에서 종점까지 정해진 노선을 달리는 전차 같았고, 얼마나 많은 승객을 태울지도 어느 정도 계산할 수 있었다.","chapter":17},{"lemma":"daintiness","difficulty":"C2","gloss":"The characteristic of being dainty.","ipa":"/ˈdeɪntɪnəs/","sentence":"She had had the idea of giving it a certain daintiness, and she made much use of blue and red inks; she bound the copy in coarse paper, that looked vaguely like watered silk, in various pale colours; and she had acquired a reputation for neatness and accuracy.","word_in_sentence":"daintiness","ko":"그녀는 일에 어떤 우아함을 부여한다는 아이디어를 갖고 있어서 파란색과 빨간색 잉크를 많이 사용했고, 물결무늬 비단처럼 보이는 거친 종이로 원고를 다양한 연한 색깔로 제본했으며, 정확하고 깔끔하다는 평판을 얻고 있었다.","chapter":17},{"lemma":"neatness","difficulty":"C2","gloss":"The state of being neat.","ipa":null,"sentence":"He had great neatness of person, and he continued to wear his spruce black coat and his bowler hat, always a little too small for him, in a dapper, jaunty manner.","word_in_sentence":"neatness","ko":"몸단장을 매우 깔끔하게 했고, 언제나 자신에게는 조금 작은 중절모와 함께 단정한 검은 코트를 말쑥하고 경쾌하게 차려입고 다녔다.","chapter":31},{"lemma":"undignified","difficulty":"C2","gloss":"lacking in or damaging to dignity","ipa":null,"sentence":"But she could not get over the idea that to earn her living was somewhat undignified, and she was inclined to remind you that she was a lady by birth.","word_in_sentence":"undignified","ko":"하지만 생계를 위해 일한다는 것이 다소 품위에 어긋난다는 생각을 떨쳐버릴 수 없었고, 자신이 태생적으로 숙녀라는 점을 상대방에게 상기시키려 하는 경향이 있었다.","chapter":17},{"lemma":"dramatist","difficulty":"C1","gloss":"Synonym of playwright.","ipa":null,"sentence":"“Several people have suggested that she should go on the stage, but of course I couldn’t consent to that, I know all the chief dramatists, and I could get her a part to-morrow, but I shouldn’t like her to mix with all sorts of people.”","word_in_sentence":"dramatists","ko":"\"여러 사람이 그 아이가 무대에 서야 한다고 제안했지만, 물론 나는 동의할 수 없었어요. 나는 주요 극작가들을 모두 알고 있고, 내일이라도 그 아이에게 역할을 구해줄 수 있지만, 온갖 부류의 사람들과 어울리게 하고 싶지는 않거든요.\"","chapter":17},{"lemma":"morrow","difficulty":"C1","gloss":"The next or following day.","ipa":"/ˈmɑɹ.oʊ/","sentence":"“I’m starting to-morrow.","word_in_sentence":"morrow","ko":"\"내일 떠납니다.","chapter":38},{"lemma":"exclusiveness","difficulty":"C2","gloss":"The state of being exclusive; exclusivity.","ipa":null,"sentence":"I was a little chilled by Mrs. Strickland’s exclusiveness.","word_in_sentence":"exclusiveness","ko":"나는 스트릭랜드 부인의 배타적인 태도에 다소 서늘함을 느꼈다.","chapter":17},{"lemma":"ennoble","difficulty":"C2","gloss":"To bestow with nobility, honour or grace.","ipa":"/ɪˈnəʊbəl/","sentence":"It is not true that suffering ennobles the character; happiness does that sometimes, but suffering, for the most part, makes men petty and vindictive.","word_in_sentence":"ennobles","ko":"고통이 인격을 고상하게 만든다는 것은 사실이 아니다. 때로는 행복이 그런 역할을 하지만, 고통은 대부분의 경우 사람을 옹졸하고 복수심에 불타게 만든다.","chapter":17},{"lemma":"vindictive","difficulty":"C1","gloss":"Having a tendency to seek revenge when wronged, vengeful.","ipa":"/vɪnˈdɪk.tɪv/","sentence":"It is not true that suffering ennobles the character; happiness does that sometimes, but suffering, for the most part, makes men petty and vindictive.","word_in_sentence":"vindictive","ko":"고통이 인격을 고상하게 만든다는 것은 사실이 아니다. 때로는 행복이 그런 역할을 하지만, 고통은 대부분의 경우 사람을 옹졸하고 복수심에 불타게 만든다.","chapter":17},{"lemma":"fortnight","difficulty":"C1","gloss":"A period of 2 weeks.","ipa":"/ˈfɔːt.naɪt/","sentence":"“Yes, I’ve known it for a fortnight.","word_in_sentence":"fortnight","ko":"\"네, 2주 전부터 알고 있었어요.","chapter":29},{"lemma":"franc","difficulty":"C1","gloss":"A former unit of currency of France, Belgium and Luxembourg, replaced by the euro.","ipa":"/fɹæŋk/","sentence":"I’ve got to give her twenty francs.”","word_in_sentence":"francs","ko":"아주머니한테 20프랑을 줘야 해요.\"","chapter":23},{"lemma":"habitable","difficulty":"C1","gloss":"Safe and comfortable, where
